<style>
:root{--ink:#3c4654;--paper:#fdfcf9;--paper-light:#faf9f6;--line:#e2e2e2;--brass:#b6874f;--brass-deep:#8a6238;--card-bg:#ececec;--muted:#6b7280;--green:#3f7d4f;}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper-light);color:var(--ink);font-family:"Inter",sans-serif;}
.site-header{display:flex;align-items:center;padding:.9rem 5vw;border-bottom:1px solid var(--line);background:var(--paper);}
.site-header .brand{display:flex;align-items:center;gap:.5rem;color:var(--ink);text-decoration:none;font-family:"Cinzel",serif;font-weight:600;font-size:1.05rem;}
.brand-mark{width:26px;height:26px;border:1px solid var(--brass);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;}
.banner{background:#3c4654;color:#f3ede1;text-align:center;padding:.6rem 1rem;font-size:.78rem;}
.banner strong{color:var(--brass);}
.toolbar{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;padding:1rem 5vw;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
.toolbar h1{font-family:"Cinzel",serif;font-size:1.15rem;margin:0;flex:none;}
.toolbar .stat{font-size:.75rem;color:var(--muted);}
.toolbar button{font-family:"Inter",sans-serif;font-size:.75rem;font-weight:700;border:1px solid var(--brass);background:transparent;color:var(--brass-deep);padding:.4rem .8rem;border-radius:4px;cursor:pointer;}
.toolbar button:hover{background:var(--brass);color:#fff;}
.toolbar button.danger{border-color:#a33;color:#a33;}
.toolbar button.danger:hover{background:#a33;color:#fff;}

.match-bar{position:sticky;top:58px;z-index:19;background:var(--brass-deep);color:#fff;padding:.8rem 5vw;display:none;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.match-bar.active{display:flex;}
.match-bar .pair{font-size:.85rem;}
.match-bar .pair b{font-weight:700;}
.match-bar button{background:#fff;color:var(--brass-deep);border:none;font-weight:700;padding:.5rem 1.1rem;border-radius:4px;cursor:pointer;font-size:.8rem;}
.match-bar button.clear{background:transparent;color:#fff;border:1px solid #fff;}

.columns{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:70vh;}
@media (max-width:900px){.columns{grid-template-columns:1fr;}}
.col{padding:1.4rem 2vw 4rem;border-right:1px solid var(--line);}
.col:last-child{border-right:none;}
.col h2{font-family:"Cinzel",serif;font-size:1rem;margin:0 0 1rem;padding:0 .5rem;}
.search-box{width:calc(100% - 1rem);margin:0 .5rem 1rem;padding:.6rem .8rem;border:1px solid var(--line);border-radius:4px;font-size:.85rem;font-family:"Inter",sans-serif;}
.card-list{display:flex;flex-direction:column;gap:.6rem;padding:0 .5rem;}
.card{display:flex;gap:.7rem;align-items:flex-start;background:var(--card-bg);border-radius:4px;padding:.8rem .9rem;cursor:pointer;border:2px solid transparent;transition:border-color .1s;}
.card:hover{border-color:var(--line);}
.card.selected{border-color:var(--brass);background:#f3e8d8;}
.card.matched{opacity:.4;pointer-events:none;}
.card input[type=checkbox]{margin-top:.2rem;flex:none;width:16px;height:16px;accent-color:var(--brass-deep);}
.card .info h3{font-family:"Cinzel",serif;font-weight:600;font-size:.88rem;margin:0 0 .3rem;line-height:1.3;}
.card .info .meta{font-size:.68rem;color:var(--brass-deep);font-weight:700;margin-bottom:.25rem;}
.card .info p{font-family:"EB Garamond",serif;font-size:.8rem;color:#4a4640;margin:0;line-height:1.45;}
.card .badge-matched{font-size:.62rem;font-weight:700;color:var(--green);text-transform:uppercase;}

.matches-section{padding:1.5rem 5vw 3rem;background:var(--paper);border-top:2px solid var(--brass);}
.matches-section h2{font-family:"Cinzel",serif;font-size:1.1rem;margin:0 0 1rem;}
.matches-table{width:100%;border-collapse:collapse;font-size:.8rem;}
.matches-table th,.matches-table td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--line);}
.matches-table th{font-size:.68rem;text-transform:uppercase;color:var(--muted);font-weight:700;}
.matches-table button{font-size:.68rem;border:1px solid #a33;color:#a33;background:transparent;border-radius:3px;padding:.2rem .5rem;cursor:pointer;}
.empty-note{color:var(--muted);font-size:.82rem;padding:1rem .5rem;}
</style>

<script>
const YENI = [{"id": "a002", "slug": "yeni-a002-pusula-kardan-sistemi", "title": "Pusula (Kardan Sistemi)", "creator": "İslam Denizcilik Geleneği (Anonim / Kolektif)", "kisa": "Denizcilikte pusula/«kardan» sistemi; geminin yalpalanmasına rağmen iğnenin sabit kalmasını sağlayan manyetik yön bulma aleti.", "uzun": "İslam denizcilik geleneğinde pusula, yalnızca bir yön bulma aracı değil, aynı zamanda karmaşık bir navigasyon sisteminin merkezinde yer alan bir teknolojidir. 'Kardan' (gimbal) sistemi, iç içe geçmiş halkalar aracılığıyla pusula iğnesinin geminin her türlü hareketine (yalpa, baş-kıç vurma) rağmen yatay düzlemde sabit kalmasını sağlıyordu. Bu mekanik çözüm, İslam mühendisliğinin pratik dehasının en parlak örneklerinden biridir. Pusula diski üzerinde 32 kollu rüzgâr gülü bulunuyordu; her kol, belirli bir yönü ve rüzgârı temsil ediyordu. İslam denizcileri, pusulayı yıldız gözlemleri (özellikle Kutup Yıldızı ve Güney Haçı), güneş yüksekliği ölçümleri ve 'kamal' latası ile birlikte kullanarak Hint Okyanusu'nda, Basra Körfezi'nde, Kızıldeniz'de ve Akdeniz'de binlerce kilometrelik seyirler gerçekleştirmişlerdir. Bu teknoloji, 12.-13. yüzyıllarda Akdeniz üzerinden İtalyan ve İspanyol denizcilerine aktarılmış, ardından Portekiz ve İspanyol keşif yolculuklarının vazgeçilmez aracı olmuştur. Vasco da Gama'nın 1498'de Hindistan'a ulaşması, büyük ölçüde İslam denizcilik geleneğinden devralınan bu navigasyon teknolojisine dayanmaktadır."}, {"id": "a005", "slug": "yeni-a005-gnomon-meridyen", "title": "Gnomon ve Meridyen Çizgisi", "creator": "İslam Mîkât ve Rasathane Geleneği", "kisa": "Güneşin gölgesini kullanarak zamanı, mevsimleri ve coğrafi koordinatları belirleyen; İslam rasathanelerinin ve muvakkithanelerin en temel, en yaygın kalibrasyon aleti.", "uzun": "Gnomon (Arapça: müşriq, 'düşüren/izleyen'), insanlık tarihinin en kadim gözlem aletidir; ancak İslam bilim geleneğinde o, sıradan bir çubuk olmaktan çıkarılarak matematiksel bir ölçüm istasyonuna dönüştürülmüştür. İslam dünyasında gnomon, yalnızca saati göstermezdi; gölge boyunun tanjant ve kotanjant değerleri hesaplanarak güneşin ekliptik üzerindeki konumu, mevsimsel gündönümleri, gözlemcinin coğrafi enlemi ve hatta dünyanın çevresi (Erathosthenes/Me'mun yöntemiyle) ölçülürdü. Cami avlularına dikilen kısa gnomonlar halkın namaz vakitlerini takip etmesini sağlarken; Şam'daki Kâsiyün, Bağdat'taki Şemmâsiyye ve Semerkant'taki Uluğ Bey rasathanelerinde onlarca metre uzunluğunda mermer meridyen kanallarına dönüştü. Güneşin tam öğlen vakti meridyeni geçişi anındaki gölge boyu, o yılın takvimini ve astronomik çizelgelerini (zîc) güncellemek için altın standarttı. Koleksiyonda gnomon, İslam'ın 'zamanı ve mekanı matematikle okuma' vizyonunun en yalın, en güçlü başlangıç noktasıdır."}, {"id": "a008", "slug": "yeni-a008-tasinabilir-gunes-saati", "title": "Taşınabilir Güneş Saati (Yüzük Kadranı)", "creator": "İslam Seyahat ve Mîkât Geleneği", "kisa": "Seyyahların ceplerinde veya parmaklarında taşıdığı; üzerinde farklı enlemler için ölçekler bulunan, güneşin ışığıyla zamanı gösteren portatif pirinç güneş saati.", "uzun": "Taşınabilir Güneş Saati (Portatif Sundial), İslam mîkât mühendisliğinin 'zamanı demokratikleştirme' ve kişiselleştirme hamlesinin en zarif ürünüdür. Sabit ve devasa mermer güneş saatlerinin aksine bu aletler, avuç içine sığacak kadar küçük, pirinç veya gümüşten oyulmuş kompakt cihazlardı. Genellikle bir yüzük, küçük bir disk veya katlanabilir iki kanatlı bir plaka şeklinde tasarlanırlardı. Aletin en kritik özelliği, üzerindeki 'enlem skalasıydı'. Seyyah, bulunduğu şehrin enlemine (örneğin Şam 33°, Kahire 30°) göre kadranı veya gnomonu ayarlar, ardından aleti güneşe çevirerek gölgenin düştüğü noktadan zamanı okurdu. Hac yolculukları, ticaret kervanları ve askeri seferler için hayati bir navigasyon ve zaman aracıydı. Bu portatif saatler, 15. yüzyıldan itibaren Avrupa'ya 'Diptych Dial' ve 'Ring Dial' formlarında aktarılmış, Rönesans döneminde denizcilerin ve gezginlerin vazgeçilmez aksesuarı olmuştur. Koleksiyonda bu alet, zamanın saraydan ve camiden taşıp yollara, çöllere ve denizlere yayıldığı anı temsil eder."}, {"id": "a010b", "slug": "yeni-a010b-atolye-aletleri", "title": "Usturlap Yapım Atölyesi Aletleri", "creator": "İslam Zanaat ve Alet Yapımcılığı Geleneği", "kisa": "Usturlap ve kadranların üzerine stereografik projeksiyonları, yıldız ağını ve trigonometrik skalaları milimetrik hassasiyetle kazıyan zanaatkârların el aletleri seti.", "uzun": "Usturlap Yapım Atölyesi Aletleri, İslam bilim tarihinin 'görünmez kahramanları' olan usta zanaatkârların sessiz tanıklarıdır. Bir usturlabın üzerindeki karmaşık 'ankebut' (örümcek ağı) deseni, ekliptik halkası veya arka yüzdeki gölge karesi, rastgele çizilmezdi; bunlar küresel geometrinin pirinç üzerine işlenmiş matematiksel izdüşümleriydi. Bu iş için kullanılan çelik kazıma kalemleri (burin), hassas açıklığı ayarlanabilir pirinç pergeller ve geometrik şablonlar, dönemin 'yüksek teknoloji üretim araçlarıydı'. Zanaatkâr, önce taslağı balmumu veya kömürle çizer, ardından çelik kalemle pirinç yüzeyi oyarak (hâkk) çizgileri oluştururdu. Çizgi kalınlıkları, gölge ve ışık oyunlarıyla okunabilirliği artıracak şekilde ayarlanırdı. Bu aletler olmasaydı, el-Hârizmî'nin zîcleri veya ez-Zerkâlî'nin evrensel diskleri yalnızca kağıt üzerindeki soyut denklemler olarak kalırdı. Koleksiyonda bu atölye aletleri, bilimin yalnızca 'fikir' değil, aynı zamanda 'el emeği, sabır ve maden' olduğunu hatırlatan bir onur köşesidir."}, {"id": "a011b", "slug": "yeni-a011b-rub-tahtasi", "title": "Rub' Tahtası (Basit Trigonometrik Kadran)", "creator": "İslam Muvakkit Geleneği", "kisa": "Çeyrek daire formunda; üzerinde gölge eğrileri, namaz vakitleri ve kıble açısının kazındığı, cami avlularında ve muvakkithanelerde kullanılan pratik astronomik kadran.", "uzun": "Rub' Tahtası (Çeyrek Kadran), İslam mîkât geleneğinin en işlevsel, en yaygın ve en 'halk dostu' astronomik aletidir. Usturlaplar çok parçalı, pahalı ve öğrenmesi yıllar alan karmaşık cihazlar iken; rub' tahtası tek bir yüzeyde, çeyrek daire formunda, tüm temel zaman ve yön hesaplamalarını yapabilen bir 'pratik hesap makinesi' olarak tasarlanmıştır. Kadranın üzerinde, o şehrin enlemine göre hesaplanmış güneşin saatlik açıları, namaz vakitlerine karşılık gelen gölge boyları ve Mekke'nin azimut açısı (kıble) kazınmıştır. Muvakkit, kadranı güneşe doğru tutar veya avludaki gnomonun gölgesini kadran üzerindeki çizgilerle karşılaştırarak vakti ilan ederdi. Bu tahtalar genellikle ahşaptan, fildişinden veya pirinçten yapılır, üzerine renkli mürekkeple (kalem işi) çizilirdi. Rub' tahtası, İslam'ın 'ibadeti bilime, bilimi halka bağlayan' mîkât felsefesinin en somut aracıdır; karmaşık küresel astronomi, bu çeyrek daire sayesinde bir bakışta okunabilir hale gelmiştir."}, {"id": "a016", "slug": "yeni-a016-yildiz-saati-nocturnal", "title": "Yıldız Saati / Nocturnal", "creator": "İslam Mîkât ve Denizcilik Geleneği", "kisa": "Güneş battıktan sonra Kutup Yıldızı ve çevresindeki takımyıldızların gökyüzündeki dönüş açısını ölçerek gece zamanını belirleyen döner kadranlı astronomik saat.", "uzun": "Yıldız Saati (Nocturnal), İslam astronomisinin 'geceyi de gündüz gibi ölçülebilir' kılma dehasının ürünüdür. Güneş saatleri yalnızca gündüz çalışırken, gece ibadetleri (yatsı, teheccüd), denizcilik nöbetleri ve kervan yolculukları için kesintisiz bir zaman referansı gerekiyordu. İslam mühendisleri, Kutup Yıldızı'nın (Polaris) etrafında saat yönünde dönen Büyük Ayı ve Küçük Ayı takımyıldızlarının bu hareketini bir 'gök saati'ne dönüştürdüler. Alet, ortasında Kutup Yıldızı'na bakmak için küçük bir delik bulunan, üzerinde döner bir gösterge kolu ve saat ölçeği bulunan bir diskten oluşurdu. Gözlemci, delikten Kutup Yıldızı'na bakar, döner kolu ise Büyük Ayı'nın o anki konumuna hizalardı; kolun gösterdiği değer, gece vaktini ve bazen tarih bilgisini verirdi. Bu aletler, özellikle denizciler için pusula ve usturlapla birlikte hayati bir seyir ekibiydi. Koleksiyonda yıldız saati, İslam'ın 'karanlığı da matematikle aydınlatma' vizyonunun; gökyüzünün devasa bir saat kadranı olarak okunduğu anın sembolüdür."}, {"id": "a018", "slug": "yeni-a018-hassas-terazi-agirlik", "title": "Hassas Terazi ve Ağırlık Setleri", "creator": "İslam Metroloji ve Hisbe Geleneği", "kisa": "Kuyumcular, eczacılar ve simyacılar tarafından kullanılan; dirhem, mithkal ve kırat gibi standart ağırlıklarla donatılmış, İslam ticaret ve bilim dünyasının 'adalet ve hassasiyet' sembolü terazi.", "uzun": "Hassas Terazi ve Ağırlık Setleri, İslam medeniyetinin 'ölçme, tartma ve adalet' kavramlarını maddi bir nesneye dönüştürdüğü en temel bilim enstrümanıdır. İslam dünyasında ticaretin adil işlemesi için çarşıları denetleyen 'Hisbe' teşkilatı, tüm terazi ve ağırlıkları periyodik olarak kontrol eder, damgalar ve standartlaştırırdı. Bilim dünyasında ise terazi, kimyanın (Câbir ve er-Râzî geleneği), tıbbın (ilaç dozajları) ve fiziğin (el-Hâzinî'nin özgül ağırlık çalışmaları) vazgeçilmez laboratuvar aracıydı. 'Mithkal' (altın sikke ağırlığı), 'dirhem' ve 'kırat' gibi birimler, tüm İslam coğrafyasında evrensel bir 'bilimsel ve ticari dil' oluşturmuştu. Kuyumcu terazileri, pirinç kefeli, agat yataklı ve milimetrik hassasiyetle dengelenmiş başyapıtlardı. Terazi, yalnızca bir ticaret aracı değil, aynı zamanda İslam felsefesinde 'mîzan' (evrensel denge ve adalet) kavramının kozmik bir yansımasıydı. Koleksiyonda bu terazi setleri, bilimin ve ticaretin 'güvenilir veri' üzerine kurulduğunu hatırlatan sessiz birer anıttır."}, {"id": "a025", "slug": "yeni-a025-idrar-muayene-kabi", "title": "İdrar Muayene Kabı (Matula)", "creator": "İslam Teşhis Geleneği (Üroskopi)", "kisa": "Hastanın idrarının rengine, tortusuna ve berraklığına bakarak (üroskopi) humoral dengesizlikleri ve organ hastalıklarını teşhis etmekte kullanılan, özel formlu cam kaplar.", "uzun": "İdrar Muayene Kabı (Matula / Ânîe), Orta Çağ tıbbının 'klinik laboratuvarı' işlevi gören ve hekimin en mahrem teşhis aracı olan cam kaptır. Kan tahlili veya röntgen öncesi çağda, vücut içindeki metabolik süreçleri gözlemlemenin tek yolu idrardı (üroskopi). İslam hekimleri (ve ardından Avrupa'daki hekimler), hastalardan getirdilen idrarı bu özel, dibi yuvarlak ve boynu uzun cam kaplara (matula) boşaltır ve kabı güneş ışığına karşı tutarak sıvının rengini, tortusunun (sediment) hangi seviyede çöktüğünü incelerlerdi. İbn Sînâ, el-Kânûn'da idrarın 20'den fazla renk tonunu ve bunların hangi organın (karaciğer, dalak, böbrek) iflas ettiğine dair işaretleri listeler. Daha da ilginci, İslam hekimleri 'karıncaların idrar kabının etrafına üşüşmesi' veya 'idrarın tadının tatlı olması' durumunu kaydederek, diyabeti (şeker hastalığını / diyabetus mellitus) tarihte ilk kez metabolik bir hastalık olarak teşhis etmişlerdir. Bu cam kaplar, Orta Çağ minyatürlerinde hekimin elinde, bilimin ve otoritenin yegâne sembolü olarak resmedilmiştir."}, {"id": "a025b", "slug": "yeni-a025b-nabiz-olcer-saati", "title": "İbn Sînâ'nın Nabız Ölçer Saati", "creator": "İbn Sînâ Geleneği", "kisa": "İbn Sînâ geleneğinde hastanın nabız ritmini, hızını ve dolgunluğunu belirli bir zaman diliminde (genellikle su veya kum saatiyle) ölçerek teşhis koyan tıbbi zaman ölçer.", "uzun": "İbn Sînâ'nın Nabız Ölçer Saati, İslam tıbbının 'teşhisi subjektif bir histen, objektif bir ölçüme' dönüştürme devriminin sembolüdür. İbn Sînâ, 'el-Kânûn fî et-Tıb'ın nabız bölümünde, nabzın yalnızca 'atıyor' olmasının değil, 'nasıl attığının' (hızlı/yavaş, dolgun/zayıf, düzenli/aritmik) hastalığın doğasını (humoral dengeyi) ele verdiğini yazmıştır. Ancak bu ritmi değerlendirmek için bir 'zaman referansı' gerekiyordu. Hekimler, hastanın bileğine parmaklarını koyarken yanlarında küçük bir su saati (clepsydra) veya kum saati bulundururlardı. Belirli bir su/kum miktarı akana kadar geçen süredeki nabız vuruşları sayılarak 'nabız frekansı' hesaplanırdı. Bu, modern tıbbın 'vuru/dakika' (bpm) mantığının Orta Çağ'daki öncülüdür. Ayrıca İbn Sînâ, nabız ritmindeki değişiklikleri müzik terapisiyle ilişkilendirmiş; farklı makamların nabız üzerindeki etkisini gözlemlemiştir. Koleksiyonda nabız ölçer saati, tıbbın 'sezgi'den 'veri'ye, 'hastalık'tan 'hasta takibine' geçtiği anın en zarif kanıtıdır."}, {"id": "a028b", "slug": "yeni-a028b-levh-el-ittisalat", "title": "Levh el-İttişâlât (Kavuşum Levhası)", "creator": "Gıyâseddîn Cemşîd el-Kâşî", "kisa": "el-Kâşî'nin gezegenlerin burçlar kuşağındaki yaklaşmalarını (kavuşumları) hesaplamak için tasarladığı; hareketli gösterge ve üç yatay sürgüden oluşan mekanik hesap makinesi.", "uzun": "Levh el-İttişâlât (Kavuşum Levhası), el-Kâşî'nin Tabak el-Menâtık'ın yanı sıra tasarladığı ikinci ve eşsiz bir mekanik hesap makinesidir. Bu alet, herhangi iki gezegenin, Güneş veya Ay'ın ekliptik üzerindeki yaklaşmalarının (kavuşumlarının) tam saatini hesaplamak için kullanılır. Alet işlevsel iki parçadan oluşur: 1) Hareketli gösterge taşıyan hâkkedilmiş bir levha, bununla yaklaşmanın bir önceki günün öğleden sonraki saatlere girişi bulunur; 2) Üç yatay sürgü, bunlarla yaklaşma saati Güneş'in doğuşu ve batışıyla ilişkilendirilir. Bu mekanizma, öğlen vakti bilinen boylamlarından hareket ederek tahmin edilen bir yaklaşmanın tam saatini bulmayı sağlar. Koleksiyonda bu alet, İslam astronomisinin yalnız 'konum' değil, aynı zamanda 'zamanlama' problemini de mekanikleştirdiğinin kanıtıdır."}, {"id": "a029", "slug": "yeni-a029-erken-daglama-aletleri", "title": "Erken Dönem Dağlama Aletleri (Koter)", "creator": "İslam Cerrahi Geleneği (Zehrâvî Öncesi)", "kisa": "Kanama durdurma, doku yakma ve fistül tedavisinde kullanılan; ateşte kızdırılan demir/bronz dağlama çubukları ve maşaları. Zehrâvî cerrahisinin termal temeli.", "uzun": "Erken Dönem Dağlama Aletleri (Koter / Mikvât), İslam cerrahisinin 'kesmek ve yakmak' arasındaki hayati dengeyi kurduğu en eski ve en etkili araçlardır. Dağlama (koterizasyon), Antik Çağ'dan beri bilinse de İslam cerrahları onu 'rastgele bir yakma' işleminden çıkarıp, anatomik hassasiyete dayalı bir 'termal cerrahi' disiplinine dönüştürmüşlerdir. Farklı dokular (kemik, deri, damar, sinir) ve farklı patolojiler (kanama, tümör, fistül, ülser) için farklı uç geometrilerine (zambak, mızrak, iğne, küre) sahip koterler geliştirilmiştir. Koterler, ateşte belirli bir sıcaklığa (genellikle kiraz kırmızısı) kadar ısıtılır, ardından hedef dokuya milimetrik bir hassasiyetle temas ettirilirdi. Bu aletler, özellikle savaş cerrahisinde kanama durdurma ve enfeksiyon önleme konusunda hayat kurtarıcıydı. İbn Sînâ ve Râzî, koterin hangi durumlarda uygulanıp hangilerinde kaçınılması gerektiğini tıbbi etik ve fizyolojiyle temellendirmiştir. Koleksiyonda bu erken koterler, Zehrâvî'nin 172 aletlik dev cerrahi setine giden yolun ilk, en cesur ve en ateşli adımlarıdır."}, {"id": "a030", "slug": "yeni-a030-konik-kesitler-pergeli", "title": "Konik Kesitler Pergeli (el-Berkâr et-Tâmm)", "creator": "Ebû Sehl el-Kûhî", "kisa": "Sadece daire değil; elips, parabol ve hiperbol gibi konik kesitleri mekanik olarak ve sürekli bir hareketle çizebilen, optik ve astronomi aletlerinin yapımını mümkün kılan 'mükemmel pergel'.", "uzun": "Konik Kesitler Pergeli (el-Berkâr et-Tâmm), Ebû Sehl el-Kûhî'nin geometri ve mekanik tarihine yaptığı en büyük katkıdır. Antik Çağ'dan beri pergel yalnızca 'daire' çizmek için kullanılan sabit yarıçaplı bir aletti. Ancak İslam optikçileri (İbn el-Heysem) ve astronomları, ışığı tek bir odak noktasına toplamak için 'parabolik' aynalara ve merceklerine ihtiyaç duyuyorlardı. Parabolü elle veya yaklaşık eğrilerle çizmek ise optik sapmalara (aberasyon) yol açıyordu. el-Kûhî, sabit bir eksen, kayar bir mafsal ve değişken bir yarıçap kolu içeren mekanik bir pergel tasarlayarak, matematiksel olarak kusursuz elips, parabol ve hiperbollerin fiziksel olarak çizilmesini sağladı. Bu 'mükemmel pergel', teorik matematiğin (Apollonius'un konikleri) pratik mühendisliğe (ayna ve mercek taşlama tezgahlarına) doğrudan entegre edildiği anı temsil eder. el-Kûhî'nin bu aleti, İslam dünyasındaki parabolik yakıcı aynaların ve rasathanelerdeki hassas astrolap/ekvatoryum disklerinin üretilmesindeki gizli kahramandır. Rönesans Avrupası'nda Descartes'ın analitik geometriyi kurarken faydalandığı konik kesit literatürü, büyük ölçüde el-Kûhî ve İslam geometrilerinin mirasına dayanır."}, {"id": "a034", "slug": "yeni-a034-yansima-aleti", "title": "Yansıma Aleti (Âlet el-İnkâs)", "creator": "Hasan İbn el-Heysem", "kisa": "Küresel ve silindirik aynalarda ışığın yansıma açılarını, giriş ve sapma açılarını milimetrik hassasiyetle ölçmek için tasarlanmış, bakır disk ve kadranlardan oluşan optik-geometri laboratuvarı.", "uzun": "Yansıma Aleti (Âlet el-İnkâs), İbn el-Heysem'in optiği geometrik ve deneysel bir disipline dönüştürdüğü en kritik cihazdır. 'İbn el-Heysem Problemi' (Problema Alhazeni) olarak bilinen; 'bir noktadan çıkan ışığın, küresel bir aynadan yansıyarak başka bir noktaya ulaşması için aynadaki hangi noktaya çarpması gerekir?' sorusu, 4. dereceden denklemlere götürmüş; Avrupa'da Fermat, Huygens ve l'Hôpital gibi dev matematikçileri yüzyıllarca meşgul etmiştir. İbn el-Heysem bu problemi çözmek için, üzerinde açısal bölüntüler (kadran) bulunan yassı bakır bir disk ve bu diske monte edilebilen silindirik/küresel aynalar tasarladı. Işık demetleri dar deliklerden (diopter) gönderilerek aynaya çarptırılıyor, yansıma açısı disk üzerindeki derecelerden okunuyordu. Bu alet, yalnız optik değil, aynı zamanda cebir ve konik kesitler geometrisinin de pratik laboratuvarıdır. Koleksiyonda bu düzenek, İslam-Avrupa matematik diyaloğunun en kalıcı düğüm noktasını temsil eder; bir optik aleti, aslında bir denklem çözme makinesidir."}, {"id": "a035", "slug": "yeni-a035-hacamat-sisesi", "title": "Hacamat Çekmeni / Şişeleri", "creator": "İslam Tıp ve Farmakoloji Geleneği", "kisa": "Vücuttaki kirli kanı veya fazla sıvıyı vakum yoluyla çekmek için kullanılan; ısı veya pompa ile vakum yaratılan cam, boynuz veya metal hacamat şişeleri.", "uzun": "Hacamat Çekmeni / Şişeleri (Mihcem), İslam tıbbının en yaygın ve en ikonik tedavi araçlarından biridir. Humoral patolojiye (vücuttaki kan, balgam, safra ve sevda dengesine) dayanan İslam tıbbında, hastalıkların bir kısmı vücutta biriken 'fazla veya kirli kanın' atılmasıyla tedavi edilirdi. Bu işlem için hekimler, deriyi hafifçe çizen özel neşterler (mihcem) ve ardından bölgeye yerleştirilen şişeler kullanırlardı. Şişelerin içinde vakum yaratmak için iki yöntem vardı: Ya şişenin içine yanmış bir pamuk atılarak oksijen tüketilir ve şiş hızla deriye kapatılırdı (ateşli hacamat), ya da boynuzdan yapılan şişelerin ucundaki küçük bir delikten hava emilerek vakum yaratılırdı. Cam, boynuz veya bronzdan üretilen bu şişeler, deriyi kabartarak kanın toplanmasını sağlardı. İbn Sînâ, 'el-Kânûn' adlı eserinde hacamatın yapılması gereken mevsimleri, ayın evrelerini ve vücuttaki anatomik noktaları (akupunktur noktalarına benzer şekilde) detaylandırmıştır. Bu şişeler, İslam dünyasındaki eczanelerin ve berber-cerrahların dükkânlarının vazgeçilmez bir parçasıydı ve Avrupa'ya geçerek yüzyıllarca 'kan alma' (bloodletting) geleneğinin temel aracı olarak kullanılmıştır."}, {"id": "a036", "slug": "yeni-a036-flebotomi-bicagi", "title": "Kan Alma (Flebotomi) Bıçağı", "creator": "İslam Tıp Geleneği (İbn Sînâ, ez-Zehrâvî)", "kisa": "Kol, boyun veya şakaktaki venleri (toplar damarları) yararak kontrollü kan almak için kullanılan; ucu sınırlayıcılı, çift ağızlı hassas cerrahi neşterler.", "uzun": "Kan Alma Bıçağı (Mibzara), İslam tıbbının temelini oluşturan 'Humoral Patoloji' (Dört Sıvı Teorisi) pratiğinin en kritik aletidir. İbn Sînâ ve Galen geleneğine göre, hastalıkların büyük bir kısmı vücutta biriken 'fazla veya bozulmuş kanın' atılmasıyla tedavi edilirdi. Ancak damar açmak (flebotomi), hastayı anında ölüme (kanama şokuna) götürebilecek riskli bir işlemdi. İslam cerrahları, bu riski minimize etmek için 'mibzara' adı verilen özel neşterler icat ettiler. Bu bıçakların en dâhiyane özelliği, keskin ucun hemen arkasında bulunan 'sınırlayıcı halka' veya 'çentik'ti. Hekim damarın üzerine bastırdığında, bu sınırlayıcı deriye çarpar ve bıçağın damarı tamamen ikiye kesmesini (transeksiyon) fiziksel olarak engeller; sadece damarın yan duvarında kontrollü bir 'pencere' açardı. İbn Sînâ, el-Kânûn'da flebotominin mevsime, hastanın yaşına, ayın evrelerine ve hangi damardan (örneğin baş ağrısı için şakak, karaciğer hastalığı için sağ kol) kan alınacağına dair katı protokoller belirlemiştir. Bu aletler, 18. yüzyıla kadar Avrupa tıbbında da 'lanset' adıyla standart kan alma aracı olarak kullanılmıştır."}, {"id": "a038", "slug": "yeni-a038-zeytin-koter", "title": "«Zeytin» Koter", "creator": "Ebü'l-Kâsım Halef b. Abbâs ez-Zehrâvî", "kisa": "Zeytin çekirdeği formunda ucu olan koter; göz ve yüz bölgesindeki hassas dağlama işlemleri için tasarlanmış, milimetrik hassasiyette termal cerrahi aleti.", "uzun": "«Zeytin» Koter (Mikvât Zeytüniyye), ez-Zehrâvî'nin et-Taşrîf'inin 30. makalesinde tarif ettiği ve H 1.03 envanter numarasıyla kayıt altına alınan, cerrahi koterizasyon aletlerinin en zarif örneklerinden biridir. Aletin ucu, zeytin çekirdeği formunda şekillendirilmiş olup, bu form yalnızca estetik değil, aynı zamanda fonksiyoneldir: zeytin çekirdeğinin oval ve sivri yapısı, göz kapağı, yüz ve boyun gibi hassas bölgelerde milimetrik dağlama noktaları oluşturmayı mümkün kılar. Koter, pirinç gövdeye paslanmaz çelik uç monte edilerek üretilmiştir; uzunluğu 127 mm'dir. Kullanım tekniği şu şekildeydi: Koter ateşte kızdırılır, ardından hedef dokuya kısa süreli temas ettirilerek (koterizasyon) istenmeyen dokular yakılır veya kanama durdurulurdu. ez-Zehrâvî, bu aletin özellikle 'soğuk karaciğer' (el-kabid el-bârid) tedavisinde, yüz felcinde (lakve) ve göz kapağındaki kıl köklerinin dağlanmasında kullanılmasını önermiştir. Aletin ateşte kızdırılarak sterilize edilebilmesi, İslam cerrahisinin aseptik prensiplere ne denli erken ulaştığının da kanıtıdır. Paris (BnF ar. 2953), Veliyeddin (No. 2491) ve Süleymaniye (Beşirağa 502) yazmalarındaki çizimler, bu aletin Endülüs'ten Bağdat'a kadar geniş bir coğrafyada standart cerrahi ekipman olarak kullanıldığını gösterir."}, {"id": "a040", "slug": "yeni-a040-kirik-cikik-aletleri", "title": "Kırık ve Çıkık Tespit Aletleri", "creator": "İslam Ortopedi ve Travma Cerrahisi Geleneği", "kisa": "Kırık ve çıkıkları tespit edip sabitlemek için kullanılan; ahşap/kamış ateller, bandajlar, redüksiyon maşaları ve traksiyon düzeneklerinden oluşan ortopedik alet seti.", "uzun": "Kırık ve Çıkık Tespit Aletleri, İslam cerrahisinin 'travma yönetimi' konusundaki sistematik dehasının kanıtıdır. Savaş alanları, inşaat kazaları ve günlük yaşam yaralanmaları, kırık ve çıkık tedavisini İslam tıbbının en kritik dallarından biri haline getirmişti. İbn Sînâ, 'el-Kânûn'un kırık-çıkık bölümünde, kırık tiplerini (açık, kapalı, parçalı, eklem içi) sınıflandırmış ve her tip için özel tedavi protokolü belirlemiştir. Zehrâvî ise 'et-Taşrîf'te kırıkları yerine oturtmak (redüksiyon) için özel maşalar, sabitlemek için ahşap ve kamış ateller, traksiyon (çekme) için ip ve makara düzenekleri çizmiştir. Ateller, kırığın tipine ve yerine göre farklı şekillerde (düz, kavisli, silindirik) hazırlanır; bandajlar ise nişasta, yumurta akı ve reçine karışımıyla sertleştirilerek 'alçı' benzeri bir sabitleme sağlardı. Sabuncuoğlu, 15. yüzyılda bu geleneği Osmanlı pratiğine taşımış ve 'Cerrâhiyyetü'l-Hâniyye'de kırık tedavisini minyatürlerle görselleştirmiştir. Koleksiyonda bu set, İslam ortopedisinin 'kemik kaynamadan hayat durmaz' felsefesinin somut aracıdır."}, {"id": "a045", "slug": "yeni-a045-surme-milleri", "title": "Sürme (Kühl) ve Sürme Milleri", "creator": "İslam Göz Hekimliği Geleneği", "kisa": "Antimon sülfür ve çinko oksit gibi mineralleri toz haline getirip göz kapağı içine uygulamak için kullanılan; ucu yassı veya hafif kabarık cam/metal miller.", "uzun": "Sürme (Kühl) ve Sürme Milleri (Mîl), İslam tıbbının 'koruyucu hekimlik' ve 'kozmetoloji' alanındaki en yaygın ve en zarif uygulamalarından biridir. Çöl ikliminin kavurucu güneşi, kum fırtınaları ve sinekleri, İslam coğrafyasında trahom (göz kapağı enfeksiyonu) ve konjonktivit hastalıklarını salgın haline getirmişti. İslam göz hekimleri (kehhâller), bu soruna karşı kimyasal bir kalkan geliştirdiler: 'Kühl' (antimon sülfür veya kurşun bazlı tozlar). Bu tozlar sadece estetik bir karartma sağlamıyor, aynı zamanda antimikrobiyal etkisiyle enfeksiyonları önlüyor ve güneşin parlaklığını emerek (doğal güneş gözlüğü etkisi) retinayı koruyordu. Bu tozu göze uygulamak için 'mîl' adı verilen, cam, bronz veya fildişinden oyulmuş ince miller kullanılırdı. Milin ucu, konjonktivayı (göz iç zarını) çizmeyecek şekilde zımparalanmış, hafif kabarık veya yassı bir formdaydı. Hekimler, milin ucunu gül suyu veya zeytinyağına batırıp toza değdirerek göz kapağının içine nazikçe sürerlerdi. Bu mil kutuları (mikvale), İslam arkeolojisinde en sık bulunan günlük tıp objeleridir ve modern göz damlası aplikatörlerinin tarihsel atasıdır."}, {"id": "a046", "slug": "yeni-a046-dis-hekimligi-aletleri", "title": "Diş Hekimliği Aletleri", "creator": "İslam Diş Hekimliği Geleneği", "kisa": "Diş çekme, çürük kazıma, dolgu yapma ve çene sabitleme için kullanılan; pens, küret, dolgu aletleri ve bandajlardan oluşan İslam diş hekimliği seti.", "uzun": "Diş Hekimliği Aletleri, İslam tıbbının 'ağız sağlığını genel sağlığın ayrılmaz parçası' olarak gören bütüncül yaklaşımının kanıtıdır. İbn Sînâ, 'el-Kânûn'da diş hastalıklarını (çürük, apse, diş eti iltihabı, çene kırığı) sınıflandırmış ve her biri için tedavi protokolü belirlemiştir. Zehrâvî ise 'et-Taşrîf'te diş çekme maşalarını (pens), çürük kazıyıcıları (küret), dolgu aletlerini ve çene sabitleme bandajlarını çizmiştir. Diş çekme maşaları, dişin kök yapısına göre farklı uç geometrilerine (tek köklü, çok köklü, azı dişi) sahipti. Dolgu için ise çürük kazındıktan sonra boşluk, reçine, balmumu veya metal (altın/gümüş) ile doldurulurdu. Zehrâvî, diş taşını temizlemek için özel kazıyıcılar ve diş etini güçlendirmek için bitkisel gargara tarifleri vermiştir. İslam dünyasında 'dişçi' (tabîb el-esnân) ayrı bir uzmanlık olarak tanınmış ve saraylarda görev yapmıştır. Koleksiyonda bu set, İslam'ın 'güler yüzlü sağlık' vizyonunun; diş sağlığının estetik ve fonksiyonel boyutunu aynı anda ele alan bir medeniyetin sembolüdür."}, {"id": "a047", "slug": "yeni-a047-orak-mincel", "title": "Orak (Mincel)", "creator": "Halîfe b. Ebü’l-Mehâsin el-Halebî", "kisa": "Göz kapağı yapışıklıklarını, tavşan-göz (şifre) rahatsızlıklarını ve konjonktiva tümörlerini kesmek için kullanılan, hilal/orak formundaki mikro-cerrahi bıçak.", "uzun": "Orak (Mincel), 13. yüzyılın büyük Halepli göz hekimi Halîfe el-Halebî'nin 'el-Kâfî fî el-Kuhl' adlı eserinde detaylandırdığı ve oftalmoloji tarihinin en hassas aletlerinden biri olan mikro-cerrahi bıçaktır. Göz, insan vücudunun en hassas ve hata kabul etmeyen organıdır; bu nedenle İslam göz hekimleri (kehhâller), standart cerrahi bıçaklar yerine, korneaya ve göz kapağı dokusuna zarar vermeyecek, hilal veya orak (mincel) formunda özel bıçaklar geliştirmişlerdir. Bu orak, özellikle 'tavşan-göz' (lagophthalmos) denilen göz kapağının tam kapanamaması rahatsızlıklarında, göz kapağı yapışıklıklarında (simblefaron) ve konjonktiva üzerindeki et benlerinin (pterjium) sıyrılmasında kullanılırdı. Bıçağın içbükey keskin yüzeyi, hekimin göz küresine zarar vermeden sadece istenen doku tabakasını kazımasına veya kesmesine olanak tanıyordu. el-Halebî'nin Paris ve İstanbul yazmalarındaki çizimleri, bu aletin dönemin metallurji ve zanaat ustalığının tıbbi bir gereksinimle nasıl mükemmel bir şekilde birleştiğini gösterir."}, {"id": "a048", "slug": "yeni-a048-katarakt-ignesi", "title": "Katarakt İğnesi / Neşteri", "creator": "Ammâr b. Alî el-Mevsılî", "kisa": "Ammâr b. Ali'nin icat ettiği; kataraktı (göz perdesini) içi boş metal bir iğne ve vakum/emme yoluyla gözden dışarı çıkaran devrim niteliğinde oftalmolojik alet.", "uzun": "Katarakt İğnesi ve Emme Yöntemi, İslam tıp tarihinin en büyük cerrahi devrimlerinden biridir. 11. yüzyıla kadar katarakt (göz merceğinin bulanıklaşması) tedavisi, Antik Yunan ve Hint geleneğinden gelen 'couching' (keskin bir iğneyle kataraktı gözün arkasına, camur cisme doğru itme) yöntemiyle yapılırdı. Bu yöntem körlüğü giderse de, katarakt gözün içinde kalmaya devam eder ve sıklıkla glokom veya enfeksiyonla sonuçlanırdı. Musullu hekim Ammâr b. Alî, bu tehlikeli yöntemi reddetti ve tarihte ilk kez içi boş metal bir iğne tasarladı. Bu iğneyi korneadan içeri sokuyor, kataraktın üzerine yerleştiriyor ve dışarıdaki bir şırınga/tulum mekanizmasıyla vakum yaratarak bulanık dokuyu gözün içinden 'emerek' dışarı çıkarıyordu. Ammâr, bu devrim niteliğindeki ameliyatı 'Kitâb el-Müntehab' adlı eserinde detaylıca anlatır ve 'bu yöntemi benden önce kimse yapmamıştır' diyerek icadının özgünlüğünü vurgular. Bu içi boş iğne ve aspirasyon prensibi, 19. yüzyılda modern katarakt cerrahisinin (fakoemülsifikasyon) temelini oluşturacaktır."}, {"id": "a050", "slug": "yeni-a050-dikis-igneleri", "title": "Cerrahi Dikiş İğneleri ve İpleri", "creator": "İslam Cerrahi Geleneği", "kisa": "Bağırsak yırtılmaları ve derin doku yaralarını dikmek için kullanılan; kavisli çelik iğneler ve koyun bağırsağı veya ipekten bükülmüş steril iplikler.", "uzun": "Cerrahi Dikiş İğneleri ve İpleri, İslam cerrahisinin doku mühendisliğindeki inceliğinin bir göstergesidir. Orta Çağ'da bağırsak delinmeleri (örneğin bıçaklanma veya fıtık boğulması sonucu) neredeyse her zaman peritonit (karın zarı iltihabı) ve ölümle sonuçlanırdı. İslam hekimleri, bu yaraları kapatmak için iki devrim niteliğinde malzeme kullandılar: İlki, dokunun içinden rahatça geçebilen 'kavisli' (yarım daire) metal iğnelerdi. İkincisi ise dikiş ipliğiydi. ez-Zehrâvî ve İbn Sînâ, ipek ipliklerin yanı sıra, koyun veya kedi bağırsağından elde edilen ve zamanla vücut tarafından emilerek yok olan (absorbable) iplikler kullandılar; bu, modern 'catgut' ipliklerin doğrudan atasıdır. Daha da ilginci, 'karınca başı' (veya karınca gövdesi) kullanımıdır: Hekimler, yaranın iki yakasını birbirine yaklaştırmak için büyük karıncaları yara üzerine yerleştirir, karınca deriyi ısırdığında başını koparırlardı; karınanın güçlü çeneleri, yara iyileşene kadar doğal bir 'dikiş klipsi' (sütür zımbası) işlevi görürdü. Bu biyouyumlu ve yaratıcı çözümler, İslam tıbbının doğayı ne denli iyi gözlemlediğinin kanıtıdır."}, {"id": "a050b", "slug": "yeni-a050b-katarakt-couching-ignesi", "title": "Katarakt Ameliyatı İğnesi (Couching)", "creator": "İslam Oftalmoloji Geleneği", "kisa": "Katarakt (göz merceği bulanıklaşması) tedavisinde kullanılan; bulanık merceği göz bebeğinin arkasına itmek için tasarlanmış ince, sivri ve kavisli cerrahi iğne.", "uzun": "Katarakt Ameliyatı İğnesi (Couching Needle), İslam oftalmolojisinin en hassas, en cesur ve en hayat değiştiren cerrahi aletidir. Katarakt, göz merceğinin bulanıklaşarak görme kaybına yol açmasıdır ve Orta Çağ'da körlüğün en yaygın nedeniydi. İslam göz hekimleri (kehhal), bu sorunu çözmek için 'couching' tekniğini geliştirmişlerdir: ince, sivri ve hafif kavisli bir iğne, gözün beyaz kısmından (sklera) sokularak bulanık mercek göz bebeğinin arkasına itilir; böylece ışık tekrar retinaya ulaşır ve hasta görmeye başlar. Ammâr b. Alî (ö. 1020), 'Kitâb el-Müntehab'ta bu tekniği adım adım anlatmış; iğnenin giriş açısını, itme hızını ve olası komplikasyonları (kanama, enfeksiyon, mercek düşmesi) detaylandırmıştır. Halîfe b. Ebü'l-Mehâsin ise iğne tasarımını mükemmelleştirerek, farklı katarakt tipleri (sert, yumuşak, süt katarakt) için farklı iğne uçları önermiştir. Bu alet, modern fakoemülsifikasyon (ultrasonik katarakt cerrahisi) tekniğinin kavramsal atasıdır. Koleksiyonda katarakt iğnesi, İslam tıbbının 'karanlığı ışığa çevirme' misyonunun en keskin sembolüdür."}, {"id": "a052", "slug": "yeni-a052-kbb-cerrahi-aletleri", "title": "Kulak-Burun-Boğaz (KBB) Cerrahi Aletleri", "creator": "İslam KBB Cerrahisi Geleneği", "kisa": "Kulak enfeksiyonları, burun polipleri, bademcik iltihapları ve boğaz tıkanıklıkları için kullanılan; kancalar, maşalar, şırıngalar ve aynalardan oluşan KBB cerrahi seti.", "uzun": "Kulak-Burun-Boğaz (KBB) Cerrahi Aletleri, İslam tıbbının 'baş-boyun bölgesini bütüncül ele alma' yaklaşımının kanıtıdır. Zehrâvî, 'et-Taşrîf'in KBB bölümünde bademcik ameliyatı için özel kancalar ve kesici aletler, burun poliplerini çıkarmak için ince maşalar ve kulak enfeksiyonlarını temizlemek için yıkama şırıngaları çizmiştir. Bademcik ameliyatı (tonsillektomi), özellikle çocuklarda solunum tıkanıklığına yol açan kronik bademcik iltihapları için uygulanırdı; Zehrâvî, bademciği kancayla sabitleyip özel bir bıçakla kesmeyi ve ardından kanamayı koterle durdurmayı önermiştir. Burun polipleri için ise ince, kıvrık maşalarla polipin kökünden çekilip çıkarılması tekniğini anlatmıştır. Kulak için ise ılık su veya bitkisel yağlarla yıkama yapan şırıngalar ve kulak kanalını aydınlatmak için küçük aynalar tasarlanmıştır. İbn Sînâ, KBB hastalıklarının iç kulak, orta kulak ve dış kulak olarak sınıflandırılmasını yapmıştır. Koleksiyonda KBB seti, İslam cerrahisinin 'duyu organlarını koruma' misyonunun sembolüdür."}, {"id": "a054", "slug": "yeni-a054-litotomi-seti", "title": "Mesane Taşı Ameliyatı Aletleri (Litotomi)", "creator": "İslam Üroloji ve Cerrahi Geleneği", "kisa": "Mesane taşını cerrahi yolla çıkarmak için kullanılan; litotom bıçağı, taş çıkarma maşası, mesane sondası ve yara genişleticiden oluşan ürolojik cerrahi seti.", "uzun": "Mesane Taşı Ameliyatı Aletleri (Litotomi Seti), İslam cerrahisinin en riskli, en acı verici ve en hayat kurtarıcı operasyonlarından birinin aracıdır. Mesane taşı, Orta Çağ'da dayanılmaz ağrılara, idrar tıkanıklığına ve ölüme yol açan yaygın bir hastalıktı. İslam cerrahları, bu taşı cerrahi yolla çıkarmak (litotomi) için sistematik bir protokol geliştirmişlerdir. Zehrâvî, 'et-Taşrîf'in litotomi bölümünde operasyonu adım adım anlatır: önce hasta sırtüstü yatırılır ve bacakları bağlanır; ardından özel bir bıçakla (litotom) perine bölgesinden mesaneye kesi yapılır; kesiden sokulan taş çıkarma maşasıyla (lithotomy forceps) taş kavranır ve dikkatlice çekilir. İbn Sînâ, taşın boyutuna ve sertliğine göre farklı cerrahi yaklaşımlar önermiş; büyük taşlar için önce kırma (lithotripsy) tekniğini anlatmıştır. Operasyon sonrası yara bakımı, enfeksiyon önleme ve diyet düzenlemesi de sistematize edilmiştir. Koleksiyonda litotomi seti, İslam cerrahisinin 'acıya karşı cesaret ve hassasiyet' dengesinin en keskin kanıtıdır."}, {"id": "a055", "slug": "yeni-a055-dis-cekme-penseleri", "title": "Diş Çekme Penseleri (Minza)", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Çürük azı dişlerini ve kırık kökleri, çene kemiğine zarar vermeden kavrayıp çekmek için tasarlanmış, farklı uç formlarına sahip metal dişçi penseleri.", "uzun": "Diş Çekme Penseleri (Minza'), ez-Zehrâvî'nin et-Taşrîf'inde detaylandırdığı ve modern diş hekimliğinin temel aletleri olan forceps'lerin doğrudan atasıdır. Orta Çağ'da diş çekimi, genellikle berberler veya demirciler tarafından kaba kuvvet kullanılarak (çekiç ve kerpetenle) yapılırdı; bu da çene kırıklarına ve ciddi enfeksiyonlara yol açıyordu. ez-Zehrâvî ise diş hekimliğini tıbbi bir disiplin olarak ele almış ve her diş tipinin (kesici, köpek, azı) anatomik yapısına uygun, farklı açılarda ve kavrama yüzeylerinde penseler tasarlamıştır. Özellikle 'cavus' (çürük ve oyulmuş) dişlerin ve diş eti içinde kalan kırık köklerin çekimi için, ucu sivri ve tırtıklı özel penseler (minza' el-cıdr) icat etmiştir. Bu penseler, dişi kökünden kavrayarak, çevre dokuya ve çene kemiğine minimum travmayla dişin çıkarılmasını sağlıyordu. ez-Zehrâvî'nin eserindeki penselerin çizimleri, 14. yüzyılda Avrupa'nın en büyük cerrahı Guy de Chauliac tarafından aynen kopyalanmış ve Avrupa diş hekimliğinin standart aletleri haline gelmiştir."}, {"id": "a055b", "slug": "yeni-a055b-dogum-ebelik-aletleri", "title": "Doğum ve Ebelik Aletleri (Obstetrik Set)", "creator": "İslam Kadın Doğum ve Ebelik Geleneği", "kisa": "Zor doğumlarda bebeği çıkarmak, plasentayı almak ve göbek kordonunu kesmek için kullanılan; kancalar, maşalar, genişleticiler ve makaslardan oluşan obstetrik alet seti.", "uzun": "Doğum ve Ebelik Aletleri, İslam tıbbının 'anne ve bebek hayatını koruma' misyonunun en hassas araçlarıdır. İslam dünyasında ebelik (kâbile), kadınlar tarafından icra edilen saygın bir meslekti; ancak zor doğumlarda cerrahi müdahale gerekiyordu. Zehrâvî, 'et-Taşrîf'in doğum bölümünde, bebeğin ters geldiği durumlarda (makat veya transvers geliş) kullanılan embriyotomi kancalarını, plasentanın yapıştığı durumlarda kullanılan çıkarma maşalarını ve doğum kanalını genişletmek için kullanılan dilatörleri çizmiştir. İbn Sînâ, doğum öncesi bakım, doğum pozisyonları ve doğum sonrası anne bakımı konusunda ayrıntılı protokoller belirlemiştir. Sabuncuoğlu ise 15. yüzyılda bu geleneği Osmanlı pratiğine taşımış ve 'Cerrâhiyyetü'l-Hâniyye'de doğum müdahalelerini minyatürlerle görselleştirmiştir. Göbek kordonu, steril bir makasla kesilir ve bağlanırdı; bu, modern doğum pratiğinin temelidir. Koleksiyonda obstetrik set, İslam tıbbının 'hayatın başlangıcını koruma' sorumluluğunun en nazik ve en cesur sembolüdür."}, {"id": "a056", "slug": "yeni-a056-koter-uclari-seti", "title": "Çeşitli Koter Uçları ve Dağlama Seti", "creator": "İslam Cerrahi Geleneği (Zehrâvî Sonrası)", "kisa": "Farklı doku tipleri ve patolojiler için özel uç geometrilerine sahip; zambak, mızrak, küre, iğne ve düz çubuk formlarındaki koterlerden oluşan termal cerrahi kiti.", "uzun": "Çeşitli Koter Uçları ve Dağlama Seti, İslam cerrahisinin 'ateşi kontrollü bir şifa aracına dönüştürme' dehasının en kapsamlı kanıtıdır. Zehrâvî, 'et-Taşrîf'te 50'den fazla farklı koter ucu çizmiştir; her biri belirli bir doku tipi, patoloji ve anatomik bölge için tasarlanmıştır. Zambak uçlu koterler, geniş yüzeyli yanıklar ve ülserler için; mızrak uçlu koterler, derin fistüller ve apse drenajı için; küre uçlu koterler, küçük tümörler ve siğiller için; iğne uçlu koterler ise ince damarlar ve sinir uçları için kullanılırdı. Koterler, ateşte belirli bir sıcaklığa (genellikle kiraz kırmızısı veya portakal rengi) kadar ısıtılır, ardından hedef dokuya milimetrik bir hassasiyetle temas ettirilirdi. Sabuncuoğlu, 15. yüzyılda bu geleneği Osmanlı pratiğine taşımış ve dağlama tekniklerini minyatürlerle görselleştirmiştir. Koterizasyon, kanama durdurma, enfeksiyon kontrolü, tümör yakma ve kronik yara tedavisinde vazgeçilmez bir yöntemdi. Koleksiyonda koter seti, İslam cerrahisinin 'ateşle şifa verme' paradoksunun; acı ve iyileşmenin aynı araçta buluştuğu anın sembolüdür."}, {"id": "a057", "slug": "yeni-a057-bademcik-aleti", "title": "Bademcik Ameliyatı Aleti", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Boğazın derinliklerindeki bademcikleri ve polipleri, kanama riskini minimize ederek tek hamlede kavrayıp koparmak için tasarlanmış, perçinli mafsal ve yaylı makas benzeri alet.", "uzun": "Bademcik Ameliyatı Aleti (Âle tuşbihu el-mikaşş), ez-Zehrâvî'nin K.B.B. cerrahisindeki mühendislik dehasını gösteren 320 mm'lik devasa ve hassas bir alettir. Bademcik iltihapları (tonsillit) ve boğazdaki et benleri (polipler), Orta Çağ'da solunumu ve yutkunmayı engelleyen, hatta boğulmaya yol açan ciddi hastalıklardı. Ancak boğazın dar, karanlık ve damar açısından zengin yapısı, standart bıçaklarla müdahaleyi ölümcül (kanamalı) kılıyordu. ez-Zehrâvî, bu sorunu çözmek için 'makas benzeri' (tuşbihu el-mikaşş) bir alet icat etti. Bu aletin uzun sapları, hekimin elinin hastanın ağzının dışında kalmasını sağlarken; perçinli mafsal yapısı, ucundaki kavrayıcı çenelerin boğazın derinliklerinde hassas bir şekilde açılıp kapanmasına olanak tanıyordu. ez-Zehrâvî, kanama riskini azaltmak için aletin tek bir kararlı hamleyle kapatılmasını ve dokuyu kökünden koparmasını salık verir. Bu mekanik 'snare' (ilmik/kesici) prensibi, 20. yüzyılın modern K.B.B. cerrahisinde kullanılan bademcik ve geniz eti alma aletlerinin birebir atasıdır."}, {"id": "a065", "slug": "yeni-a065-cenin-cengeli", "title": "Cenin Çengeli (Şinnâre)", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Zor doğumlarda veya rahim içinde ölen ceninin tahliyesinde, annenin hayatını kurtarmak için kullanılan, ucu sivri ve kancalı metal doğum aleti.", "uzun": "Cenin Çengeli (Şinnâre), İslam jinekolojisinin ve doğum cerrahisinin en hassas ve en dramatik aletlerinden biridir. Orta Çağ'da zor doğumlar (distosi) veya rahim içinde ölen ceninler, hem anne hem de bebek için ölümcül bir tehlike arz ediyordu. ez-Zehrâvî, bu gibi durumlarda annenin hayatını kurtarmak için 'embriyotomi' (ceninin parçalanarak çıkarılması) tekniklerini ve bu teknikler için özel kancalar (şinnâre) tasarlamıştır. Bu kancalar, ceninin çenesine, koltuk altına veya kafatasına takılarak, dışarıdan kontrollü bir traksiyon (çekme) uygulanmasını sağlıyordu. ez-Zehrâvî, eserinde bu aletin kullanımının ne denli tehlikeli olduğunu vurgular ve 'bu müdahaleyi sadece işinin ehli, deneyimli hekimler yapmalıdır; aksi halde annenin rahim damarlarını yırtarak ölümüne sebep olursunuz' uyarısında bulunur. Bu etik ve teknik uyarılar, İslam tıbbının cerrahi müdahalelerde 'önce zarar verme' (primum non nocere) ilkesine ne denli sadık kaldığını gösterir. Bu kancalar, 19. yüzyıla kadar Avrupa obstetriğinde standart araçlar olarak kullanılmıştır."}, {"id": "a066", "slug": "yeni-a066-kafatasi-matkabi", "title": "Kafatası Matkabı / Trepan (Minkab)", "creator": "ez-Zehrâvî ve Sabuncuoğlu Geleneği", "kisa": "Kafa travmalarında çöken kemik parçalarını temizlemek ve beyin üzerindeki basıncı almak için kullanılan; ucu derinliğe karşı koruyucu halkalarla donatılmış el matkapları.", "uzun": "Kafatası Matkabı (Minkab / Trepan), İslam cerrahisinin nöroşirürji alanındaki ustalığının en riskli ve en hassas kanıtıdır. Savaşlarda veya kazalarda meydana gelen kafa travmalarında, kafatası kemikleri içeri çökerek beyne baskı yapar ve ölümcül sonuçlar doğururdu. ez-Zehrâvî ve yüzyıllar sonra onun izinden giden Sabuncuoğlu, bu kemik parçalarını çıkarmak için 'modiolus' adı verilen, ortasında vida benzeri bir ucu olan döner el matkapları tasarladılar. Ancak bu matkapların en dâhiyane özelliği, ucun etrafına yerleştirilen 'koruyucu halkalar' (sınırlayıcılar) idi. Hekim, kemiğin kalınlığını tahmin ettikten sonra bu halkayı ayarlıyor; matkap kemiği deldiği an, halka kemik yüzeyine çarpıyor ve matkabın daha derine inerek beyni saran zarı (dura mater) yırtmasını fiziksel olarak engelliyordu. Sabuncuoğlu, Cerrâhiyyetü'l-Hâniyye'deki minyatürlerinde bu matkapların nasıl tutulacağını ve hastanın başının nasıl sabitleneceğini resmetmiştir. Bu 'kontrollü derinlik' mekanizması, modern nöroşirürjik matkapların temel güvenlik prensibidir."}, {"id": "a067", "slug": "yeni-a067-epilepsi-koteri", "title": "Epilepsi (Sara) Koteri", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Epilepsi (sara) nöbetlerini ve şiddetli nevraljik ağrıları kontrol altına almak için kafatası ve şakaklardaki belirli sinir noktalarına uygulanan, özel uçlu dağlama aleti.", "uzun": "Epilepsi Koteri (Mikvât eş-şarc), Orta Çağ tıbbının nöroloji alanındaki en cesur ve en tartışmalı müdahalelerinden birinin aracıdır. Antik Çağ'dan beri 'kutsal hastalık' (morbus sacer) olarak bilinen ve şeytan çıkarma ritüellerine maruz kalan epilepsi, İslam hekimleri tarafından biyolojik ve nörolojik bir hastalık olarak ele alınmıştır. ez-Zehrâvî, ilaçlara yanıt vermeyen şiddetli epilepsi nöbetlerinde ve migrenlerde, kafa derisindeki ve şakaklardaki belirli damar ve sinir noktalarını (bugünkü akupunktur ve trigeminal sinir noktalarına benzer bölgeler) kızdırılmış demirle dağlayarak (koterizasyon) nöbetlerin yayılmasını bloke etmeyi denemiştir. Bu aletin ucu, kafa kemini (cranium) delip beyne zarar vermeyecek kadar küt, ancak deriyi ve sinir zarını mühürleyecek kadar sıcak ve sivriydi. Ez-Zehrâvî, bu işlemin ancak 'işinin ehli, anatomiyi bilen' hekimler tarafından yapılmasını, aksi halde hastanın felç geçirebileceğini vurgular. Bu müdahale, modern tıptaki 'vagal sinir uyarımı' veya 'termal lezyon' tedavilerinin ilkel ama mantıksal öncülüdür."}, {"id": "a069", "slug": "yeni-a069-kist-kaziyici", "title": "Kist ve Tümör Kazıyıcı (Mişdâh)", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Deri altındaki kistleri, et benlerini ve kemik yüzeyindeki ölü dokuları, çevre sağlıklı dokuya zarar vermeden kökünden kazıyıp çıkarmak için kullanılan, ucu kavisli cerrahi raspator.", "uzun": "Kist ve Tümör Kazıyıcı (Mişdâh), ez-Zehrâvî'nin genel cerrahi alet setinin en çok yönlü ve en hayati parçalarından biridir. Orta Çağ'da deri altında büyüyen kistler (özellikle saçlı derideki sebze kistleri veya 'kıl kurdu' denilen oluşumlar) ve iyi huylu tümörler, enfekte olup apse oluşturarak hastayı sepsise (kan zehirlenmesi) sürükleyebilirdi. Bıçakla kesmek, kist zarının patlamasına ve içeriğin dokuya yayılarak hastalığın nüksetmesine yol açıyordu. ez-Zehrâvî, bu sorunu çözmek için 'mişdâh' adını verdiği, ucu kaşık veya yassı bir spatula gibi kavislenmiş, kenarları keskinleştirilmiş kazıyıcılar icat etti. Hekim, kistin üzerini küçük bir kesiyle açtıktan sonra bu aleti kistin zarı ile sağlıklı et arasına sokuyor, kavisli hareketlerle kisti 'soyarak' (raspaj) bütünlüğünü bozmadan dışarı çıkarıyordu. Aynı aletin daha büyük ve sert versiyonları, kemik iltihaplarında (osteomyelitis) ölü kemik dokusunu (sekvestr) kazımak için de kullanılırdı. Mişdâh, modern cerrahideki 'Volkmann kaşıkları' ve 'kemik küretleri'nin doğrudan atasıdır."}, {"id": "a070", "slug": "yeni-a070-uretral-sonda", "title": "Üretral Sonda (Kâşâtîr)", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Mesanede tutulu kalan idrarı dışarı akıtmak, üretra darlıklarını genişletmek için kullanılan; ucu pamuk/yün tıpalı, pürüzsüz gümüş veya bronz borular.", "uzun": "Üretral Sonda (Kâşâtîr), ez-Zehrâvî'nin et-Taşrîf'inin 'İdrar Yolları Tedavisi' bölümünde detaylandırdığı ve modern ürolojinin temel aletlerinden biri olan cerrahi borudur. Orta Çağ'da prostat büyümesi veya üretra darlıkları nedeniyle mesanede tutulu kalan idrar (retansiyon), hastalar için agonize edici ve ölümcül bir tehlikeydi. ez-Zehrâvî, bu sorunu çözmek için 'yaklaşık bir buçuk karış uzunluğunda oldukça ince, pürüzsüz gümüş bir boru' tasarlamıştır. Gümüşün seçilmesi tesadüfi değildir; gümüş, doğal antiseptik özelliklere sahiptir ve üretra mukozasını tahriş etmez. Sondanın ucunda, mesaneye girerken dokuyu zedelememesi için tıpkı bir tıpa gibi duran, çift katlı bir tel aracılığıyla tutulan pamuk veya yün bir başlık bulunurdu. Hekim sondayı mesaneye yerleştirdikten sonra bu pamuğu çekiyor ve idrarın dışarı akmasını sağlıyordu. Bu alet, 19. yüzyılda Auguste Mercier ve modern Foley sondaları geliştirilene kadar, tam 900 yıl boyunca Avrupa ve İslam tıbbında standart ürolojik müdahale aracı olarak kalmıştır."}, {"id": "a072", "slug": "yeni-a072-sunnet-makasi", "title": "Sünnet Makası (Mikaşş)", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Erkek çocuklarının sünnet işleminde glans'ın (sünnet derisinin altındaki hassas doku) kesilmesini fiziksel olarak engelleyen, koruyucu plaka ve kavisli makastan oluşan güvenli cerrahi set.", "uzun": "Sünnet Makası (Mikaşş), ez-Zehrâvî'nin pediatrik (çocuk) cerrahisindeki hassasiyetini ve İslam tıbbının dini ritüelleri güvenli tıbbi prosedürlere dönüştürme çabasını gösterir. Orta Çağ'da sünnet, genellikle tecrübesiz berberler veya hocalar tarafından standart bıçaklarla yapılıyor; bu da glans penis'in (hassas baş kısmın) kesilmesi veya ölümcül kanamalar gibi trajik kazalara yol açıyordu. ez-Zehrâvî, bu riskleri ortadan kaldırmak için özel bir 'mikaşş' (makas) ve koruyucu sistem tarif eder. İşlemde, sünnet derisi öne çekildikten sonra, glans'ın hemen önüne ahşap veya fildişinden bir 'koruyucu plaka' (şim) yerleştirilir. Hekim, özel olarak kavislendirilmiş makası bu plakanın üzerinden tek bir hamleyle kapatarak deriyi keser; plaka, makasın hassas dokuya ulaşmasını fiziksel olarak engeller. ez-Zehrâvî, operasyon sonrası kanamayı durdurmak için kül ve özel bitkisel tozlar (hemostatik ajanlar) kullanmayı da salık verir. Bu alet, İslam dünyasında sünnetin bir 'halk ritüeli' olmaktan çıkıp, steril ve anatomik bilgiye dayalı bir 'klinik cerrahi' haline gelmesinin mihenk taşıdır."}, {"id": "a082b", "slug": "yeni-a082b-kukurt-ve-civa", "title": "Kükürt ve Cıva (Simyasal Prensipler)", "creator": "Câbir b. Hayyân", "kisa": "Câbir b. Hayyân'ın tüm metallerin kökeni olarak kabul ettiği; yanıcılığı ve metalik parlaklığı temsil eden kükürt (sülfür) ile akışkanlığı ve birleştiriciliği temsil eden cıva (zebak) prensipleri ve bunların laboratuvar kapları.", "uzun": "Kükürt ve Cıva, İslam simyasının ve erken metalürjisinin teorik omurgasını oluşturan iki 'felsefi taştır'. Câbir b. Hayyân, Aristoteles'in dört element (toprak, su, hava, ateş) teorisinin laboratuvar pratiğini açıklamakta yetersiz kaldığını görmüş ve bunun yerine 'Kükürt-Cıva Teorisi'ni geliştirmiştir. Ona göre kükürt, maddelerin yanma, renk verme ve katılaşma (erkeklik/aktif) prensibiydi; cıva ise akışkanlık, birleşme ve metalik parlaklık (dişilik/pasif) prensibiydi. Altın, bu iki maddenin kusursuz saflıkta ve dengede birleşmesiydi; kurşun veya demir ise bu dengenin bozuk veya safsız halleriydi. Simyacıların (ve daha sonra rasyonel kimyagerlerin) tüm laboratuvar çabası, kükürt ve cıvayı saflaştırarak (süblimasyon ve damıtma) onları yeniden birleştirmek ve 'İksir'i (Felsefe Taşı'nı) bulmaktı. Bu teori, 17. yüzyıla kadar Avrupa kimyasının (Paracelsus ve Robert Boyle'a kadar) temel paradigması olarak kalmıştır. Koleksiyondaki kükürt kristalleri ve cıva kapları, kimya tarihinin en uzun ömürlü teorik modelinin maddi tanıklarıdır."}, {"id": "a085", "slug": "yeni-a085-maskeli-nester", "title": "Maskeli Neşter (Mihdac)", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Hastanın kesici yüzü görüp paniğe kapılmasını önlemek için jileti elipsoit bir kabuk içinde gizleyen, insan psikolojisini gözeten maskeli cerrahi neşter.", "uzun": "Maskeli Neşter (Mihdac), ez-Zehrâvî'nin et-Taşrîf'inin 'Genel Cerrahi' bölümünde tarif ettiği ve tıp tarihinin en zarif 'deontolojik' (etik) buluşlarından biridir. Orta Çağ'da ameliyat olacak hastalar, hekimin elindeki parlak ve keskin çelik bıçakları gördüklerinde şoka giriyor, kalp krizi geçiriyor veya kaçmaya çalışıyorlardı. ez-Zehrâvî bu psikolojik travmayı çözmek için 'mihdac' (Arapça 'gizli oda' kökünden) adını verdiği bir neşter tasarladı. Bu alette, son derece keskin olan çelik jilet, dışarıdan bakıldığında sıradan bir metal kalem veya silindir gibi görünen elipsoit bir kabuğun (maske) içine gizlenmişti. Hekim aleti hastanın vücuduna yaklaştırdığında, kabuk geri çekiliyor veya sadece kesmesi gereken milimetrik uç dışarı çıkarak dokuyu yarıyordu. Hasta, kesildiğini hissedene kadar bıçağı görmüyordu. Bu tasarım, İslam tıbbının hastayı sadece 'biyolojik bir makine' olarak değil, korkuları ve hassasiyetleri olan bir 'insan' olarak gördüğünün; cerrahinin sadece el becerisi değil, aynı zamanda derin bir empati ve psikoloji bilgisi gerektirdiğinin somut kanıtıdır."}, {"id": "a085b", "slug": "yeni-a085b-ampulla-lutata", "title": "Ampulla lutata (Balçık Sıvalı Şişe)", "creator": "İslam Kimya ve Metalurji Geleneği", "kisa": "Yüksek ısıya ve asidik buharlara dayanması için dışı kalın bir 'bilge kili' (tın el-hikme / lut) tabakasıyla sıvanmış, termal şoka karşı korumalı cam şişe/retort.", "uzun": "Ampulla lutata (Balçık Sıvalı Şişe), İslam laboratuvar pratiğinin malzeme bilimindeki (seramik ve cam mühendisliği) en pratik ve en hayati çözümlerinden biridir. Latince 'lutum' (balçık/çamur) kelimesinden türeyen bu teknik, Arapça 'tın el-hikme' (bilge kili) olarak bilinirdi. Orta Çağ camları, modern borosilikat (Pyrex) camlar kadar termal şoka dayanıklı değildi; güçlü asitlerin (örneğin nitrik asit veya kral suyu) damıtılması sırasında cam hem kimyasal olarak aşınıyor hem de ani ısı değişimleriyle patlıyordu. er-Râzî ve Câbir geleneği, bu sorunu çözmek için cam kapların dışını özel bir kil, kum, tuz ve organik bağlayıcılardan (örneğin at kılı veya yün) oluşan bir macunla sıvamışlardır. Fırında pişen bu balçık zırh, camı hem dış darbelerden koruyor hem de ısıyı homojen bir şekilde dağıtarak patlamayı önlüyordu. Ayrıca imbiklerin ek yerlerini (kapak ve kazan birleşimlerini) tamamen sızdırmaz (hermetik) hale getirmek için de bu 'lut' macunu kullanılırdı. Bu teknik, 'hermetik kapama' (hermetic seal) kavramının kökenidir ve İslam kimyasının 'maddi kültürünün' en somut tanığıdır."}, {"id": "a091", "slug": "yeni-a091-nefesli-otomat", "title": "Kendiliğinden Çalan Nefesli Alet", "creator": "Benû Mûsâ b. Şâkir", "kisa": "Su veya hava basıncıyla çalışan, üzerindeki çıkıntılar (pin) değiştirilerek farklı melodiler çalınabilen, tarihin ilk 'programlanabilir' makinesi.", "uzun": "Kendiliğinden Çalan Nefesli Alet (el-Âle elletî tuzammiru bi-nefsihâ), Benû Mûsâ kardeşlerin 'Kitâb el-Hiyel' adlı eserinde anlattığı ve sibernetik tarihinin en büyük devrimlerinden biri olan cihazdır. Bu otomat, temelde bir su saati mekanizmasıyla döndürülen silindirik bir tambur ve bu tambura bağlı körüklerden oluşan bir flüt sistemidir. Ancak asıl dâhiyane buluş, tamburun üzerindeki 'çıkıntılar' (pinler) ve kaldıraçlardır. Benû Mûsâ, tamburun üzerindeki çıkıntıların yerlerini ve uzunluklarını değiştirerek (yani silindiri 'yeniden programlayarak') makinenin farklı melodiler, farklı ritimler ve farklı makamlar çalmasını sağlamışlardır. Bu, insanlık tarihinde bir makinenin fiziksel gövdesinden (donanım) bağımsız olarak, ona dışarıdan bir komut dizisi (yazılım/program) yüklenebileceğinin ilk kanıtıdır. 19. yüzyıldaki müzik kutuları, delikli kartlarla çalışan piyanolar ve nihayetinde modern bilgisayarların 'değiştirilebilir program' mantığı, doğrudan bu 9. yüzyıl Bağdat otomatının mirasçısıdır. Benû Mûsâ, bu aletle mekaniği sadece 'iş yapan' bir güç olmaktan çıkarıp 'bilgi işleyen' bir sisteme dönüştürmüştür."}, {"id": "a095", "slug": "yeni-a095-hileli-icme-kabi", "title": "Hayret Uyandırıcı İçme Kabı (Hileli Kap)", "creator": "Benû Mûsâ b. Şâkir", "kisa": "İçine sıvı konulduğunda normal bir kadeh gibi davranan, ancak ters çevrildiğinde veya belirli bir deliğe parmak basıldığında sıvının dökülmesini engelleyen vakum ve sifon mekanizmalı hileli kap.", "uzun": "Hayret Uyandırıcı İçme Kabı, Benû Mûsâ kardeşlerin 'Kitâb el-Hiyel' adlı eserinde anlattığı 15 hileli kaptan biridir ve saray meclislerinin en popüler bilimsel şakasıydı. Bu kap, dışarıdan bakıldığında zarif bir pirinç veya cam kadeh gibi görünür; ancak içinde çift cidarlı hazneler, gizli hava kanalları ve sifon boruları barındırır. Kadehe su veya şarap doldurulduğunda sıvı normal bir şekilde içilebilir. Ancak konuk kadehi ağzına götürmeden ters çevirirse veya kadehin sapındaki gizli bir hava deliğine parmağıyla basarsa, içerideki vakum kilidi devreye girer ve sıvı yerçekimine meydan okuyarak kadehin içinden dökülmez. Hava basıncının sıvıları nasıl tuttuğunu (Torricelli ve Pascal'dan 800 yıl önce) pratik olarak kanıtlayan bu kaplar, yalnızca birer eğlence aracı değil, aynı zamanda Abbâsî elitine pnömatik ve hidrostatik yasaları öğreten interaktif 'bilimsel oyuncaklar'dı."}, {"id": "a098", "slug": "yeni-a098-krank-biyel-pompasi", "title": "Su Kaldıran Alet (Krank-Biyel Pompası)", "creator": "İsmâil b. er-Rezzâz el-Cezerî", "kisa": "el-Cezerî'nin tasarladığı; su çarkının dönme hareketini, krank ve biyel kolu aracılığıyla pistonların ileri-geri (doğrusal) hareketine çevirerek suyu yükseğe pompalayan devrim niteliğinde hidrolik makine.", "uzun": "Su Kaldıran Alet (Krank-Biyel Pompası), İslam mühendisliğinin ve dünya mekanik tarihinin en kritik dönüm noktalarından biridir. el-Cezerî, kitabının beşinci kısmında tarif ettiği bu düzenezkte, bir su çarkına veya hayvan gücüne bağlı döner bir mile 'krank' (dirsekli mil) ve ona bağlı bir 'biyel' (bağlantı çubuğu) eklemiştir. Bu mekanizma, milin dairesel dönme hareketini, pistonların silindir içindeki doğrusal (ileri-geri) hareketine dönüştürüyordu. Antik Çağ'da (Heron veya Philon) krank mekanizması bilinmiyordu; el-Cezerî bu mekanizmayı icat ederek, suyun kesintisiz ve yüksek basınçla yukarı pompalanmasını sağladı. Bu 'dönme-doğrusal' hareket dönüşümü, yüzyıllar sonra 18. yüzyılda James Watt'ın buharlı makinelerinde ve bugün kullandığımız tüm içten yanmalı otomobil motorlarında çalışan temel kinematik zincirdir. el-Cezerî'nin bu pompası, Sanayi Devrimi'nin 600 yıl öncesindeki mekanik atasıdır."}, {"id": "a113", "slug": "yeni-a113-yakup-sopasi", "title": "Yakup Sopası (Cross-staff)", "creator": "İslam Denizcilik ve Astronomi Geleneği", "kisa": "Gök cisimlerinin (özellikle Kutup Yıldızı ve Güneş) yükseklik açısını ölçerek enlem belirlemeye yarayan, basit ama son derece etkili sopa ve çapraz lata düzeneği.", "uzun": "Yakup Sopası (Cross-staff / Haşabât), İslam denizciliğinin ve astronomisinin açık deniz navigasyonundaki en vazgeçilmez aracıdır. Temel yapısı son derece sadedir: derecelendirilmiş uzun bir ana sopa ve üzerinde kayan, ufkı ve gök cismini aynı anda hizalamaya yarayan bir çapraz lata. Gözlemci, sopanın bir ucunu gözüne dayar, çapraz latayı gök cismine (genellikle Kutup Yıldızı) ve ufka hizalar ve sopadaki ölçekten açıyı okur. Bu açı, doğrudan gözlemcinin coğrafi enlemini verir. İslam denizcileri, bu aletin daha basit ve deniz koşullarına uygun bir varyantı olan 'kamal'ı da geliştirmişlerdir; kamal, küçük bir ahşap levha ve farklı enlemlere göre düğümlenmiş bir ipten oluşur. Hint Okyanusu'nda binlerce yıl kullanılan bu sistem, gemilerin Afrika kıyılarından Endonezya'ya kadar güvenli bir şekilde seyretmesini sağlamıştır. 15. yüzyılda Vasco da Gama'nın Hint Okyanusu'na açıldığında, İslam denizcilerinden (özellikle İbn Mâcid'den) devraldığı en kritik teknoloji bu alettir. Avrupa'ya 'Jacob's Staff' (Yakup Sopası) adıyla geçen bu cihaz, 16.-17. yüzyıllarda okyanus ötesi keşiflerin ve sömürge imparatorluklarının kurulmasının teknik altyapısını oluşturmuştur."}, {"id": "a114", "slug": "yeni-a114-ziyar-yayi-arbalet", "title": "Ziyâr Yayı / Arbalet", "creator": "Murdâ b. Alî et-Tarsûsî", "kisa": "Tarsûsî'nin tasarladığı; ahşap, boynuz ve sinirden oluşan bileşik yayların mekanik bir kundağa monte edildiği, bocurgat veya manivela ile gerilerek zırh delen 'Tatar okları' atan mekanik arbalet.", "uzun": "Ziyâr Yayı (kavs ez-ziyâr), İslam askerî mühendisliğinin kinetik enerji ve malzeme bilimindeki ustalığının zirvesidir. Orta Çağ'da standart yaylar, insan kas gücünün sınırlarına takılıyordu. Tarsûsî, 'Tabşirat' adlı eserinde, boynuz, ahşap ve hayvan sinirinin katmanlar halinde yapıştırılmasıyla (kompozit malzeme) üretilen devasa yayları, mekanik bir ahşap kundağa monte etmeyi anlatır. Bu yaylar elle gerilemeyecek kadar güçlü olduğu için, Tarsûsî aletin arkasına 'bocurgat' (çıkrık/vinç) veya kaldıraçlı germe mekanizmaları eklemiştir. Bu mekanik arbaletler, Haçlıların ağır zırhlarını ve kale surlarındaki mazgalları delmek için 'Tatar oku' (ağır, zırh delici ok) fırlatıyordu. Avrupa'da 'Arbalet' (crossbow) olarak bilinen ve kilise tarafından 'Hristiyanlara karşı kullanılması yasaklanan' bu korkutucu silahın mühendislik altyapısı ve terminolojisi, doğrudan İslam kuşatma risalelerinden (ziyâr) ve Haçlı Seferleri sırasındaki teknolojik osmozdan beslenmiştir."}, {"id": "a134", "slug": "yeni-a134-dogrusal-usturlap", "title": "Doğrusal Usturlap (Tûsî Cetveli)", "creator": "Nasîrüddîn et-Tûsî", "kisa": "et-Tûsî'nin icat ettiği; usturlabın dairesel kadranlarını ve trigonometrik fonksiyonlarını tek bir doğru (cetvel) üzerine izdüşüren, cepte taşınabilir 'lineer analog bilgisayar'.", "uzun": "Doğrusal Usturlap (el-Âlet el-Hattiyye), Nasîrüddîn et-Tûsî'nin pratik zekâsının ve geometrik dehasının bir ürünüdür. Klasik usturlaplar dairesel formdaydı ve metalurjik olarak üretilmesi, kalibre edilmesi hassas ustalık gerektiriyordu. et-Tûsî, usturlabın tüm fonksiyonlarını (sinüs, kosinüs, tanjant, yükseklik ve zaman hesabı) stereografik projeksiyonun lineer (doğrusal) bir dönüşümünü kullanarak tek bir cetvel veya dikdörtgen plaka üzerine indirmeyi başardı. Bu cetvel, üzerinde kayan bir şakül (ip) ve boncuklar yardımıyla, dairesel bir usturlabın yapabildiği tüm trigonometrik ve astronomik hesaplamaları yapabiliyordu. 'Tûsî Cetveli' olarak da bilinen bu alet, özellikle seyahat eden alimler, kâdı'lar (hakimler) ve ordu komutanları için cepte taşınabilir, kırılması imkânsız ve üretimi çok daha ucuz bir 'cep bilgisayarı' işlevi gördü. Bu alet, İslam matematikçilerinin geometriyi sadece şekil çizmek için değil, hesaplama makineleri tasarlamak için bir 'yazılım dili' olarak kullandıklarının en çarpıcı kanıtlarından biridir."}, {"id": "a134b", "slug": "yeni-a134b-evrensel-disk-hamairi", "title": "Evrensel Disk (Muhammed b. Futûh el-Hamâ’irî)", "creator": "Muhammed b. Futûh el-Hamâ’irî", "kisa": "Hamâ'irî'nin safiha (evrensel disk) formunda ürettiği; ez-Zerkâlî geleneğinin Mağrib'deki devamı olan, zarif gravürleri ve matematiksel kusursuzluğuyla ünlü alet.", "uzun": "Muhammed b. Futûh el-Hamâ'irî'nin Evrensel Diski, Endülüs-Mağrib astronomi ekolünün 13. yüzyıldaki canlılığının kanıtıdır. Hamâ'irî, Toledo'lu ez-Zerkâlî'nin 11. yüzyılda icat ettiği 'safiha zerkaliyye' (evrensel disk) geleneğini devralmış ve onu Mağrib atölyelerinin o meşhur 'zarif gravür' üslubuyla buluşturmuştur. Bu disk, çok plakalı klasik usturlaba Endülüs'ün cevabıdır; küresel astronomi problemlerini tek plakada çözer. Hamâ'irî'nin ürettiği bu evrensel diskler, sadece birer hesaplama aracı değil, aynı zamanda üzerlerindeki Kufi ve Nesih hatlarıyla birer sanat eseridir. Bu aletler, Endülüs'ün Hristiyanlar tarafından fethinden sonra İtalya ve Güney Fransa'ya taşınmış; Avrupa'nın ilk 'Saphea' (evrensel disk) usturlaplarına doğrudan model olmuştur. Koleksiyonda bu disk, bilginin sınırları ve dinleri aşan evrensel doğasının sembolüdür."}, {"id": "a136", "slug": "yeni-a136-kuresel-usturlap-harrani", "title": "Küresel Usturlap (Câbir b. Sinan el-Harrânî)", "creator": "Câbir b. Sinan el-Harrânî", "kisa": "Harrânî'nin tasarladığı; düzlem usturlabın üç boyutlu karşılığı olan, gök küresini döner bir pirinç küre üzerine izdüşüren ve mecra kadranıyla donatılmış anıtsal alet.", "uzun": "Küresel Usturlap (el-Asturlâb el-Kuravî), İslam alet yapımı geleneğinin en özgün ve en cesur tasarımlarından biridir. 9. yüzyılda Câbir b. Sinan el-Harrânî, düzlem usturlabın stereografik projeksiyonunun kutuplara yakın bölgelerde yarattığı açısal bozulmaları fark etmiş ve gök küresini birebir 3 boyutlu bir pirinç küre üzerine kazıyarak bu sorunu çözmüştür. Küre, bir meridyen çemberi içine asılır ve mecra (yükseklik kadranı) ile donatılırdı. Bu alet, yalnızca bir gözlem aracı değil, aynı zamanda gökyüzünün mekanik bir modeliydi; gezegenlerin ve yıldızların günlük hareketlerini fiziksel olarak simüle edebiliyordu. Harrânî'nin bu tasarımı, Kustâ b. Lükâ ve en-Neyrîzî gibi sonraki nesil astronomlar tarafından teorik olarak temellendirilmiş, ancak karmaşık kullanımı ve taşıma zorluğu nedeniyle düzlem usturlap kadar yaygınlaşamamıştır. Koleksiyonda bu alet, İslam mühendisliğinin 'uzay ve geometri' kavramlarını nasıl somutlaştırdığının kanıtıdır."}, {"id": "a139", "slug": "yeni-a139-sakkaziyye-usturlap", "title": "Şakkâziyye Usturlap (Çift Kadranlı Evrensel Disk)", "creator": "İslam Alet Geleneği (el-Merîdînî Ekolü)", "kisa": "Evrensel disk ile klasik usturlabın işlevlerini birleştiren; tek bir plaka üzerinde tüm enlemlerdeki ufuk ve saat eğrilerini matematiksel bir sentezle gösteren melez alet.", "uzun": "Şakkâziyye Usturlap, İslam astronomisinin en sofistike stereografik projeksiyon çözümlerinden biridir. Farklı enlemler için ayrı ayrı plaka taşıma zorunluluğunu ortadan kaldıran bu evrensel disk/usturlap, tek bir 'evrensel plaka' üzerinde tüm enlemlerdeki ufuk ve saat eğrilerini matematiksel bir sentezle birleştirir. Adı, 'çift kadranlı' veya 'bölünmüş' yapısından gelir; aletin ön yüzü farklı projeksiyon katmanlarını (ufki ve ekvatoryal) aynı anda okumaya olanak tanır. Bu alet, Avrupa'da 'Meteoroskop' adıyla bilinen ve karmaşık küresel üçgen problemlerini çözmek için kullanılan aletlerin doğrudan atasıdır. Şakkâziyye, evrensellik arayışının pratik ve son derece rafine bir çözümüdür; kullanıcının karmaşık trigonometrik hesaplamalar yapmasına gerek kalmadan, doğrudan görsel okuma yapmasını sağlar."}, {"id": "a140", "slug": "yeni-a140-sinus-kadrani", "title": "Sinüs Kadranı (Rub' el-Müceyyeb)", "creator": "İslam Muvakkit ve Astronomi Geleneği", "kisa": "Trigonometrik fonksiyonları (sinüs, kosinüs) geometrik olarak çözmek, namaz vakitlerini ve kıble yönünü hesaplamak için kullanılan, çeyrek daire formundaki matematiksel kadran.", "uzun": "Sinüs Kadranı (Rub' el-Müceyyeb), İslam medeniyetinin matematiği (trigonometriyi) dini bir ihtiyaçla (namaz vakitleri ve kıble) harmanlayarak yarattığı en zarif ve en yaygın bilimsel alettir. Bir çeyrek daire (90 derecelik yay) formundaki bu kadranın iç yüzeyi, ortadan kenara doğru yayılan sinüs ve kosinüs eğrileriyle, ızgara hatlarıyla ve ufuk çizgileriyle kazınmıştır. Kullanıcı, kadranın merkezinden sarkan bir şakül (çekül) ve ip yardımıyla Güneş'in yüksekliğini ölçer; ardından ipi kadran üzerindeki sinüs eğrileriyle kesiştirerek, o günkü öğle vaktini, ikindi vaktini veya Mekke'nin yönünü (kıble) hiçbir sayısal hesaplama yapmadan, sadece ipin gösterdiği noktadan okuyabilirdi. Bu alet, İslam dünyasındaki her camiinin 'muvakkithane'sinin (zaman ölçüm odasının) duvarında veya muvakkitlerin cebinde bulunan standart bir araçtı. Sinüs kadranı, Avrupa'ya aktarıldığında 'Quadrans Vetus' (Eski Kadran) adını almış ve Rönesans denizcilerinin ve kâşiflerinin okyanuslarda yön ve zaman bulmak için kullandıkları en temel trigonometrik hesap makinesi haline gelmiştir."}, {"id": "a142", "slug": "yeni-a142-semerkant-sekstanti", "title": "Semerkant Rasathanesi Sekstantı", "creator": "Uluğ Bey ve Semerkant Ekolü", "kisa": "Teleskop öncesi çağın en büyük ve en hassas gözlem aleti; 40 metre yarıçaplı, yeraltına inen devasa meridyen sekstantı.", "uzun": "Semerkant Rasathanesi Sekstantı, insanlık tarihinin teleskop icat edilmeden önce inşa ettiği en büyük ve en hassas astronomik gözlem aletidir. Uluğ Bey'in emriyle 1420'lerde inşa edilen bu devasa yapı, tam bir meridyen düzleminde (kuzey-güney hattında) toprağın içine oyulmuş, 40 metre yarıçaplı (118 derecelik bir yay çizen) mermer bir sekstanttan oluşuyordu. Aletin merkezi, rasathanenin üst katındaki gözlem odasında, ışığın girdiği bir karanlık oda (camera obscura) prensibiyle çalışıyordu. Güneş'in veya Ay'ın ışığı bu delikten girip 40 metrelik mermer yay üzerinde bir görüntü oluşturuyor; astronomlar bu görüntünün mermer üzerindeki milimetrik taksimatını okuyarak gök cisimlerinin konumlarını saniyenin kesirleri hassasiyetinde belirliyordu. Bu sekstant sayesinde hazırlanan 'Zîc-i Sultânî', 1018 yıldızın konumunu içeren ve 16. yüzyıla kadar (Tycho Brahe'ye dek) dünyanın en doğru yıldız kataloğu olarak kalan anıtsal bir eserdir. Aletin yeraltındaki kalıntıları bugün dahi Semerkant'ta İslam biliminin devasa vizyonunun fiziksel bir anıtı olarak ayaktadır."}, {"id": "a144", "slug": "yeni-a144-samrat-yantra", "title": "Samrât Yantra", "creator": "Sawai Jai Singh II", "kisa": "Jai Singh II'nin Delhi ve Jaipur'da inşa ettiği, 20-30 metre yüksekliğindeki devasa taş gnomon ve mermer kadranlardan oluşan, dünyanın en büyük ve en hassas ekinoksal güneş saati.", "uzun": "Samrât Yantra (Yüce Alet), İslam astronomi mirasının Hint coğrafyasındaki en anıtsal ve en görkemli yankısıdır. 18. yüzyılda Babür İmparatorluğu'nda hüküm süren Sawai Jai Singh II, Uluğ Bey'in Semerkant'taki ve el-Hucendî'nin Rey'deki dev sekstantlarından ilham alarak, teleskop çağına girilmiş olmasına rağmen 'taş ve mermerden' devasa rasathaneler (Jantar Mantar) inşa etmiştir. Samrât Yantra, temelde devasa bir üçgen prizma (gnomon) ve onun iki yanına yerleştirilmiş çeyrek daire biçimindeki mermer kadranlardan oluşur. Gnomonun yüksekliği 20 ila 30 metre arasında değişir ve tam olarak coğrafi enleme paralel olarak (kutup noktasına yönlü) inşa edilmiştir. Güneş'in gölgesi bu devasa kadranlar üzerinde milimetrik bir hassasiyetle hareket eder; gözlemciler bu gölgeyi izleyerek yerel zamanı saniye hassasiyetle, güneşin deklinasyonunu ve ekinoks anlarını hesaplayabilirler. Jai Singh II'nin bu mimari şaheserleri, İslam dünyasındaki 'aletlerin boyutunu büyütmenin, bölüntü (derece) hatalarını minimize edeceği' prensibinin (ki bu prensibi Merâğa ve Semerkant'tan devralmıştır) tarihteki en büyük fiziksel uygulamasıdır."}, {"id": "a147", "slug": "yeni-a147-dakshinovritti-yantra", "title": "Dakshinovritti Yantra", "creator": "Sawai Jai Singh II", "kisa": "Jai Singh II'nin Delhi rasathanesinde inşa ettiği; gök cisimlerinin meridyenden geçiş anındaki maksimum yüksekliklerini (deklanasyon) ölçmek için kullanılan, yarım daire biçiminde devasa taş meridyen kadranı.", "uzun": "Dakshinovritti Yantra, İslam astronomisindeki 'duvar kadranı' (quadrans muralis) ve 'meridyen sekstantı' geleneğinin, Hint taş mimarisiyle yorumlanmış halidir. Klasik İslam rasathanelerinde (Merâğa, İstanbul) meridyen kadranları rasathane binasının iç duvarına monte edilirdi. Jai Singh II ise bu aleti açık havada, devasa bir yarım daire biçiminde taş ve mermerden inşa etmiştir. Alet, tam olarak kuzey-güney (meridyen) düzlemine yerleştirilmiştir. Gök cisimleri (Güneş, Ay, gezegenler veya yıldızlar) tam öğlen vakti veya gece yarısı meridyeni kestiğinde, gözlemci aletin merkezindeki nişangâh (veya gnomon) aracılığıyla cismin yüksekliğini bu dev yay üzerindeki taksimattan okurdu. Bu ölçüm, cismin ekvatora göre konumunu (deklanasyon) belirlemek için kritik öneme sahipti. Dakshinovritti Yantra, Takiyyeddîn'in ve Tycho Brahe'nin metal kadranlarıyla aynı optik ve geometrik prensipleri kullanır; ancak boyutu sayesinde, insan gözünün teleskopsuz olarak ulaşabileceği maksimum açısal çözünürlüğü sunar. Bu alet, İslam-Hint bilimsel etkileşiminin (özellikle Farsça Zîc'lerin Sanskritçe'ye çevrilmesinin) somut bir anıtıdır."}, {"id": "a155", "slug": "yeni-a155-bingam-i-rasadi", "title": "Astronomik Gözlem Saati (Bingâm-ı Rasadı)", "creator": "Takiyyeddîn er-Râsıd", "kisa": "Takiyyeddîn'in İstanbul Rasathanesi için icat ettiği; yıldızların meridyenden geçiş anlarını saniye hassasiyetiyle kaydeden, mekanik ve ağırlık tahrikli devrim niteliğinde gözlem saati.", "uzun": "Astronomik Gözlem Saati (Bingâm-ı Rasadı), Takiyyeddîn'in İstanbul Rasathanesi'ndeki en kritik ve en özgün buluşlarından biridir. 16. yüzyıla kadar astronomlar, gök cisimlerinin geçiş zamanlarını ölçmek için su saatlerine veya kum saatlerine güvenmek zorundaydı; bu da özellikle kış aylarında veya uzun gözlem seanslarında ciddi sapmalara yol açıyordu. Takiyyeddîn, Avrupa'da mekanik saatçiliğin henüz rasathanelere tam entegre olmadığı bir dönemde, tamamen kendi tasarımı olan, ağırlık ve zemberek (yay) mekanizmasıyla çalışan, dakikaları ve saniyeleri bölümlendiren hassas bir 'rasathane saati' icat etti. Bu saat, rasathanenin meridyen duvarındaki kadranlarla senkronize edilmiş, gözlemcinin bir yıldızın tam tepe noktasından (zenit) veya meridyenden geçtiği anı, insan refleksinden bağımsız olarak saniyesine kadar kaydetmesini sağlıyordu. Takiyyeddîn, bu saati 'rasadın (gözlemin) ayrılmaz bir parçası' olarak tanımlar. Bu buluş, İstanbul Rasathanesi'nin Tycho Brahe'nin Uraniborg'uyla boy ölçüşmesini, hatta bazı sabit yıldız kataloğu verilerinde onu geçmesini sağlayan 'zaman teknolojisi'ydi."}, {"id": "a163", "slug": "yeni-a163-avize-saat-ibn-yunis", "title": "Avize Saat (İbn Yûnis)", "creator": "İbn Yûnis Geleneği", "kisa": "İbn Yünis'in avize saati, Kahire'deki saat geleneğinin en önemli temsilcilerinden biridir. Güneş saatleri, İslam dünyasında zaman ölçümünün en önemli araçlarından biri olmuştur.", "uzun": "İbn Yünis'in avize saati, Kahire'deki saat geleneğinin en önemli temsilcilerinden biridir. Avize saat, Kahire'deki saat geleneğinin en önemli temsilcilerinden biridir. Güneş saatleri, İslam dünyasında zaman ölçümünün en önemli araçlarından biri olmuştur ve camilerde, medreselerde ve saraylarda yaygın olarak kullanılmıştır. Güneş saatleri, güneşin konumuna göre zamanı ölçer ve bu sayede zaman oldukça hassas bir şekilde ölçülebilir. İbn Yünis'in avize saati, Kahire'deki saat geleneğinin en önemli temsilcilerinden biridir. Koleksiyonda İbn Yünis'in avize saati, Kahire'deki saat geleneğinin en önemli temsilcilerinden biridir; zamanın güneşle ölçüldüğü, saatin güneşle aktığı büyülü bir düzeneği temsil eder."}, {"id": "a165", "slug": "yeni-a165-agirlik-duzenekli-saatler", "title": "Ağırlık Düzenekli Saatler (Takiyyeddîn)", "creator": "Takiyyeddîn er-Râsıd", "kisa": "Takiyyeddîn'in ağırlık düzenekli saatleri, Osmanlı saat geleneğinin en gelişmiş örneklerinden biridir. Bu saatler, ağırlık mekanizmasıyla çalışır ve zamanı oldukça hassas bir şekilde ölçer.", "uzun": "Takiyyeddîn'in ağırlık düzenekli saatleri, Osmanlı saat geleneğinin en gelişmiş örneklerinden biridir. Bu saatler, ağırlık mekanizmasıyla çalışır ve zamanı oldukça hassas bir şekilde ölçer. Takiyyeddîn, İstanbul'da rasathane kurmuş ve bu rasathanede mekanik saatler üzerine çalışmıştır. Ağırlık düzenekli saatler, Avrupa saat geleneğiyle karşılaştırıldığında oldukça gelişmiş örneklerdir. Bu saatler, Osmanlı saat geleneğinin en önemli temsilcilerinden biridir. Koleksiyonda Takiyyeddîn'in ağırlık düzenekli saatleri, Osmanlı saat geleneğinin en gelişmiş örneklerinden biridir; zamanın ağırlıkla ölçüldüğü, saatin yerçekimiyle aktığı büyülü bir düzeneği temsil eder."}, {"id": "a168", "slug": "yeni-a168-denizcilik-pusulasi", "title": "Denizcilik Pusulası (el-Muhît)", "creator": "Şihâbeddîn İbn Mâcid ve Süleyman el-Mehrî", "kisa": "Geminin yalpalanmasına rağmen manyetik iğneyi yatay tutan 'kardano' süspansiyon sistemiyle donatılmış, 32 kollu rüzgâr güllü profesyonel gemi pusulası.", "uzun": "Denizcilik Pusulası (el-Muhît), İslam denizciliğinin manyetik doğayı ustaca ehlileştirdiği dönemin en rafine tanığıdır. Çin'den gelen ham manyet
