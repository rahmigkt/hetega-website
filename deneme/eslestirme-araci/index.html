<style>
:root{--ink:#3c4654;--paper:#fdfcf9;--paper-light:#faf9f6;--line:#e2e2e2;--brass:#b6874f;--brass-deep:#8a6238;--card-bg:#ececec;--muted:#6b7280;--green:#3f7d4f;}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper-light);color:var(--ink);font-family:"Inter",sans-serif;}
.site-header{display:flex;align-items:center;padding:.9rem 5vw;border-bottom:1px solid var(--line);background:var(--paper);}
.site-header .brand{display:flex;align-items:center;gap:.5rem;color:var(--ink);text-decoration:none;font-family:"Cinzel",serif;font-weight:600;font-size:1.05rem;}
.brand-mark{width:26px;height:26px;border:1px solid var(--brass);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;}
.banner{background:#3c4654;color:#f3ede1;text-align:center;padding:.6rem 1rem;font-size:.78rem;}
.banner strong{color:var(--brass);}
.toolbar{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;padding:1rem 5vw;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
.toolbar h1{font-family:"Cinzel",serif;font-size:1.15rem;margin:0;flex:none;}
.toolbar .stat{font-size:.75rem;color:var(--muted);}
.toolbar button{font-family:"Inter",sans-serif;font-size:.75rem;font-weight:700;border:1px solid var(--brass);background:transparent;color:var(--brass-deep);padding:.4rem .8rem;border-radius:4px;cursor:pointer;}
.toolbar button:hover{background:var(--brass);color:#fff;}
.toolbar button.danger{border-color:#a33;color:#a33;}
.toolbar button.danger:hover{background:#a33;color:#fff;}

.match-bar{position:sticky;top:58px;z-index:19;background:var(--brass-deep);color:#fff;padding:.8rem 5vw;display:none;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.match-bar.active{display:flex;}
.match-bar .pair{font-size:.85rem;}
.match-bar .pair b{font-weight:700;}
.match-bar button{background:#fff;color:var(--brass-deep);border:none;font-weight:700;padding:.5rem 1.1rem;border-radius:4px;cursor:pointer;font-size:.8rem;}
.match-bar button.clear{background:transparent;color:#fff;border:1px solid #fff;}

.columns{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:70vh;}
@media (max-width:900px){.columns{grid-template-columns:1fr;}}
.col{padding:1.4rem 2vw 4rem;border-right:1px solid var(--line);}
.col:last-child{border-right:none;}
.col h2{font-family:"Cinzel",serif;font-size:1rem;margin:0 0 1rem;padding:0 .5rem;}
.search-box{width:calc(100% - 1rem);margin:0 .5rem 1rem;padding:.6rem .8rem;border:1px solid var(--line);border-radius:4px;font-size:.85rem;font-family:"Inter",sans-serif;}
.card-list{display:flex;flex-direction:column;gap:.6rem;padding:0 .5rem;}
.card{display:flex;gap:.7rem;align-items:flex-start;background:var(--card-bg);border-radius:4px;padding:.8rem .9rem;cursor:pointer;border:2px solid transparent;transition:border-color .1s;}
.card:hover{border-color:var(--line);}
.card.selected{border-color:var(--brass);background:#f3e8d8;}
.card.matched{opacity:.4;pointer-events:none;}
.card input[type=checkbox]{margin-top:.2rem;flex:none;width:16px;height:16px;accent-color:var(--brass-deep);}
.card .info h3{font-family:"Cinzel",serif;font-weight:600;font-size:.88rem;margin:0 0 .3rem;line-height:1.3;}
.card .info .meta{font-size:.68rem;color:var(--brass-deep);font-weight:700;margin-bottom:.25rem;}
.card .info p{font-family:"EB Garamond",serif;font-size:.8rem;color:#4a4640;margin:0;line-height:1.45;}
.card .badge-matched{font-size:.62rem;font-weight:700;color:var(--green);text-transform:uppercase;}

.matches-section{padding:1.5rem 5vw 3rem;background:var(--paper);border-top:2px solid var(--brass);}
.matches-section h2{font-family:"Cinzel",serif;font-size:1.1rem;margin:0 0 1rem;}
.matches-table{width:100%;border-collapse:collapse;font-size:.8rem;}
.matches-table th,.matches-table td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--line);}
.matches-table th{font-size:.68rem;text-transform:uppercase;color:var(--muted);font-weight:700;}
.matches-table button{font-size:.68rem;border:1px solid #a33;color:#a33;background:transparent;border-radius:3px;padding:.2rem .5rem;cursor:pointer;}
.empty-note{color:var(--muted);font-size:.82rem;padding:1rem .5rem;}
</style>
</head>

<script>
const YENI = [{"id": "yeni-a002-pusula-kardan-sistemi", "slug": "Pusula (Kardan Sistemi)", "title": "kategori belirlenecek", "creator": "İslam Denizcilik Geleneği (Anonim / Kolektif)", "kisa": "Denizcilikte pusula/«kardan» sistemi; geminin yalpalanmasına rağmen iğnenin sabit kalmasını sağlayan manyetik yön bulma aleti."}, {"id": "yeni-a003-hasabat-yakup-sopasi", "slug": "Haşabât / Hatabat (Yakup Sopası)", "title": "kategori belirlenecek", "creator": "İslam Astronomi ve Denizcilik Geleneği (Anonim / Kolektif)", "kisa": "Gözlem aracı olarak anılır; gök cisimlerinin yükseklik açısını ölçen basit ama etkili sopa-lata-ip sistemi."}, {"id": "yeni-a010-cift-bacakli-alet", "slug": "Çift Bacaklı Alet", "title": "kategori belirlenecek", "creator": "Müeyyededîn el-Urdî", "kisa": "Meridyen yükseklikleri ölçmek için tasarlanmış, iki bacaklı ve ayarlanabilir şaküllü, devasa boyutlu rasathane aleti."}, {"id": "yeni-a030-konik-kesitler-pergeli", "slug": "Konik Kesitler Pergeli (el-Berkâr et-Tâmm)", "title": "Tesviye ve Geometri", "creator": "Ebû Sehl el-Kûhî", "kisa": "Sadece daire değil; elips, parabol ve hiperbol gibi konik kesitleri mekanik olarak ve sürekli bir hareketle çizebilen, optik ve astronomi aletlerinin yapımını mümkün kılan 'mükemmel pergel'."}, {"id": "yeni-a035-hacamat-sisesi", "slug": "Hacamat Çekmeni / Şişeleri", "title": "Tıp", "creator": "İslam Tıp ve Farmakoloji Geleneği", "kisa": "Vücuttaki kirli kanı veya fazla sıvıyı vakum yoluyla çekmek için kullanılan; ısı veya pompa ile vakum yaratılan cam, boynuz veya metal hacamat şişeleri."}, {"id": "yeni-a038-zeytin-koter", "slug": "«Zeytin» Koter", "title": "Tıp", "creator": "Ebü&#x27;l-Kâsım Halef b. Abbâs ez-Zehrâvî", "kisa": "Zeytin çekirdeği formunda ucu olan koter; göz ve yüz bölgesindeki hassas dağlama işlemleri için tasarlanmış, milimetrik hassasiyette termal cerrahi aleti."}, {"id": "yeni-a047-orak-mincel", "slug": "Orak (Mincel)", "title": "Tıp", "creator": "Halîfe b. Ebü’l-Mehâsin el-Halebî", "kisa": "Göz kapağı yapışıklıklarını, tavşan-göz (şifre) rahatsızlıklarını ve konjonktiva tümörlerini kesmek için kullanılan, hilal/orak formundaki mikro-cerrahi bıçak."}, {"id": "yeni-a048-katarakt-ignesi", "slug": "Katarakt İğnesi / Neşteri", "title": "Tıp", "creator": "Ammâr b. Alî el-Mevsılî", "kisa": "Ammâr b. Ali'nin icat ettiği; kataraktı (göz perdesini) içi boş metal bir iğne ve vakum/emme yoluyla gözden dışarı çıkaran devrim niteliğinde oftalmolojik alet."}, {"id": "yeni-a055-dis-cekme-penseleri", "slug": "Diş Çekme Penseleri (Minza)", "title": "Tıp", "creator": "Ebü&#x27;l-Kâsım ez-Zehrâvî", "kisa": "Çürük azı dişlerini ve kırık kökleri, çene kemiğine zarar vermeden kavrayıp çekmek için tasarlanmış, farklı uç formlarına sahip metal dişçi penseleri."}, {"id": "yeni-a065-cenin-cengeli", "slug": "Cenin Çengeli (Şinnâre)", "title": "Tıp", "creator": "Ebü&#x27;l-Kâsım ez-Zehrâvî", "kisa": "Zor doğumlarda veya rahim içinde ölen ceninin tahliyesinde, annenin hayatını kurtarmak için kullanılan, ucu sivri ve kancalı metal doğum aleti."}, {"id": "yeni-a083-aludel", "slug": "Aludel (Süblimasyon Kabı)", "title": "Kimya", "creator": "İslam Kimya Geleneği (Câbir/er-Râzî)", "kisa": "Kükürt, cıva, arsenik ve kafur gibi maddelerin saflaştırılması için kullanılan, üst üste dizilen silindirik toprak/cam kaplardan oluşan süblimasyon düzeneği."}, {"id": "yeni-a086-tutulma-diski", "slug": "Tutulma Diski (Şâfiha el-Küsûfiyye)", "title": "Usturlaplar", "creator": "Nastülüs", "kisa": "Güneş ve Ay tutulmalarının zamanını, fazlarını ve süresini trigonometrik hesaplamalar yapmadan, mekanik olarak simüle edip okumayı sağlayan özel usturlap levhası."}, {"id": "yeni-a091-nefesli-otomat", "slug": "Kendiliğinden Çalan Nefesli Alet", "title": "Fizik ve Teknik", "creator": "Benû Mûsâ b. Şâkir", "kisa": "Su veya hava basıncıyla çalışan, üzerindeki çıkıntılar (pin) değiştirilerek farklı melodiler çalınabilen, tarihin ilk 'programlanabilir' makinesi."}, {"id": "yeni-a102-alev-fiskirtici", "slug": "Alev Fışkırtıcı (Neft Pompası)", "title": "Askeri Teknoloji", "creator": "Necmeddîn Hasan er-Rammâh", "kisa": "Basınçlı pompa mekanizmasıyla neft (petrol) veya Rum ateşi püskürterek düşman gemilerini ve surlarını yakmak için kullanılan erken dönem alev makinesi."}, {"id": "yeni-a107-evrensel-disk-zerkali", "slug": "Evrensel Disk (Saphaea)", "title": "Astronomi", "creator": "Ebû İshâk İbrahim ez-Zerkâlî", "kisa": "Tek bir levha üzerinde stereografik projeksiyonun matematiğini kullanarak, dünyanın her yerinde (tüm enlemlerde) gözlem yapmayı sağlayan devrim niteliğinde 'evrensel' analog bilgisayar."}, {"id": "yeni-a113-yakup-sopasi", "slug": "Yakup Sopası (Cross-staff)", "title": "Coğrafya ve Seyrüsefer", "creator": "İslam Denizcilik ve Astronomi Geleneği", "kisa": "Gök cisimlerinin (özellikle Kutup Yıldızı ve Güneş) yükseklik açısını ölçerek enlem belirlemeye yarayan, basit ama son derece etkili sopa ve çapraz lata düzeneği."}, {"id": "yeni-a133-evrensel-disk-ibn-huzeyl", "slug": "Evrensel Disk (İbn Hüzeyl)", "title": "Usturlaplar", "creator": "Muhammed b. Muhammed b. Hüzeyl", "kisa": "İbn Hüzeyl'in Endülüs/Mağrip geleneğinde ürettiği; stereografik projeksiyonun matematiğini kullanarak tüm enlemlerde gözlem yapmayı sağlayan evrensel astronomik disk."}, {"id": "yeni-a134-dogrusal-usturlap", "slug": "Doğrusal Usturlap (Tûsî Cetveli)", "title": "Usturlaplar", "creator": "Nasîrüddîn et-Tûsî", "kisa": "et-Tûsî'nin icat ettiği; usturlabın dairesel kadranlarını ve trigonometrik fonksiyonlarını tek bir doğru (cetvel) üzerine izdüşüren, cepte taşınabilir 'lineer analog bilgisayar'."}, {"id": "yeni-a135-evrensel-usturlap-serrac", "slug": "Evrensel Usturlap (Ahmed b. es-Serrâc)", "title": "Usturlaplar", "creator": "Ahmed b. es-Serrâc", "kisa": "Ahmed b. es-Serrâc'ın tasarladığı; kullanıcının coğrafi enlemine bakılmaksızın dünyanın her yerinde zaman, yön ve gezegen konumu hesaplamayı sağlayan çok katmanlı 'evrensel' usturlap."}, {"id": "yeni-a140-sinus-kadrani", "slug": "Sinüs Kadranı (Rub' el-Müceyyeb)", "title": "Astronomi", "creator": "İslam Muvakkit ve Astronomi Geleneği", "kisa": "Trigonometrik fonksiyonları (sinüs, kosinüs) geometrik olarak çözmek, namaz vakitlerini ve kıble yönünü hesaplamak için kullanılan, çeyrek daire formundaki matematiksel kadran."}, {"id": "yeni-a142-semerkant-sekstanti", "slug": "Semerkant Rasathanesi Sekstantı", "title": "Astronomi", "creator": "Uluğ Bey ve Semerkant Ekolü", "kisa": "Teleskop öncesi çağın en büyük ve en hassas gözlem aleti; 40 metre yarıçaplı, yeraltına inen devasa meridyen sekstantı."}, {"id": "yeni-a144-samrat-yantra", "slug": "Samrât Yantra", "title": "Astronomi", "creator": "Sawai Jai Singh II", "kisa": "Jai Singh II'nin Delhi ve Jaipur'da inşa ettiği, 20-30 metre yüksekliğindeki devasa taş gnomon ve mermer kadranlardan oluşan, dünyanın en büyük ve en hassas ekinoksal güneş saati."}, {"id": "yeni-a147-dakshinovritti-yantra", "slug": "Dakshinovritti Yantra", "title": "Astronomi", "creator": "Sawai Jai Singh II", "kisa": "Jai Singh II'nin Delhi rasathanesinde inşa ettiği; gök cisimlerinin meridyenden geçiş anındaki maksimum yüksekliklerini (deklanasyon) ölçmek için kullanılan, yarım daire biçiminde devasa taş meridyen kadranı."}, {"id": "yeni-a151-cemberli-kure-istanbul", "slug": "Çemberli Küre (İstanbul Rasathanesi)", "title": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "kisa": "Takiyyeddîn'in İstanbul Rasathanesi için bizzat tasarladığı; gezegenlerin ekliptik üzerindeki boylam ve enlemlerini 3 boyutlu olarak ölçmeye yarayan, Ptoleme ve Merâğa geleneğinin Osmanlı'daki zirvesi olan armiller küre."}, {"id": "yeni-a155-bingam-i-rasadi", "slug": "Astronomik Gözlem Saati (Bingâm-ı Rasadı)", "title": "Saatler", "creator": "Takiyyeddîn er-Râsıd", "kisa": "Takiyyeddîn'in İstanbul Rasathanesi için icat ettiği; yıldızların meridyenden geçiş anlarını saniye hassasiyetiyle kaydeden, mekanik ve ağırlık tahrikli devrim niteliğinde gözlem saati."}, {"id": "yeni-a156-camera-obscura", "slug": "Camera Obscura (Beyt Muzlim)", "title": "Optik", "creator": "Hasan İbn el-Heysem (Ebû Alî el-Hasan b. el-Heysem)", "kisa": "İbn el-Heysem'in ışığın doğrusal yayılımını ve görme olayının fiziksel temellerini kanıtlamak için kullandığı, küçük delikli karanlık oda düzeneği."}, {"id": "yeni-a167-fincan-su-saati", "slug": "Fincan / Yolculuk Su Saati", "title": "Saatler", "creator": "İsmâil b. er-Rezzâz el-Cezerî", "kisa": "el-Cezerî'nin seyahatlerde kullanılmak üzere tasarladığı, kupa/fincan formunda portatif su saati; şamandıra ve ip-çıkrık mekanizmasıyla zamanı görsel olarak kaydeder."}, {"id": "yeni-a171-el-esref-aletleri", "slug": "el-Melik el-Eşref'in Aletleri", "title": "Usturlaplar", "creator": "el-Melik el-Eşref Ömer b. Yûsuf", "kisa": "Yemen hükümdarı el-Melik el-Eşref'in bizzat tasarladığı ve risalelerinde detaylandırdığı; karmaşık trigonometrik ağlara ve mekanik saat mekanizmalarına sahip özgün astronomik aletler."}, {"id": "yeni-a189-karsi-agirlikli-mancinik", "slug": "Karşı Ağırlıklı Mancınık (Trebuşet)", "title": "Askeri Teknoloji", "creator": "İslam Kuşatma Mühendisliği (İbn Erenbuğâ ez-Zerdkâş)", "kisa": "Kısa koldaki karşı ağırlığın düşme gücüyle uzun koldaki gülleyi fırlatan, insan gücüne ihtiyaç duymayan devasa kuşatma makinesi."}, {"id": "yeni-a190-seramik-bomba", "slug": "Seramik Bomba (İkrîh Borucuklu)", "title": "Askeri Teknoloji", "creator": "İslam Askerî Mühendislik Geleneği", "kisa": "İçine barut, neft veya kimyasal maddeler doldurulan, fitil (ikrîh) ile ateşlenip fırlatılan, parça tesirli ve yakıcı erken dönem el bombası."}, {"id": "yeni-a195-areometre", "slug": "Areometre / Fiziksel Terazi", "title": "Fizik ve Teknik", "creator": "İslam Fizik ve Metroloji Geleneği", "kisa": "Sıvıların yoğunluğunu ve metallerin saflığını ölçmek için kullanılan, cam silindir ve kalibre edilmiş daldırma cisimlerinden oluşan erken dönem areometre / piknometre."}, {"id": "yeni-a197-arsimed-vidasi", "slug": "Arşimed Vidası (Su Burgusu)", "title": "Fizik ve Teknik", "creator": "İslam Sulama ve Mekanik Mühendisliği Geleneği", "kisa": "Suyu yerçekimine karşı helezoni (sarmal) bir boru içinde yukarı taşıyan, İslam'ın 'Tarım Devrimi'nin belkemiği hidrolik pompa."}, {"id": "yeni-a234-alhidade", "slug": "Alhidade (Açı Cetveli)", "title": "Usturlaplar", "creator": "İslam Astronomi Geleneği", "kisa": "Usturlabın veya kadranın arka yüzünde, merkez etrafında dönen ve üzerinde iki delikli nişangâh (diopter) bulunan; güneşin veya yıldızın yüksekliğini ölçmeye yarayan açı cetveli."}, {"id": "yeni-a242-kusayr-amra", "slug": "Kuşayr Amra Gök Haritası", "title": "Astronomi", "creator": "Emevî Saray Geleneği", "kisa": "Ürdün çölündeki Emevî kasrının hamam kubbesine fresk tekniğiyle işlenmiş; yaklaşık 400 yıldızı, takımyıldızları ve zodyak kuşağını içeren, İslam dünyasının bilinen en eski gök haritası."}, {"id": "yeni-a250-kasiyun-rasathanesi", "slug": "Şam (Kâsiyün) Rasathanesi Aletleri", "title": "Astronomi", "creator": "Hâlid b. Abdülmelik el-Merverrûdî", "kisa": "Halife Me'mûn'un emriyle Şam'ın Kâsiyün Dağı'nda kurulan, Ptoleme'nin verilerini test etmek ve Dünya'nın çevresini ölçmek için kullanılan ilk kurumsal İslam rasathanesinin gözlem aletleri."}, {"id": "yeni-a257-sabuncuoglu-cerrahi-aletleri", "slug": "Sabuncuoğlu'nun Cerrahi Aletleri", "title": "Tıp", "creator": "Şerefeddin Sabuncuoğlu", "kisa": "Şerefeddin Sabuncuoğlu'nun 1465'te Fatih Sultan Mehmed'e sunduğu, 140 minyatürle donatılmış Türkçe cerrahi ansiklopedisindeki özgün cerrahi aletler ve müdahale teknikleri."}, {"id": "yeni-a272-zerkali-ekvatoryumu", "slug": "ez-Zerkâlî Ekvatoryumu Modeli", "title": "Astronomi", "creator": "Ebû İshâk ez-Zerkâlî", "kisa": "ez-Zerkâlî'nin icat ettiği, gezegenlerin ekliptik üzerindeki konumlarını (boylam) mekanik diskler ve ipler aracılığıyla, hesaplama yapmadan doğrudan okumayı sağlayan 'ekvatoryum' cihazının modern müze rekonstrüksiyonu."}, {"id": "yeni-a276-ay-isigi-deney-duzenegi", "slug": "Ay Işığı Deney Düzeneği", "title": "Optik", "creator": "Hasan İbn el-Heysem", "kisa": "İbn el-Heysem'in ay ışığının ısı verip vermediğini ve odaklanıp odaklanamadığını test etmek için parabolik aynalar ve camera obscura kullanarak kurduğu deneysel fizik düzeneği."}, {"id": "yeni-a279-ankebut", "slug": "Ankebut (Örümcek)", "title": "Usturlaplar", "creator": "İslam Usturlap Ustaları Geleneği", "kisa": "Usturlabın ön yüzünde dönen, zodyak kuşağını ve gökkürenin en parlak yıldızlarını (Sirius, Vega, Aldebaran) temsil eden ajurlu, oymalı pirinç plaka."}, {"id": "yeni-a353-enlem-plakalari", "slug": "Enlem Plakaları (Safâ'ih)", "title": "Usturlaplar", "creator": "İslam Coğrafya ve Astronomi Geleneği", "kisa": "Usturlabın ana gövdesi (mater) içine yerleştirilen; her biri belirli bir coğrafi enlem (iklim) için stereografik projeksiyonla kazınmış ufuk, yükseklik (mukantaralar) ve azimut eğrilerini içeren pirinç levhalar."}, {"id": "yeni-a385-kible-pusulasi", "slug": "Kıble Pusulası", "title": "Coğrafya ve Seyrüsefer", "creator": "İslam Muvakkit ve Denizcilik Geleneği", "kisa": "Manyetik pusula iğnesi ile üzerine farklı şehirlerden Mekke'nin yönünü (kıble) ve mesafesini gösteren koordinat haritası kazınmış kadranın birleşimi; cepte taşınabilir dini-astrofiziksel kompas."}, {"id": "yeni-a402-bimaristan-mimarisi", "slug": "Bimaristan Mimarisi (Nûreddîn Hastanesi)", "title": "Mimari", "creator": "İslam Tıp ve Mimari Geleneği (Bimaristan Kurumları)", "kisa": "Şam'daki Nûreddîn Bimaristanı; havalandırma (malqaf), su terapisi ve akustik mühendisliğini birleştirerek hastaların iyileşme sürecini hızlandıran devrim niteliğinde tıp-mimari kompleksi."}, {"id": "yeni-a403-kagit-uretimi", "slug": "Kağıt Üretimi ve Değirmenleri", "title": "Fizik ve Teknik", "creator": "İslam Endüstri ve Mühendislik Geleneği", "kisa": "Çin'den alınan kağıt hamuru teknolojisini su değirmenleriyle mekanize ederek endüstriyel ölçekte üreten, İslam 'Bilgi Devrimi'nin ve kütüphanelerinin maddi altyapısı."}];

let selectedYeni = null;
let selectedTam = new Set();
let matches = JSON.parse(localStorage.getItem('hetega_eslestirmeler') || '[]');

function saveMatches(){ localStorage.setItem('hetega_eslestirmeler', JSON.stringify(matches)); }

function isMatched(id, side){
  return matches.some(m => side === 'yeni' ? m.yeni_id === id : m.tam_id === id);
}

function renderYeni(){
  const wrap = document.getElementById('list-yeni');
  wrap.innerHTML = '';
  YENI.forEach(item => {
    const matched = isMatched(item.id, 'yeni');
    const div = document.createElement('div');
    div.className = 'card' + (matched ? ' matched' : '') + (selectedYeni === item.id ? ' selected' : '');
    div.innerHTML = `
      <input type="checkbox" ${selectedYeni === item.id ? 'checked' : ''} ${matched ? 'disabled' : ''}>
      <div class="info">
        <div class="meta">${item.id} · ${item.creator}</div>
        <h3>${item.title}</h3>
        <p>${item.kisa}</p>
        ${matched ? '<div class="badge-matched">✓ eşleşti</div>' : ''}
      </div>`;
    if(!matched){
      div.onclick = () => { selectedYeni = (selectedYeni === item.id ? null : item.id); renderYeni(); updateMatchBar(); };
    }
    wrap.appendChild(div);
  });
}

function renderTam(){
  const q = document.getElementById('search-tam').value.trim().toLowerCase();
  const wrap = document.getElementById('list-tam');
  wrap.innerHTML = '';
  let shown = 0;
  for(const item of TAM){
    if(q && !(item.name.toLowerCase().includes(q) || item.creator.toLowerCase().includes(q) || item.category.toLowerCase().includes(q) || item.id.toLowerCase().includes(q) || item.slug.toLowerCase().includes(q))) continue;
    shown++;
    if(shown > 150) continue; // performans icin sinir, arama daraltinca daha fazlasi gorunur
    const matched = isMatched(item.id, 'tam');
    const isSel = selectedTam.has(item.id);
    const div = document.createElement('div');
    div.className = 'card' + (matched ? ' matched' : '') + (isSel ? ' selected' : '');
    div.innerHTML = `
      <input type="checkbox" ${isSel ? 'checked' : ''} ${matched ? 'disabled' : ''}>
      <div class="info">
        <div class="meta">${item.category} · ${item.creator}${item.has_img ? ' · 📷' : ''}</div>
        <h3>${item.name}</h3>
        ${matched ? '<div class="badge-matched">✓ eşleşti</div>' : ''}
      </div>`;
    if(!matched){
      div.onclick = () => {
        if(selectedTam.has(item.id)) selectedTam.delete(item.id); else selectedTam.add(item.id);
        renderTam(); updateMatchBar();
      };
    }
    wrap.appendChild(div);
  }
  if(shown > 150){
    const note = document.createElement('p');
    note.className = 'empty-note';
    note.textContent = `${shown} sonuç bulundu, ilk 150 gösteriliyor — daraltmak için arama kutusunu kullan.`;
    wrap.prepend(note);
  }
}

function updateMatchBar(){
  const bar = document.getElementById('matchBar');
  const text = document.getElementById('matchBarText');
  if(selectedYeni && selectedTam.size > 0){
    const y = YENI.find(x=>x.id===selectedYeni);
    const names = [...selectedTam].map(id => TAM.find(x=>x.id===id).name);
    const label = selectedTam.size === 1 ? names[0] : `${selectedTam.size} kayıt: ${names.join(', ')}`;
    text.innerHTML = `<b>${y.title}</b> (${y.id}) &nbsp;↔&nbsp; <b>${label}</b>`;
    bar.classList.add('active');
  } else {
    bar.classList.remove('active');
  }
}

function clearSelection(){
  selectedYeni = null; selectedTam = new Set();
  renderYeni(); renderTam(); updateMatchBar();
}

function confirmMatch(){
  if(!selectedYeni || selectedTam.size === 0) return;
  const y = YENI.find(x=>x.id===selectedYeni);
  selectedTam.forEach(tamId => {
    const t = TAM.find(x=>x.id===tamId);
    matches.push({
      yeni_id: y.id, yeni_title: y.title, yeni_slug: y.slug,
      tam_id: t.id, tam_name: t.name, tam_slug: t.slug, tam_category: t.category
    });
  });
  saveMatches();
  selectedYeni = null; selectedTam = new Set();
  renderAll();
}

function removeMatch(idx){
  matches.splice(idx, 1);
  saveMatches();
  renderAll();
}

function renderMatchesTable(){
  const wrap = document.getElementById('matches-table-wrap');
  document.getElementById('match-count').textContent = matches.length;
  if(matches.length === 0){
    wrap.innerHTML = '<p class="empty-note">Henüz eşleştirme yapılmadı.</p>';
    return;
  }
  let rows = matches.map((m, i) => `
    <tr>
      <td>${m.yeni_id}</td>
      <td>${m.yeni_title}</td>
      <td style="text-align:center">↔</td>
      <td>${m.tam_id}</td>
      <td>${m.tam_name}</td>
      <td>${m.tam_category}</td>
      <td><button onclick="removeMatch(${i})">Geri al</button></td>
    </tr>`).join('');
  wrap.innerHTML = `<table class="matches-table"><thead><tr>
    <th>Yeni ID</th><th>Yeni Başlık</th><th></th><th>Gerçek ID</th><th>Gerçek Kayıt</th><th>Kategori</th><th></th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

function renderAll(){
  renderYeni(); renderTam(); updateMatchBar(); renderMatchesTable();
  document.getElementById('stat-yeni').textContent = (YENI.length - matches.length) + ' / ' + YENI.length + ' yeni kayıt kaldı';
  document.getElementById('stat-matched').textContent = matches.length + ' eşleşme yapıldı';
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(matches, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'hetega_eslestirmeler.json';
  a.click();
}

function copyJSON(){
  navigator.clipboard.writeText(JSON.stringify(matches, null, 2)).then(()=>alert('Kopyalandı! Bunu Claude'+String.fromCharCode(39)+'a yapıştırabilirsin.'));
}

function resetAll(){
  if(!confirm('Tüm eşleştirmeler silinsin mi?')) return;
  matches = [];
  saveMatches();
  renderAll();
}

renderAll();
</script>
</body>
