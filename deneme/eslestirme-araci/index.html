tası, kartografya tarihinin en gizemli ve en çok tartışılan belgelerinden biridir. Topkapı Sarayı'nda 1929'da yeniden keşfedilen bu ceylan derisi parşömen, Piri Reis'in kendi notlarına göre, Kolombus'un kayıp Antiller haritası, Portekiz hint okyanusu haritaları, İslam coğrafyacılarının (el-İdrisi, İbn Macid) eserleri ve antik Ptoleme haritalarının sentezidir. Harita, Güney Amerika'nın doğu kıyılarını ve Afrika'nın batısını şaşırtıcı bir doğrulukla gösterirken, güneydeki «Terra Australis» (Güney Kıtası) iddiasıyla tartışma yaratır. Fuat Sezgin'in araştırmaları, bu haritanın «gizemli» değil, aksine İslam denizcilerinin Hint Okyanusu ve Atlantik verilerinin Osmanlı amirali tarafından sistematik bir sentezi olduğunu kanıtlar. Koleksiyonda Piri Reis haritası, küresel keşifler çağının Doğu-Batı bilgi havuzunun Osmanlı'daki zirvesidir."}, {"id": "narrated-45-25", "slug": "cografya-ve-seyrusefer-anlatili-45-balik-pusula", "name": "Balık Pusula", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam denizcileri (geleneğe dayalı)", "has_img": 1, "desc": "Pusulalar bölümü, manyetik iğnenin bin yıllık serüvenini tek vitrinde toplar: balık pusula, gemi pusulası, yüzer pusula, namaz pusulası (kıble göstergesi), coğrafi ve «mesaha» (arazi ölçüm) pusulası, iğne pusula ve yardımcı düzenekler. İslam denizciliği, Çin kökenli iğneyi «kardano» süspansiyonu, karton disk ve 15 sabit yıldızlı bölümlemeyle profesyonel bir seyir aletine dönüştürmüştür; namaz pusulası ise aynı teknolojiyi ibadetin hizmetine verir. Bu çok‐tipli aile, pusulanın tek bir nesne değil, bir «teknoloji platformu» olduğunu gösterir. Koleksiyonda bölüm, Doğu‐Batı aktarımının en yoğun yaşandığı alanı temsil eder; mıknatıs taşından modern bussoleye uzanan zincirin tüm halkaları yan yanadır."}, {"id": "narrated-46-26", "slug": "cografya-ve-seyrusefer-anlatili-46-melik-el-esref-in-en-eski-manyetik-pusula-tarifi", "name": "Melik el-Eşref'in En Eski Manyetik Pusula Tarifi", "category": "Coğrafya ve Seyrüsefer", "creator": "el-Melik el-Eşref (Eyyubi prensi)", "has_img": 1, "desc": "el-Melik el-Eşref'in risalelerindeki (Risdlet et-Tase, Mu'in et-Tullab) aletler, usturlap ve namaz vakti belirleme araçlarını içerir. Eyyubi prensi hem himaye eden hem de bizzat yazan bir bilim dostudur; risaleleri 13. yüzyıl Yemen-Mısır alet yapımının önemli kaynaklarındandır."}, {"id": "narrated-48-27", "slug": "saatler-anlatili-48-melik-el-esref-in-gunes-saati", "name": "Melik el-Eşref'in Güneş Saati", "category": "Saatler", "creator": "el-Melik el-Eşref (Eyyubi prensi)", "has_img": 1, "desc": "İslam şehirlerinin camilerine entegre edilen güneş saatleri (yalı saatleri, muvakkithane kadranları), ibadet ile bilimin en somut…"}, {"id": "narrated-49-28", "slug": "saatler-anlatili-49-nuredd-n-zeng-nin-tasinabilir-gunes-saati", "name": "Nureddin Zengi'nin Taşınabilir Güneş Saati", "category": "Saatler", "creator": "İslam muvakkit geleneği", "has_img": 1, "desc": "İslam şehirlerinin camilerine entegre edilen güneş saatleri (yalı saatleri, muvakkithane kadranları), ibadet ile bilimin en somut kesişim noktasıdır. Namaz vakitlerinin (özellikle ikindi ve yatsı) gölge uzunluklarına göre belirlenmesi zorunluluğu, küresel trigonometrinin ve gnomonik (gölge bilimi) pratiğinin sürekli gelişmesini sağlamıştır. Muvakkitler, her şehrin enlemine özel hesaplamlar yapar; «mebsut» ve «menküs» (tanjant ve kotanjant) çizgilerini mermer levhalara kazırlardı. Osmanlı döneminde bu saatler, mimari estetiğin bir parçası haline gelmiş; cami duvarlarına, avlu şadırvanlarına ve özel muvakkithane binalarına işlenmiştir. Koleksiyonda güneş saati, zamanın mekanik dişlilerden önce, taşın ve güneşin geometrisiyle nasıl okunduğunun; bilimin halkın günlük ibadet ritmine nasıl hizmet ettiğinin anıtıdır."}, {"id": "narrated-50-29", "slug": "saatler-anlatili-50-i-bn-es-s-tir-in-sam-emev-camii-saati", "name": "İbn eş-Şâtır'ın Şam Emevî Camii Saati", "category": "Saatler", "creator": "Alâeddîn İbn eş-Şâtir", "has_img": 1, "desc": "Şam Emevî Camii'nde kurulan meşhur su saatinin İbn eş-Şâtir tarafından yapılan mekanik aksamı ve rekonstrüksiyonu."}, {"id": "narrated-51-30", "slug": "saatler-anlatili-51-i-bn-el-muhalleb-nin-cift-cubuklu-gunes-saati", "name": "İbn el-Muhallebi'nin Çift Çubuklu Güneş Saati", "category": "Saatler", "creator": "İslam muvakkit geleneği", "has_img": 1, "desc": "İslam şehirlerinin camilerine entegre edilen güneş saatleri (yalı saatleri, muvakkithane kadranları), ibadet ile bilimin en somut…"}, {"id": "narrated-52-31", "slug": "saatler-anlatili-52-ta-iyyudd-n-in-mekanik-saati", "name": "Takiyyüddîn'in Mekanik Saatleri", "category": "Saatler", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Takiyyeddîn'in İstanbul Rasathanesi için tasarladığı mekanik saatler (bingâmât devriyye ve siryâkiyye), 16. yüzyılın en iddialı kronometrik projelerindendir. Rasathane gözlemlerinde saniye hassasiyeti gerektiği için, dönemin Avrupa ve İslam saatleri yetersiz kalmış; Takiyyeddîn kendi «astronomik saatini» (bingâm rasadı) kurmaya girişmiştir. Zemberekli (yay tahrikli) ve ağırlıklı (siryâkiyye) varyasyonları, eşapman mekanizmaları ve kadranlarıyla Avrupa'daki çağdaş saatçilikle yarışır düzeydedir. Bu saatler, rasathanenin «zaman altyapısı»nı oluşturur; gözlemlerin eşzamanlılığı bu mekanik kalbe bağlıdır. Koleksiyonda bu saatler, Osmanlı mühendisinin zamanı ölçme tutkusunun; su saatinden mekanik saate geçişin İslam dünyasındaki en somut ve en trajik (rasathanenin yıkımıyla yarım kalan) belgesidir."}, {"id": "narrated-53-32", "slug": "saatler-anlatili-53-el-cezer-nin-tasinabilir-k-tipli-su-saati", "name": "el-Cezerî'nin Taşınabilir Kâtipli Su Saati", "category": "Saatler", "creator": "İsmail el-Cezerî", "has_img": 1, "desc": "el-Cezerî'nin el-Câmi' adlı eserindeki yolculuk saati, zincir ve terazi içermeyen, taşınabilir bir saat düzeneğidir. Yolculukta kullanılmak üzere tasarlanan bu kompakt düzenek, «seyahat saati» kavramının bilinen en erken örneklerindendir. el-Cezerî'nin yalnız anıtsal saatler değil, taşınabilir cihazlar da tasarladığını gösterir."}, {"id": "narrated-54-33", "slug": "saatler-anlatili-54-el-cezer-nin-filli-su-saati", "name": "el-Cezeri'nin Filli Su Saati", "category": "Saatler", "creator": "İsmail el-Cezerî", "has_img": 1, "desc": "Kâtipli su saati, el-Cezerî'nin en ünlü otomatlarından biridir: ortada oturan kâtip figürü, elindeki yazı kamışıyla saatleri gösteren bir diski döndürür; galeri halkası 217,5 kısma bölünmüştür. Hidrostatiği estetikle birleştiren bu saat, «zamanın otomasyonu» kavramının orta çağdaki en şiirsel ifadesidir ve koleksiyonun en sevilen parçalarındandır."}, {"id": "narrated-56-34", "slug": "tesviye-ve-geometri-anlatili-56-hint-pergeli", "name": "Hint Pergeli", "category": "Tesviye ve Geometri", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Delhi «Karma Alet»inin gnomonu, iki dereceli yarım daire üzerinde güneşin meridyen yüksekliğini okutan anıtsal bir gölge ölçerdir. Taşın kalıcılığı, gözlemin tekrarlanabilirliğini garanti eder; her öğlen, aynı gölge aynı çizgiyi keser. Bu düzenek, İslam gnomon (mikyas) geleneğinin Hindistan'daki mimari zirvesidir; azlâl (gölge tabloları) bilimi, burada taşa yazılmıştır. Koleksiyonda gnomon, «en basit alet‑en derin bilim» ilkesinin temsilcisidir; bir dikili taş, küresel trigonometrinin kapısıdır."}, {"id": "narrated-57-35", "slug": "tesviye-ve-geometri-anlatili-57-el-cezer-nin-daire-merkezi-aleti", "name": "el-Cezerî'nin Daire Merkezi Aleti", "category": "Tesviye ve Geometri", "creator": "İsmail el-Cezerî", "has_img": 1, "desc": "el-Cezerî'nin el-Câmi' adlı kapsamlı eserinde yer alan bu esnek pirinç alet, bir küre üzerindeki herhangi üç noktadan geçen çemberin merkezini bulmaya ve açı belirlemeye yarar. Küresel geometrinin 'üç noktadan çember' problemini pratik bir araca dönüştüren alet, el-Cezerî'nin yalnızca bir mekanikçi değil, aynı zamanda yaratıcı bir geometriçi olduğunu da gösterir."}, {"id": "narrated-60-36", "slug": "optik-anlatili-60-i-bn-el-heysem-in-yansima-aleti", "name": "İbn el-Heysem'in Yansıma Aleti", "category": "Optik", "creator": "Hasan İbn el-Heysem", "has_img": 1, "desc": "İbn el-Heysem'in yansıma aleti, ışığın gelme ve yansıma açılarını yarım daire pirinç levha üzerinde ölçerek yansıma yasasını deneysel olarak kanıtlayan düzeneğidir. Kitâb el-Menâzır'ın (Optik Kitapları) deneysel metodunun temel taşı olan bu alet, optiği felsefi spekülasyondan laboratuvar bilimine dönüştürmüştür. İbn el-Heysem bu ve benzeri düzenekleriyle 'modern optiğin babası' sayılır."}, {"id": "narrated-61-37", "slug": "optik-anlatili-61-kem-ledd-n-el-f-r-s-nin-gokkusagi-aciklamasi", "name": "Kemaleddin el-Farisi'nin Gökkuşağı Açıklaması", "category": "Optik", "creator": "İbn el-Heysem", "has_img": 1, "desc": "İbn el‐Heysem'in optik aletleri grubu, deneysel bilimin kurucu düzeneklerini bir araya getirir: camera obscura (beyt muzlim) ışığın doğrusal yayılımını kanıtlar; alet el‐inkas (yansıma aleti) küresel ve silindirik aynalarda yansıma yasalarını ölçer; Ay Işığını Gözlemleme Aleti (s. 174‐177) ay ışığının karakterini sorgular. «İbn el‐Heysem Problemi» (Problema Alhazeni) ve aksi‐den ışık deneyleri, optiği geometrik‐deneysel bir disipline dönüştürmüştür. Roger Bacon'dan Peckham'a Avrupa optiği bu grubun omzunda yükselir. Koleksiyonda grup, «deney yöntemi»nin maddi doğum belgeleridir; modern laboratuvarın orta çağdaki prototipleri."}, {"id": "narrated-62-38", "slug": "optik-anlatili-62-i-bn-i-heysem-in-ay-gozlem-aleti", "name": "İbn-i Heysem'in Ay Gözlem Aleti", "category": "Optik", "creator": "Hasan İbn el-Heysem", "has_img": 1, "desc": "Ay Işığı Deney Düzeneği, İbn el-Heysem'in 'Makale fî Dav' el-Kamer' (Ay Işığı Üzerine Risale) adlı eserinde anlattığı ve deneysel bilimin en zarif örneklerinden biri olan test ortamıdır. Antik Çağ'da ve erken Orta Çağ'da Ay'ın kendi ışığını ürettiğine veya en azından Güneş gibi 'ısıtıcı' bir etkiye sahip olduğuna dair yaygın bir inanış vardı. İbn el-Heysem bu hipotezi çürütmek için devasa parabolik (yakıcı) aynalar kullanmış, Ay ışığını bu aynalarla tek bir odak noktasında toplamıştır. Odağa hassas termal ölçüm araçları (eriyen balmumu, yanan pamuk vb.) yerleştirmiş, ancak odak noktasında hiçbir ısı artışı veya yanma gerçekleşmediğini gözlemlemiştir. Ardından camera obscura (karanlık oda) düzeneğiyle Ay ışığının doğrusal yayıldığını ve sadece yansıma (refleksiyon) olduğunu kanıtlamıştır. Bu deney, gök cisimlerinin fiziksel doğasının sadece matematiksel modellerle değil, laboratuvar ortamında deneysel olarak da sınanabileceğini gösteren, astrofizik ve optik tarihinin en kritik kilometre taşlarından biridir."}, {"id": "narrated-64-39", "slug": "fizik-ve-teknik-anlatili-64-ta-iyyudd-n-in-alti-silindirli-su-pompasi", "name": "Pompa Düzenekleri (Benû Mûsâ / Arşimed geleneği)", "category": "Fizik ve Teknik", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "İki pistonlu su çıkarma cihazı, Takiyyeddîn'in et-Turuk es-Seniyye'sinde ve Leonardo da Vinci'nin notalarında paralel olarak karşımıza çıkan, Doğu-Batı teknik yaratıcılığının en ünlü örneklerindendir. Piston-valf sistemi, dönme hareketini pompalama işine çevirerek modern pompanın temelini kurar. Bu cihaz, İslam mekanik geleneğinin Avrupa Rönesansı'na etkisinin somut kanıtıdır."}, {"id": "narrated-65-40", "slug": "fizik-ve-teknik-anlatili-65-ta-iyyudd-n-in-buharla-calisan-doner-makinasi", "name": "Buharla Çalışan Döner Şiş Çeviricisi", "category": "Fizik ve Teknik", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Takiyyeddîn'in buharla çalışan döner şiş çeviricisi, buhar gücünün mekanik harekete dönüştürüldüğü bilinen en erken düzeneklerden biridir: kazanda kaynayan suyun buharı, bir lüleden çıkarak kanatçıklı bir çarkı döndürür; ısıtma spirali ve durdurma supabı, sistemi kontrol edilebilir kılar. Bu tasarım, Avrupa'da Branca (1629) ve Papin'den on yıllar önce, buhar türbini ilkesini pratik bir mutfak otomasyonuna uygulamıştır. Model, kazanı ve supabıyla birlikte yeniden inşa edilmiş; pirinç‑bakır işçiliği Osmanlı metal sanatının inceliğini sergilemiştir. Koleksiyonun «vitrin» parçalarından olan bu düzenek, sanayi devriminin köklerinin İslam mühendisliğinde olduğunu anlatan en çarpıcı nesnedir; buhar çağı, saray mutfağında başlamıştır."}, {"id": "narrated-66-41", "slug": "fizik-ve-teknik-anlatili-66-el-cezer-nin-i-ki-silindirli-su-pompasi", "name": "Benû Mûsâ İki Pistonlu Pompası", "category": "Fizik ve Teknik", "creator": "Benû Mûsâ / el-Cezerî", "has_img": 1, "desc": "Benû Mûsâ kardeşlerin iki pistonlu pompası, akışkanlar mühendisliğinin kurucu belgelerindendir: iki piston sırayla çalışarak kesintisiz akış üretir; konik valfler tek yönlü geçişi garanti eder. Bu düzenek, el‑Cezerî'den Leonardo'ya uzanan zincirin ilk halkasıdır ve modern çift etkili pompanın doğrudan atasıdır. Abbâsî Bağdat'ının bahçe‑saray kültürü, böyle otomatik sulama ve fıskiye sistemlerini talep etmişti. Koleksiyonda bu pompa, «basınç‑valf‑piston» üçlüsünün bilim tarihine giriş kapısıdır; su medeniyetinin mekanik kalbidir."}, {"id": "narrated-67-42", "slug": "fizik-ve-teknik-anlatili-67-el-cezer-nin-sifreli-kilit-mekanizmasi", "name": "el-Cezerî'nin Şifreli Kilit Mekanizması", "category": "Fizik ve Teknik", "creator": "İsmail el-Cezerî", "has_img": 1, "desc": "el-Cezerî'nin el-Câmi' adlı eserinde tarif ettiği şifreli kilit, Arap alfabesi harflerini taşıyan döner halkalardan oluşan bir kombinasyon kilididir; sandık yalnızca doğru 12 harf dizilimiyle açılır. «Mekanik şifreleme»nin bilinen en erken örneklerinden sayılan bu düzenek, Artuklu sarayının güvenlik ihtiyacının ve mühendislik zarafetinin ürünüdür. Kilit, koleksiyonun en sevilen parçalarındandır."}, {"id": "narrated-68-43", "slug": "fizik-ve-teknik-anlatili-68-el-cezer-nin-dort-surgulu-kapi-kilidi", "name": "el-Cezeri'nin Dört Sürgülü Kapı Kilidi", "category": "Fizik ve Teknik", "creator": "İslam demircilik/çilingir geleneği", "has_img": 1, "desc": "Kilitler bölümü, İslam şehir hayatının görünmez güvenlik mimarisini sergiler: sandık kilitleri, kapı sürgüleri, menteşeler (nermazec) ve asma kilitler, çilingirliğin (kilitçilik) başlı başına bir zanaat kolu olduğunu gösterir. Benu Musa'dan el‐Cezeri'ye uzanan mühendislik geleneği, bu gündelik donanımı zamanla şifreli kilit gibi sofistike düzeneklere taşımıştır. Kilidin dili, sürgüsü ve yayı üzerine kurulu mikro‐mekanik, büyük makinelerin dişli‐kaldıraç mantığının ölçek küçültülmüş okuludur. Hisba teşkilatının çarşıda kilit ve menteşe kalitesini dahi denetlemesi, güvenliğin kamusal bir sorumluluk sayıldığını kanıtlar. Koleksiyonda kilit mekanizmaları, şifreli kilidin «arka planındaki» zanaat sürekliliğini temsil eder; metal işçiliğinin gündelik dehasının sessiz tanıklarıdır."}, {"id": "narrated-69-44", "slug": "fizik-ve-teknik-anlatili-69-ebu-l-alef-el-mur-d", "name": "Ebü'l-Halef el-Murâdî'nin Cıva Saati", "category": "Fizik ve Teknik", "creator": "Ebü'l-Halef el-Murâdî", "has_img": 1, "desc": "el-Murâdî'nin cıva akışı ve dişlilerle çalışan mekanik saati."}, {"id": "narrated-70-45", "slug": "fizik-ve-teknik-anlatili-70-ben-m-s-nin-siddetli-ruzg-rda-sonmeyen-gaz-lambasi", "name": "Benû Mûsâ'nın Sönmeyen Gaz Lambası", "category": "Fizik ve Teknik", "creator": "Benû Mûsâ", "has_img": 1, "desc": "Şiddetli rüzgarda dahi sönmeyen, kendi kendine yakıt ayarlayan otomatik lamba."}, {"id": "narrated-71-46", "slug": "fizik-ve-teknik-anlatili-71-nesneleri-sulardan-kaldirmak-i-cin-ceneli-ekskavator", "name": "Agricola'nın Kuyu Kovası Zinciri", "category": "Fizik ve Teknik", "creator": "İslam mühendislik geleneği", "has_img": 1, "desc": "Nesneleri sulardan kaldırmak için tasarlanan düzenek, iki kova zinciri ve bir pedal çarkıyla işleyen bir «çeneli ekskavatör»dür. Menteşeli çeneler, nehir yatağındaki nesneleri kavrayıp yüzeye taşır. Vitruvius'la karşılaştırmalı sunulan bu mekanizma, modern tarak gemilerinin ve ekskavatörlerin atası sayılır; İslam mekanik hayal gücünün sürekliliğinin çarpıcı bir örneğidir."}, {"id": "narrated-74-47", "slug": "askeri-teknoloji-anlatili-74-alev-fiskirtici", "name": "Alev Fışkırtıcı", "category": "Askeri Teknoloji", "creator": "Necmeddîn Hasan er-Rammâh", "has_img": 1, "desc": "Alev Fışkırtıcı, Hasan er-Rammâh'ın 'Kitâb el-Furûsiyye' adlı eserinde detaylandırdığı, kimya ve mekanik mühendisliğinin ölümcül bir sentezidir. 'Rum Ateşi' veya 'Neft' olarak bilinen, suyla temas ettiğinde dahi sönmeyen yakıcı petrol türevleri, antik dönemden beri bilinmekteydi; ancak İslam mühendisleri bu sıvıları uzaktan ve kontrollü bir şekilde fırlatmak için çift pistonlu basınçlı pompalar (zerrâka) geliştirmişlerdir. Bu düzenek, bronz veya demir bir haznedeki yakıcı sıvıyı, namlu ucundaki fitil mekanizmasıyla ateşleyerek düşman üzerine sürekli bir alev hüzmesi olarak püskürtüyordu. Özellikle deniz savaşlarında ve kale savunmalarında kullanılan bu silah, psikolojik ve fiziksel yıkım gücü çok yüksek bir caydırıcıydı. er-Rammâh'ın çizimleri, pompanın emme-basme valflerini ve namlunun soğutma sistemini (suyun namlu etrafında dolaştırılması) dahi içerir. Bu teknoloji, modern alev makinelerinin (flamethrower) ve kimyasal silahların tarihsel atası sayılır ve İslam dünyasının Haçlı ve Moğol akınlarına karşı geliştirdiği asimetrik harp yeteneğinin kanıtıdır."}, {"id": "narrated-75-48", "slug": "askeri-teknoloji-anlatili-75-asan-er-ramma-in-cilgin-roketi", "name": "Hasan er-Rammah'ın Çılgın Roketi", "category": "Askeri Teknoloji", "creator": "Hasan er-Rammah", "has_img": 1, "desc": "Hasan er-Rammah'ın el-Furusiyye'sinde tarif edilen «hareket eden ve yanan yumurta», kendinden tahrikli torpidonun bilinen en erken örneği sayılır. Barut ve neft dolu bakır gövde, roket itkisiyle su yüzeyinde kendi kendine ilerler. Bu düzenek, modern torpido kavramını yaklaşık yedi yüzyıl önceleyen bir askeri deha ürünüdür ve İslam dünyasının ateşli silahlar tarihindeki öncü rolünün en çarpıcı kanıtıdır."}, {"id": "narrated-76-49", "slug": "askeri-teknoloji-anlatili-76-za-fa", "name": "Zahhâfa (Sürülebilir Şahmerdan Koçbaşı)", "category": "Askeri Teknoloji", "creator": "Giovanni Fontana / Arap öncül", "has_img": 1, "desc": "Giovanni Fontana'nın tasvir ettiği sürülebilir şahmerdan koçbaşı, üzerindeki «alphasat» (ez-zahhâfa) Arapça yazıtıyla, bu aletin Arap geleneğinden devralındığının doğrudan kanıtıdır. Zırhlı arabalar içinde surlara yanaştırılan koçbaşları, İslam kuşatma sanatının temel araçlarındandı. Bu çizim, Avrupa askerî mühendisliğinin İslam dünyasından beslenişinin belgesidir."}, {"id": "narrated-77-50", "slug": "askeri-teknoloji-anlatili-77-fars-mancinigi", "name": "Fars Mancınığı", "category": "Askeri Teknoloji", "creator": "İbn en-Nedîm (Fihrist)", "has_img": 1, "desc": "İbn en-Nedîm'in 987 tarihli Fihrist'inde andığı Sasani ve Hint kökenli mancınık ve şahmerdan (koçbaşı) tercümeleri, İslam askerî mühendisliğinin «küresel sentez» doğasını gösterir. İslam orduları, Bizans'ın burulma (torsion) makinelerini, Sasani'nin karşıt ağırlık sistemlerini ve Hint'in metalurji bilgisini devralıp, kendi balistik ve geometri bilimleriyle (ilm el-ramy) harmanlamıştır. Bu erken tercümeler, Tarsûsî'nin 12. yüzyıldaki anıtsal Tabşira'sının ve Memlük roketlerinin teorik altyapısını hazırlamıştır. Koleksiyonda bu metinler, savaş teknolojisinin tek bir millete ait olmadığını; antik çağın yıkıcı mirasının İslam kütüphanelerinde sistematikleştirilip, orta çağın küresel silahlanma yarışına nasıl sürüldüğünün belgesidir."}, {"id": "narrated-80-51", "slug": "kimya-anlatili-80-ed-dimesk-nin-endustriyel-gul-suyu-uretim-aleti", "name": "Kereke (gül suyu elde etme düzeneği)", "category": "Kimya", "creator": "Şemseddîn ed-Dımeşkî", "has_img": 1, "desc": "Şemseddîn ed-Dımeşkî'nin gül suyu damıtımında kullandığı ez-Zücâc el-Hikmî («bilge camı» / «hikmet camı»), cam üfleme sanatının kimyanın hizmetindeki en zarif örneklerindendir. 14. yüzyılın kozmograf ve tacir bilginlerinden Dımeşkî, eserinde parfüm üretiminin ticari ve teknik ayrıntılarını aktarır; cam düzenek, saydam gövdesiyle damıtma sürecinin ilk kez gözle izlenip kontrol edilmesini sağlar. Camın İslam laboratuvarında kullanımı, er-Râzî'nin «saydam kap» tavsiyesinden itibaren bir metodolojik devrimdir: kimyager, artık yalnız koku ve sesle yetinmez, süreci «görür». Bu düzenek, Taşrîf'in gül suyu aparatıyla birlikte, parfümerinin zanaattan bilime dönüşümünü ve İslam dünyasının küresel koku endüstrisi tarihindeki yerini belgeler. Koleksiyonda cam laboratuvar kapları zincirinin (cauchil, scutellae, cannutum) Doğu halkasıdır."}, {"id": "narrated-81-52", "slug": "kimya-anlatili-81-ez-zehr-v-nin-gul-suyu-damitma-duzenegi", "name": "Gül Suyu Damıtma Düzeneği (ez-Zehrâvî varyantı)", "category": "Kimya", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "ez-Zehrâvî'nin farmakoloji amaçlı gül suyu damıtma düzeneği."}, {"id": "narrated-82-53", "slug": "kimya-anlatili-82-eb-bekir-er-r-z-nin-gelismis-i-mbigi", "name": "Ebû Bekir er-Râzî'nin Gelişmiş İmbiği", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 1, "desc": "Buharın miğfer dışında yoğunlaştığı en eski tarif; Wiedemann taslağı."}, {"id": "narrated-83-54", "slug": "kimya-anlatili-83-semsedd-n-ed-dimesk-nin-distilasyon-aygiti", "name": "Şemseddîn ed-Dımeşkî'nin Distilasyon Aygıtı", "category": "Kimya", "creator": "Şemseddîn ed-Dımeşkî", "has_img": 1, "desc": "ez-Zücâc el-Hikmî; cam damıtım düzeneği."}, {"id": "narrated-86-55", "slug": "tip-anlatili-86-el-cezer-nin-kan-miktarini-olcen-i-ki-aleti", "name": "el-Cezeri'nin Kan Miktarını Ölçen İki Aleti", "category": "Tıp", "creator": "Alaeddin Ali b. İbrahim İbn eş-Şatir", "has_img": 1, "desc": "Şam Emevi Camii'nin başmuvakkidi İbn eş‐Şatir'in icat ettiği «el‐alet el‐camia» (kapsamlı/evrensel alet), tüm enlemlerde ve tüm astronomik problemlerde kullanılabilen çok işlevli bir usturlap/kadran sentezidir. Bu alet, ez‐Zerkali'nin evrensel disk (safiha zerkaliyye) geleneğinin 14. yüzyıldaki zirvesidir; farklı enlem plakalarını taşımaya gerek bırakmadan, stereografik projeksiyonun incelikleriyle her yerde çalışır. İbn eş‐Şatir'in aleti, yalnız pratik bir araç değil, aynı zamanda onun ünlü gezegen teorisinin («Tusi Çifti» ile Batlamyus eleştirisi) mekanik yansımasıdır. Kopernik'in yüzyıl sonra kullanacağı matematiksel modellerin sahibi olan bu muvakkit, alet yapımında da aynı dehayı gösterir. Koleksiyonda el‐alet el‐camia, İslam astronomisinin hem teoride hem pratikte kendi «devrimini» yarattığının maddi kanıtıdır."}, {"id": "narrated-89-56", "slug": "tip-anlatili-89-dudak-catlaklari-tedavisinde-kullanilan-koter", "name": "Dudak Çatlakları Tedavisinde Kullanılan Koter", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Şam Emevi Camii'nin başmuvakkidi İbn eş‑Şâtir'in icat ettiği «el‑âlet el‑câmia» (kapsamlı/evrensel alet), tüm enlemlerde ve tüm astronomik problemlerde kullanılabilen çok işlevli bir usturlap/kadran sentezidir. Bu alet, ez‑Zerkâlî'nin evrensel disk (safiha zerkaliyye) geleneğinin 14. yüzyıldaki zirvesidir; farklı enlem plakalarını taşımaya gerek bırakmadan, stereografik projeksiyonun incelikleriyle her yerde çalışır. İbn eş‑Şâtir'in aleti, yalnız pratik bir araç değil, aynı zamanda onun ünlü gezegen teorisinin («Tusî Çifti» ile Batlamyus eleştirisi) mekanik yansımasıdır. Kopernik'in yüzyıl sonra kullanacağı matematiksel modellerin sahibi olan bu muvakkit, alet yapımında da aynı dehayı gösterir. Koleksiyonda el‑âlet el‑câmia, İslam astronomisinin hem teoride hem pratikte kendi «devrimini» yarattığının maddi kanıtıdır."}, {"id": "narrated-90-57", "slug": "tip-anlatili-90-gozyasi-bezindeki-fistullerin-tedavisi-i-cin-koter", "name": "Gözyaşı Bezindeki Fistüllerin Tedavisi İçin Koter", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Gözyaşı bezi fistülünün (nâşir) dağlanması için kullanılan bu koter, İslam oftalmolojisinin ince aletlerindendir. Gözyaşı kanalı hastalıklarının tedavisi, ez-Zehrâvî'den Halîfe el-Halebî'ye uzanan çizgide sistematik biçimde işlenmiş; alet uçları göz bölgesinin hassasiyetine göre inceltilmiştir. Bu model, yüzyıllarca göz tedavisinde referans kalan İslam kuhl geleneğinin parçasıdır."}, {"id": "narrated-90-58", "slug": "tip-anlatili-90-gozyasi-fistulleri-i-cin-temizleyici", "name": "Gözyaşı Fistülü Temizleyicisi", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Fistül kanalını temizleyen ince alet; teyit bekliyor."}, {"id": "narrated-91-59", "slug": "tip-anlatili-91-kargi", "name": "Kargı (harbe)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Oftalmolojik kargı (harbe), göz ameliyatlarında kullanılan mızrak uçlu bir lansettir. Katarakt ve pterjiyum gibi operasyonlarda kesim için kullanılan bu alet, İslam göz cerrahisinin yalnızca ilaçla değil, gerçek bir mikro-cerrahiyle yürütüldüğünü gösterir. İnce ucu ve kontrollü sapı, yüzyıllık kuhl geleneğinin ürünüdür."}, {"id": "narrated-91-60", "slug": "tip-anlatili-91-cimbiz", "name": "Cımbız (kulak/yabancı cisim, çift)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Kulak kanalından yabancı cisim çıkarmak için tasarlanan cımbız çifti, Taşrîf'in KBB cerrahisi bölümünün en zarif aletlerindendir. Veliyüddin Efendi yazmasındaki (fol. 128a) minyatürlere dayanarak yeniden üretilen iki model, 118 ve 130 mm uzunlukta, bakır ve pirinçten yapılmıştır; uçları, kanalı zedelemeden kavrayacak biçimde kavisli ve yassıtılmıştır. ez-Zehrâvî, kulaktaki yabancı cisimlerin (böcek, tohum, boncuk) türüne göre farklı aletlerle çıkarılmasını vurgular; hatta canlı böceklerin önce öldürülmesi gibi incelikli yöntemler tarif eder. Bu cımbızlar, Latince çeviri (Albucasis) üzerinden Avrupa cerrahi pratiğine girmiş ve yüzyıllarca kopyalanmıştır; Karl Sudhoff ve Leclerc'in çalışmaları, Taşrîf alet resimlerinin orta çağ cerrahisinin en kapsamlı görsel atlası olduğunu gösterir. Cımbız, İslam tıbbının «alet temelli» rasyonalitesinin ve hasta güvenliği duyarlılığının simgesidir."}, {"id": "narrated-92-61", "slug": "tip-anlatili-92-makas-benzeri-alet", "name": "Makas Benzeri Alet (âle tuşbihu el-mikaşş)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Bademcik ve yutak tümörleri için tasarlanan «makas benzeri alet», KBB cerrahisi tarihinin en dikkat çekici aletlerindendir. Makas biçimli çeneler, boğazdaki şişkin dokuyu kavrayarak kesip çıkarmayı sağlar. Veliyüddin yazmasında resmedilen bu alet, 10. yüzyıl Kurtuba'sının modern tıbbın bile zor saydığı problemlere cerrahi çözümler geliştirdiğini gösterir. Taşrîf, yüzyıllarca Avrupa cerrahisinin temel metni olarak kalmıştır."}, {"id": "narrated-92-62", "slug": "tip-anlatili-92-dis-taslarini-gidermek-i-cin-14-raspator", "name": "Diş Taşlarını Gidermek İçin 14 Raspatör", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Diş taşını gidermek için kullanılan raspator (soyucu), İslam tıbbının ağız sağlığına verdiği önemin göstergelerindendir. ez-Zehrâvî, diş temizliği ve diş taşı giderme işlemlerini sistematize etmiş; diş eti ve diş yapısına uygun aletler tarif etmiştir. Modern diş hekimliğindeki detertraj aletlerinin atası sayılabilecek bu soyucu, yüzyıllardır süren bir sağlık pratiğinin halkasıdır."}, {"id": "narrated-93-63", "slug": "tip-anlatili-93-piston-siringa", "name": "Piston Şırınga (zerrâka / mihkan)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Zerrâka veya mihkan adı verilen pistonlu şırınga, mesaneye ilaç instilasyonu için kullanılan, üroloji tarihinin en özgün aletlerindendir. Emme-basma prensibiyle çalışan piston mekanizması, modern enjektörün doğrudan atasıdır. Bu alet, İslam tıbbının yalnızca tedavi yöntemleri değil, teknolojik icatlar da ürettiğinin somut kanıtıdır."}, {"id": "narrated-93-64", "slug": "tip-anlatili-93-germe-banki", "name": "Germe Bankı (Scamnum)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Kırık ve çıkıklarda omurgayı veya eklemleri germek için kullanılan ortopedik bank."}, {"id": "narrated-93-65", "slug": "tip-anlatili-93-buyuk-yay-testere", "name": "Büyük Yay Testere (minşâr kebîr)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Kemik kesmek için kullanılan yaprak testere (minşâr), ampütasyon cerrahisinin en karakteristik aletidir. İnce ve esnek yaprak, kemiği kontrollü biçimde keserek yumuşak doku travmasını azaltır. ez-Zehrâvî'nin ampütasyon tekniği —önce neşterle yumuşak doku, sonra testereyle kemik— 19. yüzyıla dek Avrupa cerrahisinde standart olarak uygulanmıştır."}, {"id": "physical-asset-1", "slug": "astronomi-fiziksel-1-es-sicz-nin-gezegen-gosterim-aleti-planetarium-of-al-sigzi", "name": "Kayık Formunda Usturlap (el-asturlâb ez-zevrakî)", "category": "Astronomi", "creator": "Çeşitli ustalar", "has_img": 0, "desc": "Planetaryumlar ve gök küreleri bölümü, gökyüzünün «taşınabilir kopyaları»nı bir araya getirir: es‐Siczi'nin gezegen modeli, el‐Hazimi'nin dönen küresi, Merağa ve İstanbul küreleri ve Avrupa'daki ardılları. Bu nesneler, gözlem aletlerinden farklı olarak ölçmez; temsil eder — gökyüzünü bir bütün olarak avuca indirir. Kürecilik (küre yapımı), İslam dünyasında başlı başına bir zanaat‐bilim dalıydı; pirinç üzerine binlerce yıldız adı kazınırdı. Koleksiyonda bölüm, «kozmosun minyatürleri»ni sergiler; her küre, bir çağın evren tasavvurunun üç boyutlu belgesidir."}, {"id": "physical-asset-2", "slug": "astronomi-fiziksel-2-abdurrahm-n-es-s-f-nin-gokkuresi-the-celestial-globe-of-abdarrahman-al", "name": "Abdurrahmân eş-Şûfî'nin Gökküresi", "category": "Astronomi", "creator": "Abdurrahmân eş-Şûfî", "has_img": 0, "desc": "Sûverü'l-Kevâkib geleneğine dayanan erken İslam gök küresi."}, {"id": "physical-asset-3", "slug": "astronomi-fiziksel-3-coronelli-nin-gokkuresi-the-celestial-globe-of-coronelli", "name": "Coronelli'nin Gökküresi", "category": "Astronomi", "creator": "Vincenzo Coronelli", "has_img": 0, "desc": "Karşılaştırmalı sunum için eklenen Avrupa rönesans gök küresi."}, {"id": "physical-asset-4", "slug": "astronomi-fiziksel-4-rey-rasathanesi-the-observatory-of-raiy-old-teheran", "name": "Rey Rasathanesi (el-Hucendî)", "category": "Astronomi", "creator": "Ebu Mahmud el-Hucendi", "has_img": 0, "desc": "el‐Hucendi'nin Rey'de (bugünkü Tahran'ın güneyi) Büveyhi sultanı Fahreddevle'yi ikna ederek kurduğu rasathanedeki sekstant, yaklaşık 20 metre yarıçapıyla döneminin en büyük gözlem yayıydı. Bu dev aletle yapılan gözlemler, ekliptik eğiminin zamanla sürekli küçüldüğü sonucunu verdi; Sabit b. Kurra'nın trepidasyon (hareket el‐ikbal ve'l‐idbar) hipoteziyle başlayan tartışma, böylece yeni bir deneysel zemine taşındı. Sekstantın kalıntısı, «büyüklük = hassasiyet» ilkesinin İslam astronomisindeki en cesur uygulamasıdır. Koleksiyonda Rey sekstantı, Semerkant'ın 40 metrelik yayının habercisi olarak sergilenir."}, {"id": "physical-asset-5", "slug": "astronomi-fiziksel-5-al-uddevle-nin-hemedan-rasathanesi-ana-aleti-main-instrument-of-alaadd", "name": "Alaüddevle'nin Hemedan Rasathanesi Ana Aleti (Main Instrument of Alaaddaula's Observatory)", "category": "Astronomi", "creator": "Alaüddevle dönemi astronomları", "has_img": 0, "desc": "11./5. yüzyılın başlarında Alaüddevle'nin himayesinde Hemedan'da kurulan rasathane, İbn Sina ve Ebu Naşr b. Irak gibi dönemin dev isimlerinin gözlemlerine sahne olmuştur. Bu ana alet modeli, gezegen hareketlerinin tartışıldığı bir dönemde ekliptik eğiminin sabit mi değişken mi olduğunu sınama çabalarının bir parçasıdır. Ahşap astar üzerine altın kaplama pirinç skalalar, dönemin hassas işçiliğini yansıtır."}, {"id": "physical-asset-6", "slug": "astronomi-fiziksel-6-mer-ga-rasathanesi-buyuk-sekstanti-reconstruction-of-the-great-sextant", "name": "Merağa Rasathanesi Büyük Sekstantı (Reconstruction of the Great Sextant of Maraga Observatory)", "category": "Astronomi", "creator": "Hulagu / Reşideddin / İlhanlı devleti", "has_img": 0, "desc": "Merağa Rasathanesi, yalnız bir gözlem evi değil; kütüphanesi, atölyeleri, vakıf geliri ve uluslararası bilgin kadrosuyla tarihin ilk kurumsal bilim komplekslerinden biridir. Hulagu'nun himayesi ve Reşideddin'in idaresiyle kurulan bu yapı, bilimin devlet tarafından finanse edilip örgütlendiği modern araştırma enstitülerinin orta çağ prototipidir. Kazı kalıntılarındaki kütüphane temelleri, bu kurumsal büyüklüğün maddi kanıtıdır. Koleksiyonda Merağa'nın mirası, bilimin «bireysel deha»dan «kurumsal üretim»e geçtiği andır."}, {"id": "physical-asset-7", "slug": "astronomi-fiziksel-7-mer-ga-rasathanesi-duvar-kadrani-mural-quadrant-maraga-observatory-ins", "name": "Merağa Rasathanesi Duvar Kadranı (Mural Quadrant – Maraga Observatory, Instrument I)", "category": "Astronomi", "creator": "Müeyyededin el-Urdi", "has_img": 0, "desc": "Duvar kadranı, gök cisimlerinin meridyenden geçiş yüksekliklerini ölçen rasathane aletlerinin en temel ve en hassas olanıdır. el-Battani'den beri İslam dünyasında bilinen bu alet, Merağa'da Müeyyededin el-Urdi'nin elinde anıtsal boyutlara ulaşmıştır: tik ağacından kadranın yarıçapı yaklaşık 2,5 metreyi buluyordu. Merkezine takılan ve yarıçapa eşit uzunluktaki alhidade ile güneşin yüksekliği, ekliptik eğimi ve gözlem yerinin enlemi belirleniyordu. Model, el-Urdi'nin Aletler Kitabı'ndaki çizimlere dayanır."}, {"id": "physical-asset-8", "slug": "astronomi-fiziksel-8-mer-ga-rasathanesi-cemberli-kure-armillary-sphere-maraga-observatory-i", "name": "Çemberli Küre, Merâğa Rasathanesi'nde", "category": "Astronomi", "creator": "Müeyyededin el-Urdi", "has_img": 0, "desc": "Merağa Rasathanesi'nin çemberli küresi, el-Urdi'nin Aletler Kitabı'nda ayrıntıyla tasvir edilir; en dıştaki meridyen halkası, büyük enlem halkası, ekliptik ve kolur çemberleri göksel koordinat sistemlerini temsil eder. Beş kişilik bir ekibin aynı anda işlettiği bu küre, orta çağın en sistematik rasathanesinin üç boyutlu simgesidir."}, {"id": "physical-asset-9", "slug": "astronomi-fiziksel-9-mer-ga-rasathanesi-gundonumu-halkasi-solstitial-armilla-maraga-observa", "name": "Gündönümü Halkası (Merâğa III)", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî", "has_img": 0, "desc": "Ekliptik eğimini belirlemek için kullanılan gündönümü halkası, Ptoleme'nin Almagest'inden beri bilinen klasik bir gözlem düzeneğidir. el-Urdî, Merâğa'da bu halkayı yeniden tasarlayarak hassasiyetini artırmış; güneşin gündönümlerindeki tepe yüksekliklerini ölçerek eğim değerini hesaplamıştır. Halka sayısının artırılmasını gereksiz gören el-Urdî'nin bu sade ama kesin tasarımı, Merâğa ekolünün mühendislik zekâsının tipik bir örneğidir."}, {"id": "physical-asset-10", "slug": "astronomi-fiziksel-10-mer-ga-rasathanesi-ekinoksal-cember-equinoctial-armilla-maraga-observa", "name": "Ekinoksal Çember (halkat el-istivâ')", "category": "Astronomi", "creator": "Müeyyededin el-Urdi", "has_img": 0, "desc": "el-Urdi'nin Ptoleme'den devralıp geliştirdiği ekinoksal çember (halkat el-istiva'), güneşin burçlar dairesinde gündönümü noktalarına girişini belirlemeye yarar. Taksimatlı dikey meridyen halkası ve sabit ekvator çemberi, ekinoks tarihinin hassas tespitini sağlıyordu. Bu alet, Merağa'nın takvim ve gözlem programının temel taşlarından biridir."}, {"id": "physical-asset-11", "slug": "astronomi-fiziksel-11-mer-ga-rasathanesi-hareket-edebilir-nisang-hli-alet-instrument-v-marag", "name": "Nişangâh (hareketli, diopter)", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî", "has_img": 0, "desc": "el-Urdî'nin beşinci aleti olan hareket edebilir nişangâhlı düzenek, güneşin günlük en büyük yüksekliğini ölçmek üzere tasarlanmıştır. Dönebilen bir payanda üzerine yerleştirilen ve 90°'ye bölünen daire üzerinde kayan gösterge, gözlemciye esnek ve hızlı bir ölçüm imkânı sunar. Orijinali 230 cm boyundaki bu dev alet, Merâğa'daki gözlem programının sürekliliğini ve sistematik karakterini ortaya koyar."}, {"id": "physical-asset-12", "slug": "astronomi-fiziksel-12-mer-ga-rasathanesi-cift-kadranli-alet-instrument-vi-maraga-observatory", "name": "Çift Kadranlı Alet (Merâğa VI)", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî", "has_img": 0, "desc": "«Çift Kadranlı Alet», Merâğa Rasathanesi'nin temel aletlerinden biridir ve el-Urdî'nin kendi geliştirdiğini özellikle vurguladığı bir buluştur. Yıldızların yüksekliklerini ve azimutlarını belirlemeye yarayan aletin en özgün yanı, iki gözlemcinin eş zamanlı ölçüm yapabilmesine imkân tanımasıdır; böylece aynı gök cismi iki farklı düzlemde doğrulanabiliyordu. İlk rekonstrüksiyonu Hugo Seemann tarafından yapılmıştır."}, {"id": "physical-asset-13", "slug": "astronomi-fiziksel-13-mer-ga-rasathanesi-cift-bacakli-alet-instrument-vii-maraga-observatory", "name": "Makara-İp Düzeneği (kadran cetvelleri için)", "category": "Astronomi", "creator": "Müeyyededin el-Urdi", "has_img": 0, "desc": "«Çift Bacaklı Alet» (el-ale zat eş-şu'beteyn), bir pergelin bacakları gibi menteşe ile birbirine bağlı iki dev cetvelden oluşan, Merağa'nın en özgün trigonometrik aletidir. Bacaklardan biri yatay konumda sabit durur ve okuma skalası taşır; nişangahla donatılmış diğeri ise hedefe doğrultulur ve ucundaki şakül ile yatay bacak üzerinde bir nokta işaretler. Yatay cetvelin başından şakül ile işaretlenmiş noktaya kadar olan mesafenin, hareketli bacağın uzunluğuna oranı, nişan alınan yüksekliğin kosinüs değerini doğrudan verir. Bu basit ama derin geometri, küresel trigonometrinin pratik bir uygulamasıdır ve uzun hesaplamaları mekanik bir okumaya indirger. Koleksiyonda bu alet, «yoksul malzeme-zengin matematik» ilkesinin simgesidir; ahşap ve pirinç, gökyüzünün en soyut açılarını somut sayılara dönüştürür."}, {"id": "physical-asset-14", "slug": "astronomi-fiziksel-14-mer-ga-rasathanesi-yukseklik-ve-azimut-olcen-alet-instrument-viii-mara", "name": "Merağa Rasathanesi Yükseklik ve Azimut Ölçen Alet (Instrument VIII – Maraga Observatory)", "category": "Astronomi", "creator": "Müeyyededin el-Urdi", "has_img": 0, "desc": "el‐Urdi'nin 7. ve 8. aletleri, Ptoleme'nin «paralaks cetveli»nin (üç cetvelli düzenek) İslam mühendisliğindeki en gelişmiş versiyonudur. Paralaks (ikhtilaf el‐manzar), Ay ve gezegenlerin gerçek konumunu belirlemenin anahtarıdır; bu cetveller, sorunu mekanik bir okumaya indirger. 8. alet, bir yıldızın yüksekliğini ve azimutunu birlikte vererek bir dizi astronomi problemi (küresel üçgen çözümlemeleri) çözer. Bu aletler, Merağa ekolünün «problemi alete çevirme» yönteminin en verimli örneklerindendir. Koleksiyonda bu ikili, rasathanenin «hesap makinesi»dir; karmaşık küresel trigonometri, ahşap ve pirinç cetvellerin dansıyla basit bir okumaya dönüşür."}, {"id": "physical-asset-15", "slug": "astronomi-fiziksel-15-mer-ga-rasathanesi-sinus-belirleme-aleti-instrument-ix-maraga-observat", "name": "Sinüs Belirleme Aleti (Merâğa IX)", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî", "has_img": 0, "desc": "«Mükemmel Alet», el-Urdî'nin üç özgün buluşunun zirvesi sayılır. Kılavuz ray üzerinde inip çıkan menteşeli cetvel pergeli sayesinde, gözlem sırasında sürekli ayar gerektiren karmaşık işlemler tek bir hareketle çözülmüştür. Alet, Merâğa ekolünün yalnızca gözlemci değil, aynı zamanda yaratıcı mühendisler topluluğu olduğunun kanıtıdır."}, {"id": "physical-asset-16", "slug": "astronomi-fiziksel-16-mer-ga-rasathanesi-mukemmel-alet-instrument-x-maraga-observatory", "name": "Merâğa Rasathanesi Mükemmel Alet", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî", "has_img": 0, "desc": "Merâğa Rasathanesi'nin «Mükemmel Alet»i (el-âle el-kâmile), döneminin en sofistike ve çok işlevli gözlem cihazıdır. el-Urdî'nin kendi buluşu olan bu alet, cetvel pergeli, kılavuz ray, döner taban ve hassas nişangâhları birleştirerek hem yükseklik hem de azimut ölçümlerini eşzamanlı ve mikron hassasiyetinde yapabilir. Ptoleme'nin hantal «armiller küre»sinin ve sınırlı «paralaks cetveli»nin ötesine geçen bu modüler tasarım, rasathane aletlerinin «kapalı katalog» dışındaki, deneysel ve yaratıcı yüzünü temsil eder. Aletin adı, onun yalnızca bir araç değil, aynı zamanda bir «tasarım felsefesi» olduğunu gösterir. Koleksiyonda Mükemmel Alet, Merâğa'nın «altın standardı»dır; rasathanenin kurumsal ve entelektüel iddiasının pirinç ve ahşaba dökülmüş halidir."}, {"id": "physical-asset-18", "slug": "astronomi-fiziksel-18-i-stanbul-rasathanesi-halkali-kure-instrument-i-istanbul-observatory", "name": "İstanbul Rasathanesi Halkalı Küre", "category": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "has_img": 0, "desc": "İstanbul Rasathanesi'nin çemberli küresi, Takiyyeddîn'in Merâğa geleneğinden devraldığı aletler arasındadır. Stephan Gerlach'ın notları ve Schweigger'in anıları, bu halkalı kürenin Osmanlı rasathanesinde kullanıldığını kaydeder. Küre, Ptoleme'den Tycho'ya uzanan iki bin yıllık armiller geleneğin son büyük halkalarındandır."}, {"id": "physical-asset-19", "slug": "astronomi-fiziksel-19-i-stanbul-rasathanesi-duvar-kadrani-instrument-ii-istanbul-observatory", "name": "İstanbul Rasathanesi Duvar Kadranı", "category": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "has_img": 0, "desc": "Meridyen yükseklikleri ölçen büyük duvar kadranı."}, {"id": "physical-asset-20", "slug": "astronomi-fiziksel-20-i-stanbul-rasathanesi-yukseklik-ve-azimut-olcen-alet-instrument-iii-is", "name": "Azimut ve Yükseklik Aleti (İstanbul III)", "category": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "has_img": 0, "desc": "Takiyyeddîn'in İstanbul Rasathanesi için tasarladığı azimut-yükseklik aleti, gökyüzünü iki eksende birden tarayabilen evrensel bir gözlem düzeneğidir. Toplam 220 cm yüksekliğindeki pirinç skala ve 167 cm'lik kiriş cetveli, dönemin en büyük hassas mekanik düzenekleri arasındadır. Alet, modern teleskop kundaklarının 'altazimut' prensibinin 16. yüzyıldaki habercisidir."}, {"id": "physical-asset-21", "slug": "astronomi-fiziksel-21-i-stanbul-rasathanesi-cift-bacakli-alet-instrument-iv-istanbul-observa", "name": "Duvar Kadranı (İstanbul II)", "category": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "has_img": 0, "desc": "İstanbul Rasathanesi'nin meridyen duvar kadranı."}, {"id": "physical-asset-22", "slug": "astronomi-fiziksel-22-i-stanbul-rasathanesi-ahsap-kadrani-wooden-quadrant-instrument-v-istan", "name": "İstanbul Rasathanesi Ahşap Kadranı", "category": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "has_img": 0, "desc": "Takiyyeddîn'in V. aleti; alhidadeli büyük ahşap duvar kadranı."}, {"id": "physical-asset-23", "slug": "astronomi-fiziksel-23-i-stanbul-rasathanesi-paralaks-cetveli-parallactic-ruler-instrument-vi", "name": "İstanbul Rasathanesi Paralaks Cetveli", "category": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "has_img": 0, "desc": "Azimut ayarlı döner payandalı cetveller."}, {"id": "physical-asset-24", "slug": "astronomi-fiziksel-24-i-stanbul-rasathanesi-kirisli-alet-instrument-with-the-chords-instrume", "name": "Kirişli Alet (İstanbul VII)", "category": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "has_img": 0, "desc": "'İpli aletler' anlamına gelen âlât zât el-evtâr, Takiyyeddîn'in gerilmiş ipleri optik nişangâh gibi kullandığı yenilikçi bir gözlem düzeneğidir. İplerin oluşturduğu geometri, gök cisimlerinin konumlarını metal cetveller olmadan da hassas biçimde ölçmeyi mümkün kılıyordu. Bu tasarım, Osmanlı gözlem geleneğinin pratik zekâsının ve malzeme bağımsız mühendislik arayışının simgesidir."}, {"id": "physical-asset-25", "slug": "astronomi-fiziksel-25-musebbehe-bi-l-men-tik-instrument-for-the-measurement-of-distances-ins", "name": "Müşebbehe bi'l-Menâtık (İstanbul)", "category": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "has_img": 0, "desc": "Takiyyeddîn'in sekizinci aleti olan «Yıldızlar Arasındaki Mesafeleri Ölçen Alet» (Âlet Müşebbehe bi-el-Manâtık), gökyüzündeki iki yıldız arasındaki açısal mesafeyi doğrudan ölçmek için tasarlanmış özel bir düzenektir. Bu alet, sabit yıldızlar kataloğunun güncellenmesi ve gezegenlerin yörünge parametrelerinin (özellikle presesyon ve eğim) hassas biçimde belirlenmesi için kritik öneme sahipti. Takiyyeddîn, bu aletle Tycho Brahe'nin Hven'de kullandığı benzer aletlerden (Sextans pistorius) bağımsız veya onlardan haberdar olarak (aktarım tartışması) aynı mühendislik sonucuna ulaşmıştır. Koleksiyonda bu alet, 16. yüzyılın iki büyük rasathanesi (İstanbul ve Hven) arasındaki görünmez diyaloğun ve «büyük alet» felsefesinin küresel bir fenomen olduğunun maddi kanıtıdır."}, {"id": "physical-asset-26", "slug": "astronomi-fiziksel-26-yukseklik-ve-azimut-olcen-alet-tycho-brahe-instrument-i", "name": "Hven Rasathanesi Aletleri (Tycho Brahe)", "category": "Astronomi", "creator": "Tycho Brahe", "has_img": 0, "desc": "Hven Rasathanesi aletleri —büyük duvar kadranı, sekstant ve çemberli küre— Merâğa ve İstanbul rasathanelerinin Avrupa'daki yankısıdır. Takiyyeddîn'in aletlerine dair haberler Avrupa'ya çok erken ulaşmıştı; Tycho'nun hassas gözlem programı, aynı gözlem felsefesinin son halkasıdır."}, {"id": "physical-asset-28", "slug": "astronomi-fiziksel-28-astronomik-sekstant-astronomical-sextant-tycho-brahe-instrument-iii", "name": "Sekstant (Tycho Brahe, sextans astronomicus)", "category": "Astronomi", "creator": "Takiyyeddin er-Rasıd", "has_img": 0, "desc": "Takiyyeddin'in 'el-ale el-müşebbehe bi-l-menatık' adını verdiği bu alet, yıldızlar arası açısal mesafeleri ölçmek için İstanbul Rasathanesi'nde kullanılmıştır ve mucidinin kendi buluşu olarak kayda geçmiştir. İki nişangah ve bir ölçekten oluşan basit ama kesin geometri, Tycho Brahe'nin benzer aletleriyle çarpıcı bir koşutluk gösterir; bu benzerlik, 16. yüzyıl Osmanlı-Avrupa astronomisinin ortak teknik diline işaret eder."}, {"id": "physical-asset-30", "slug": "astronomi-fiziksel-30-buyuk-ahsap-kadran-large-wooden-quadrant-tycho-brahe-instrument-vii", "name": "Büyük Ahşap Kadran (Tycho VII)", "category": "Astronomi", "creator": "Tycho Brahe", "has_img": 0, "desc": "Tycho Brahe'nin 1576'da inşa ettiği Quadrans maximus, yaklaşık 6 metre yarıçapıyla Avrupa'nın en büyük duvar kadranıydı. Ancak bu anıtsal tasarımın öncülleri, Merâğa ve İstanbul rasathanelerindeki dev kadranlardır; duvar kadranı geleneği el-Battânî'den beri İslam dünyasında yaşıyordu. Tycho'nun kadranı, İslam rasathane mühendisliğinin Avrupa'ya dolaylı mirasının bir anıtı olarak okunmalıdır."}, {"id": "physical-asset-32", "slug": "astronomi-fiziksel-32-jaipur-rasathanesi-the-observatory-of-jaipur", "name": "Jaipur Rasathanesi Aletleri", "category": "Astronomi", "creator": "Sawai Jai Singh II", "has_img": 0, "desc": "Delhi Jantar Mantar'ın Samrât Yantra'sı, ekinoksal zamanı belirleyen anıtsal bir güneş saatidir; dev gnomon ve dereceli yaylar, yerel saati saniye hassasiyetinde okutur. Bu taş aletler, İslam astronomisinin kadran geleneğinin Hindistan'daki mimari devamıdır."}, {"id": "physical-asset-33", "slug": "astronomi-fiziksel-33-delhi-rasathanesi-jantar-mantar-the-observatory-jantar-mantar-in-delhi", "name": "Sekstant, Delhi Rasathanesi'nde", "category": "Astronomi", "creator": "Sawai Jai Singh II", "has_img": 0, "desc": "Delhi Rasathanesi'ndeki büyük sekstant, gök cisimlerinin yüksekliklerini ölçen dev bir yaydır; gözlemci, yay üzerindeki merdivenleri tırmanarak okuma yapar. Bu anıtsal aletler, çıplak göz gözleminin hassasiyet sınırını zorlayan son büyük yapılardır."}, {"id": "physical-asset-34", "slug": "usturlaplar-fiziksel-34-nast-lus-usturlabi-nastulus-astrolabe", "name": "Nastülüs Usturlabı (Fiziksel)", "category": "Usturlaplar", "creator": "Nastülüs", "has_img": 0, "desc": "En eski tarihli İslam usturlaplarından; Nastülüs imzalı."}, {"id": "physical-asset-35", "slug": "usturlaplar-fiziksel-35-nast-lus-un-i-kinci-usturlabi-second-astrolabe-of-nastulus", "name": "Nastulus'un İkinci Usturlabı (Second Astrolabe of Nastulus)", "category": "Usturlaplar", "creator": "Nastülüs", "has_img": 0, "desc": "Güneş ve Ay tutulmalarının zamanını, fazlarını ve süresini trigonometrik hesaplamalar yapmadan, mekanik olarak simüle edip okumayı sağlayan özel usturlap levhası."}, {"id": "physical-asset-37", "slug": "usturlaplar-fiziksel-37-ahmed-b-halef-usturlabi-astrolabe-made-by-ahmad-b-halaf", "name": "Usturlap, Osmanlı (1680 yılından)", "category": "Usturlaplar", "creator": "Ahmed b. Halef", "has_img": 0, "desc": "1680 tarihli bu Osmanlı usturlabı, klasik geleneğin Osmanlı topraklarındaki geç ama yetkin bir örneğidir. Cami muvakkithanelerinde namaz vakitlerinin belirlenmesi ve astronomi eğitimi için kullanılan bu aletler, Osmanlı bilim hayatının sürekliliğini gösterir. Parça, 17. yüzyılda usturlabın hâlâ canlı olduğunun maddi kanıtıdır."}, {"id": "physical-asset-38", "slug": "usturlaplar-fiziksel-38-el-hucend-nin-usturlabi-the-astrolabe-of-al-khujandi", "name": "el-Hucendî'nin Usturlabı (Fiziksel)", "category": "Usturlaplar", "creator": "Ebû Mahmûd el-Hucendî", "has_img": 0, "desc": "el-Hucendî'nin 374/984'te Rey'de imal ettiği usturlap, günümüze ulaşan en eski ve en güzel usturlaplardandır. Gravür zarafeti ve taksimat hassasiyeti, Büveyhî dönemi alet yapımı okulunun olgunluğunu yansıtır. Bu alet, aynı ustanın Rey'deki dev sekstantı inşa eden bir gözlemci-mühendis olduğunun da kanıtıdır."}, {"id": "physical-asset-39", "slug": "usturlaplar-fiziksel-39-katalan-modele-dayanan-usturlap-astrolabe-based-on-a-catalan-model", "name": "Usturlap, Katalan (10. yüzyıl)", "category": "Usturlaplar", "creator": "Katalan atölyesi", "has_img": 0, "desc": "10. yüzyıldan bu Katalan usturlabı, İslam-Latin aktarım kuşağının Avrupa yakasında üretilmiş en erken örneklerdendir. Aletin formu ve gravür üslubu, Endülüs okulunun doğrudan etkisini gösterir. İslam dünyasında doğan usturlabın, Avrupa'da yerelleşmeye başladığının maddi belgesidir."}, {"id": "physical-asset-41", "slug": "usturlaplar-fiziksel-41-papa-ii-sylvester-e-atfedilen-usturlap-astrolabe-attributed-to-pope-sy", "name": "el-Urdî Usturlabı", "category": "Usturlaplar", "creator": "Müeyyededîn el-Urdî", "has_img": 0, "desc": "Merâğa'nın başmühendisinin nadir usturlabı."}, {"id": "physical-asset-42", "slug": "usturlaplar-fiziksel-42-muhammed-b-es-saff-r-in-usturlabi-astrolabe-by-muhammad-b-al-saffar-to", "name": "Şaffâr Usturlabı (Toledo 420/1029)", "category": "Usturlaplar", "creator": "Muhammed b. eş-Şaffâr", "has_img": 0, "desc": "Toledo'lu Şaffâr ailesinin erken usturlabı; Endülüs alet yapımının altın çağı."}, {"id": "physical-asset-43", "slug": "usturlaplar-fiziksel-43-ahmed-b-en-nakk-s-in-usturlabi-astrolabe-by-ahmad-b-muhammad-al-naqqas", "name": "Ahmed b. en-Nakkâş'ın Usturlabı", "category": "Usturlaplar", "creator": "Ahmed b. Muhammed en-Nakkâş", "has_img": 0, "desc": "Saragossa'da imal edilmiş Endülüs usturlabı."}, {"id": "physical-asset-44", "slug": "usturlaplar-fiziksel-44-i-br-h-m-b-sa-d-es-sehl-nin-usturlabi-astrolabe-by-ibrahim-b-said-al-s", "name": "İbrâhîm b. Sa'îd es-Sehlî'nin Usturlabı", "category": "Usturlaplar", "creator": "İbrahim b. Sa'îd es-Sehlî", "has_img": 0, "desc": "Valensiya'da imal edilmiş Endülüs usturlabı."}, {"id": "physical-asset-45", "slug": "usturlaplar-fiziksel-45-muhammed-b-fut-h-el-ham-ir-nin-usturlabi-astrolabe-by-muhammad-b-al-fu", "name": "Hamâ'irî Usturlabı (Sevilla 613/1216)", "category": "Usturlaplar", "creator": "Muhammed b. Futûh el-Hamâ'irî", "has_img": 0, "desc": "Muhammed b. Futûh el-Hamâ'irî, Endülüs'ün en ünlü alet yapımcılarından biridir; 1216 tarihli bu usturlap, Mağrib okulunun gravür zarafetini ve matematik olgunluğunu yansıtır. Farklı enlemler için hazırlanmış plakalar ve yıldız adlarını taşıyan örümcek (ankebut), aletin hem gözlem hem eğitim amaçlı kullanıldığını gösterir. Bu usturlap, Endülüs alet yapımının geç döneme dek süren canlılığının maddi belgesidir."}, {"id": "physical-asset-46", "slug": "usturlaplar-fiziksel-46-muhammed-b-fut-h-un-i-kinci-usturlabi-astrolabe-by-muhammad-b-futuh-al", "name": "Muhammed b. Fütûh'un İkinci Usturlabı", "category": "Usturlaplar", "creator": "Muhammed b. Futûh el-Hamâ'irî", "has_img": 0, "desc": "Hamâ'irî'nin ikinci tarihli usturlabı."}, {"id": "physical-asset-47", "slug": "usturlaplar-fiziksel-47-eyyubi-sultani-el-mu-azzam-i-cin-yapilan-usturlap-astrolabe-of-the-mar", "name": "Usturlap, İstanbul Deniz Müzesi'nde", "category": "Usturlaplar", "creator": "Şam atölyesi", "has_img": 0, "desc": "Deniz Müzesi koleksiyonundaki usturlap."}, {"id": "physical-asset-48", "slug": "usturlaplar-fiziksel-48-abdulker-m-el-misr-nin-usturlabi-astrolabe-by-al-misri-for-muzaffaradd", "name": "Abdülkerîm el-Mısrî'nin Usturlabı", "category": "Usturlaplar", "creator": "Abdülkerîm el-Mısrî", "has_img": 0, "desc": "Ahmed b. es-Serrâc'ın evrensel usturlabı, Memlük topraklarında gelişen evrensel alet geleneğinin en kapsamlı sentezidir. Libros del saber'deki tariflere dayanarak rekonstrükte edilen model, kulplu ve asma halkalı ana, üç iç disk ve ibreden oluşur. Serrâc'ın aleti, klasik usturlap geleneğinin son büyük zirvesidir."}, {"id": "physical-asset-49", "slug": "usturlaplar-fiziksel-49-es-sehl-en-n-s-b-r-nin-usturlabi-astrolabe-by-al-sahl-al-nisaburi", "name": "es-Sehl en-Nisaburi'nin Usturlabı (Astrolabe by al-Sahl al-Nisaburi)", "category": "Usturlaplar", "creator": "Johannes Regiomontanus", "has_img": 0, "desc": "Johannes Regiomontanus, Avrupa astronomisinin İslam mirasıyla kurduğu bağın kilit figürüdür. Arapça kaynaklardan (Battani, Zerkali) ve alet geleneğinden beslenen Regiomontanus, Ephemerides'i ve gözlem aletleriyle Avrupa'nın bilimsel uyanışını hızlandırmıştır. Koleksiyonda Regiomontanus, İslam astronomisinin Avrupa'daki «öğrencisi» ve «devamcısı»dır; bilginin sınırları aşan zincirinin halkasıdır."}, {"id": "physical-asset-50", "slug": "usturlaplar-fiziksel-50-melik-el-esref-in-kendi-eliyle-yaptigi-usturlap-astrolabe-made-by-al-m", "name": "Melik el-Eşref'in Kendi Eliyle Yaptığı Usturlap", "category": "Usturlaplar", "creator": "el-Melik el-Eşref", "has_img": 0, "desc": "Melik el-Eşref'in bizzat imal ettiği usturlap."}, {"id": "physical-asset-51", "slug": "usturlaplar-fiziksel-51-13-yuzyil-arap-modeline-dayanan-usturlap-astrolabe-based-on-an-arab-mo", "name": "13. Yüzyıl Arap Modeline Dayanan Usturlap", "category": "Usturlaplar", "creator": "Arap atölyesi", "has_img": 0, "desc": "13. yüzyıl Arap modeline dayalı olarak üretilmiş rekonstrüksiyon."}, {"id": "physical-asset-52", "slug": "usturlaplar-fiziksel-52-semsedd-n-muhammed-es-saff-r-in-usturlabi-astrolabe-by-shamseddin-muha", "name": "Şemseddîn Muhammed eş-Şaffâr'ın Usturlabı", "category": "Usturlaplar", "creator": "Şemseddîn Muhammed eş-Şaffâr", "has_img": 0, "desc": "Şaffâr ailesinin 15. yy geleneğinden günümüze ulaşan beş usturlaptan biri."}, {"id": "physical-asset-53", "slug": "usturlaplar-fiziksel-53-muhammed-muk-m-el-yezd-nin-usturlabi-astrolabe-made-by-muhammad-mukim-", "name": "Muhammed Mukim el-Yezdi'nin Usturlabı (Astrolabe made by Muhammad Mukim al-Yazdi for Shah Abbas II)", "category": "Usturlaplar", "creator": "Muhammed Mukim el-Yezdi", "has_img": 0, "desc": "Muhammed Mukim el-Yezdi imzalı bu usturlap, Safevi dönemi İran alet yapımını temsil eder. Zarif ajurlu örümceği ve hat sanatıyla işlenmiş kitabeleri, usturlabın yalnız bir bilim aleti değil, aynı zamanda bir sanat nesnesi olduğunu gösterir. Yezdi ekolü, klasik usturlap geleneğinin son büyük okullarındandır."}, {"id": "physical-asset-54", "slug": "usturlaplar-fiziksel-54-sultan-ii-bayezid-i-cin-i-mal-edilen-usturlap-astrolabe-manufactured-f", "name": "Sultan II. Bayezid İçin İmal Edilen Usturlap (Astrolabe manufactured for Sultan Beyazid II)", "category": "Usturlaplar", "creator": "Osmanlı atölyesi", "has_img": 0, "desc": "1680 tarihli bu Osmanlı usturlabı, klasik geleneğin Osmanlı topraklarındaki geç ama yetkin bir örneğidir. Cami muvakkithanelerinde namaz vakitlerinin belirlenmesi ve astronomi eğitimi için kullanılan bu aletler, Osmanlı bilim hayatının sürekliliğini gösterir. Parça, 17. yüzyılda usturlabın hala canlı olduğunun maddi kanıtıdır."}, {"id": "physical-asset-55", "slug": "usturlaplar-fiziksel-55-i-spanyol-gotik-tarzi-usturlap-astrolabe-based-on-a-spanish-gothic-ins", "name": "İspanyol-Gotik Tarzı Usturlap (Astrolabe based on a Spanish-Gothic instrument from the 14th century)", "category": "Usturlaplar", "creator": "İspanyol-Gotik atölye", "has_img": 0, "desc": "14. yüzyıl İspanyol-Gotik usturlabı, Endülüs geleneğini devralan Latin Hristiyan atölyelerinin ürünüdür. Kürsi formu ve gravür üslubunda Gotik estetik görülür; ancak matematiksel iskelet tamamen İslam kökenlidir. Bu alet, usturlabın İslam dünyasından Avrupa'ya «tercüme» edilişinin simgesidir."}, {"id": "physical-asset-56", "slug": "usturlaplar-fiziksel-56-martin-brunold-yapimi-avrupa-usturlabi-astrolabe-made-by-martin-brunol", "name": "Martin Brunold Yapımı Avrupa Usturlabı", "category": "Usturlaplar", "creator": "Martin Brunold", "has_img": 0, "desc": "Brunold atölyesinin Avrupa usturlabı rekonstrüksiyonu."}, {"id": "physical-asset-57", "slug": "usturlaplar-fiziksel-57-gualterus-arsenius-atolyesi-usturlabi-astrolabe-by-the-workshop-of-gua", "name": "Gualterus Arsenius Atölyesi Usturlabı", "category": "Usturlaplar", "creator": "Gualterus Arsenius", "has_img": 0, "desc": "Arsenius atölyesinin 1570 tarihli usturlabı."}, {"id": "physical-asset-58", "slug": "usturlaplar-fiziksel-58-erasmus-habermel-usturlabi-astrolabe-made-by-erasmus-habermal", "name": "Erasmus Habermel Usturlabı", "category": "Usturlaplar", "creator": "Erasmus Habermal", "has_img": 0, "desc": "Habermel atölyesinin Avrupa usturlabı."}, {"id": "physical-asset-59", "slug": "astronomi-fiziksel-59-muhammed-b-hud-yl-in-evrensel-diski-universal-disc-by-muhammad-ibn-hud", "name": "Evrensel Disk (Muhammed b. Muhammed b. Hüzeyl)", "category": "Astronomi", "creator": "Muhammed b. Muhammed b. Hüzeyl", "has_img": 0, "desc": "İbn Hüzeyl'in Evrensel Diski, Endülüs astronomi ekolünün (özellikle ez-Zerkâlî'nin Toledo'daki mirasının) Mağrip ve Kuzey Afrika'daki yankısıdır. 13. ve 14. yüzyıllarda Endülüs'ün Hristiyan krallıklar tarafından fethedilmesiyle birlikte, İslami bilimsel atölyeler Kuzey Afrika'ya ve İspanyol-Arap (Mudejar) atölyelerine göç etmiştir. İbn Hüzeyl, bu geçiş döneminin en önemli alet yapımcısıdır. Onun ürettiği diskler, klasik usturlapların hantal 'ana gövde' (mater) yapısını reddeder; bunun yerine tek bir pirinç plaka üzerine, ekvatoral ve ekliptik koordinat sistemlerini iç içe geçen eğrilerle kazırdı. Bu diskin üzerine yerleştirilen döner bir 'örümcek' (ankebut) ve kayar bir şakül (ip) yardımıyla, bir denizci veya astronom, Akdeniz'den Hint Okyanusu'na kadar her yerde namaz vakitlerini, kıble yönünü ve gezegen konumlarını hesaplayabiliyordu. İbn Hüzeyl'in diskleri, Kastilya Kralı X. Alfonso'nun meşhur 'Libros del saber de astronomia' (Astronomi Bilgisi Kitapları) adlı eserine kaynaklık etmiş, Avrupa'da Rönesans astronomisinin doğuşuna zemin hazırlayan 'kayıp halka' olmuştur."}, {"id": "physical-asset-60", "slug": "astronomi-fiziksel-60-muhammed-b-fut-h-el-ham-ir-nin-evrensel-diski-universal-disc-safiha", "name": "Evrensel Disk (Muhammed b. Futûh el-Hamâ'irî)", "category": "Astronomi", "creator": "Muhammed b. Futûh el-Hamâ'irî", "has_img": 0, "desc": "Hamâ'irî'nin evrensel diski, ünlü Endülüs ustasının evrensel plaka geleneğinde de eser verdiğini gösterir. Küresel astronomi problemlerini tek plakada çözen bu disk, çok plakalı usturlaba Endülüs'ün cevabıdır. Safiha zerkaliyye geleneğinin rafine bir örneğidir."}, {"id": "physical-asset-61", "slug": "astronomi-fiziksel-61-libros-del-saber-de-astronomia-dan-evrensel-disk-universal-disc-from-a", "name": "Evrensel Disk (Libros del saber)", "category": "Astronomi", "creator": "Kastilya Kralı X. Alfonso", "has_img": 0, "desc": "Kastilya Kralı X. Alfonso'nun 1277'de derlettiği Libros del saber de astronomia, ez-Zerkâlî'nin evrensel diskinin (Saphaea) Arapça'dan Kastilya İspanyolcasına ve Latince'ye çevrilerek Avrupa'ya mal edildiği anıtsal eserdir. Bu rekonstrüksiyon, Toledo Çeviri Okulu'nun çok kültürlü (İslam, Hristiyan, Yahudi) entelektüel işbirliğinin somut bir ürünüdür. Disk üzerindeki İspanyolca ve Latince terminoloji, İslam astronominin teknik dilinin Avrupa dillerine nasıl kazındığını gösterir. Koleksiyonda bu rekonstrüksiyon, iki kültürün aynı gökyüzünü okumak için nasıl işbirliği yaptığının; bilimin sınırları ve dinleri aşan evrensel doğasının belgesidir."}, {"id": "physical-asset-62", "slug": "usturlaplar-fiziksel-62-i-bn-es-serr-c-in-evrensel-usturlabi-universal-astrolabe-by-ahmad-ibn-", "name": "İbn eş-Serrâc'ın Evrensel Usturlabı", "category": "Usturlaplar", "creator": "Ahmed b. es-Serrâc", "has_img": 0, "desc": "Evrensel Usturlap, İslam astronomi aletleri tarihinin 'yazılım standardizasyonu' konusundaki en büyük arayışlarının somut bir sonucudur. Klasik usturlaplar, her bir coğrafi enlem için ayrı ayrı kazınmış iç disklere ihtiyaç duyardı; bu da seyahat eden alimler için ciddi bir lojistik yüktü. 11. yüzyılda ez-Zerkâlî'nin teorize ettiği 'evrensel disk' fikri, 14. yüzyılda Şamlı usta Ahmed b. es-Serrâc tarafından mekanik ve metalürjik bir başyapıta dönüştürülmüştür. es-Serrâc'ın usturlaplarında, ekvatoral ve ufki projeksiyonları aynı anda barındıran, karmaşık dişli ve kayar mekanizmalarla donatılmış iç diskler bulunur. Kullanıcı, aletin dışındaki bir ayar düğmesiyle kendi bulunduğu enlemi 'seçer' ve aletin içindeki trigonometrik ağ (mukantaralar) otomatik olarak o enleme göre hizalanırdı. Bu alet, Memlük saraylarında diplomatik hediyeler olarak da kullanılmış, İslam dünyasının bilimsel üstünlüğünü Avrupa elçilerine gösteren birer 'teknolojik güç gösterisi' işlevi görmüştür. es-Serrâc'ın hayatta kalan nadir eserleri, bugün dünya müzelerinde İslam metal işçiliğinin (hâkkâklık) ulaşılmaz zirveleri olarak sergilenmektedir."}, {"id": "physical-asset-64", "slug": "usturlaplar-fiziksel-64-el-b-r-n-nin-kuresel-usturlabi-the-spherical-astrolabe-by-al-biruni", "name": "el-Bîrûnî'nin Küresel Usturlabı", "category": "Usturlaplar", "creator": "Ebû Reyhân el-Bîrûnî", "has_img": 0, "desc": "Câbir b. Sinan el-Harrânî'nin küresel usturlabı, düzlem usturlabın üç boyutlu karşılığı olarak gök küresini döner bir küre üzerine izdüşürür. Mecra kadranıyla donatılan bu alet, İslam alet yapımı geleneğinin en özgün tasarımlarındandır. Küresel usturlap, 3./9. yüzyıl astronomlarının matematiksel yaratıcılığının pirince dökülmüş kanıtıdır."}, {"id": "physical-asset-65", "slug": "usturlaplar-fiziksel-65-el-marr-kus-nin-kuresel-usturlabi-spherical-astrolabe-of-al-marrakusi", "name": "el-Marrâkuşî'nin Küresel Usturlabı", "category": "Usturlaplar", "creator": "Hasan el-Marrâkuşî", "has_img": 0, "desc": "İbn el‑Heysem'in «âlet el‑inkâs» (yansıma aleti), düzlem, küresel, silindirik ve konik aynalarda yansıma yasalarını deneysel olarak ölçen bir optik laboratuvarıdır. Bu alet, aynı zamanda Avrupa'da «Problema Alhazeni» (Alhazen's Problem) olarak bilinen ünlü geometri probleminin çözümünde kullanılmıştır: «Verilen bir noktadan çıkan ışığın, küresel bir aynadan yansıyarak başka bir noktaya ulaşması». Bu problem, 4. dereceden denklemlere götürmüş; Avrupa'da Fermat, Huygens ve l'Hôpital gibi dev matematikçileri yüzyıllarca meşgul etmiştir. İbn el‑Heysem'in aleti, yalnız optik değil, aynı zamanda cebir ve konik kesitler geometrisinin de pratik laboratuvarıdır. Koleksiyonda bu düzenek, İslam‑Avrupa matematik diyaloğunun en kalıcı düğüm noktasını temsil eder; bir optik aleti, aslında bir denklem çözme makinesidir."}, {"id": "physical-asset-66", "slug": "usturlaplar-fiziksel-66-alfonso-nun-kuresel-usturlabi-spherical-astrolabe-alfonso", "name": "X. Alfons Küresel Usturlabı", "category": "Usturlaplar", "creator": "Kastilya Kralı X. Alfonso", "has_img": 0, "desc": "Kastilya Kralı X. Alfons'un 1277 civarında derlettiği Libros del saber de astronomia, İslam astronomisinin Avrupa'ya aktarılmasındaki en kritik köprüdür. Eserdeki sabit yıldız kataloğu, eş‑Şüfî'nin eserinin Kastilyaca serbest çevirisidir; ez‑Zerkâlî'nin evrensel diski (saphaea) ve İslam usturlapları ayrıntılı olarak tarif edilir. Toledo Çeviri Okulu'nun çok kültürlü işbirliğinin ürünüdür. Koleksiyonda bu eser, iki kültürün aynı gökyüzünü okumak için nasıl işbirliği yaptığının; Avrupa Rönesans'ını hazırlayan teknik altyapının belgesidir."}, {"id": "physical-asset-68", "slug": "usturlaplar-fiziksel-68-1070-1660-tarihli-kuresel-usturlap-spherical-astrolabe-1070-1660", "name": "Küresel Usturlap (17. yy)", "category": "Usturlaplar", "creator": "Safevî atölyesi", "has_img": 0, "desc": "17. yüzyıl Safevî yapımı; İslam dünyasında geleneksel aletlerin hâlâ živа olduğunun kanıtı."}, {"id": "physical-asset-70", "slug": "astronomi-fiziksel-70-al-b-es-sih-b-in-sinus-kadrani-sine-quadrant-made-by-ali-b-al-sihab", "name": "'Alî b. eş-Şihâb'ın Sinüs Kadranı", "category": "Astronomi", "creator": "Ali b. eş-Şihâb", "has_img": 0, "desc": "Muhammed b. el-Guzûlî kazıması sinüs kadranı."}, {"id": "physical-asset-71", "slug": "astronomi-fiziksel-71-magrip-sinus-kadrani-sine-quadrant-from-the-magrib", "name": "Mağrip Sinüs Kadranı (Sine Quadrant from the Magrib)", "category": "Astronomi", "creator": "İslam muvakkit geleneği", "has_img": 0, "desc": "Mebsut (uzanmış/tanjant) ve menküs (ters/kotanjant) çizgili kadranlar, İslam matematikçilerinin trigonometriyi bağımsız bir bilim dalı olarak kurmalarının pratik meyveleridir. Bu kadranlar, dikey bir çubuğun (gnomon) gölgesinin uzunluğunu, çubuğun boyuna oranlayarak güneş yüksekliğini ve dolayısıyla namaz vakitlerini hesaplamayı sağlar. Yunanlıların «kiriş» (chord) fonksiyonunu terk edip modern sinüs, kosinüs, tanjant ve kotanjant fonksiyonlarını geliştiren İslam bilginleri (el-Battani, el-Vefa), bu fonksiyonları pirinç kadranların üzerine kazıyarak «analog bilgisayarlar» yaratmışlardır. Koleksiyonda bu kadran, matematiğin soyut formüllerden çıkıp, müezzinin ezan vaktini belirlediği somut bir araca dönüştüğü eşiktir."}, {"id": "physical-asset-72", "slug": "astronomi-fiziksel-72-cift-kadranli-sekk-ziyye-a-sakkaziya-with-double-quadrant", "name": "Çift Kadranlı Şekkâziyye", "category": "Astronomi", "creator": "Cemâleddîn el-Merîdînî", "has_img": 0, "desc": "«Şakkâziyye» (veya Şakkâzîya), İslam astronomisinin en sofistik stereografik projeksiyon çözümlerinden biridir. Farklı enlemler için ayrı ayrı plaka (tabak) taşıma zorunluluğunu ortadan kaldıran bu evrensel disk/usturlap, tek bir «evrensel plaka» üzerinde tüm enlemlerdeki ufuk ve saat eğrilerini matematiksel bir sentezle birleştirir. Bu alet, ez-Zerkâlî'nin evrensel disk geleneğinin 14. yüzyıldaki (özellikle İbn eş-Şâtir ve Şam okulu) olgunlaşmış halidir. Şakkâziyye, kullanıcının coğrafyadan bağımsız olarak astronomik problemleri çözmesini sağlayan bir «analog bilgisayar»dır. Koleksiyonda bu alet, İslam matematiğinin projeksiyon geometrisindeki üstünlüğünün; pirinç üzerine kazınmış evrensel bir dilin kanıtıdır."}, {"id": "physical-asset-73", "slug": "astronomi-fiziksel-73-avrupa-tarzi-cift-kadran-double-quadrant", "name": "Avrupa Tarzı Çift Kadran", "category": "Astronomi", "creator": "Avrupa atölyesi (Arap model)", "has_img": 0, "desc": "Müeyyededîn el-Urdî'nin Merâğa Rasathanesi için tasarladığı «Çift Kadranlı Alet» (el-âle zât er-rub'ayn), rasathane pratiğindeki «eşzamanlılık» problemini çözen dahiyan bir mekanizmadır. İki ayrı kadranı ve nişangâhı tek bir merkezi eksen üzerinde birleştiren bu alet, iki gözlemcinin aynı anda farklı iki gök cismini (örneğin Ay ve bir referans yıldızı) veya aynı cismin farklı parametrelerini gözlemleyerek veri çaprazlaması yapmasını sağlar. Bu, teleskop öncesi çağda gözlem hatasını (paralaks ve atmosferik kırılma) minimize etmenin en etkili yoluydu. el-Urdî'nin bu buluşu, Merâğa ekolünün «takım çalışması» ve «sistematik veri üretimi» felsefesinin somut bir yansımasıdır. Koleksiyonda bu alet, bilimin bireysel bir çaba olmaktan çıkıp, kurumsal ve senkronize bir mühendislik disiplinine evrildiği anın kanıtıdır."}, {"id": "physical-asset-74", "slug": "astronomi-fiziksel-74-peter-apian-in-meteoroskopu-meteoroscope-peter-apian", "name": "Peter Apian'ın Meteoroskopu", "category": "Astronomi", "creator": "Peter Apian", "has_img": 0, "desc": "Johannes de Lineriis'in Abbreviatio instrumenti Campani'si, Campanus ekvatoryumunun Avrupa'daki kısaltılmış uyarlamasıdır. İbn es-Semh ve ez-Zerkâlî'nin Endülüs ekvatoryumlarına uzanan bu zincir, gezegen hesaplamanın Latin Avrupa'da nasıl mekanikleştiğini gösterir. İslam «mekanik bilgisayar» geleneğinin Batı'ya ulaşan halkalarındandır."}, {"id": "physical-asset-76", "slug": "astronomi-fiziksel-76-18-yuzyil-avrupa-kadrani-rekonstruksiyonu-replica-european-18th-centur", "name": "18. Yüzyıl Avrupa Kadranı Rekonstrüksiyonu", "category": "Astronomi", "creator": "Avrupa atölyesi", "has_img": 0, "desc": "Mebsût ve menküs çizgili güneş kadranı (rub'), İslam dünyasının en yaygın zaman ölçme aletidir; gölge skalaları küresel trigonometriye dayanır. Muvakkit geleneği binlerce böyle kadran üretmiş, cami muvakkithaneleri bu aletlerle donatılmıştır. Bu bölüm, kadran tiplerini ve matematik temellerini sergiler."}, {"id": "physical-asset-82", "slug": "astronomi-fiziksel-82-el-hucend-nin-kapsamli-aleti-comprehensive-instrument-by-al-khujandi", "name": "el-Hucendî'nin Kapsamlı Aleti (el-Âle eş-Şâmile)", "category": "Astronomi", "creator": "Ebû Mahmûd el-Hucendî", "has_img": 0, "desc": "Hama'nın (Suriye) Orontes Nehri üzerindeki devasa nâ'ûraları (su dolapları), İslam hidrolik mühendisliğinin ve «Yeşil Devrim»inin en görkemli anıtlarıdır. 20 metreyi aşan çaplarıyla bu ahşap devler, nehrin kinetik enerjisini kullanarak suyu onlarca metre yükseklikteki su kemerlerine (kanat) basar; buradan da şehrin bahçelerini, hamamlarını ve tarım arazilerini beslerdi. Nâ'ûranın çıkardığı ritmik gıcırtı, şehrin «kalp atışı» sayılmış ve şiirlere konu olmuştur. Bu teknoloji, Endülüs üzerinden Avrupa'ya (noria) aktarılarak Akdeniz tarımını dönüştürmüştür. Koleksiyonda nâ'ûra, suyun yalnızca bir nimet değil, mühendislik ile fethedilen bir enerji kaynağı olduğunun; İslam şehirlerinin suyu nasıl bir sanat ve bilim eseri olarak yönettiğinin yaşayan bir hafızasıdır."}, {"id": "physical-asset-85", "slug": "astronomi-fiziksel-85-s-d-al-reis-in-yukseklik-olcum-aleti-instrument-described-by-ali-reis", "name": "Sîdî Alî Reis'in Yükseklik Ölçüm Aleti", "category": "Astronomi", "creator": "Sîdî Alî Reis", "has_img": 0, "desc": "Hint Okyanusu denizciliğinde kullanılan, Yakup Sopası/Kamal geleneğinden yükseklik ölçüm aleti."}, {"id": "physical-asset-87", "slug": "saatler-fiziksel-87-masa-gunes-saatleri-table-sundials", "name": "Masa Güneş Saatleri", "category": "Saatler", "creator": "İslam muvakkit geleneği", "has_img": 0, "desc": "Muvakkithanelerde ve masada kullanılmak üzere tasarlanmış yatay güneş saatleri."}, {"id": "physical-asset-90", "slug": "astronomi-fiziksel-90-yildiz-yuksekliklerini-dakikalarla-olcen-alet-instrument-for-determini", "name": "Yıldız Yüksekliklerini Dakikalarla Ölçen Alet", "category": "Astronomi", "creator": "Michel rekonstrüksiyonu", "has_img": 0, "desc": "Üç ipli gözlem sopası, «Diğer Aletler» bölümünün en özgün düzeneklerindendir: 5°'lik yay uzunluklarını veren derecelendirme skalaları uygun bir sopa üzerine taşınır ve üç ip bu sopaya bağlanır; P kutbuna kurşun ağırlıklı bir ip sabitlenir. Gece kullanımı için güneş alçalım dairelerine başlıca sabit yıldızların deklinasyon daireleri eklenebilir. Michel, aletin kullanımını güneş yüksekliği bulma örneğiyle açıklamıştır. Bu basit ama derin düzenek, ip ve sopanın küresel trigonometriye dönüştüğü andır. Koleksiyonda üç ipli sopa, «yoksul malzeme‑zengin matematik» ilkesinin simgesidir."}, {"id": "physical-asset-99", "slug": "astronomi-fiziksel-99-johannes-schoner-in-organum-uranicum-u-equatorium-by-johannes-schoner", "name": "Johannes Schöner'in Organum Uranicum'u (Equatorium by Johannes Schöner)", "category": "Astronomi", "creator": "Johannes Schöner", "has_img": 0, "desc": "Johannes Schöner'in Opera Mathematica'sındaki ekvatoryumlar, İslam ekvatoryum geleneğinin (Zerkali, Kaşi) Avrupa'daki doğrudan devamıdır. Schöner, gezegen boylamlarını mekanik olarak hesaplayan bu aletleri seri üretimle yaygınlaştırmış; Kopernik'in De revolutionibus'unun ilk baskısını da o hazırlamıştır. Koleksiyonda Schöner, İslam «analog bilgisayar»ının Avrupa'daki üreticisi ve dağıtıcısıdır."}, {"id": "physical-asset-100", "slug": "astronomi-fiziksel-100-baska-bir-kadran-another-quadrant", "name": "Başka Bir Kadran (Another Quadrant)", "category": "Astronomi", "creator": "", "has_img": 0, "desc": "Envanter çapraz eşleştirmesinde karşılığı bulunamayan (BULUNAMADI) kadran kaydı. Manuel inceleme bekliyor."}, {"id": "physical-asset-260", "slug": "cografya-ve-seyrusefer-fiziksel-260-el-i-dr-s-nin-metal-dunya-haritasi-metal-world-map-of-al-idrisi", "name": "el-İdrîsî'nin Metal Dünya Haritası", "category": "Coğrafya ve Seyrüsefer", "creator": "Şerîf el-İdrîsî", "has_img": 0, "desc": "Piri Reis'in 1513 tarihli dünya haritası, kartografya tarihinin en gizemli ve en çok tartışılan belgelerinden biridir. Topkapı Sarayı'nda 1929'da yeniden keşfedilen bu ceylan derisi parşömen, Piri Reis'in kendi notlarına göre, Kolombus'un kayıp Antiller haritası, Portekiz hint okyanusu haritaları, İslam coğrafyacılarının (el-İdrîsî, İbn Mâcid) eserleri ve antik Ptoleme haritalarının sentezidir. Harita, Güney Amerika'nın doğu kıyılarını ve Afrika'nın batısını şaşırtıcı bir doğrulukla gösterirken, güneydeki «Terra Australis» (Güney Kıtası) iddiasıyla tartışma yaratır. Fuat Sezgin'in araştırmaları, bu haritanın «gizemli» değil, aksine İslam denizcilerinin Hint Okyanusu ve Atlantik verilerinin Osmanlı amirali tarafından sistematik bir sentezi olduğunu kanıtlar. Koleksiyonda Piri Reis haritası, küresel keşifler çağının Doğu-Batı bilgi havuzunun Osmanlı'daki zirvesidir."}, {"id": "physical-asset-263", "slug": "cografya-ve-seyrusefer-fiziksel-263-el-kind-nin-yakup-sopasi-jacob-s-staff-by-al-kindi", "name": "el-Kindî'nin Yakup Sopası", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam denizcilik geleneği (el-Kindî)", "has_img": 0, "desc": "el-Kindî'nin Yakup Sopası, denizde enlem belirlemek için kullanılan temel seyir aletlerinden biridir. Düğümlü ip ve ahşap lata ile kutup yıldızının yüksekliği ölçülür. Bu alet, Hint Okyanusu denizciliğinin temel yöntemlerinden biridir ve Yakup Sopası'nın öncüllerinden biridir."}, {"id": "physical-asset-264", "slug": "cografya-ve-seyrusefer-fiziksel-264-yakup-sopasi-dort-aci-skalali-alt-parca-jacob-s-staff-bottom-part", "name": "Yakup Sopası – Dört Açı Skalalı Alt Parça (Jacob's Staff, Bottom Part)", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam Astronomi ve Denizcilik Geleneği (Anonim / Kolektif)", "has_img": 0, "desc": "Balestilha (veya cross-staff), Arap denizcilerinin «Kamal» ve Hint Okyanusu geleneklerinin İber Yarımadası'nda (Portekiz ve İspanya) Avrupalı gemicilerle buluşmasıyla kristalize olmuş bir seyir aletidir. Uzun bir ana cetvel üzerinde kayan çapraz bir latadan (transversal) oluşur; gözlemci cetvelin ucunu gözüne dayar, latanın alt ucu ufku, üst ucu ise Kutup Yıldızı'nı kesene kadar kaydırır. Bu basit trigonometrik düzenek, 15. ve 16. yüzyıllardaki tüm büyük okyanus ötesi keşiflerin (Kolomb, Macellan, Vasco da Gama) kaptan köşkündeki en önemli aletti. Balestilha'nın geometrisi, Levi ben Gerson (Gersonides) ve İslam astronomilerinin trigonometrik cetvellerine dayanır. Koleksiyonda bu alet, coğrafi keşiflerin «matematiksel direksiyonu»dur; dünyanın haritasını yeniden çizen alettir."}, {"id": "physical-asset-265", "slug": "cografya-ve-seyrusefer-fiziksel-265-yakup-sopasi-dort-aci-skalali-alt-parca-jacob-s-staff-bottom-part", "name": "Yakup Sopası – Dört Açı Skalalı Alt Parça (Jacob's Staff, Bottom Part)", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam Astronomi ve Denizcilik Geleneği (Anonim / Kolektif)", "has_img": 0, "desc": "Balestilha (veya cross-staff), Arap denizcilerinin «Kamal» ve Hint Okyanusu geleneklerinin İber Yarımadası'nda (Portekiz ve İspanya) Avrupalı gemicilerle buluşmasıyla kristalize olmuş bir seyir aletidir. Uzun bir ana cetvel üzerinde kayan çapraz bir latadan (transversal) oluşur; gözlemci cetvelin ucunu gözüne dayar, latanın alt ucu ufku, üst ucu ise Kutup Yıldızı'nı kesene kadar kaydırır. Bu basit trigonometrik düzenek, 15. ve 16. yüzyıllardaki tüm büyük okyanus ötesi keşiflerin (Kolomb, Macellan, Vasco da Gama) kaptan köşkündeki en önemli aletti. Balestilha'nın geometrisi, Levi ben Gerson (Gersonides) ve İslam astronomilerinin trigonometrik cetvellerine dayanır. Koleksiyonda bu alet, coğrafi keşiflerin «matematiksel direksiyonu»dur; dünyanın haritasını yeniden çizen alettir."}, {"id": "physical-asset-266", "slug": "astronomi-fiziksel-266-davis-kadrani-davis-quadrant-backstaff", "name": "Davis Kadranı (Davis Quadrant / Backstaff)", "category": "Astronomi", "creator": "İslam / Avrupa denizcilik etkileşimi", "has_img": 0, "desc": "Backstaff (bağlantı sopası), denizcinin güneşe doğrudan bakarak gözlerini kör etmesi riskini ortadan kaldıran devrim niteliğinde bir seyir aletidir: gözlemci güneşe sırtını döner ve aletin casting vane (gölge düşüren parça) üzerinden ufuk çizgisine yansıyan gölgeyi hizalar. Bu «tersine gözlem» prensibi, İslam dünyasındaki gölge ölçme (gnomonik) ve kamal/yakup sopası geleneklerinin Avrupa'daki pratik bir evrimidir. John Davis tarafından 16. yüzyılın sonlarında popülerleştirilse de, optik ve gölge geometrisine dayalı bu yöntem, İslam astronomisinin «azlal» (gölge tabloları) birikiminin denizcilikteki yankısıdır. Koleksiyonda backstaff, astronominin insan bedenini ve duyularını korumaya yönelik ergonomik çözümler ürettiğinin; Doğu-Batı teknolojik diyaloğunun bir halkasıdır."}, {"id": "physical-asset-125", "slug": "usturlaplar-fiziksel-125-vasco-da-gama-nin-deniz-usturlabi-marine-astrolabe", "name": "Vasco da Gama'nın Deniz Usturlabı", "category": "Usturlaplar", "creator": "Portekiz denizcilik geleneği", "has_img": 0, "desc": "Denizcilik aletleri bölümü, Hint Okyanusu'ndan Akdeniz'e İslam seyir biliminin (ilm el‑bahr) araç kutusunu sergiler: kamal (düğümlü ip ve lata), Yakup sopası (balestilha), bağlantı sopası (backstaff), iskandil ve pusula ailesi. Modern araştırmaların gösterdiği gibi, İslam pusula diski sanıldığı gibi rüzgâr gülünden değil, 15 sabit yıldızın doğuş‑batış noktaları ile iki kutbun 32'lik bölümlemesinden doğmuştur; bu disk, Vasco da Gama'nın Roteiro'sunda bile izlenebilir. «Balık formu» iğne, Arap denizcilerinin en yaygın tipidir. Bölüm, açık denizde pozisyon belirlemenin matematik‑astronomi‑zanaat üçlüsüyle nasıl kurulduğunu anlatır; koleksiyonun denizcilik kanadının giriş kapısıdır."}, {"id": "physical-asset-16-1", "slug": "usturlaplar-fiziksel-16-diogo-ribeiro-nun-deniz-usturlabi-marine-astrolabe-of-diogo-ribeiro", "name": "Diogo Ribeiro'nun Deniz Usturlabı", "category": "Usturlaplar", "creator": "Portekiz denizcilik geleneği", "has_img": 0, "desc": "Denizcilik aletleri bölümü, Hint Okyanusu'ndan Akdeniz'e İslam seyir biliminin (ilm el‑bahr) araç kutusunu sergiler: kamal (düğümlü ip ve lata), Yakup sopası (balestilha), bağlantı sopası (backstaff), iskandil ve pusula ailesi. Modern araştırmaların gösterdiği gibi, İslam pusula diski sanıldığı gibi rüzgâr gülünden değil, 15 sabit yıldızın doğuş‑batış noktaları ile iki kutbun 32'lik bölümlemesinden doğmuştur; bu disk, Vasco da Gama'nın Roteiro'sunda bile izlenebilir. «Balık formu» iğne, Arap denizcilerinin en yaygın tipidir. Bölüm, açık denizde pozisyon belirlemenin matematik‑astronomi‑zanaat üçlüsüyle nasıl kurulduğunu anlatır; koleksiyonun denizcilik kanadının giriş kapısıdır."}, {"id": "physical-asset-21-1", "slug": "usturlaplar-fiziksel-21-portekiz-deniz-usturlabi-marine-astrolabe-16th-century", "name": "Portekiz Deniz Usturlabı", "category": "Usturlaplar", "creator": "Portekiz denizcilik geleneği", "has_img": 0, "desc": "Denizcilik aletleri bölümü, Hint Okyanusu'ndan Akdeniz'e İslam seyir biliminin (ilm el‑bahr) araç kutusunu sergiler: kamal (düğümlü ip ve lata), Yakup sopası (balestilha), bağlantı sopası (backstaff), iskandil ve pusula ailesi. Modern araştırmaların gösterdiği gibi, İslam pusula diski sanıldığı gibi rüzgâr gülünden değil, 15 sabit yıldızın doğuş‑batış noktaları ile iki kutbun 32'lik bölümlemesinden doğmuştur; bu disk, Vasco da Gama'nın Roteiro'sunda bile izlenebilir. «Balık f
