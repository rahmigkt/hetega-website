<style>
:root{--ink:#3c4654;--paper:#fdfcf9;--paper-light:#faf9f6;--line:#e2e2e2;--brass:#b6874f;--brass-deep:#8a6238;--card-bg:#ececec;--muted:#6b7280;--green:#3f7d4f;}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper-light);color:var(--ink);font-family:"Inter",sans-serif;}
.site-header{display:flex;align-items:center;padding:.9rem 5vw;border-bottom:1px solid var(--line);background:var(--paper);}
.site-header .brand{display:flex;align-items:center;gap:.5rem;color:var(--ink);text-decoration:none;font-family:"Cinzel",serif;font-weight:600;font-size:1.05rem;}
.brand-mark{width:26px;height:26px;border:1px solid var(--brass);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;}
.banner{background:#3c4654;color:#f3ede1;text-align:center;padding:.6rem 1rem;font-size:.78rem;}
.banner strong{color:var(--brass);}
.toolbar{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;padding:1rem 5vw;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;}
.toolbar h1{font-family:"Cinzel",serif;font-size:1.15rem;margin:0;flex:none;}
.toolbar .stat{font-size:.75rem;color:var(--muted);}
.toolbar button{font-family:"Inter",sans-serif;font-size:.75rem;font-weight:700;border:1px solid var(--brass);background:transparent;color:var(--brass-deep);padding:.4rem .8rem;border-radius:4px;cursor:pointer;}
.toolbar button:hover{background:var(--brass);color:#fff;}
.toolbar button.danger{border-color:#a33;color:#a33;}
.toolbar button.danger:hover{background:#a33;color:#fff;}

.match-bar{position:sticky;top:58px;z-index:19;background:var(--brass-deep);color:#fff;padding:.8rem 5vw;display:none;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.match-bar.active{display:flex;}
.match-bar .pair{font-size:.85rem;}
.match-bar .pair b{font-weight:700;}
.match-bar button{background:#fff;color:var(--brass-deep);border:none;font-weight:700;padding:.5rem 1.1rem;border-radius:4px;cursor:pointer;font-size:.8rem;}
.match-bar button.clear{background:transparent;color:#fff;border:1px solid #fff;}

.columns{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:70vh;}
@media (max-width:900px){.columns{grid-template-columns:1fr;}}
.col{padding:1.4rem 2vw 4rem;border-right:1px solid var(--line);}
.col:last-child{border-right:none;}
.col h2{font-family:"Cinzel",serif;font-size:1rem;margin:0 0 1rem;padding:0 .5rem;}
.search-box{width:calc(100% - 1rem);margin:0 .5rem 1rem;padding:.6rem .8rem;border:1px solid var(--line);border-radius:4px;font-size:.85rem;font-family:"Inter",sans-serif;}
.card-list{display:flex;flex-direction:column;gap:.6rem;padding:0 .5rem;}
.card{display:flex;gap:.7rem;align-items:flex-start;background:var(--card-bg);border-radius:4px;padding:.8rem .9rem;cursor:pointer;border:2px solid transparent;transition:border-color .1s;}
.card:hover{border-color:var(--line);}
.card.selected{border-color:var(--brass);background:#f3e8d8;}
.card.matched{opacity:.4;pointer-events:none;}
.card input[type=checkbox]{margin-top:.2rem;flex:none;width:16px;height:16px;accent-color:var(--brass-deep);}
.card .info h3{font-family:"Cinzel",serif;font-weight:600;font-size:.88rem;margin:0 0 .3rem;line-height:1.3;}
.card .info .meta{font-size:.68rem;color:var(--brass-deep);font-weight:700;margin-bottom:.25rem;}
.card .info p{font-family:"EB Garamond",serif;font-size:.8rem;color:#4a4640;margin:0;line-height:1.45;}
.card .badge-matched{font-size:.62rem;font-weight:700;color:var(--green);text-transform:uppercase;}

.matches-section{padding:1.5rem 5vw 3rem;background:var(--paper);border-top:2px solid var(--brass);}
.matches-section h2{font-family:"Cinzel",serif;font-size:1.1rem;margin:0 0 1rem;}
.matches-table{width:100%;border-collapse:collapse;font-size:.8rem;}
.matches-table th,.matches-table td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--line);}
.matches-table th{font-size:.68rem;text-transform:uppercase;color:var(--muted);font-weight:700;}
.matches-table button{font-size:.68rem;border:1px solid #a33;color:#a33;background:transparent;border-radius:3px;padding:.2rem .5rem;cursor:pointer;}
.empty-note{color:var(--muted);font-size:.82rem;padding:1rem .5rem;}
</style>

<script>
const YENI = [{"id": "a002", "slug": "yeni-a002-pusula-kardan-sistemi", "title": "Pusula (Kardan Sistemi)", "creator": "İslam Denizcilik Geleneği (Anonim / Kolektif)", "kisa": "Denizcilikte pusula/«kardan» sistemi; geminin yalpalanmasına rağmen iğnenin sabit kalmasını sağlayan manyetik yön bulma aleti.", "uzun": "İslam denizcilik geleneğinde pusula, yalnızca bir yön bulma aracı değil, aynı zamanda karmaşık bir navigasyon sisteminin merkezinde yer alan bir teknolojidir. 'Kardan' (gimbal) sistemi, iç içe geçmiş halkalar aracılığıyla pusula iğnesinin geminin her türlü hareketine (yalpa, baş-kıç vurma) rağmen yatay düzlemde sabit kalmasını sağlıyordu. Bu mekanik çözüm, İslam mühendisliğinin pratik dehasının en parlak örneklerinden biridir. Pusula diski üzerinde 32 kollu rüzgâr gülü bulunuyordu; her kol, belirli bir yönü ve rüzgârı temsil ediyordu. İslam denizcileri, pusulayı yıldız gözlemleri (özellikle Kutup Yıldızı ve Güney Haçı), güneş yüksekliği ölçümleri ve 'kamal' latası ile birlikte kullanarak Hint Okyanusu'nda, Basra Körfezi'nde, Kızıldeniz'de ve Akdeniz'de binlerce kilometrelik seyirler gerçekleştirmişlerdir. Bu teknoloji, 12.-13. yüzyıllarda Akdeniz üzerinden İtalyan ve İspanyol denizcilerine aktarılmış, ardından Portekiz ve İspanyol keşif yolculuklarının vazgeçilmez aracı olmuştur. Vasco da Gama'nın 1498'de Hindistan'a ulaşması, büyük ölçüde İslam denizcilik geleneğinden devralınan bu navigasyon teknolojisine dayanmaktadır."}, {"id": "a025", "slug": "yeni-a025-idrar-muayene-kabi", "title": "İdrar Muayene Kabı (Matula)", "creator": "İslam Teşhis Geleneği (Üroskopi)", "kisa": "Hastanın idrarının rengine, tortusuna ve berraklığına bakarak (üroskopi) humoral dengesizlikleri ve organ hastalıklarını teşhis etmekte kullanılan, özel formlu cam kaplar.", "uzun": "İdrar Muayene Kabı (Matula / Ânîe), Orta Çağ tıbbının 'klinik laboratuvarı' işlevi gören ve hekimin en mahrem teşhis aracı olan cam kaptır. Kan tahlili veya röntgen öncesi çağda, vücut içindeki metabolik süreçleri gözlemlemenin tek yolu idrardı (üroskopi). İslam hekimleri (ve ardından Avrupa'daki hekimler), hastalardan getirdilen idrarı bu özel, dibi yuvarlak ve boynu uzun cam kaplara (matula) boşaltır ve kabı güneş ışığına karşı tutarak sıvının rengini, tortusunun (sediment) hangi seviyede çöktüğünü incelerlerdi. İbn Sînâ, el-Kânûn'da idrarın 20'den fazla renk tonunu ve bunların hangi organın (karaciğer, dalak, böbrek) iflas ettiğine dair işaretleri listeler. Daha da ilginci, İslam hekimleri 'karıncaların idrar kabının etrafına üşüşmesi' veya 'idrarın tadının tatlı olması' durumunu kaydederek, diyabeti (şeker hastalığını / diyabetus mellitus) tarihte ilk kez metabolik bir hastalık olarak teşhis etmişlerdir. Bu cam kaplar, Orta Çağ minyatürlerinde hekimin elinde, bilimin ve otoritenin yegâne sembolü olarak resmedilmiştir."}, {"id": "a030", "slug": "yeni-a030-konik-kesitler-pergeli", "title": "Konik Kesitler Pergeli (el-Berkâr et-Tâmm)", "creator": "Ebû Sehl el-Kûhî", "kisa": "Sadece daire değil; elips, parabol ve hiperbol gibi konik kesitleri mekanik olarak ve sürekli bir hareketle çizebilen, optik ve astronomi aletlerinin yapımını mümkün kılan 'mükemmel pergel'.", "uzun": "Konik Kesitler Pergeli (el-Berkâr et-Tâmm), Ebû Sehl el-Kûhî'nin geometri ve mekanik tarihine yaptığı en büyük katkıdır. Antik Çağ'dan beri pergel yalnızca 'daire' çizmek için kullanılan sabit yarıçaplı bir aletti. Ancak İslam optikçileri (İbn el-Heysem) ve astronomları, ışığı tek bir odak noktasına toplamak için 'parabolik' aynalara ve merceklerine ihtiyaç duyuyorlardı. Parabolü elle veya yaklaşık eğrilerle çizmek ise optik sapmalara (aberasyon) yol açıyordu. el-Kûhî, sabit bir eksen, kayar bir mafsal ve değişken bir yarıçap kolu içeren mekanik bir pergel tasarlayarak, matematiksel olarak kusursuz elips, parabol ve hiperbollerin fiziksel olarak çizilmesini sağladı. Bu 'mükemmel pergel', teorik matematiğin (Apollonius'un konikleri) pratik mühendisliğe (ayna ve mercek taşlama tezgahlarına) doğrudan entegre edildiği anı temsil eder. el-Kûhî'nin bu aleti, İslam dünyasındaki parabolik yakıcı aynaların ve rasathanelerdeki hassas astrolap/ekvatoryum disklerinin üretilmesindeki gizli kahramandır. Rönesans Avrupası'nda Descartes'ın analitik geometriyi kurarken faydalandığı konik kesit literatürü, büyük ölçüde el-Kûhî ve İslam geometrilerinin mirasına dayanır."}, {"id": "a035", "slug": "yeni-a035-hacamat-sisesi", "title": "Hacamat Çekmeni / Şişeleri", "creator": "İslam Tıp ve Farmakoloji Geleneği", "kisa": "Vücuttaki kirli kanı veya fazla sıvıyı vakum yoluyla çekmek için kullanılan; ısı veya pompa ile vakum yaratılan cam, boynuz veya metal hacamat şişeleri.", "uzun": "Hacamat Çekmeni / Şişeleri (Mihcem), İslam tıbbının en yaygın ve en ikonik tedavi araçlarından biridir. Humoral patolojiye (vücuttaki kan, balgam, safra ve sevda dengesine) dayanan İslam tıbbında, hastalıkların bir kısmı vücutta biriken 'fazla veya kirli kanın' atılmasıyla tedavi edilirdi. Bu işlem için hekimler, deriyi hafifçe çizen özel neşterler (mihcem) ve ardından bölgeye yerleştirilen şişeler kullanırlardı. Şişelerin içinde vakum yaratmak için iki yöntem vardı: Ya şişenin içine yanmış bir pamuk atılarak oksijen tüketilir ve şiş hızla deriye kapatılırdı (ateşli hacamat), ya da boynuzdan yapılan şişelerin ucundaki küçük bir delikten hava emilerek vakum yaratılırdı. Cam, boynuz veya bronzdan üretilen bu şişeler, deriyi kabartarak kanın toplanmasını sağlardı. İbn Sînâ, 'el-Kânûn' adlı eserinde hacamatın yapılması gereken mevsimleri, ayın evrelerini ve vücuttaki anatomik noktaları (akupunktur noktalarına benzer şekilde) detaylandırmıştır. Bu şişeler, İslam dünyasındaki eczanelerin ve berber-cerrahların dükkânlarının vazgeçilmez bir parçasıydı ve Avrupa'ya geçerek yüzyıllarca 'kan alma' (bloodletting) geleneğinin temel aracı olarak kullanılmıştır."}, {"id": "a036", "slug": "yeni-a036-flebotomi-bicagi", "title": "Kan Alma (Flebotomi) Bıçağı", "creator": "İslam Tıp Geleneği (İbn Sînâ, ez-Zehrâvî)", "kisa": "Kol, boyun veya şakaktaki venleri (toplar damarları) yararak kontrollü kan almak için kullanılan; ucu sınırlayıcılı, çift ağızlı hassas cerrahi neşterler.", "uzun": "Kan Alma Bıçağı (Mibzara), İslam tıbbının temelini oluşturan 'Humoral Patoloji' (Dört Sıvı Teorisi) pratiğinin en kritik aletidir. İbn Sînâ ve Galen geleneğine göre, hastalıkların büyük bir kısmı vücutta biriken 'fazla veya bozulmuş kanın' atılmasıyla tedavi edilirdi. Ancak damar açmak (flebotomi), hastayı anında ölüme (kanama şokuna) götürebilecek riskli bir işlemdi. İslam cerrahları, bu riski minimize etmek için 'mibzara' adı verilen özel neşterler icat ettiler. Bu bıçakların en dâhiyane özelliği, keskin ucun hemen arkasında bulunan 'sınırlayıcı halka' veya 'çentik'ti. Hekim damarın üzerine bastırdığında, bu sınırlayıcı deriye çarpar ve bıçağın damarı tamamen ikiye kesmesini (transeksiyon) fiziksel olarak engeller; sadece damarın yan duvarında kontrollü bir 'pencere' açardı. İbn Sînâ, el-Kânûn'da flebotominin mevsime, hastanın yaşına, ayın evrelerine ve hangi damardan (örneğin baş ağrısı için şakak, karaciğer hastalığı için sağ kol) kan alınacağına dair katı protokoller belirlemiştir. Bu aletler, 18. yüzyıla kadar Avrupa tıbbında da 'lanset' adıyla standart kan alma aracı olarak kullanılmıştır."}, {"id": "a038", "slug": "yeni-a038-zeytin-koter", "title": "«Zeytin» Koter", "creator": "Ebü'l-Kâsım Halef b. Abbâs ez-Zehrâvî", "kisa": "Zeytin çekirdeği formunda ucu olan koter; göz ve yüz bölgesindeki hassas dağlama işlemleri için tasarlanmış, milimetrik hassasiyette termal cerrahi aleti.", "uzun": "«Zeytin» Koter (Mikvât Zeytüniyye), ez-Zehrâvî'nin et-Taşrîf'inin 30. makalesinde tarif ettiği ve H 1.03 envanter numarasıyla kayıt altına alınan, cerrahi koterizasyon aletlerinin en zarif örneklerinden biridir. Aletin ucu, zeytin çekirdeği formunda şekillendirilmiş olup, bu form yalnızca estetik değil, aynı zamanda fonksiyoneldir: zeytin çekirdeğinin oval ve sivri yapısı, göz kapağı, yüz ve boyun gibi hassas bölgelerde milimetrik dağlama noktaları oluşturmayı mümkün kılar. Koter, pirinç gövdeye paslanmaz çelik uç monte edilerek üretilmiştir; uzunluğu 127 mm'dir. Kullanım tekniği şu şekildeydi: Koter ateşte kızdırılır, ardından hedef dokuya kısa süreli temas ettirilerek (koterizasyon) istenmeyen dokular yakılır veya kanama durdurulurdu. ez-Zehrâvî, bu aletin özellikle 'soğuk karaciğer' (el-kabid el-bârid) tedavisinde, yüz felcinde (lakve) ve göz kapağındaki kıl köklerinin dağlanmasında kullanılmasını önermiştir. Aletin ateşte kızdırılarak sterilize edilebilmesi, İslam cerrahisinin aseptik prensiplere ne denli erken ulaştığının da kanıtıdır. Paris (BnF ar. 2953), Veliyeddin (No. 2491) ve Süleymaniye (Beşirağa 502) yazmalarındaki çizimler, bu aletin Endülüs'ten Bağdat'a kadar geniş bir coğrafyada standart cerrahi ekipman olarak kullanıldığını gösterir."}, {"id": "a045", "slug": "yeni-a045-surme-milleri", "title": "Sürme (Kühl) ve Sürme Milleri", "creator": "İslam Göz Hekimliği Geleneği", "kisa": "Antimon sülfür ve çinko oksit gibi mineralleri toz haline getirip göz kapağı içine uygulamak için kullanılan; ucu yassı veya hafif kabarık cam/metal miller.", "uzun": "Sürme (Kühl) ve Sürme Milleri (Mîl), İslam tıbbının 'koruyucu hekimlik' ve 'kozmetoloji' alanındaki en yaygın ve en zarif uygulamalarından biridir. Çöl ikliminin kavurucu güneşi, kum fırtınaları ve sinekleri, İslam coğrafyasında trahom (göz kapağı enfeksiyonu) ve konjonktivit hastalıklarını salgın haline getirmişti. İslam göz hekimleri (kehhâller), bu soruna karşı kimyasal bir kalkan geliştirdiler: 'Kühl' (antimon sülfür veya kurşun bazlı tozlar). Bu tozlar sadece estetik bir karartma sağlamıyor, aynı zamanda antimikrobiyal etkisiyle enfeksiyonları önlüyor ve güneşin parlaklığını emerek (doğal güneş gözlüğü etkisi) retinayı koruyordu. Bu tozu göze uygulamak için 'mîl' adı verilen, cam, bronz veya fildişinden oyulmuş ince miller kullanılırdı. Milin ucu, konjonktivayı (göz iç zarını) çizmeyecek şekilde zımparalanmış, hafif kabarık veya yassı bir formdaydı. Hekimler, milin ucunu gül suyu veya zeytinyağına batırıp toza değdirerek göz kapağının içine nazikçe sürerlerdi. Bu mil kutuları (mikvale), İslam arkeolojisinde en sık bulunan günlük tıp objeleridir ve modern göz damlası aplikatörlerinin tarihsel atasıdır."}, {"id": "a047", "slug": "yeni-a047-orak-mincel", "title": "Orak (Mincel)", "creator": "Halîfe b. Ebü’l-Mehâsin el-Halebî", "kisa": "Göz kapağı yapışıklıklarını, tavşan-göz (şifre) rahatsızlıklarını ve konjonktiva tümörlerini kesmek için kullanılan, hilal/orak formundaki mikro-cerrahi bıçak.", "uzun": "Orak (Mincel), 13. yüzyılın büyük Halepli göz hekimi Halîfe el-Halebî'nin 'el-Kâfî fî el-Kuhl' adlı eserinde detaylandırdığı ve oftalmoloji tarihinin en hassas aletlerinden biri olan mikro-cerrahi bıçaktır. Göz, insan vücudunun en hassas ve hata kabul etmeyen organıdır; bu nedenle İslam göz hekimleri (kehhâller), standart cerrahi bıçaklar yerine, korneaya ve göz kapağı dokusuna zarar vermeyecek, hilal veya orak (mincel) formunda özel bıçaklar geliştirmişlerdir. Bu orak, özellikle 'tavşan-göz' (lagophthalmos) denilen göz kapağının tam kapanamaması rahatsızlıklarında, göz kapağı yapışıklıklarında (simblefaron) ve konjonktiva üzerindeki et benlerinin (pterjium) sıyrılmasında kullanılırdı. Bıçağın içbükey keskin yüzeyi, hekimin göz küresine zarar vermeden sadece istenen doku tabakasını kazımasına veya kesmesine olanak tanıyordu. el-Halebî'nin Paris ve İstanbul yazmalarındaki çizimleri, bu aletin dönemin metallurji ve zanaat ustalığının tıbbi bir gereksinimle nasıl mükemmel bir şekilde birleştiğini gösterir."}, {"id": "a048", "slug": "yeni-a048-katarakt-ignesi", "title": "Katarakt İğnesi / Neşteri", "creator": "Ammâr b. Alî el-Mevsılî", "kisa": "Ammâr b. Ali'nin icat ettiği; kataraktı (göz perdesini) içi boş metal bir iğne ve vakum/emme yoluyla gözden dışarı çıkaran devrim niteliğinde oftalmolojik alet.", "uzun": "Katarakt İğnesi ve Emme Yöntemi, İslam tıp tarihinin en büyük cerrahi devrimlerinden biridir. 11. yüzyıla kadar katarakt (göz merceğinin bulanıklaşması) tedavisi, Antik Yunan ve Hint geleneğinden gelen 'couching' (keskin bir iğneyle kataraktı gözün arkasına, camur cisme doğru itme) yöntemiyle yapılırdı. Bu yöntem körlüğü giderse de, katarakt gözün içinde kalmaya devam eder ve sıklıkla glokom veya enfeksiyonla sonuçlanırdı. Musullu hekim Ammâr b. Alî, bu tehlikeli yöntemi reddetti ve tarihte ilk kez içi boş metal bir iğne tasarladı. Bu iğneyi korneadan içeri sokuyor, kataraktın üzerine yerleştiriyor ve dışarıdaki bir şırınga/tulum mekanizmasıyla vakum yaratarak bulanık dokuyu gözün içinden 'emerek' dışarı çıkarıyordu. Ammâr, bu devrim niteliğindeki ameliyatı 'Kitâb el-Müntehab' adlı eserinde detaylıca anlatır ve 'bu yöntemi benden önce kimse yapmamıştır' diyerek icadının özgünlüğünü vurgular. Bu içi boş iğne ve aspirasyon prensibi, 19. yüzyılda modern katarakt cerrahisinin (fakoemülsifikasyon) temelini oluşturacaktır."}, {"id": "a050", "slug": "yeni-a050-dikis-igneleri", "title": "Cerrahi Dikiş İğneleri ve İpleri", "creator": "İslam Cerrahi Geleneği", "kisa": "Bağırsak yırtılmaları ve derin doku yaralarını dikmek için kullanılan; kavisli çelik iğneler ve koyun bağırsağı veya ipekten bükülmüş steril iplikler.", "uzun": "Cerrahi Dikiş İğneleri ve İpleri, İslam cerrahisinin doku mühendisliğindeki inceliğinin bir göstergesidir. Orta Çağ'da bağırsak delinmeleri (örneğin bıçaklanma veya fıtık boğulması sonucu) neredeyse her zaman peritonit (karın zarı iltihabı) ve ölümle sonuçlanırdı. İslam hekimleri, bu yaraları kapatmak için iki devrim niteliğinde malzeme kullandılar: İlki, dokunun içinden rahatça geçebilen 'kavisli' (yarım daire) metal iğnelerdi. İkincisi ise dikiş ipliğiydi. ez-Zehrâvî ve İbn Sînâ, ipek ipliklerin yanı sıra, koyun veya kedi bağırsağından elde edilen ve zamanla vücut tarafından emilerek yok olan (absorbable) iplikler kullandılar; bu, modern 'catgut' ipliklerin doğrudan atasıdır. Daha da ilginci, 'karınca başı' (veya karınca gövdesi) kullanımıdır: Hekimler, yaranın iki yakasını birbirine yaklaştırmak için büyük karıncaları yara üzerine yerleştirir, karınca deriyi ısırdığında başını koparırlardı; karınanın güçlü çeneleri, yara iyileşene kadar doğal bir 'dikiş klipsi' (sütür zımbası) işlevi görürdü. Bu biyouyumlu ve yaratıcı çözümler, İslam tıbbının doğayı ne denli iyi gözlemlediğinin kanıtıdır."}, {"id": "a055", "slug": "yeni-a055-dis-cekme-penseleri", "title": "Diş Çekme Penseleri (Minza)", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Çürük azı dişlerini ve kırık kökleri, çene kemiğine zarar vermeden kavrayıp çekmek için tasarlanmış, farklı uç formlarına sahip metal dişçi penseleri.", "uzun": "Diş Çekme Penseleri (Minza'), ez-Zehrâvî'nin et-Taşrîf'inde detaylandırdığı ve modern diş hekimliğinin temel aletleri olan forceps'lerin doğrudan atasıdır. Orta Çağ'da diş çekimi, genellikle berberler veya demirciler tarafından kaba kuvvet kullanılarak (çekiç ve kerpetenle) yapılırdı; bu da çene kırıklarına ve ciddi enfeksiyonlara yol açıyordu. ez-Zehrâvî ise diş hekimliğini tıbbi bir disiplin olarak ele almış ve her diş tipinin (kesici, köpek, azı) anatomik yapısına uygun, farklı açılarda ve kavrama yüzeylerinde penseler tasarlamıştır. Özellikle 'cavus' (çürük ve oyulmuş) dişlerin ve diş eti içinde kalan kırık köklerin çekimi için, ucu sivri ve tırtıklı özel penseler (minza' el-cıdr) icat etmiştir. Bu penseler, dişi kökünden kavrayarak, çevre dokuya ve çene kemiğine minimum travmayla dişin çıkarılmasını sağlıyordu. ez-Zehrâvî'nin eserindeki penselerin çizimleri, 14. yüzyılda Avrupa'nın en büyük cerrahı Guy de Chauliac tarafından aynen kopyalanmış ve Avrupa diş hekimliğinin standart aletleri haline gelmiştir."}, {"id": "a057", "slug": "yeni-a057-bademcik-aleti", "title": "Bademcik Ameliyatı Aleti", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Boğazın derinliklerindeki bademcikleri ve polipleri, kanama riskini minimize ederek tek hamlede kavrayıp koparmak için tasarlanmış, perçinli mafsal ve yaylı makas benzeri alet.", "uzun": "Bademcik Ameliyatı Aleti (Âle tuşbihu el-mikaşş), ez-Zehrâvî'nin K.B.B. cerrahisindeki mühendislik dehasını gösteren 320 mm'lik devasa ve hassas bir alettir. Bademcik iltihapları (tonsillit) ve boğazdaki et benleri (polipler), Orta Çağ'da solunumu ve yutkunmayı engelleyen, hatta boğulmaya yol açan ciddi hastalıklardı. Ancak boğazın dar, karanlık ve damar açısından zengin yapısı, standart bıçaklarla müdahaleyi ölümcül (kanamalı) kılıyordu. ez-Zehrâvî, bu sorunu çözmek için 'makas benzeri' (tuşbihu el-mikaşş) bir alet icat etti. Bu aletin uzun sapları, hekimin elinin hastanın ağzının dışında kalmasını sağlarken; perçinli mafsal yapısı, ucundaki kavrayıcı çenelerin boğazın derinliklerinde hassas bir şekilde açılıp kapanmasına olanak tanıyordu. ez-Zehrâvî, kanama riskini azaltmak için aletin tek bir kararlı hamleyle kapatılmasını ve dokuyu kökünden koparmasını salık verir. Bu mekanik 'snare' (ilmik/kesici) prensibi, 20. yüzyılın modern K.B.B. cerrahisinde kullanılan bademcik ve geniz eti alma aletlerinin birebir atasıdır."}, {"id": "a065", "slug": "yeni-a065-cenin-cengeli", "title": "Cenin Çengeli (Şinnâre)", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Zor doğumlarda veya rahim içinde ölen ceninin tahliyesinde, annenin hayatını kurtarmak için kullanılan, ucu sivri ve kancalı metal doğum aleti.", "uzun": "Cenin Çengeli (Şinnâre), İslam jinekolojisinin ve doğum cerrahisinin en hassas ve en dramatik aletlerinden biridir. Orta Çağ'da zor doğumlar (distosi) veya rahim içinde ölen ceninler, hem anne hem de bebek için ölümcül bir tehlike arz ediyordu. ez-Zehrâvî, bu gibi durumlarda annenin hayatını kurtarmak için 'embriyotomi' (ceninin parçalanarak çıkarılması) tekniklerini ve bu teknikler için özel kancalar (şinnâre) tasarlamıştır. Bu kancalar, ceninin çenesine, koltuk altına veya kafatasına takılarak, dışarıdan kontrollü bir traksiyon (çekme) uygulanmasını sağlıyordu. ez-Zehrâvî, eserinde bu aletin kullanımının ne denli tehlikeli olduğunu vurgular ve 'bu müdahaleyi sadece işinin ehli, deneyimli hekimler yapmalıdır; aksi halde annenin rahim damarlarını yırtarak ölümüne sebep olursunuz' uyarısında bulunur. Bu etik ve teknik uyarılar, İslam tıbbının cerrahi müdahalelerde 'önce zarar verme' (primum non nocere) ilkesine ne denli sadık kaldığını gösterir. Bu kancalar, 19. yüzyıla kadar Avrupa obstetriğinde standart araçlar olarak kullanılmıştır."}, {"id": "a066", "slug": "yeni-a066-kafatasi-matkabi", "title": "Kafatası Matkabı / Trepan (Minkab)", "creator": "ez-Zehrâvî ve Sabuncuoğlu Geleneği", "kisa": "Kafa travmalarında çöken kemik parçalarını temizlemek ve beyin üzerindeki basıncı almak için kullanılan; ucu derinliğe karşı koruyucu halkalarla donatılmış el matkapları.", "uzun": "Kafatası Matkabı (Minkab / Trepan), İslam cerrahisinin nöroşirürji alanındaki ustalığının en riskli ve en hassas kanıtıdır. Savaşlarda veya kazalarda meydana gelen kafa travmalarında, kafatası kemikleri içeri çökerek beyne baskı yapar ve ölümcül sonuçlar doğururdu. ez-Zehrâvî ve yüzyıllar sonra onun izinden giden Sabuncuoğlu, bu kemik parçalarını çıkarmak için 'modiolus' adı verilen, ortasında vida benzeri bir ucu olan döner el matkapları tasarladılar. Ancak bu matkapların en dâhiyane özelliği, ucun etrafına yerleştirilen 'koruyucu halkalar' (sınırlayıcılar) idi. Hekim, kemiğin kalınlığını tahmin ettikten sonra bu halkayı ayarlıyor; matkap kemiği deldiği an, halka kemik yüzeyine çarpıyor ve matkabın daha derine inerek beyni saran zarı (dura mater) yırtmasını fiziksel olarak engelliyordu. Sabuncuoğlu, Cerrâhiyyetü'l-Hâniyye'deki minyatürlerinde bu matkapların nasıl tutulacağını ve hastanın başının nasıl sabitleneceğini resmetmiştir. Bu 'kontrollü derinlik' mekanizması, modern nöroşirürjik matkapların temel güvenlik prensibidir."}, {"id": "a067", "slug": "yeni-a067-epilepsi-koteri", "title": "Epilepsi (Sara) Koteri", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Epilepsi (sara) nöbetlerini ve şiddetli nevraljik ağrıları kontrol altına almak için kafatası ve şakaklardaki belirli sinir noktalarına uygulanan, özel uçlu dağlama aleti.", "uzun": "Epilepsi Koteri (Mikvât eş-şarc), Orta Çağ tıbbının nöroloji alanındaki en cesur ve en tartışmalı müdahalelerinden birinin aracıdır. Antik Çağ'dan beri 'kutsal hastalık' (morbus sacer) olarak bilinen ve şeytan çıkarma ritüellerine maruz kalan epilepsi, İslam hekimleri tarafından biyolojik ve nörolojik bir hastalık olarak ele alınmıştır. ez-Zehrâvî, ilaçlara yanıt vermeyen şiddetli epilepsi nöbetlerinde ve migrenlerde, kafa derisindeki ve şakaklardaki belirli damar ve sinir noktalarını (bugünkü akupunktur ve trigeminal sinir noktalarına benzer bölgeler) kızdırılmış demirle dağlayarak (koterizasyon) nöbetlerin yayılmasını bloke etmeyi denemiştir. Bu aletin ucu, kafa kemini (cranium) delip beyne zarar vermeyecek kadar küt, ancak deriyi ve sinir zarını mühürleyecek kadar sıcak ve sivriydi. Ez-Zehrâvî, bu işlemin ancak 'işinin ehli, anatomiyi bilen' hekimler tarafından yapılmasını, aksi halde hastanın felç geçirebileceğini vurgular. Bu müdahale, modern tıptaki 'vagal sinir uyarımı' veya 'termal lezyon' tedavilerinin ilkel ama mantıksal öncülüdür."}, {"id": "a069", "slug": "yeni-a069-kist-kaziyici", "title": "Kist ve Tümör Kazıyıcı (Mişdâh)", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Deri altındaki kistleri, et benlerini ve kemik yüzeyindeki ölü dokuları, çevre sağlıklı dokuya zarar vermeden kökünden kazıyıp çıkarmak için kullanılan, ucu kavisli cerrahi raspator.", "uzun": "Kist ve Tümör Kazıyıcı (Mişdâh), ez-Zehrâvî'nin genel cerrahi alet setinin en çok yönlü ve en hayati parçalarından biridir. Orta Çağ'da deri altında büyüyen kistler (özellikle saçlı derideki sebze kistleri veya 'kıl kurdu' denilen oluşumlar) ve iyi huylu tümörler, enfekte olup apse oluşturarak hastayı sepsise (kan zehirlenmesi) sürükleyebilirdi. Bıçakla kesmek, kist zarının patlamasına ve içeriğin dokuya yayılarak hastalığın nüksetmesine yol açıyordu. ez-Zehrâvî, bu sorunu çözmek için 'mişdâh' adını verdiği, ucu kaşık veya yassı bir spatula gibi kavislenmiş, kenarları keskinleştirilmiş kazıyıcılar icat etti. Hekim, kistin üzerini küçük bir kesiyle açtıktan sonra bu aleti kistin zarı ile sağlıklı et arasına sokuyor, kavisli hareketlerle kisti 'soyarak' (raspaj) bütünlüğünü bozmadan dışarı çıkarıyordu. Aynı aletin daha büyük ve sert versiyonları, kemik iltihaplarında (osteomyelitis) ölü kemik dokusunu (sekvestr) kazımak için de kullanılırdı. Mişdâh, modern cerrahideki 'Volkmann kaşıkları' ve 'kemik küretleri'nin doğrudan atasıdır."}, {"id": "a070", "slug": "yeni-a070-uretral-sonda", "title": "Üretral Sonda (Kâşâtîr)", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Mesanede tutulu kalan idrarı dışarı akıtmak, üretra darlıklarını genişletmek için kullanılan; ucu pamuk/yün tıpalı, pürüzsüz gümüş veya bronz borular.", "uzun": "Üretral Sonda (Kâşâtîr), ez-Zehrâvî'nin et-Taşrîf'inin 'İdrar Yolları Tedavisi' bölümünde detaylandırdığı ve modern ürolojinin temel aletlerinden biri olan cerrahi borudur. Orta Çağ'da prostat büyümesi veya üretra darlıkları nedeniyle mesanede tutulu kalan idrar (retansiyon), hastalar için agonize edici ve ölümcül bir tehlikeydi. ez-Zehrâvî, bu sorunu çözmek için 'yaklaşık bir buçuk karış uzunluğunda oldukça ince, pürüzsüz gümüş bir boru' tasarlamıştır. Gümüşün seçilmesi tesadüfi değildir; gümüş, doğal antiseptik özelliklere sahiptir ve üretra mukozasını tahriş etmez. Sondanın ucunda, mesaneye girerken dokuyu zedelememesi için tıpkı bir tıpa gibi duran, çift katlı bir tel aracılığıyla tutulan pamuk veya yün bir başlık bulunurdu. Hekim sondayı mesaneye yerleştirdikten sonra bu pamuğu çekiyor ve idrarın dışarı akmasını sağlıyordu. Bu alet, 19. yüzyılda Auguste Mercier ve modern Foley sondaları geliştirilene kadar, tam 900 yıl boyunca Avrupa ve İslam tıbbında standart ürolojik müdahale aracı olarak kalmıştır."}, {"id": "a072", "slug": "yeni-a072-sunnet-makasi", "title": "Sünnet Makası (Mikaşş)", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Erkek çocuklarının sünnet işleminde glans'ın (sünnet derisinin altındaki hassas doku) kesilmesini fiziksel olarak engelleyen, koruyucu plaka ve kavisli makastan oluşan güvenli cerrahi set.", "uzun": "Sünnet Makası (Mikaşş), ez-Zehrâvî'nin pediatrik (çocuk) cerrahisindeki hassasiyetini ve İslam tıbbının dini ritüelleri güvenli tıbbi prosedürlere dönüştürme çabasını gösterir. Orta Çağ'da sünnet, genellikle tecrübesiz berberler veya hocalar tarafından standart bıçaklarla yapılıyor; bu da glans penis'in (hassas baş kısmın) kesilmesi veya ölümcül kanamalar gibi trajik kazalara yol açıyordu. ez-Zehrâvî, bu riskleri ortadan kaldırmak için özel bir 'mikaşş' (makas) ve koruyucu sistem tarif eder. İşlemde, sünnet derisi öne çekildikten sonra, glans'ın hemen önüne ahşap veya fildişinden bir 'koruyucu plaka' (şim) yerleştirilir. Hekim, özel olarak kavislendirilmiş makası bu plakanın üzerinden tek bir hamleyle kapatarak deriyi keser; plaka, makasın hassas dokuya ulaşmasını fiziksel olarak engeller. ez-Zehrâvî, operasyon sonrası kanamayı durdurmak için kül ve özel bitkisel tozlar (hemostatik ajanlar) kullanmayı da salık verir. Bu alet, İslam dünyasında sünnetin bir 'halk ritüeli' olmaktan çıkıp, steril ve anatomik bilgiye dayalı bir 'klinik cerrahi' haline gelmesinin mihenk taşıdır."}, {"id": "a085", "slug": "yeni-a085-maskeli-nester", "title": "Maskeli Neşter (Mihdac)", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "kisa": "Hastanın kesici yüzü görüp paniğe kapılmasını önlemek için jileti elipsoit bir kabuk içinde gizleyen, insan psikolojisini gözeten maskeli cerrahi neşter.", "uzun": "Maskeli Neşter (Mihdac), ez-Zehrâvî'nin et-Taşrîf'inin 'Genel Cerrahi' bölümünde tarif ettiği ve tıp tarihinin en zarif 'deontolojik' (etik) buluşlarından biridir. Orta Çağ'da ameliyat olacak hastalar, hekimin elindeki parlak ve keskin çelik bıçakları gördüklerinde şoka giriyor, kalp krizi geçiriyor veya kaçmaya çalışıyorlardı. ez-Zehrâvî bu psikolojik travmayı çözmek için 'mihdac' (Arapça 'gizli oda' kökünden) adını verdiği bir neşter tasarladı. Bu alette, son derece keskin olan çelik jilet, dışarıdan bakıldığında sıradan bir metal kalem veya silindir gibi görünen elipsoit bir kabuğun (maske) içine gizlenmişti. Hekim aleti hastanın vücuduna yaklaştırdığında, kabuk geri çekiliyor veya sadece kesmesi gereken milimetrik uç dışarı çıkarak dokuyu yarıyordu. Hasta, kesildiğini hissedene kadar bıçağı görmüyordu. Bu tasarım, İslam tıbbının hastayı sadece 'biyolojik bir makine' olarak değil, korkuları ve hassasiyetleri olan bir 'insan' olarak gördüğünün; cerrahinin sadece el becerisi değil, aynı zamanda derin bir empati ve psikoloji bilgisi gerektirdiğinin somut kanıtıdır."}, {"id": "a091", "slug": "yeni-a091-nefesli-otomat", "title": "Kendiliğinden Çalan Nefesli Alet", "creator": "Benû Mûsâ b. Şâkir", "kisa": "Su veya hava basıncıyla çalışan, üzerindeki çıkıntılar (pin) değiştirilerek farklı melodiler çalınabilen, tarihin ilk 'programlanabilir' makinesi.", "uzun": "Kendiliğinden Çalan Nefesli Alet (el-Âle elletî tuzammiru bi-nefsihâ), Benû Mûsâ kardeşlerin 'Kitâb el-Hiyel' adlı eserinde anlattığı ve sibernetik tarihinin en büyük devrimlerinden biri olan cihazdır. Bu otomat, temelde bir su saati mekanizmasıyla döndürülen silindirik bir tambur ve bu tambura bağlı körüklerden oluşan bir flüt sistemidir. Ancak asıl dâhiyane buluş, tamburun üzerindeki 'çıkıntılar' (pinler) ve kaldıraçlardır. Benû Mûsâ, tamburun üzerindeki çıkıntıların yerlerini ve uzunluklarını değiştirerek (yani silindiri 'yeniden programlayarak') makinenin farklı melodiler, farklı ritimler ve farklı makamlar çalmasını sağlamışlardır. Bu, insanlık tarihinde bir makinenin fiziksel gövdesinden (donanım) bağımsız olarak, ona dışarıdan bir komut dizisi (yazılım/program) yüklenebileceğinin ilk kanıtıdır. 19. yüzyıldaki müzik kutuları, delikli kartlarla çalışan piyanolar ve nihayetinde modern bilgisayarların 'değiştirilebilir program' mantığı, doğrudan bu 9. yüzyıl Bağdat otomatının mirasçısıdır. Benû Mûsâ, bu aletle mekaniği sadece 'iş yapan' bir güç olmaktan çıkarıp 'bilgi işleyen' bir sisteme dönüştürmüştür."}, {"id": "a113", "slug": "yeni-a113-yakup-sopasi", "title": "Yakup Sopası (Cross-staff)", "creator": "İslam Denizcilik ve Astronomi Geleneği", "kisa": "Gök cisimlerinin (özellikle Kutup Yıldızı ve Güneş) yükseklik açısını ölçerek enlem belirlemeye yarayan, basit ama son derece etkili sopa ve çapraz lata düzeneği.", "uzun": "Yakup Sopası (Cross-staff / Haşabât), İslam denizciliğinin ve astronomisinin açık deniz navigasyonundaki en vazgeçilmez aracıdır. Temel yapısı son derece sadedir: derecelendirilmiş uzun bir ana sopa ve üzerinde kayan, ufkı ve gök cismini aynı anda hizalamaya yarayan bir çapraz lata. Gözlemci, sopanın bir ucunu gözüne dayar, çapraz latayı gök cismine (genellikle Kutup Yıldızı) ve ufka hizalar ve sopadaki ölçekten açıyı okur. Bu açı, doğrudan gözlemcinin coğrafi enlemini verir. İslam denizcileri, bu aletin daha basit ve deniz koşullarına uygun bir varyantı olan 'kamal'ı da geliştirmişlerdir; kamal, küçük bir ahşap levha ve farklı enlemlere göre düğümlenmiş bir ipten oluşur. Hint Okyanusu'nda binlerce yıl kullanılan bu sistem, gemilerin Afrika kıyılarından Endonezya'ya kadar güvenli bir şekilde seyretmesini sağlamıştır. 15. yüzyılda Vasco da Gama'nın Hint Okyanusu'na açıldığında, İslam denizcilerinden (özellikle İbn Mâcid'den) devraldığı en kritik teknoloji bu alettir. Avrupa'ya 'Jacob's Staff' (Yakup Sopası) adıyla geçen bu cihaz, 16.-17. yüzyıllarda okyanus ötesi keşiflerin ve sömürge imparatorluklarının kurulmasının teknik altyapısını oluşturmuştur."}, {"id": "a134", "slug": "yeni-a134-dogrusal-usturlap", "title": "Doğrusal Usturlap (Tûsî Cetveli)", "creator": "Nasîrüddîn et-Tûsî", "kisa": "et-Tûsî'nin icat ettiği; usturlabın dairesel kadranlarını ve trigonometrik fonksiyonlarını tek bir doğru (cetvel) üzerine izdüşüren, cepte taşınabilir 'lineer analog bilgisayar'.", "uzun": "Doğrusal Usturlap (el-Âlet el-Hattiyye), Nasîrüddîn et-Tûsî'nin pratik zekâsının ve geometrik dehasının bir ürünüdür. Klasik usturlaplar dairesel formdaydı ve metalurjik olarak üretilmesi, kalibre edilmesi hassas ustalık gerektiriyordu. et-Tûsî, usturlabın tüm fonksiyonlarını (sinüs, kosinüs, tanjant, yükseklik ve zaman hesabı) stereografik projeksiyonun lineer (doğrusal) bir dönüşümünü kullanarak tek bir cetvel veya dikdörtgen plaka üzerine indirmeyi başardı. Bu cetvel, üzerinde kayan bir şakül (ip) ve boncuklar yardımıyla, dairesel bir usturlabın yapabildiği tüm trigonometrik ve astronomik hesaplamaları yapabiliyordu. 'Tûsî Cetveli' olarak da bilinen bu alet, özellikle seyahat eden alimler, kâdı'lar (hakimler) ve ordu komutanları için cepte taşınabilir, kırılması imkânsız ve üretimi çok daha ucuz bir 'cep bilgisayarı' işlevi gördü. Bu alet, İslam matematikçilerinin geometriyi sadece şekil çizmek için değil, hesaplama makineleri tasarlamak için bir 'yazılım dili' olarak kullandıklarının en çarpıcı kanıtlarından biridir."}, {"id": "a140", "slug": "yeni-a140-sinus-kadrani", "title": "Sinüs Kadranı (Rub' el-Müceyyeb)", "creator": "İslam Muvakkit ve Astronomi Geleneği", "kisa": "Trigonometrik fonksiyonları (sinüs, kosinüs) geometrik olarak çözmek, namaz vakitlerini ve kıble yönünü hesaplamak için kullanılan, çeyrek daire formundaki matematiksel kadran.", "uzun": "Sinüs Kadranı (Rub' el-Müceyyeb), İslam medeniyetinin matematiği (trigonometriyi) dini bir ihtiyaçla (namaz vakitleri ve kıble) harmanlayarak yarattığı en zarif ve en yaygın bilimsel alettir. Bir çeyrek daire (90 derecelik yay) formundaki bu kadranın iç yüzeyi, ortadan kenara doğru yayılan sinüs ve kosinüs eğrileriyle, ızgara hatlarıyla ve ufuk çizgileriyle kazınmıştır. Kullanıcı, kadranın merkezinden sarkan bir şakül (çekül) ve ip yardımıyla Güneş'in yüksekliğini ölçer; ardından ipi kadran üzerindeki sinüs eğrileriyle kesiştirerek, o günkü öğle vaktini, ikindi vaktini veya Mekke'nin yönünü (kıble) hiçbir sayısal hesaplama yapmadan, sadece ipin gösterdiği noktadan okuyabilirdi. Bu alet, İslam dünyasındaki her camiinin 'muvakkithane'sinin (zaman ölçüm odasının) duvarında veya muvakkitlerin cebinde bulunan standart bir araçtı. Sinüs kadranı, Avrupa'ya aktarıldığında 'Quadrans Vetus' (Eski Kadran) adını almış ve Rönesans denizcilerinin ve kâşiflerinin okyanuslarda yön ve zaman bulmak için kullandıkları en temel trigonometrik hesap makinesi haline gelmiştir."}, {"id": "a142", "slug": "yeni-a142-semerkant-sekstanti", "title": "Semerkant Rasathanesi Sekstantı", "creator": "Uluğ Bey ve Semerkant Ekolü", "kisa": "Teleskop öncesi çağın en büyük ve en hassas gözlem aleti; 40 metre yarıçaplı, yeraltına inen devasa meridyen sekstantı.", "uzun": "Semerkant Rasathanesi Sekstantı, insanlık tarihinin teleskop icat edilmeden önce inşa ettiği en büyük ve en hassas astronomik gözlem aletidir. Uluğ Bey'in emriyle 1420'lerde inşa edilen bu devasa yapı, tam bir meridyen düzleminde (kuzey-güney hattında) toprağın içine oyulmuş, 40 metre yarıçaplı (118 derecelik bir yay çizen) mermer bir sekstanttan oluşuyordu. Aletin merkezi, rasathanenin üst katındaki gözlem odasında, ışığın girdiği bir karanlık oda (camera obscura) prensibiyle çalışıyordu. Güneş'in veya Ay'ın ışığı bu delikten girip 40 metrelik mermer yay üzerinde bir görüntü oluşturuyor; astronomlar bu görüntünün mermer üzerindeki milimetrik taksimatını okuyarak gök cisimlerinin konumlarını saniyenin kesirleri hassasiyetinde belirliyordu. Bu sekstant sayesinde hazırlanan 'Zîc-i Sultânî', 1018 yıldızın konumunu içeren ve 16. yüzyıla kadar (Tycho Brahe'ye dek) dünyanın en doğru yıldız kataloğu olarak kalan anıtsal bir eserdir. Aletin yeraltındaki kalıntıları bugün dahi Semerkant'ta İslam biliminin devasa vizyonunun fiziksel bir anıtı olarak ayaktadır."}, {"id": "a144", "slug": "yeni-a144-samrat-yantra", "title": "Samrât Yantra", "creator": "Sawai Jai Singh II", "kisa": "Jai Singh II'nin Delhi ve Jaipur'da inşa ettiği, 20-30 metre yüksekliğindeki devasa taş gnomon ve mermer kadranlardan oluşan, dünyanın en büyük ve en hassas ekinoksal güneş saati.", "uzun": "Samrât Yantra (Yüce Alet), İslam astronomi mirasının Hint coğrafyasındaki en anıtsal ve en görkemli yankısıdır. 18. yüzyılda Babür İmparatorluğu'nda hüküm süren Sawai Jai Singh II, Uluğ Bey'in Semerkant'taki ve el-Hucendî'nin Rey'deki dev sekstantlarından ilham alarak, teleskop çağına girilmiş olmasına rağmen 'taş ve mermerden' devasa rasathaneler (Jantar Mantar) inşa etmiştir. Samrât Yantra, temelde devasa bir üçgen prizma (gnomon) ve onun iki yanına yerleştirilmiş çeyrek daire biçimindeki mermer kadranlardan oluşur. Gnomonun yüksekliği 20 ila 30 metre arasında değişir ve tam olarak coğrafi enleme paralel olarak (kutup noktasına yönlü) inşa edilmiştir. Güneş'in gölgesi bu devasa kadranlar üzerinde milimetrik bir hassasiyetle hareket eder; gözlemciler bu gölgeyi izleyerek yerel zamanı saniye hassasiyetle, güneşin deklinasyonunu ve ekinoks anlarını hesaplayabilirler. Jai Singh II'nin bu mimari şaheserleri, İslam dünyasındaki 'aletlerin boyutunu büyütmenin, bölüntü (derece) hatalarını minimize edeceği' prensibinin (ki bu prensibi Merâğa ve Semerkant'tan devralmıştır) tarihteki en büyük fiziksel uygulamasıdır."}, {"id": "a147", "slug": "yeni-a147-dakshinovritti-yantra", "title": "Dakshinovritti Yantra", "creator": "Sawai Jai Singh II", "kisa": "Jai Singh II'nin Delhi rasathanesinde inşa ettiği; gök cisimlerinin meridyenden geçiş anındaki maksimum yüksekliklerini (deklanasyon) ölçmek için kullanılan, yarım daire biçiminde devasa taş meridyen kadranı.", "uzun": "Dakshinovritti Yantra, İslam astronomisindeki 'duvar kadranı' (quadrans muralis) ve 'meridyen sekstantı' geleneğinin, Hint taş mimarisiyle yorumlanmış halidir. Klasik İslam rasathanelerinde (Merâğa, İstanbul) meridyen kadranları rasathane binasının iç duvarına monte edilirdi. Jai Singh II ise bu aleti açık havada, devasa bir yarım daire biçiminde taş ve mermerden inşa etmiştir. Alet, tam olarak kuzey-güney (meridyen) düzlemine yerleştirilmiştir. Gök cisimleri (Güneş, Ay, gezegenler veya yıldızlar) tam öğlen vakti veya gece yarısı meridyeni kestiğinde, gözlemci aletin merkezindeki nişangâh (veya gnomon) aracılığıyla cismin yüksekliğini bu dev yay üzerindeki taksimattan okurdu. Bu ölçüm, cismin ekvatora göre konumunu (deklanasyon) belirlemek için kritik öneme sahipti. Dakshinovritti Yantra, Takiyyeddîn'in ve Tycho Brahe'nin metal kadranlarıyla aynı optik ve geometrik prensipleri kullanır; ancak boyutu sayesinde, insan gözünün teleskopsuz olarak ulaşabileceği maksimum açısal çözünürlüğü sunar. Bu alet, İslam-Hint bilimsel etkileşiminin (özellikle Farsça Zîc'lerin Sanskritçe'ye çevrilmesinin) somut bir anıtıdır."}, {"id": "a155", "slug": "yeni-a155-bingam-i-rasadi", "title": "Astronomik Gözlem Saati (Bingâm-ı Rasadı)", "creator": "Takiyyeddîn er-Râsıd", "kisa": "Takiyyeddîn'in İstanbul Rasathanesi için icat ettiği; yıldızların meridyenden geçiş anlarını saniye hassasiyetiyle kaydeden, mekanik ve ağırlık tahrikli devrim niteliğinde gözlem saati.", "uzun": "Astronomik Gözlem Saati (Bingâm-ı Rasadı), Takiyyeddîn'in İstanbul Rasathanesi'ndeki en kritik ve en özgün buluşlarından biridir. 16. yüzyıla kadar astronomlar, gök cisimlerinin geçiş zamanlarını ölçmek için su saatlerine veya kum saatlerine güvenmek zorundaydı; bu da özellikle kış aylarında veya uzun gözlem seanslarında ciddi sapmalara yol açıyordu. Takiyyeddîn, Avrupa'da mekanik saatçiliğin henüz rasathanelere tam entegre olmadığı bir dönemde, tamamen kendi tasarımı olan, ağırlık ve zemberek (yay) mekanizmasıyla çalışan, dakikaları ve saniyeleri bölümlendiren hassas bir 'rasathane saati' icat etti. Bu saat, rasathanenin meridyen duvarındaki kadranlarla senkronize edilmiş, gözlemcinin bir yıldızın tam tepe noktasından (zenit) veya meridyenden geçtiği anı, insan refleksinden bağımsız olarak saniyesine kadar kaydetmesini sağlıyordu. Takiyyeddîn, bu saati 'rasadın (gözlemin) ayrılmaz bir parçası' olarak tanımlar. Bu buluş, İstanbul Rasathanesi'nin Tycho Brahe'nin Uraniborg'uyla boy ölçüşmesini, hatta bazı sabit yıldız kataloğu verilerinde onu geçmesini sağlayan 'zaman teknolojisi'ydi."}, {"id": "a173", "slug": "yeni-a173-eczacilik-havani", "title": "Eczacılık Havanı ve Tokmağı (Hâvün)", "creator": "İslam Eczacılık ve Farmakoloji Geleneği", "kisa": "Minerallerin, kurutulmuş otların ve baharatların toz haline getirilip standart dozlarda (mithkal/dirhem) tartılarak ilaç (macun, şurup) hazırlanması için kullanılan ağır pirinç veya bazalt havanlar.", "uzun": "Eczacılık Havanı (Hâvün), İslam dünyasında eczacılığın (saydalaniyye) tıptan bağımsız, profesyonel bir meslek olarak doğuşunun fiziksel sembolüdür. Bağdat, Kahire ve Endülüs'teki 'sûk el-attârin' (kokucular/eczacılar çarşısı), bu havanların ritmik sesleriyle yankılanırdı. er-Râzî ve İbn Sînâ, ilaçların (özellikle zehirli olabilecek minerallerin ve ağır metallerin) vücuda eşit dağılabilmesi için 'mikron' seviyesinde toz haline getirilmesini şart koşmuşlardır. Bu havanlar, sıradan mutfak havanlarından farklı olarak, asitli maddelere (örneğin sirke veya limon tuzuna) dayanıklı özel pirinç alaşımlarından veya sert bazalt taşından oyulurdu. Tokmakların (deste) sapı, eczacının saatlerce süren öğütme işlemi sırasında bileğini sakatlamaması için ergonomik olarak kalınlaştırılır, tabanı ise havanın içine tam oturacak şekilde küresel bir geometriye sahip olurdu. Havanın kenarları, tozun dışarı saçılmasını önlemek için içe doğru eğimliydi. Bu havanlarda ezilen tozlar, ardından 'mîzân' (terazi) ile hassas bir şekilde tartılır ve 'mithkal' (yaklaşık 4.5 gram) birimlerinde hastalara reçete edilirdi."}, {"id": "a174", "slug": "yeni-a174-eczacilik-terazisi", "title": "Eczacılık ve Kuyumcu Terazisi (Mîzân)", "creator": "İslam Metroloji ve Muhtesib Geleneği", "kisa": "Eczacılıkta ilaç dozajlarını ve kuyumculukta alaşım oranlarını hassas bir şekilde tartmak için kullanılan; muhtesib tarafından mühürlenmiş pirinç teraziler ve standart ağırlık taşları.", "uzun": "Eczacılık Terazisi ve Ağırlıklar (Mîzân), İslam medeniyetinin bilimi, ticareti ve kamu sağlığını tek bir noktada birleştirdiği en kritik araçtır. İslam eczacılığında (saydalaniyye) bitkisel özlerin yanı sıra cıva, arsenik, antimon ve bakır gibi ağır metaller/zehirler de ilaç olarak kullanılırdı. Bu maddelerin 'mithkal' (yaklaşık 4.5 gram) veya 'habbe' (bir arpa tanesi ağırlığı) gibi mikron düzeyindeki standartlarla tartılması hayati önem taşıyordu; bir miligramlık sapma hastayı iyileştirmek yerine zehirleyebilirdi. Bu nedenle İslam devletlerinde 'muhtesib' (çarşı denetçisi) adı verilen bir kamu görevlisi, eczanelerin ve kuyumcuların terazilerini haftalık olarak denetler, kalibrasyonları bozuk terazileri kırar ve tartılan ağırlık taşlarını (dirhem) devlet mührüyle mühürlerdi. Arkeolojik kazılarda (örneğin Nişâpür ve Fustat) bulunan bronz, cam ve akik taşından oyma ağırlıklar, üzerlerindeki 'Allah', 'Bereket' veya halifenin adını taşıyan yazıtlarla, ölçmenin ve adaletin kutsal bir eylem olarak görüldüğünü kanıtlar. Bu terazi sistemi, modern eczacılık terazilerinin ve uluslararası metroloji enstitülerinin manevi atasıdır."}, {"id": "a178", "slug": "yeni-a178-gul-suyu-damitim", "title": "Gül Suyu Damıtım Düzeneği", "creator": "Şemseddîn ed-Dımeşkî ve İslam Eczacılık Geleneği", "kisa": "Şam'ın meşhur gül sularını ve tıbbi esansları endüstriyel ölçekte üretmek için kullanılan; çoklu cam balonlar, boynuzlu imbikler ve külhanlardan oluşan devasa damıtım fırını.", "uzun": "Gül Suyu Damıtım Düzeneği (ez-Zücâc el-Hikmî / Bilge Camı), İslam kimyasının tıp, eczacılık ve ticaret kesişiminde yarattığı en zarif endüstriyel tesistir. Orta Çağ'da 'gül suyu' sadece bir kozmetik değil, aynı zamanda kalp çarpıntısını yatıştıran, bayılmaları açan ve yaraları temizleyen stratejik bir tıbbi malzemeydi. Şam ve Endülüs'teki eczacılar, bu esansı tonlarca üretmek için 'ez-Zücâc el-Hikmî' adını verdikleri özel cam fırınlar tasarladılar. Bu düzeneğin en çarpıcı özelliği, 'boynuzlu imbikler'di. Külhanın ortasından yukarı doğru yükselen ısı, etrafına dizilmiş onlarca cam balonun (imbiklerin) içindeki gül yapraklarını buharlaştırıyor; buhar, imbiklerin 'gaga' (rostrum) adı verilen uzun boyunlarından geçerek soğuk alıcı kaplarda saf esans olarak yoğuşuyordu. Şemseddîn ed-Dımeşkî, bu cam düzeneklerin saydamlığı sayesinde damıtma sürecinin (rengin ve sıvı seviyesinin) ilk kez gözle izlenip kontrol edilebildiğini yazar. Bu 'çoklu paralel damıtma' sistemi, günümüz modern parfümeri ve petrokimya endüstrisindeki 'fraksiyonel distilasyon' kolonlarının felsefi ve mekanik atasıdır."}, {"id": "a189", "slug": "yeni-a189-karsi-agirlikli-mancinik", "title": "Karşı Ağırlıklı Mancınık (Trebuşet)", "creator": "İslam Kuşatma Mühendisliği (İbn Erenbuğâ ez-Zerdkâş)", "kisa": "Kısa koldaki karşı ağırlığın düşme gücüyle uzun koldaki gülleyi fırlatan, insan gücüne ihtiyaç duymayan devasa kuşatma makinesi.", "uzun": "Karşı Ağırlıklı Mancınık (Trebuşet), İslam askerî mühendisliğinin balistik alanındaki en büyük devrimidir. Antik Çağ'da ve erken İslam döneminde kullanılan mancınıklar, onlarca askerin aynı anda ipleri çekmesiyle (traction) çalışırdı; bu da insan gücünün senkronizasyon sorunları nedeniyle atış hızını ve isabet oranını düşürüyordu. İslam mühendisleri (özellikle ez-Zerdkâş ve Tarsûsî geleneği), kısa kaldıraç koluna insan gücü yerine devasa taşlar veya demir kütlelerden oluşan bir 'karşı ağırlık' (counterweight) kutusu ekleyerek bu sorunu çözmüştür. Karşı ağırlığın yerçekimi ivmesiyle düşmesi, uzun koldaki sapanı muazzam bir kinetik enerjiyle fırlatıyordu. Bu sayede hem manevra mürettebatı azaltılmış hem de güllenin başlangıç hızı ve menzili kritik ölçüde artırılmıştır. İslam kaynakları, bu makinelerin 'Arap', 'Türk/Fars' ve 'Frenk/Bizans' varyantlarını ayrıntıyla tarif eder. 1291 yılındaki Akka (Accon) kuşatmasında Memlük ordusunun kullandığı bu devasa makineler, Haçlıların Doğu'daki varlığının sonunu getiren teknik faktörlerden biri olmuştur. Avrupa'ya aktarılan bu teknoloji, Orta Çağ'ın sonlarına kadar kale surlarını yıkan en etkili silah olarak kalmıştır."}, {"id": "a190", "slug": "yeni-a190-seramik-bomba", "title": "Seramik Bomba (İkrîh Borucuklu)", "creator": "İslam Askerî Mühendislik Geleneği", "kisa": "İçine barut, neft veya kimyasal maddeler doldurulan, fitil (ikrîh) ile ateşlenip fırlatılan, parça tesirli ve yakıcı erken dönem el bombası.", "uzun": "Seramik Bomba (İkrîh Borucuklu), İslam askerî mühendisliğinin piroteknik ve kimya alanındaki en ölümcül buluşlarından biridir. 7./13. yüzyılda Eyyûbî ve Memlük orduları, Haçlı kalelerini kuşatırken veya Moğol süvarilerine karşı savunma yaparken bu el bombalarını yaygın olarak kullanmışlardır. Bomba, el bombası formunda özel olarak tasarlanmış, kalın cidarlı seramik bir kaptan oluşurdu. İçine güherçile, kükürt, kömür karışımı (barut), yanıcı neft (petrol) ve düşmanda panik/boğulma yaratmak için sönmemiş kireç veya zehirli otlar doldurulurdu. Kabın ağzında 'ikrîh' adı verilen bir fitil borusu bulunur; bu fitil ateşlendikten sonra bomba mancınıkla veya elle düşman saflarına fırlatılırdı. Seramik kap, hedefe çarptığında parçalanarak hem şarapnel etkisi yaratır hem de içindeki yakıcı/kimyasal maddeleri etrafa saçıyordu. Carsten Niebuhr ve modern arkeologların Kahire ve Şam kazılarında bulduğu bu seramik bombalar, üzerlerindeki dekorasyonlar nedeniyle uzun yıllar 'parfüm şişesi' veya 'kum saati' sanılmış; ancak içlerindeki kimyasal kalıntıların analizi, bunların dünyanın ilk el bombaları olduğunu kanıtlamıştır. Bu teknoloji, kimyasal ve patlayıcı silahların savaş tarihine girişinin en somut arkeolojik belgesidir."}, {"id": "a195", "slug": "yeni-a195-areometre", "title": "Areometre / Fiziksel Terazi", "creator": "İslam Fizik ve Metroloji Geleneği", "kisa": "Sıvıların yoğunluğunu ve metallerin saflığını ölçmek için kullanılan, cam silindir ve kalibre edilmiş daldırma cisimlerinden oluşan erken dönem areometre / piknometre.", "uzun": "Areometre (Mîzân et-Tabîî / Fiziksel Terazi), İslam fizikçilerinin Arşimed'in hidrostatik prensiplerini laboratuvar tezgâhına indirdiği anı temsil eder. Ebû Bekir er-Râzî, kimyasal çözeltilerin, şurupların ve asitlerin yoğunluklarını ölçmek için içi sıvıyla dolu bir cam silindir ve bu silindire batırıldığında sıvının yoğunluğuna göre farklı derinliklerde yüzen/batan kalibre edilmiş ağırlıklar (veya cam şişeler) tasarlamıştır. Bu alet, terazinin kefine gerek kalmadan, sadece 'kaldırma kuvveti' farkı kullanılarak sıvının özgül ağırlığını anında okumayı sağlıyordu. el-Bîrûnî ise bu prensibi genişleterek, değerli taşların (yakut, zümrüt) ve metallerin saflığını test eden hassas piknometreler geliştirmiştir. Bu cam areometreler, 17. yüzyılda Galileo'nun 'bilancetta'sına ve modern petrol/kimya endüstrisinin yoğunluk ölçerlerine giden yolun ilk ve en zarif adımıdır. İslam eczacılığında ilaçların standart dozajda üretilmesi, büyük ölçüde bu 'fiziksel terazi' sayesinde mümkün olmuştur."}, {"id": "a197", "slug": "yeni-a197-arsimed-vidasi", "title": "Arşimed Vidası (Su Burgusu)", "creator": "İslam Sulama ve Mekanik Mühendisliği Geleneği", "kisa": "Suyu yerçekimine karşı helezoni (sarmal) bir boru içinde yukarı taşıyan, İslam'ın 'Tarım Devrimi'nin belkemiği hidrolik pompa.", "uzun": "Arşimed Vidası (Su Burgusu), Antik Yunan'da gemilerdeki suyu tahliye etmek için icat edilmiş olsa da, onu devasa bir medeniyet inşasının ve 'İslam Yeşil Devrimi'nin motoruna dönüştürenler İslam mühendisleridir. İslam dünyası, 8. yüzyıldan itibaren bu helezoni vidayı, Dicle, Fırat, Nil ve Endülüs nehirlerinde hayvan veya nehir akıntısı gücüyle döndürülen devasa sulama istasyonlarının merkezine yerleştirmiştir. el-Cezerî'nin 1206 tarihli eserinde ve Takiyyeddîn'in 16. yüzyıl mekanik kitaplarında tarif edilen bu vidalı pompalar, suyu kademeli olarak onlarca metre yükseğe çıkararak çöl ve yarı-çöl bölgelerde 'teraslı tarım' ve 'şeker kamışı/pamuk' gibi yüksek su ihtiyacı olan endüstriyel bitkilerin yetiştirilmesini mümkün kılmıştır. İslam mühendisleri, vidanın iç yüzeyindeki sürtünmeyi azaltmak için özel ahşap ve reçine kaplamalar geliştirmiş, mil yataklarında bronz burçlar kullanarak dönemin en verimli hidrolik makinelerini üretmişlerdir. Bu teknoloji, Endülüs üzerinden Avrupa'ya geçmiş ve Rönesans Avrupası'nın madencilik ve drenaj mühendisliğinin temelini oluşturmuştur."}, {"id": "a234", "slug": "yeni-a234-alhidade", "title": "Alhidade (Açı Cetveli)", "creator": "İslam Astronomi Geleneği", "kisa": "Usturlabın veya kadranın arka yüzünde, merkez etrafında dönen ve üzerinde iki delikli nişangâh (diopter) bulunan; güneşin veya yıldızın yüksekliğini ölçmeye yarayan açı cetveli.", "uzun": "Alhidade (Arapça: el-idâda), usturlabı salt bir 'hesap makinesi' olmaktan çıkarıp gerçek bir 'gözlem aleti'ne dönüştüren yegâne parçadır. Usturlabın arka yüzünde, merkezdeki bir pim etrafında dönen bu cetvelin her iki ucunda, üzerinde ince birer delik bulunan dik lameller (nişangâhlar) bulunur. Gözlemci, usturlabı kulpundan (asma halkasından) havada asılı tutarak alhidadeyi Güneş'e veya bir yıldıza doğrultur; ışığın her iki delikten aynı anda geçmesini sağladığında, cetvelin uçları dış çemberdeki (limbus) derece skalasında gök cisminin yüksekliğini (irtifa) gösterir. İslam ustaları, özellikle Güneş gözlemlerinde gözün zarar görmemesi ve ışık saçılmasının (flare) engellenmesi için nişangâh deliklerinin çaplarını ve iç yüzeylerinin karartılmasını optimize etmişlerdir. Alhidadesız bir usturlap, sadece süslü bir pirinç levhadır; alhidade ile birlikte o, gökyüzünü avuca indiren bir 'yerçekimi referanslı bilgisayar'a dönüşür. Bu basit ama kusursuz mekanik parça, İslam rasathanelerindeki devasa duvar kadranlarında da (örneğin Merâğa ve Semerkant) aynı optik prensiplerle, ancak metrelerce uzunluğunda kullanılmıştır."}, {"id": "a242", "slug": "yeni-a242-kusayr-amra", "title": "Kuşayr Amra Gök Haritası", "creator": "Emevî Saray Geleneği", "kisa": "Ürdün çölündeki Emevî kasrının hamam kubbesine fresk tekniğiyle işlenmiş; yaklaşık 400 yıldızı, takımyıldızları ve zodyak kuşağını içeren, İslam dünyasının bilinen en eski gök haritası.", "uzun": "Kuşayr Amra Gök Haritası, İslam sanat ve bilim tarihinin en büyüleyici ve en erken belgelerinden biridir. 1902'de Alois Musil tarafından Ürdün çölünde keşfedilen bu Emevî çöl sarayının hamam (caldarium) kubbesinde, gökyüzünün muhteşem bir freski yer alır. 711-715 yıllarına tarihlenen bu kubbede, yaklaşık 400 yıldız, bilinen takımyıldızlar (örneğin Büyükayı, Avcı) ve burçlar kuşağı (zodyak) koordinatlarıyla birlikte tasvir edilmiştir. Harita, düz bir zemine değil, kubbenin 3 boyutlu eğimine gökküresinin içinden bakıyormuşçasına (içbükey perspektif) işlenmiştir. Fritz Saxl ve Arthur Beer'in astronomi-tarihsel analizleri, bu haritanın Helenistik/Bizans astronomi geleneğinin İslam dünyasındaki ilk büyük yankısı olduğunu kanıtlamıştır. Haritadaki bazı takımyıldız isimlerinin ve konumlarının Arapça/İslami astronomiye geçişteki 'kayıp halka' olması, Kuşayr Amra'yı sadece bir sanat eseri değil, aynı zamanda İslam biliminin doğuşuna tanıklık eden eşsiz bir arkeolojik rasathane kalıntısı yapar."}, {"id": "a250", "slug": "yeni-a250-kasiyun-rasathanesi", "title": "Şam (Kâsiyün) Rasathanesi Aletleri", "creator": "Hâlid b. Abdülmelik el-Merverrûdî", "kisa": "Halife Me'mûn'un emriyle Şam'ın Kâsiyün Dağı'nda kurulan, Ptoleme'nin verilerini test etmek ve Dünya'nın çevresini ölçmek için kullanılan ilk kurumsal İslam rasathanesinin gözlem aletleri.", "uzun": "Şam (Kâsiyün) Rasathanesi Aletleri, İslam bilim tarihinin 'deneysel doğrulama' (tahlîk) çağını başlatan yadigârlardır. 9. yüzyılın başlarında Halife Me'mûn, Yunanca'dan çevrilen Ptoleme'nin Almagest'indeki astronomik parametrelerin (ekliptik eğimi, presesyon, gezegen periyotları) hala geçerli olup olmadığını test etmek için dev bir bilim projesi başlattı. Hâlid el-Merverrûdî başkanlığındaki ekip, Şam'ın Kâsiyün Dağı'na ve Bağdat'ın Şemmâsiyye semtine iki eşzamanlı rasathane kurdu. Burada, dönemin en büyük metal ve ahşap ustalarına, Ptoleme'nin tarif ettiği 'armiller küre' (zât el-halak), dev gnomonlar (mikyas) ve meridyen halkaları döküldü. Bu aletlerle yapılan gözlemler sonucunda, Ptoleme'nin hesapladığı ekliptik eğiminin (23°51') hatalı olduğu tespit edildi ve Me'mûn astronomları bunu 23°33' olarak düzeltti. Kâsiyün Rasathanesi, İslam dünyasında bilimin sadece 'kitaplardan okunmak' değil, 'doğada aletlerle test edilmek' zorunda olduğunun ilan edildiği ilk kurumsal merkezdir. Bu aletler, Merâğa ve İstanbul rasathanelerinin manevi ve teknik atasıdır."}, {"id": "a257", "slug": "yeni-a257-sabuncuoglu-cerrahi-aletleri", "title": "Sabuncuoğlu'nun Cerrahi Aletleri", "creator": "Şerefeddin Sabuncuoğlu", "kisa": "Şerefeddin Sabuncuoğlu'nun 1465'te Fatih Sultan Mehmed'e sunduğu, 140 minyatürle donatılmış Türkçe cerrahi ansiklopedisindeki özgün cerrahi aletler ve müdahale teknikleri.", "uzun": "Sabuncuoğlu'nun Cerrahi Aletleri, İslam tıp tarihinin 'klasik' birikiminin Osmanlı pratiğiyle ve Türkçe'yle buluştuğu en önemli dönüm noktasıdır. Sabuncuoğlu, 400 yıl önce Endülüs'te ez-Zehrâvî'nin kurduğu cerrahi alet geleneğini devralmış, ancak onunla yetinmeyerek Amasya Bimarhanesi'ndeki kendi klinik gözlemlerini eklemiştir. Cerrâhiyyetü'l-Hâniyye adlı eseri, sadece aletlerin nasıl kullanılacağını değil, aynı zamanda hastaya nasıl yaklaşılacağını, ameliyat sırasındaki etik kuralları ve hijyen prensiplerini de içerir. Sabuncuoğlu, meme kanseri tümörlerinin cerrahi olarak çıkarılması, epilepsi tedavisi için kafatasına yapılan müdahaleler ve zor doğumlarda kullanılan kancalar konusunda dönemin Avrupa'sının çok ötesinde teknikler geliştirmiştir. Eserdeki 140 minyatür, cerrahların aletleri nasıl tuttuğundan hastanın nasıl pozisyonlandırıldığına kadar her detayı resmeder; bu da eseri, tıp eğitiminde kullanılan ilk 'görsel ders kitabı' (atlas) yapar. Sabuncuoğlu, 'denemediğim hiçbir şeyi yazmadım' diyerek deneysel tıbbın Osmanlı'daki en güçlü savunucusu olmuştur."}, {"id": "a279", "slug": "yeni-a279-ankebut", "title": "Ankebut (Örümcek)", "creator": "İslam Usturlap Ustaları Geleneği", "kisa": "Usturlabın ön yüzünde dönen, zodyak kuşağını ve gökkürenin en parlak yıldızlarını (Sirius, Vega, Aldebaran) temsil eden ajurlu, oymalı pirinç plaka.", "uzun": "Ankebut (Arapça: Örümcek/Ağ), usturlabın kalbi ve görsel şaheseridir. Mater (ana gövde) içine yerleştirilen enlem plakalarının (safâ'ih) üzerinde dönen bu ajurlu plaka, gökküresinin kutuptan düzleme (stereografik) izdüşümünü temsil eder. Dış çemberi ekliptiği (Güneş'in yıllık yörüngesini) gösterirken, üzerindeki sivri uçlar (mürîler) en parlak sabit yıldızların (örneğin Şi'râ-yı Yemânî / Sirius) gökyüzündeki konumlarını işaret eder. İslam ustaları, ankebutu tasarlarken hem astronomik doğruluğu korumak hem de metalin dayanıklılığını sağlamak için inanılmaz bir geometrik ve sanatsal deha sergilemişlerdir. Her ustanın 'imzası' ve estetik zevki ankebutun oyulmuş desenlerinde (arabeskler, çiçek motifleri, geometrik düğümler) gizlidir. Kullanıcı ankebutu döndürdükçe, gece gökyüzünü avucunda canlandırır; yıldızların doğuş ve batış saatleri, namaz vakitleri ve burçların konumu bu metalik dans ile hesaplanır. Koleksiyondaki ankebut örnekleri, İslam dünyasında bilimin 'soğuk' bir matematik değil, estetik ve ruhani bir arayış olduğunun en net kanıtıdır."}, {"id": "a297", "slug": "yeni-a297-musikar", "title": "Musikâr (Bimaristan Müzik Terapisi)", "creator": "İslam Psikiyatri ve Müzik Geleneği", "kisa": "Şam Nureddin ve Edirne II. Bayezid Bimaristanlarında akıl hastalarının rehabilitasyonunda kullanılan; belirli makamlarla ruhsal çöküntüyü ve maniyi tedavi eden üflemeli çalgı.", "uzun": "Musikâr, İslam tıbbının en hümanist ve en vizyoner uygulamalarından biri olan 'psikiyatrik müzikoterapi'nin fiziksel sembolüdür. Orta Çağ Avrupası'nda akıl hastaları 'içine şeytan girmiş' kabul edilerek yakılırken veya zincire vurulurken, İslam bimaristanlarında (örneğin 1154'te Şam'daki Nureddin Hastanesi veya 1488'de Edirne'deki II. Bayezid Külliyesi) onlar birer 'hasta' olarak görülür ve tedavi edilirdi. Hastanenin mimarisi, suyun şırıltısının hastaları sakinleştireceği şekilde (akustik mühendislik) tasarlanır; ayrıca haftanın belirli günlerinde hastane avlusunda müzisyenler konser verirdi. İslam hekimleri (el-Kindî, İbn Sînâ, Gevrekzâde), makamların insan fizyolojisi üzerindeki etkilerini sistematize etmişlerdi: Örneğin 'rast' makamı neşe ve canlılık verirken, 'hüseynî' huzur, 'segâh' ise uykusuzluk çekenlere uyku getirirdi. Musikâr (bir tür ney veya kaval), bu ses dalgalarını hastanın sinir sistemine ileten bir 'frekans jeneratörü' işlevi görüyordu. Bu uygulama, 20. yüzyılda bilimsel olarak kanıtlanacak olan 'ses frekanslarının beyin dalgaları (alfa/teta) üzerindeki etkisi'nin yüzyıllar öncesindeki klinik uygulamasıdır."}, {"id": "a298", "slug": "yeni-a298-santur", "title": "Santur (Bimaristan Müzik Terapisi)", "creator": "İslam Psikiyatri ve Müzik Geleneği", "kisa": "Bimaristanlarda müzik tedavisinin en önemli telli çalgısı; çekiçlerle (zahme) vurularak çalınan, makam teorisine göre ruhsal ve fizyolojik şifa dağıtan akustik enstrüman.", "uzun": "Santur, İslam bimaristanlarında müzik terapisinin en önemli ve en sofistike telli çalgısıydı. Ahşap bir kasa üzerine gerilmiş onlarca metal ve ipek telden oluşan bu enstrüman, küçük tahta çekiçlerle (zahme) vurularak çalınırdı. Santurun tıbbi önemi, onun üretebildiği 'titreşim zenginliği' ve 'harmonik katmanlar'dı. Minyatürlerde santurcu, hastane avlusundaki şadırvanın tam karşısına oturtulur; suyun ritmik sesi ile santurun titreşimleri birleşerek hastaların beyinlerindeki kaotik dalgaları (psişik gürültüyü) senkronize ederdi (entrainment). İslam tıp literatüründe, santurun 'zengüle' makamında çalındığında kalp çarpıntısını (aritmi) dindirdiği, 'büselik' makamında ise derin depresyondaki (melankoli) hastaları hayata bağladığı kayıtlıdır. Bu enstrüman, Edirne'deki II. Bayezid Darüşşifası'nda (1488) kurumsal bir 'reçete' olarak uygulanmış; hastalara haftada üç gün, günde iki saat santur dinleme seansları düzenlenmiştir. Santur, tıbbın sadece kimyasal moleküllerle (ilaç) değil, akustik fizik ve estetikle de iyileştirme gücüne sahip olduğunun kanıtıdır."}, {"id": "a353", "slug": "yeni-a353-enlem-plakalari", "title": "Enlem Plakaları (Safâ'ih)", "creator": "İslam Coğrafya ve Astronomi Geleneği", "kisa": "Usturlabın ana gövdesi (mater) içine yerleştirilen; her biri belirli bir coğrafi enlem (iklim) için stereografik projeksiyonla kazınmış ufuk, yükseklik (mukantaralar) ve azimut eğrilerini içeren pirinç levhalar.", "uzun": "Enlem Plakaları (Safâ'ih), usturlabın 'yazılım disketleri'dir. Klasik bir İslam usturlabının 'mater' adı verilen ana gövdesinin içine, genellikle 3 ila 7 adet ince pirinç plaka üst üste yerleştirilir. Her plakanın yüzeyinde, belirli bir coğrafi enlem (örneğin 33° Bağdat, 30° Kahire, 39° Buhara veya 41° İstanbul) için stereografik projeksiyonla hesaplanmış ufuk çizgisi, yükseklik daireleri (almukantarat) ve azimut (yön) eğrileri kazınmıştır. Bir usturlap sahibi, seyahat ettiği şehrin enlemine uygun plakayı en üste alarak aleti o coğrafya için yeniden kalibre ederdi. İslam coğrafyasının genişliği, alet yapımcılarını devasa bir koordinat veri tabanı oluşturmaya zorlamıştır. Bazı nadir usturlaplarda, plakanın arka yüzüne o enlemdeki önemli şehirlerin isimleri ve kıble yönünü gösteren eğriler dahi işlenmiştir. Bu plakalar, donanım (aletin kendisi) aynı kalırken, coğrafya değiştikçe yazılımın (plakanın) değiştiği, modern bilgisayar mantığının Orta Çağ'daki en zarif fiziksel karşılığıdır."}, {"id": "a385", "slug": "yeni-a385-kible-pusulasi", "title": "Kıble Pusulası", "creator": "İslam Muvakkit ve Denizcilik Geleneği", "kisa": "Manyetik pusula iğnesi ile üzerine farklı şehirlerden Mekke'nin yönünü (kıble) ve mesafesini gösteren koordinat haritası kazınmış kadranın birleşimi; cepte taşınabilir dini-astrofiziksel kompas.", "uzun": "Kıble Pusulası, İslam medeniyetinin dini bir vecibeyi (namazda Kâbe'ye dönmek) en ileri düzey matematik ve manyetizma bilgisiyle çözmesinin somut bir zaferidir. 13. yüzyıldan itibaren İslam coğrafyasının devasa boyutları (Endülüs'ten Çin'e), Müslüman seyyahların ve tüccarların bilinmeyen diyarlarda kıble yönünü bulmasını zorunlu kıldı. Muvakkitler, usturlapların veya kadranların arka yüzüne, dünyanın farklı bölgelerinden Mekke'ye olan azimut açılarını (kıble yönü) ve mesafeleri içeren detaylı bir koordinat haritası kazıdılar. Bu haritanın merkezine ise manyetik bir pusula iğnesi yerleştirildi. Kullanıcı pusulayı yere yatay olarak koyup kuzeyi bulduğunda, kadran üzerindeki harita sayesinde kendi bulunduğu şehirden Mekke'nin tam hangi derecede olduğunu görebiliyor ve namazını o yöne yönelerek eda edebiliyordu. Osmanlı döneminde bu aletler, padişahların sefer çadırlarında ve kervanbaşların heybelerinde bulunan vazgeçilmez birer 'cep rasathanesi' idi. Kıble pusulası, manyetizmanın pratik hayata ve ibadete entegre edildiği, İslam jeodezisinin en zarif mekanik uygulamasıdır."}, {"id": "a390", "slug": "yeni-a390-anatomik-resim-serileri", "title": "Anatomik Resim Serileri (Beşli Seri)", "creator": "İslam Anatomi Geleneği (Teşrih)", "kisa": "İnsan bedeninin iskelet, sinir, kas, atardamar ve üreme sistemlerini şematik olarak özetleyen; kadavra diseksiyonu yerine 'zihinsel harita' çıkaran beşli anatomik çizim serisi.", "uzun": "Anatomik Resim Serileri (Beşli Seri), İslam ve erken Rönesans tıp yazmalarında (örneğin Mansûr b. İlyas'ın 14. yüzyıldaki 'Teşrîh-i Manşurî'si veya Bodleian Fraser 201 yazması) karşılaşılan, insan bedeninin sistemlerini şematik olarak özetleyen ikonografik bir devrimdir. İslam dünyasında kadavra diseksiyonu (teşrih), dini hassasiyetler nedeniyle nadiren yapılırdı. Bu açığı kapatmak için İslam hekimleri, İskenderiye kökenli antik bilgileri ve İbn Sînâ ile İbn en-Nefîs'in (küçük kan dolaşımını bulan hekim) teorik fizyoloji keşiflerini birleştirerek 'beşli seri' adı verilen standartlaştırılmış çizimler ürettiler. Bu şemalarda beden, gerçekçi bir et yığını olarak değil; iskelet, sinir ağı, kas lifleri, atardamar/toplardamar ağacı ve üreme organları (genellikle hamile bir rahim ve embriyo ile) gibi 5 ayrı 'katman' veya 'sistem' halinde, sanki bir elektrik devresi şeması gibi çizilirdi. Bu çizimler, tıp öğrencilerinin ameliyat masasına geçmeden önce bedenin 'iç mimarisini' zihinlerinde 3 boyutlu olarak canlandırmalarını sağlayan pedagojik araçlardı. Vesalius'un 16. yüzyılda çizeceği modern anatominin görsel altyapısı, bu İslam şemalarının Avrupa'ya aktarımıyla şekillenmiştir."}, {"id": "a402", "slug": "yeni-a402-bimaristan-mimarisi", "title": "Bimaristan Mimarisi (Nûreddîn Hastanesi)", "creator": "İslam Tıp ve Mimari Geleneği (Bimaristan Kurumları)", "kisa": "Şam'daki Nûreddîn Bimaristanı; havalandırma (malqaf), su terapisi ve akustik mühendisliğini birleştirerek hastaların iyileşme sürecini hızlandıran devrim niteliğinde tıp-mimari kompleksi.", "uzun": "Bimaristan Mimarisi, İslam medeniyetinin tıbbı sadece farmakoloji ve cerrahiyle değil, aynı zamanda mekân, ışık, su ve ses ile tedavi eden bütüncül (holistik) bir bilim olarak gördüğünün en somut kanıtıdır. Şam'daki Nûreddîn Bimaristanı (1154) ve Anadolu'daki Divriği Darüşşifası, hastaların iyileşme sürecini hızlandırmak için mimariyi bir 'tıbbi cihaz' gibi tasarlamıştır. Merkez avludaki şadırvandan geçen su kanalları, hem mekânı soğutur (doğal klima) hem de çıkan su sesiyle hastaların sinir sistemini yatıştırırdı; bu, modern 'ses terapisi'nin (white noise) erken bir uygulamasıdır. 'Malqaf' adı verilen rüzgar kuleleri, çöl sıcaklığında dahi içeride sürekli bir hava sirkülasyonu sağlayarak enfeksiyon riskini azaltırdı. Akıl hastaları için ayrılan bölümlerde ise zincirler yerine müzik (musikâr), su sesi ve çiçek kokuları kullanılırdı. Avrupa'da akıl hastalarının 'deli' damgasıyla zincire vurulduğu veya yakıldığı bir çağda, İslam bimaristanları onları birer 'hasta' olarak görüp müzik ve suyla tedavi ediyordu. Bu mimari anlayış, modern hastane tasarımındaki 'iyileştirici çevre' (healing environment) kavramının yüzyıllar öncesindeki öncüsüdür."}, {"id": "a403", "slug": "yeni-a403-kagit-uretimi", "title": "Kağıt Üretimi ve Değirmenleri", "creator": "İslam Endüstri ve Mühendislik Geleneği", "kisa": "Çin'den alınan kağıt hamuru teknolojisini su değirmenleriyle mekanize ederek endüstriyel ölçekte üreten, İslam 'Bilgi Devrimi'nin ve kütüphanelerinin maddi altyapısı.", "uzun": "Kağıt Üretimi ve Değirmenleri, İslam medeniyetinin bilimsel ve kültürel 'Altın Çağı'nı mümkün kılan en kritik endüstriyel altyapıdır. 751 Talas Savaşı'nda esir alınan Çinli kağıt ustaları, Semerkant'ta İslam dünyasının ilk kağıt fabrikasını kurmuşlardır. Ancak Çinliler kağıt hamurunu insan veya hayvan gücüyle döverek üretirken, İslam mühendisleri bu süreci su değirmenlerine entegre ederek mekanize etmişlerdir. Su çarklarının döndürdüğü devasa tokmaklar (kübit), keten, kenevir ve pamuklu paçavraları havuzlarda dövüp selüloz hamuruna dönüştürüyordu. Bu mekanizasyon, kağıdın çok ucuz ve seri bir şekilde üretilmesini sağladı. Abbâsî Halifesi Hârunürreşîd ve Me'mûn dönemlerinde Bağdat'ta kurulan kâğıt fabrikaları, Beytü'l-Hikme'nin (Bilgelik Evi) devasa çeviri hareketini ve milyonlarca ciltlik kütüphanelerin doğmasını sağladı. Kağıt teknolojisi daha sonra Şam, Kahire, Kuzey Afrika ve Endülüs'ün Xativa şehrine yayıldı. Avrupa, kağıtla ilk kez Endülüs ve Sicilya üzerinden tanıştı. 12. yüzyılda İspanya'da kurulan ilk kağıt değirmenleri, yüzyıllar sonra Gutenberg'in matbaasını besleyecek ve Avrupa'daki bilimsel devrimin (Rönesans) maddi zeminini hazırlayacaktı. İslam kağıt endüstrisi, bilginin demokratikleşmesinin tarihteki ilk büyük itici gücüdür."}];

      <div class="info">
        <div class="meta">${item.id} · ${item.creator}</div>
        <h3>${item.title}</h3>
        <p>${item.uzun || item.kisa}</p>
        ${matched ? '<div class="badge-matched">✓ eşleşti</div>' : ''}
      </div>`;
    if(!matched){
      div.onclick = () => { selectedYeni = (selectedYeni === item.id ? null : item.id); renderYeni(); updateMatchBar(); };
    }
    wrap.appendChild(div);
  });
}

function renderTam(){
  const q = document.getElementById('search-tam').value.trim().toLowerCase();
  const wrap = document.getElementById('list-tam');
  wrap.innerHTML = '';
  let shown = 0;
  for(const item of TAM){
    if(q && !(item.name.toLowerCase().includes(q) || item.creator.toLowerCase().includes(q) || item.category.toLowerCase().includes(q) || item.id.toLowerCase().includes(q) || item.slug.toLowerCase().includes(q))) continue;
    shown++;
    if(shown > 150) continue; // performans icin sinir, arama daraltinca daha fazlasi gorunur
    const matched = isMatched(item.id, 'tam');
    const isSel = selectedTam.has(item.id);
    const div = document.createElement('div');
    div.className = 'card' + (matched ? ' matched' : '') + (isSel ? ' selected' : '');
    div.innerHTML = `
      <input type="checkbox" ${isSel ? 'checked' : ''} ${matched ? 'disabled' : ''}>
      <div class="info">
        <div class="meta">${item.category} · ${item.creator}${item.has_img ? ' · 📷' : ''}</div>
        <h3>${item.name}</h3>
        ${matched ? '<div class="badge-matched">✓ eşleşti</div>' : ''}
      </div>`;
    if(!matched){
      div.onclick = () => {
        if(selectedTam.has(item.id)) selectedTam.delete(item.id); else selectedTam.add(item.id);
        renderTam(); updateMatchBar();
      };
    }
    wrap.appendChild(div);
  }
  if(shown > 150){
    const note = document.createElement('p');
    note.className = 'empty-note';
    note.textContent = `${shown} sonuç bulundu, ilk 150 gösteriliyor — daraltmak için arama kutusunu kullan.`;
    wrap.prepend(note);
  }
}

function updateMatchBar(){
  const bar = document.getElementById('matchBar');
  const text = document.getElementById('matchBarText');
  if(selectedYeni && selectedTam.size > 0){
    const y = YENI.find(x=>x.id===selectedYeni);
    const names = [...selectedTam].map(id => TAM.find(x=>x.id===id).name);
    const label = selectedTam.size === 1 ? names[0] : `${selectedTam.size} kayıt: ${names.join(', ')}`;
    text.innerHTML = `<b>${y.title}</b> (${y.id}) &nbsp;↔&nbsp; <b>${label}</b>`;
    bar.classList.add('active');
  } else {
    bar.classList.remove('active');
  }
}

function clearSelection(){
  selectedYeni = null; selectedTam = new Set();
  renderYeni(); renderTam(); updateMatchBar();
}

function confirmMatch(){
  if(!selectedYeni || selectedTam.size === 0) return;
  const y = YENI.find(x=>x.id===selectedYeni);
  selectedTam.forEach(tamId => {
    const t = TAM.find(x=>x.id===tamId);
    matches.push({
      yeni_id: y.id, yeni_title: y.title, yeni_slug: y.slug,
      tam_id: t.id, tam_name: t.name, tam_slug: t.slug, tam_category: t.category
    });
  });
  saveMatches();
  selectedYeni = null; selectedTam = new Set();
  renderAll();
}

function removeMatch(idx){
  matches.splice(idx, 1);
  saveMatches();
  renderAll();
}

function renderMatchesTable(){
  const wrap = document.getElementById('matches-table-wrap');
  document.getElementById('match-count').textContent = matches.length;
  if(matches.length === 0){
    wrap.innerHTML = '<p class="empty-note">Henüz eşleştirme yapılmadı.</p>';
    return;
  }
  let rows = matches.map((m, i) => `
    <tr>
      <td>${m.yeni_id}</td>
      <td>${m.yeni_title}</td>
      <td style="text-align:center">↔</td>
      <td>${m.tam_id}</td>
      <td>${m.tam_name}</td>
      <td>${m.tam_category}</td>
      <td><button onclick="removeMatch(${i})">Geri al</button></td>
    </tr>`).join('');
  wrap.innerHTML = `<table class="matches-table"><thead><tr>
    <th>Yeni ID</th><th>Yeni Başlık</th><th></th><th>Gerçek ID</th><th>Gerçek Kayıt</th><th>Kategori</th><th></th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

function renderAll(){
  renderYeni(); renderTam(); updateMatchBar(); renderMatchesTable();
  document.getElementById('stat-yeni').textContent = (YENI.length - matches.length) + ' / ' + YENI.length + ' yeni kayıt kaldı';
  document.getElementById('stat-matched').textContent = matches.length + ' eşleşme yapıldı';
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(matches, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'hetega_eslestirmeler.json';
  a.click();
}

function copyJSON(){
  navigator.clipboard.writeText(JSON.stringify(matches, null, 2)).then(()=>alert('Kopyalandı! Bunu Claude'+String.fromCharCode(39)+'a yapıştırabilirsin.'));
}

function resetAll(){
  if(!confirm('Tüm eşleştirmeler silinsin mi?')) return;
  matches = [];
  saveMatches();
  renderAll();
}

renderAll();
</script>
</body>
</html>
