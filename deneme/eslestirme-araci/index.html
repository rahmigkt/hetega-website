ek için kullanılan muvakkit geleneğine ait yatay güneş saati."}, {"id": "p138-12", "slug": "saatler-138-12-gunes-saati", "name": "Güneş Saati (Muvakkithane)", "category": "Saatler", "creator": "İslam muvakkit geleneği", "has_img": 1, "desc": "Muvakkithane geleneğinden silindirik/yatay güneş saati varyantı."}, {"id": "p138-13", "slug": "saatler-138-13-i-spanyol-arap-mum-saati", "name": "İspanyol-Arap Mum Saati", "category": "Saatler", "creator": "Endülüs saat geleneği", "has_img": 1, "desc": "Endülüs kökenli, kapıların düşmesiyle zamanı bildiren mekanik mum saati."}, {"id": "p138-14", "slug": "saatler-138-14-takiyyedd-n-in-zemberekli-calar-saati", "name": "Helezoni Zemberekli Saatler (bingâmât devriyye)", "category": "Saatler", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Takiyyeddîn'in tarif ettiği helezoni zemberekli saatler (bingâmât devriyye), Avrupa'nın yay tahrikli saatlerinin Osmanlı karşılığıdır. Takiyyeddîn saat risalesinde zemberekli ve ağırlıklı tipleri karşılaştırmış, eşapman hassasiyetini artırmaya çalışmıştır. Bu saatler, 16. yüzyıl Osmanlı mekaniğinin Avrupa teknolojisini izlediğinin ve özgün çözümler ürettiğinin kanıtıdır."}, {"id": "p138-15", "slug": "saatler-138-15-su-saati", "name": "Su Saati", "category": "Saatler", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Takiyyeddîn'in İstanbul Rasathanesi için tasarladığı mekanik saatler (bingâmât devriyye ve siryâkiyye), 16. yüzyılın en iddialı kronometrik projelerindendir. Rasathane gözlemlerinde saniye hassasiyeti gerektiği için, dönemin Avrupa ve İslam saatleri yetersiz kalmış; Takiyyeddîn kendi «astronomik saatini» (bingâm rasadı) kurmaya girişmiştir. Zemberekli (yay tahrikli) ve ağırlıklı (siryâkiyye) varyasyonları, eşapman mekanizmaları ve kadranlarıyla Avrupa'daki çağdaş saatçilikle yarışır düzeydedir. Bu saatler, rasathanenin «zaman altyapısı»nı oluşturur; gözlemlerin eşzamanlılığı bu mekanik kalbe bağlıdır. Koleksiyonda bu saatler, Osmanlı mühendisinin zamanı ölçme tutkusunun; su saatinden mekanik saate geçişin İslam dünyasındaki en somut ve en trajik (rasathanenin yıkımıyla yarım kalan) belgesidir."}, {"id": "p140-1", "slug": "tesviye-ve-geometri-140-1-tesviye-aletleri", "name": "Tesviye Aletleri", "category": "Tesviye ve Geometri", "creator": "Ömer Hayyam / el-Kaşi / Ebu Sehl el-Kühi", "has_img": 1, "desc": "Geometri ölçüm ve çizim aletleri, İslam matematiğinin soyut cebiri maddeye indirdiği atölye araçlarıdır. Ömer Hayyam'ın kübik denklemleri konik kesitlerin (parabol, hiperbol) kesişimiyle çözerken kullandığı «mükemmel tam pergel» (barkar kamil tamm) ve el‐Kaşi'nin eliptik yörüngeleri çizen özel cetvelleri, yalnız birer çizim aracı değil, aynı zamanda birer «analog bilgisayar»dır. Ebu Sehl el‐Kühi'nin aletleri, mimari mukarnasların ve kubbe geometrilerinin kağıt üzerinde kusursuzca kurgulanmasını sağlamıştır. Koleksiyonda bu aletler, matematiğin mimariyle, astronominin mühendislikle buluştuğu; cetvel ve pergelin, imparatorlukların kubbelerini ve rasathanelerini inşa ettiği o görünmez eşikte durur."}, {"id": "p140-2", "slug": "tesviye-ve-geometri-140-2-tesviye-aletleri", "name": "Tesviye Aletleri", "category": "Tesviye ve Geometri", "creator": "Ömer Hayyam / el-Kaşi / Ebu Sehl el-Kühi", "has_img": 1, "desc": "Geometri ölçüm ve çizim aletleri, İslam matematiğinin soyut cebiri maddeye indirdiği atölye araçlarıdır. Ömer Hayyam'ın kübik denklemleri konik kesitlerin (parabol, hiperbol) kesişimiyle çözerken kullandığı «mükemmel tam pergel» (barkar kamil tamm) ve el‐Kaşi'nin eliptik yörüngeleri çizen özel cetvelleri, yalnız birer çizim aracı değil, aynı zamanda birer «analog bilgisayar»dır. Ebu Sehl el‐Kühi'nin aletleri, mimari mukarnasların ve kubbe geometrilerinin kağıt üzerinde kusursuzca kurgulanmasını sağlamıştır. Koleksiyonda bu aletler, matematiğin mimariyle, astronominin mühendislikle buluştuğu; cetvel ve pergelin, imparatorlukların kubbelerini ve rasathanelerini inşa ettiği o görünmez eşikte durur."}, {"id": "p140-3", "slug": " 40-5-tesviyenin-kucuk-kuvet-ve-latali-ucuncu-tipi", "name": "Tesviyenin küçük küvet ve latalı üçüncü tipi", "category": "Tesviye ve Geometri", "creator": "Ömer Hayyam / el-Kaşi / Ebu Sehl el-Kühi", "has_img": 1, "desc": "Geometri ölçüm ve çizim aletleri, İslam matematiğinin soyut cebiri maddeye indirdiği atölye araçlarıdır. Ömer Hayyam'ın kübik denklemleri konik kesitlerin (parabol, hiperbol) kesişimiyle çözerken kullandığı «mükemmel tam pergel» (barkar kamil tamm) ve el‐Kaşi'nin eliptik yörüngeleri çizen özel cetvelleri, yalnız birer çizim aracı değil, aynı zamanda birer «analog bilgisayar»dır. Ebu Sehl el‐Kühi'nin aletleri, mimari mukarnasların ve kubbe geometrilerinin kağıt üzerinde kusursuzca kurgulanmasını sağlamıştır. Koleksiyonda bu aletler, matematiğin mimariyle, astronominin mühendislikle buluştuğu; cetvel ve pergelin, imparatorlukların kubbelerini ve rasathanelerini inşa ettiği o görünmez eşikte durur."}, {"id": "p140-6", "slug": "tesviye-ve-geometri-140-6-tesviye-araci", "name": "Tesviye Aracı (Grup)", "category": "Tesviye ve Geometri", "creator": "İslam geometri geleneği", "has_img": 1, "desc": "İnşaat ve arazi ölçümlerinde kullanılan su terazisi ve şakül grupları."}, {"id": "p141-7", "slug": "tesviye-ve-geometri-141-7-el-marr-kus-tarafindan-tarif-edilen-ikinci-tesviye-aracinin-yapilan-mo", "name": "el-Marrâkuşî Tesviye Aracı", "category": "Tesviye ve Geometri", "creator": "Hasan el-Marrâkuşî", "has_img": 1, "desc": "İbn el‑Heysem'in «âlet el‑inkâs» (yansıma aleti), düzlem, küresel, silindirik ve konik aynalarda yansıma yasalarını deneysel olarak ölçen bir optik laboratuvarıdır. Bu alet, aynı zamanda Avrupa'da «Problema Alhazeni» (Alhazen's Problem) olarak bilinen ünlü geometri probleminin çözümünde kullanılmıştır: «Verilen bir noktadan çıkan ışığın, küresel bir aynadan yansıyarak başka bir noktaya ulaşması». Bu problem, 4. dereceden denklemlere götürmüş; Avrupa'da Fermat, Huygens ve l'Hôpital gibi dev matematikçileri yüzyıllarca meşgul etmiştir. İbn el‑Heysem'in aleti, yalnız optik değil, aynı zamanda cebir ve konik kesitler geometrisinin de pratik laboratuvarıdır. Koleksiyonda bu düzenek, İslam‑Avrupa matematik diyaloğunun en kalıcı düğüm noktasını temsil eder; bir optik aleti, aslında bir denklem çözme makinesidir."}, {"id": "p141-8", "slug": "tesviye-ve-geometri-141-8-tesviye-terazisi", "name": "Tesviye Terazisi", "category": "Tesviye ve Geometri", "creator": "İslam geometri geleneği", "has_img": 1, "desc": "Arazi eğimlerini ölçmek için kullanılan hassas terazi düzeneği."}, {"id": "p141-9", "slug": "tesviye-ve-geometri-141-9-pergel", "name": "Büyük Yarım Daire Pergeli", "category": "Tesviye ve Geometri", "creator": "İslam geometri geleneği", "has_img": 1, "desc": "Büyük daireleri tek hamlede çizmek için normal pergeller yetersiz kaldığından, İslam geometri ustaları vidalanabilir uzatma parçalarına sahip özel pergeller geliştirmiştir. Büyük daireleri parça parça çizen bu alet, mukarnas, kubbe ve yıldız desenleri estetiğinin ardındaki geometrik tasarımın vazgeçilmez aracıdır. Teorik geometriyi şantiyeye taşıyan sessiz kahramanlardan biridir."}, {"id": "p141-10", "slug": "tesviye-ve-geometri-141-10-pergel", "name": "Büyük Daire Pergeli", "category": "Tesviye ve Geometri", "creator": "İslam geometri geleneği", "has_img": 1, "desc": "Rasathane ve mimari projeler için büyük ölçekli pergel."}, {"id": "p141-11", "slug": "tesviye-ve-geometri-141-11-tesviye-terazisi", "name": "Tesviye Terazisi", "category": "Tesviye ve Geometri", "creator": "İslam geometri geleneği", "has_img": 1, "desc": "İnşaat terazisi; su terazisinin erken İslam uygulaması."}, {"id": "p142-12", "slug": "tesviye-ve-geometri-142-12-tesviye-aletleri", "name": "Tesviye Aletleri", "category": "Tesviye ve Geometri", "creator": "Endülüs mühendislik geleneği", "has_img": 1, "desc": "Endülüs tesviye terazileri, İber Yarımadası'nın «su medeniyeti»nin (acequias, qanat) hassas ölçüm araçlarıdır. Suyun eğimini ve kanalların düzlemini kontrol eden bu teraziler, Endülüs tarım devriminin (pirinç, pamuk, narenciye) altyapısını oluşturur. İslam mühendislerinin nivelman bilgisi, Reconquista sonrasında İspanyol hidromühendisliğine devredilmiştir. Koleksiyonda bu teraziler, suyun yalnız bir nimet değil, matematikle yönetilen bir enerji kaynağı olduğunun; Endülüs'ün yeşil devriminin sessiz tanıklarıdır."}, {"id": "p142-13", "slug": "tesviye-ve-geometri-142-13-pergel", "name": "Konik Kesitler Çizen Pergel", "category": "Tesviye ve Geometri", "creator": "Ebû Sehl el-Kühî geleneği", "has_img": 1, "desc": "el-Kühî'nin konik kesitler çizmek için tasarladığı mükemmel pergel."}, {"id": "p142-14", "slug": "tesviye-ve-geometri-142-14-eb-ca-fer-el-h-zin-nikomedes-m-o-yaklasik-2-yuzyil4-in-cozumunu-alet-m", "name": "Ebu Ca'fer el-Hazin nikomedes (m.ö. yaklaşık 2. yüzyıl4)'in çözümünü «alet metodu»", "category": "Tesviye ve Geometri", "creator": "Endülüs mühendislik geleneği", "has_img": 1, "desc": "Endülüs tesviye terazileri, İber Yarımadası'nın «su medeniyeti»nin (acequias, qanat) hassas ölçüm araçlarıdır. Suyun eğimini ve kanalların düzlemini kontrol eden bu teraziler, Endülüs tarım devriminin (pirinç, pamuk, narenciye) altyapısını oluşturur. İslam mühendislerinin nivelman bilgisi, Reconquista sonrasında İspanyol hidromühendisliğine devredilmiştir. Koleksiyonda bu teraziler, suyun yalnız bir nimet değil, matematikle yönetilen bir enerji kaynağı olduğunun; Endülüs'ün yeşil devriminin sessiz tanıklarıdır."}, {"id": "p142-15", "slug": "tesviye-ve-geometri-142-15-arap-i-slam-geleneginde-nikomedes-m-o-yaklasik-2-yuzyil-in-pergeli", "name": "Arap-İslam Geleneğinde nikomedes (m.ö. yaklaşık 2. yüzyıl)'in Pergeli", "category": "Tesviye ve Geometri", "creator": "Endülüs mühendislik geleneği", "has_img": 1, "desc": "Endülüs tesviye terazileri, İber Yarımadası'nın «su medeniyeti»nin (acequias, qanat) hassas ölçüm araçlarıdır. Suyun eğimini ve kanalların düzlemini kontrol eden bu teraziler, Endülüs tarım devriminin (pirinç, pamuk, narenciye) altyapısını oluşturur. İslam mühendislerinin nivelman bilgisi, Reconquista sonrasında İspanyol hidromühendisliğine devredilmiştir. Koleksiyonda bu teraziler, suyun yalnız bir nimet değil, matematikle yönetilen bir enerji kaynağı olduğunun; Endülüs'ün yeşil devriminin sessiz tanıklarıdır."}, {"id": "p142-16", "slug": "tesviye-ve-geometri-142-16-aciolcer", "name": "Açıölçer", "category": "Tesviye ve Geometri", "creator": "Osmanlı atölyesi", "has_img": 1, "desc": "Osmanlı 16. yüzyılından bu açı ölçer, mimari tasarım, arazi ölçümü ve astronomi eğitiminde kullanılan pratik bir alettir. Sade ama hassas bölümlenmiş yapısı, Takiyyeddin rasathanesini ve muvakkitlik kurumunu besleyen Osmanlı teknik kültürünün parçasıdır. Geometri geleneğinin usta ellerinde yaşayan bir örnek olarak koleksiyonda yer alır."}, {"id": "p143-17", "slug": "tesviye-ve-geometri-143-17-acilir-kapanir-cifte-cetvel", "name": "Usturlap Yapım Aletleri (destür, torna)", "category": "Tesviye ve Geometri", "creator": "Ömer Hayyam / el-Kâşî geleneği", "has_img": 1, "desc": "Usturlap imalatında destür ve torna düzenekleri."}, {"id": "p143-18", "slug": "tesviye-ve-geometri-143-18-hesap-sopasi", "name": "Hesap sopası", "category": "Tesviye ve Geometri", "creator": "Ebu Ali İbn Sina", "has_img": 1, "desc": "İbn Sina'nın tesviye aracı, büyük filozof‐hekimin pratik mühendislik bilgisinin de derin olduğunu gösterir. Suyun ve yapının düzlemini kontrol etmek için tasarlanan bu araç, İbn Sina'nın ansiklopedik dehasının (felsefe, tıp, fizik) «saha mühendisliği»ne uzanan koludur. İslam bilim geleneğinde teorik bilgi (ilm) ile pratik uygulama (amel) arasındaki sınırın ne denli geçirgen olduğunun kanıtıdır. Koleksiyonda bu araç, «filozofun terazisi»dir; soyut aklın yeryüzünü düzlediği andır."}, {"id": "p144-19", "slug": "tesviye-ve-geometri-144-19-daireleri-bolumleme-duzenegi", "name": "Daireleri Bölümleme Düzeneği", "category": "Tesviye ve Geometri", "creator": "el-Bîrûnî geleneği", "has_img": 1, "desc": "el-Bîrûnî'nin İstî'âb adlı eserinde tarif ettiği destür ed-devâ'ir, iç içe döndürülebilir kollarıyla daireleri ve düz çizgileri eşit parçalara bölen zarif bir bölümleme aletidir. Astronomi aletlerinin skalalarının taksimi ve geometrik konstrüksiyonlar için temel bir araç olan bu küçük pirinç düzenek, el-Bîrûnî'nin mühendis zekâsının eserleri kadar aletlerinde de yaşadığını gösterir."}, {"id": "p144-20", "slug": "tesviye-ve-geometri-144-20-egik-uclu-pergel", "name": "Eğik Uçlu Pergel", "category": "Tesviye ve Geometri", "creator": "Ömer Hayyam / el-Kâşî geleneği", "has_img": 1, "desc": "Geometri bölümü, İslam matematiğinin soyut cebiri maddeye ve mimariye indirdiği atölye araçlarını ve teorik zirveleri sergiler. Ömer Hayyâm'ın kübik denklemleri konik kesitlerin (parabol, hiperbol) kesişimiyle çözme yöntemi, Ebû Sehl el-Kühî'nin «mükemmel tam pergel» (barkâr kâmil tâmm) tasarımları ve el-Kâşî'nin eliptik yörünge pergelleri, bu bölümün matematiksel omurgasını oluşturur. Bu aletler, yalnızca kağıt üzerinde çizim yapmak için değil, aynı zamanda İslam mimarisinin karmaşık mukarnas geometrilerini, kubbe kavislerini ve optik aletlerin parabolik aynalarını inşa etmek için kullanılmıştır. Koleksiyonda bu bölüm, matematiğin «görülebilen» ve «dokunulabilen» yüzüdür; pergel ve cetvelin, imparatorlukların kubbelerini ve rasathanelerini inşa ettiği o görünmez eşikte durur."}, {"id": "p144-21", "slug": "tesviye-ve-geometri-144-21-ucayak", "name": "Kimya Fırını Üçayağı", "category": "Tesviye ve Geometri", "creator": "İslam kimya geleneği", "has_img": 1, "desc": "Ebû Bekir er-Râzî'nin tasarladığı «kendi kendisini yelleyen» fırın (nâfih nefsehû), körük gerektirmeden baca etkisiyle kendi hava akımını üreten bir fırındır. Çelik üçayak ve pişirilmiş kil gövde, kimyasal işlemler için sabit ve kontrollü bir ısı sağlar. İşgücünden ve enerjiden tasarruf eden bu tasarım, İslam laboratuvar mühendisliğinin en özgün örneklerinden biridir."}, {"id": "p146-1", "slug": "optik-146-1-gozlemleme-aleti", "name": "Gözlemleme Aleti", "category": "Optik", "creator": "Müeyyededdin el-Urdi", "has_img": 1, "desc": "Müeyyededdin el‐Urdi'nin çember formunda tarif ettiği tesviye aleti, İslam mühendisliğinin «nivelman» (hassas düzlemleme) biliminin zirvesidir. Su kanallarının (kariz, ark) eğimini, bina temellerinin yataylığını ve rasathane zeminlerinin düzlemliğini milimetrik hassasiyetle ölçen bu alet, şakül ve çember geometrisini birleştirir. el‐Urdi, rasathane aletlerinin yanı sıra altyapı mühendisliğinin de ustasıydı. Koleksiyonda bu alet, İslam bilim insanının yalnız gökyüzünü değil, yeryüzünü de aynı matematiksel titizlikle düzlediğinin; su medeniyetinin görünmez kahramanının kanıtıdır."}, {"id": "p146-2", "slug": "optik-146-2-fecir-isigi-isinlarinin-dogrusal-cereyan-ettigini-i-spatlamak-i-cin-de", "name": "Fecir Işığı Işınlarının Doğrusal Cereyan Ettiğini İspatlamak İçin Deney Düzeneği", "category": "Optik", "creator": "Müeyyededdin el-Urdi", "has_img": 1, "desc": "Müeyyededdin el‐Urdi'nin çember formunda tarif ettiği tesviye aleti, İslam mühendisliğinin «nivelman» (hassas düzlemleme) biliminin zirvesidir. Su kanallarının (kariz, ark) eğimini, bina temellerinin yataylığını ve rasathane zeminlerinin düzlemliğini milimetrik hassasiyetle ölçen bu alet, şakül ve çember geometrisini birleştirir. el‐Urdi, rasathane aletlerinin yanı sıra altyapı mühendisliğinin de ustasıydı. Koleksiyonda bu alet, İslam bilim insanının yalnız gökyüzünü değil, yeryüzünü de aynı matematiksel titizlikle düzlediğinin; su medeniyetinin görünmez kahramanının kanıtıdır."}, {"id": "p146-3", "slug": "optik-146-3-karanlik-oda", "name": "Karanlık oda", "category": "Optik", "creator": "Hasan İbn el-Heysem (Ebû Alî el-Hasan b. el-Heysem)", "has_img": 1, "desc": "Camera Obscura (Beyt Muzlim / Karanlık Oda), İbn el-Heysem'in optik tarihini yeniden yazdığı devrim niteliğindeki deney düzeneğidir. Antik Yunan'da Öklid ve Batlamyus, görme olayının gözden çıkan 'görsel ışınların' nesnelere çarpmasıyla (extramission) gerçekleştiğine inanıyordu. İbn el-Heysem, bu teoriyi çürütmek için tamamen karanlık bir odanın (veya kapalı bir kutunun) duvarına küçük bir delik açmış ve dışarıdaki ışık kaynaklarının (mumlar, güneş) delikten geçerek karşı duvarda ters bir görüntü oluşturduğunu gözlemlemiştir. Bu deney, ışığın doğrusal olarak yayıldığını, nesnelerden yansıyan ışınların göze girdiğini ve görmenin pasif bir algı süreci olduğunu matematiksel ve deneysel olarak kanıtlamıştır. İbn el-Heysem, bu düzeneği kullanarak güneş tutulmalarını güvenli bir şekilde gözlemlemiş ve ışığın kırılma/yansıma yasalarını formüle etmiştir. Onun 'Kitâb el-Menâzır'ı, 12. yüzyılda Latince'ye çevrilerek (De Aspectibus) Avrupa'da Roger Bacon, Kepler ve Descartes gibi isimleri derinden etkilemiş; Rönesans perspektif sanatının ve 19. yüzyılda fotoğraf makinesinin icadının teorik altyapısını oluşturmuştur. Camera Obscura, bilimin 'felsefi spekülasyon'dan 'deneysel doğrulama'ya geçtiği anın fiziksel anıtıdır."}, {"id": "p146-4", "slug": "optik-146-4-aksidentel-isigin-dogrusal-cereyan-ettigini-i-spatlamak-i-cin-deney-du", "name": "Aksidentel Işık Deney Düzeneği", "category": "Optik", "creator": "Hasan İbn el-Heysem", "has_img": 1, "desc": "İbn el‑Heysem'in optik aletleri grubu, deneysel bilimin kurucu düzeneklerini bir araya getirir: camera obscura (beyt muzlim) ışığın doğrusal yayılımını kanıtlar; âlet el‑inkâs (yansıma aleti) küresel ve silindirik aynalarda yansıma yasalarını ölçer; Ay Işığını Gözlemleme Aleti (s. 174‑177) ay ışığının karakterini sorgular. «İbn el‑Heysem Problemi» (Problema Alhazeni) ve aksi‑den ışık deneyleri, optiği geometrik‑deneysel bir disipline dönüştürmüştür. Roger Bacon'dan Peckham'a Avrupa optiği bu grubun omzunda yükselir. Koleksiyonda grup, «deney yöntemi»nin maddi doğum belgeleridir; modern laboratuvarın orta çağdaki prototipleri."}, {"id": "p146-5", "slug": "optik-146-5-i-bn-el-heysem-problemi", "name": "İbn el-Heysem Problemi", "category": "Optik", "creator": "Müeyyededdin el-Urdi", "has_img": 1, "desc": "Müeyyededdin el‐Urdi'nin çember formunda tarif ettiği tesviye aleti, İslam mühendisliğinin «nivelman» (hassas düzlemleme) biliminin zirvesidir. Su kanallarının (kariz, ark) eğimini, bina temellerinin yataylığını ve rasathane zeminlerinin düzlemliğini milimetrik hassasiyetle ölçen bu alet, şakül ve çember geometrisini birleştirir. el‐Urdi, rasathane aletlerinin yanı sıra altyapı mühendisliğinin de ustasıydı. Koleksiyonda bu alet, İslam bilim insanının yalnız gökyüzünü değil, yeryüzünü de aynı matematiksel titizlikle düzlediğinin; su medeniyetinin görünmez kahramanının kanıtıdır."}, {"id": "p148-1", "slug": "fizik-ve-teknik-148-1-areometrei", "name": "el-Hâzinî'nin Areometresi", "category": "Fizik ve Teknik", "creator": "Abdurrahmân el-Hâzinî", "has_img": 1, "desc": "el-Hâzinî'nin sıvıların özgül ağırlığını sayısal olarak belirlemek için geliştirdiği areometre, orta çağın en sofistike fizik aletlerinden biridir. Hâkkedilmiş pirinç gövde ve cam silindir, sıvıların yoğunluğunu şaşırtıcı bir hassasiyetle ölçer. Bu alet, İslam «terazi bilimi» geleneğinin zirvesi ve modern hidrometrenin doğrudan atasıdır."}, {"id": "p148-2", "slug": "fizik-ve-teknik-148-2-hikmet-terazisi", "name": "Mîzân el-Hikme (Bilgelik Terazisi, el-Hâzinî)", "category": "Fizik ve Teknik", "creator": "Abdurrahmân el-Hâzinî", "has_img": 1, "desc": "el-Hâzinî'nin mükemmelleştirdiği «bilgelik terazisi» (mîzân el-hikme), metallerin ve değerli taşların özgül ağırlığını havada ve suda tartarak belirleyen hidrostatiik bir terazidir. Beş kefeli ve hareketli sürgülü bu alet, İslam «terazi bilimi»nin zirvesi ve modern hassas terazilerin atasıdır."}, {"id": "p148-3", "slug": "fizik-ve-teknik-148-3-terazi", "name": "İbreli Terazi (kabbân)", "category": "Fizik ve Teknik", "creator": "el-İsfizârî / İslam metroloji", "has_img": 1, "desc": "İbreli terazi (kabbân), İslam çarşısının en yaygın tartı aleti ve aynı zamanda teorik bir bilimin konusudur: «ilm el-karastûn» (kantar bilimi). el-İsfizârî'nin İrşâd'ı ve Sabit b. Kurra'nın Kitâb el-Karastûn'u, kaldıraç ilkesini matematikleştirerek ibreli terazinin kuramını kurmuş; karşıt ağırlığın konumunu oranlarla belirlemiştir. Kabbân, ticarette, vergide ve darphanede vazgeçilmezdi; muhtesib teşkilatı çarşıdaki kantarların doğruluğunu denetler, «ölçü ve tartı» devletin meşruiyetinin parçası sayılırdı. Tek kollu tasarımı, küçük bir sürgüyle ağır yüklerin tartılmasını sağlayarak modern baskülün atası olmuştur. Bu alet, gündelik ekonomik hayat ile teorik mekaniği birbirine bağlayan nadir nesnelerdendir; İslam uygarlığının yalnız «yüksek bilim» değil, bir metroloji (ölçüm) kültürü de ürettiğinin en somut kanıtıdır."}, {"id": "p148-4", "slug": "fizik-ve-teknik-148-4-osmanli-terazi", "name": "Osmanlı / Bizans Terazisi", "category": "Fizik ve Teknik", "creator": "Osmanlı/Bizans atölyesi", "has_img": 1, "desc": "Dumbarton Oaks koleksiyonundaki Bizans terazisi (acc. no. 40.11), kaldıraçlı terazi geleneğinin geç antik dönem halkasının çarpıcı bir örneğidir. İslam kabbân/karastün geleneği, bu Bizans örnekleriyle ortak bir teknolojik kökü paylaşır. Terazinin koleksiyonda yer alması, ölçüm kültürünün Doğu Akdeniz'de kültürlerarası aktarımını gösterir."}, {"id": "p148-5", "slug": "fizik-ve-teknik-148-5-ozgul-agirligin-sayisal-olarak-belirlenmeleri", "name": "Özgül Ağırlık Hesapları (el-Hâzinî)", "category": "Fizik ve Teknik", "creator": "Abdurrahmân el-Hâzinî", "has_img": 1, "desc": "el-Hâzinî'nin sıvıların özgül ağırlığını sayısal olarak belirlemek için geliştirdiği areometre, orta çağın en sofistike fizik aletlerinden biridir. Hâkkedilmiş pirinç gövde ve cam silindir, sıvıların yoğunluğunu şaşırtıcı bir hassasiyetle ölçer. Bu alet, İslam «terazi bilimi» geleneğinin zirvesi ve modern hidrometrenin doğrudan atasıdır."}, {"id": "p149-6", "slug": "fizik-ve-teknik-149-6-kovali-su-dolabi", "name": "Kovalı Su Dolabı (Sâkiye)", "category": "Fizik ve Teknik", "creator": "İslam mühendislik geleneği", "has_img": 1, "desc": "Sâkiye, İslam tarım devriminin iki büyük su kaldırma makinesinden biridir (diğeri nâ'ûra/dolap). Hayvan gücüyle döndürülen çark, kova zinciriyle kuyudan veya ırmaktan suyu yükseltip sulama kanalına boşaltır; dişli sistemi (pinion ve büyük çark) hayvanın gücünü katlar. Endülüs'ten Pencap'a sâkiye, sulanabilir tarım alanını genişletmiş; şeker kamışı, pamuk ve narenciye gibi yeni ürünleri Akdeniz'e taşımıştır. Gıcırtılı çarkın sesi, kırsal ses peyzajının parçası olmuş, şiire ve atasözlerine girmiştir. Bugün hâlâ bazı bölgelerde kullanılan sâkiye, İslam mühendisliğinin «yeşil» enerji teknolojisi olarak mirasıdır; koleksiyonda değirmenler ve pompalar zincirinin halkası olarak, suyun İslam uygarlığındaki merkezi yerini hatırlatır: su, yalnız nimet değil, aynı zamanda bir mühendislik nesnesiydi."}, {"id": "p149-7", "slug": "fizik-ve-teknik-149-7-perpetuum-mobile", "name": "Perpetuum Mobile (sürekli hareket düzeneği)", "category": "Fizik ve Teknik", "creator": "Villard de Honnecourt", "has_img": 1, "desc": "Perpetuum mobile (sürekli hareket düzeneği), mekanik tarihinin en baştan çıkarıcı hayalidir: dışarıdan enerji almadan sonsuza dek işleyen makine. İslam kaynakları (kendi kendine yelleyen fırın, sonsuz ışık lambası, el-Murâdî otomatları) ve Avrupa notları (Villard de Honnecourt'un ağırlıklı çarkı), bu tasarımlarla doludur; imkânsızlık ancak 19. yüzyıl termodinamiğiyle kesinleşmiştir. Ancak bu hayal verimsiz değildi: sürekli hareket arayışı, dişli dizilerini, eşapmanları ve kendi kendini düzenleyen mekanizmaları —kısaca modern makine mühendisliğinin alet kutusunu— üretmiştir. Koleksiyonda perpetuum mobile, insan yaratıcılığının sınırlarını ve doğa yasalarıyla diyaloğunu gösteren «kavramsal bir otomat»tır; mekanik bölümünün en felsefi parçası olarak, bilimin yalnız çözümlerden değil, verimli hayallerden de beslendiğini hatırlatır."}, {"id": "p149-8", "slug": "fizik-ve-teknik-149-8-helezonlu-pompa", "name": "Helezonlu Pompa", "category": "Fizik ve Teknik", "creator": "Eyyubi atölyeleri (el-Melik el-Kamil)", "has_img": 1, "desc": "Eyyubi sultanı el‐Melik el‐Kamil'in İmparator II. Friedrich'e hediye ettiği planetaryum, bilim tarihinin en ünlü diplomatik nesnelerinden biridir: gök cisimlerinin hareketlerini dişli çarklarla gösteren bu mekanik küre, İslam mühendisliğinin Avrupa saraylarındaki prestij elçisiydi. Friedrich'in bilim merakı ve el‐Kamil'in kültürel diplomasisi, bu hediyeyle somutlaşır; planetaryum, «bilim‐siyaset» diyaloğunun orta çağdaki zirvesidir. Mekanik‐astronomik takvim geleneğinin (el‐Biruni, el‐İşfehani) bir ürünü olan bu küre, Avrupa'da mekanik saat ve planetaryum gelişimini dolaylı biçimde beslemiştir. Koleksiyonda bu parça, bilimin sınır tanımayan gücünün simgesidir."}, {"id": "p149-9", "slug": "fizik-ve-teknik-149-9-oylum-olcekleri", "name": "Oylum (Hacim) Ölçekleri", "category": "Fizik ve Teknik", "creator": "İslam metroloji geleneği", "has_img": 1, "desc": "Antik ağırlıklar, metrolojinin (ölçüm bilimi) en mütevazı ama en bilgilendirici nesneleridir: her taş ve metal parçası, ticaretin, verginin ve güvenin standardının bir fosilidir. İslam dünyası, antik ağırlık sistemlerini (mithkal, dirhem, ukıyye) devralıp standartlaştırmış; muhtesib teşkilatı çarşıdaki ağırlıkları denetleyerek «ölçü ve tartı»yı adaletin simgesi kılmıştır. Fustat (Mısır) ve Nişâpür buluntuları, bu standardizasyonun coğrafi genişliğini gösterir. Antik ağırlıklar, koleksiyonda «Antik Objeler» bölümünü terazi bilimi (mîzân, karastûn, mîzân el-hikme) ile bağlar: küçük bir taş parçası, bin yıllık ekonomik tarihin ve bilimsel hassasiyetin taşıyıcısıdır. Müze vitrininde sessiz duran bu nesneler, aslında uygarlığın görünmez altyapısının —güvenin— maddi kanıtıdır."}, {"id": "p149-10", "slug": "fizik-ve-teknik-149-10-bir-su-dolabi-tympanum", "name": "Bir su Dolabı (tympanum)", "category": "Fizik ve Teknik", "creator": "İslam mühendislik geleneği", "has_img": 1, "desc": "Sakiye, İslam tarım devriminin iki büyük su kaldırma makinesinden biridir (diğeri na'ura/dolap). Hayvan gücüyle döndürülen çark, kova zinciriyle kuyudan veya ırmaktan suyu yükseltip sulama kanalına boşaltır; dişli sistemi (pinion ve büyük çark) hayvanın gücünü katlar. Endülüs'ten Pencap'a sakiye, sulanabilir tarım alanını genişletmiş; şeker kamışı, pamuk ve narenciye gibi yeni ürünleri Akdeniz'e taşımıştır. Gıcırtılı çarkın sesi, kırsal ses peyzajının parçası olmuş, şiire ve atasözlerine girmiştir. Bugün hala bazı bölgelerde kullanılan sakiye, İslam mühendisliğinin «yeşil» enerji teknolojisi olarak mirasıdır; koleksiyonda değirmenler ve pompalar zincirinin halkası olarak, suyun İslam uygarlığındaki merkezi yerini hatırlatır: su, yalnız nimet değil, aynı zamanda bir mühendislik nesnesiydi."}, {"id": "p150-11", "slug": "fizik-ve-teknik-150-11-tesis", "name": "Tesis", "category": "Fizik ve Teknik", "creator": "İslam zanaat / Havas geleneği", "has_img": 1, "desc": "Kalker üzerine kufi hatla kazınmış «li-şahibihi bereketün min Allah» (Sahibine Allah'tan bereket vardır) yazıtlı bu amulet, İslam dünyasının metafizik ve koruyucu tılsım (havas) geleneğinin zarif bir örneğidir. Sasani ve Bizans mühür geleneklerini devralan İslam zanaatkarları, bu formları geometrik süslemeler ve Kur'an ayetleri/esma-ül hüsna ile harmanlayarak yeni bir «manevi zırh» estetiği yaratmışlardır. Bu küçük nesne, bilimin ve rasyonalitenin yanında, halkın gündelik kaygılarının, hastalık ve nazara karşı korunma arayışlarının da maddi kültürün bir parçası olduğunu hatırlatır. Koleksiyonda bu amulet, «Antik Objeler» bölümünün en dokunaklı parçalarından biridir; taşın üzerine kazınmış bir dua, bin yıllık bir insanlık kaygısının sessiz tanığıdır."}, {"id": "p150-12", "slug": "fizik-ve-teknik-150-12-palanga", "name": "Palanga / Makara Düzeneği", "category": "Fizik ve Teknik", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "İki pistonlu su çıkarma cihazı, Takiyyeddîn'in et-Turuk es-Seniyye'sinde ve Leonardo da Vinci'nin notalarında paralel olarak karşımıza çıkan, Doğu-Batı teknik yaratıcılığının en ünlü örneklerindendir. Piston-valf sistemi, dönme hareketini pompalama işine çevirerek modern pompanın temelini kurar. Bu cihaz, İslam mekanik geleneğinin Avrupa Rönesansı'na etkisinin somut kanıtıdır."}, {"id": "p150-13", "slug": "fizik-ve-teknik-150-13-yel-degirmeni", "name": "Yel Değirmeni (Rahâ)", "category": "Fizik ve Teknik", "creator": "İslam mühendislik geleneği", "has_img": 1, "desc": "Yel değirmeni (rahâ), ilk kez Sistan'da (bugünkü İran-Afganistan sınırı) belgelenen ve İslam dünyasının en önemli enerji icatlarından biridir. Dikey eksenli değirmenler, rüzgâr gücüyle tahıl öğütüp su çekiyordu. Haçlı seferleri ve Endülüs yoluyla Avrupa'ya aktarılan yel değirmeni, sanayi öncesi enerji devriminin İslam kökeninin simgesidir."}, {"id": "p150-14", "slug": "fizik-ve-teknik-150-14-makas-bicimli-kaldirac", "name": "Makas Biçimli Kaldıraç", "category": "Fizik ve Teknik", "creator": "İslam zanaat / Havas geleneği", "has_img": 1, "desc": "Kalker üzerine kufi hatla kazınmış «li-şahibihi bereketün min Allah» (Sahibine Allah'tan bereket vardır) yazıtlı bu amulet, İslam dünyasının metafizik ve koruyucu tılsım (havas) geleneğinin zarif bir örneğidir. Sasani ve Bizans mühür geleneklerini devralan İslam zanaatkarları, bu formları geometrik süslemeler ve Kur'an ayetleri/esma-ül hüsna ile harmanlayarak yeni bir «manevi zırh» estetiği yaratmışlardır. Bu küçük nesne, bilimin ve rasyonalitenin yanında, halkın gündelik kaygılarının, hastalık ve nazara karşı korunma arayışlarının da maddi kültürün bir parçası olduğunu hatırlatır. Koleksiyonda bu amulet, «Antik Objeler» bölümünün en dokunaklı parçalarından biridir; taşın üzerine kazınmış bir dua, bin yıllık bir insanlık kaygısının sessiz tanığıdır."}, {"id": "p150-15", "slug": "fizik-ve-teknik-150-15-gemi-degirmeni", "name": "Gemi Değirmeni (Caraba)", "category": "Fizik ve Teknik", "creator": "İslam mühendislik geleneği", "has_img": 1, "desc": "Gemi değirmeni (caraba), demirli bir tekneye monte edilen su çarkının nehir akıntısıyla döndürülmesiyle çalışan dahiyane bir düzeneğidir. Dicle ve Fırat'ta yaygın olarak kullanılan bu değirmenler, akışın kinetik enerjisini öğütme işine dönüştürürdü. Gemi değirmeni, İslam hidro-mühendisliğinin en özgün ürünlerinden biri olarak yüzyıllarca kent yaşamının parçası oldu."}, {"id": "p151-16", "slug": "fizik-ve-teknik-151-16-duzenek-isi-etkisiyle-su-kaldirmak-icin", "name": "Isı/Buhar Etkisiyle Su Kaldırma Düzeneki", "category": "Fizik ve Teknik", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Takiyyeddîn'in buharla çalışan döner şiş çeviricisi, buhar gücünün mekanik harekete dönüştürüldüğü bilinen en erken düzeneklerden biridir: kazanda kaynayan suyun buharı, bir lüleden çıkarak kanatçıklı bir çarkı döndürür; ısıtma spirali ve durdurma supabı, sistemi kontrol edilebilir kılar. Bu tasarım, Avrupa'da Branca (1629) ve Papin'den on yıllar önce, buhar türbini ilkesini pratik bir mutfak otomasyonuna uygulamıştır. Model, kazanı ve supabıyla birlikte yeniden inşa edilmiş; pirinç‑bakır işçiliği Osmanlı metal sanatının inceliğini sergilemiştir. Koleksiyonun «vitrin» parçalarından olan bu düzenek, sanayi devriminin köklerinin İslam mühendisliğinde olduğunu anlatan en çarpıcı nesnedir; buhar çağı, saray mutfağında başlamıştır."}, {"id": "p151-17", "slug": "fizik-ve-teknik-151-17-sicak-havayla-calisan-doner-dondurucusu", "name": "Sıcak Hava Türbinli Şiş Çeviricisi (2. düzenek)", "category": "Fizik ve Teknik", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Takiyyeddîn'in buharla çalışan döner şiş çeviricisi, buhar gücünün mekanik harekete dönüştürüldüğü bilinen en erken düzeneklerden biridir: kazanda kaynayan suyun buharı, bir lüleden çıkarak kanatçıklı bir çarkı döndürür; ısıtma spirali ve durdurma supabı, sistemi kontrol edilebilir kılar. Bu tasarım, Avrupa'da Branca (1629) ve Papin'den on yıllar önce, buhar türbini ilkesini pratik bir mutfak otomasyonuna uygulamıştır. Model, kazanı ve supabıyla birlikte yeniden inşa edilmiş; pirinç‑bakır işçiliği Osmanlı metal sanatının inceliğini sergilemiştir. Koleksiyonun «vitrin» parçalarından olan bu düzenek, sanayi devriminin köklerinin İslam mühendisliğinde olduğunu anlatan en çarpıcı nesnedir."}, {"id": "p151-18", "slug": "fizik-ve-teknik-151-18-krankli-ve-disli-cark-mekanizmali-doner-dondurucusu", "name": "Ağırlık Tahrikli Şiş Çeviricisi", "category": "Fizik ve Teknik", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Üçüncü düzenek, inen bir ağırlığın potansiyel enerjisini dişli oranlarıyla büyüterek şişi döndürür; Takiyyeddîn burada «küçük gücü büyük işe çevirme» problemini, saatçiliğin eşapman ve dişli bilgisini mutfak teknolojisine taşıyarak çözer. Ağırlığın düşüş hızını düzenleyen kaçış mekanizması, dönme hızını sabitler; böylece şiş, ateş karşısında eşit pişirme sağlar. Bu düzenek, el‑Cezerî'nin ağırlıklı otomatları ile Avrupa'nın zemberekli saatleri arasındaki teknik sürekliliğin halkasıdır. Koleksiyonda üçlü serinin (buhar‑sıcak hava‑ağırlık) son üyesi olarak, 16. yüzyıl Osmanlı mühendisinin enerji kaynaklarını sistematik biçimde karşılaştıran yöntemini gösterir."}, {"id": "p151-19", "slug": "fizik-ve-teknik-151-19-disli-cark-mekanizmali-vinc", "name": "Dişli Çark Mekanizmalı Vinç", "category": "Fizik ve Teknik", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Delhi «Karma Alet»inin gnomonu, iki dereceli yarım daire üzerinde güneşin meridyen yüksekliğini okutan anıtsal bir gölge ölçerdir. Taşın kalıcılığı, gözlemin tekrarlanabilirliğini garanti eder; her öğlen, aynı gölge aynı çizgiyi keser. Bu düzenek, İslam gnomon (mikyas) geleneğinin Hindistan'daki mimari zirvesidir; azlâl (gölge tabloları) bilimi, burada taşa yazılmıştır. Koleksiyonda gnomon, «en basit alet‑en derin bilim» ilkesinin temsilcisidir; bir dikili taş, küresel trigonometrinin kapısıdır."}, {"id": "p152-20", "slug": "fizik-ve-teknik-152-20-i-cme-kabi", "name": "Hayret Uyandırıcı İçme Kabı", "category": "Fizik ve Teknik", "creator": "Benû Mûsâ kardeşler", "has_img": 1, "desc": "Benû Mûsâ'nın Hileler Kitabı'ndaki «hayret uyandırıcı içme kabı», farklı sıvıları sırayla veya istenen oranlarda sunan oyunbaz bir otomattır. Gizli valf ve sifon sistemleri, konuğa şarap, su veya karışımları ardışık biçimde ikram eder. Bu kap, İslam mekaniğinin yalnızca fayda değil, eğlence ve hayret üretme sanatı olduğunun da kanıtıdır."}, {"id": "p152-21", "slug": "fizik-ve-teknik-152-21-allah-lambasi-sonsuz-isik", "name": "Allah Lambası (Sonsuz Işık)", "category": "Fizik ve Teknik", "creator": "Benû Mûsâ kardeşler", "has_img": 1, "desc": "Benû Mûsâ'nın tarif ettiği «Allah lambası» (sıne Allah), yani sonsuz ışık, kendi yağ seviyesini ve fitil konumunu otomatik koruyan bir lambadır. Uzun süre insan müdahalesi olmadan yanabilen lamba, türbeler ve mescitler için tasarlanmıştır. Bu düzenek, inanç ile mühendisliği birleştiren İslam otomat geleneğinin en şiirsel örneklerindendir."}, {"id": "p152-22", "slug": "fizik-ve-teknik-152-22-sicak-ve-soguk-suyu-nobetlese-veren-otomat", "name": "Sıcak ve Soğuk Su Otomatı", "category": "Fizik ve Teknik", "creator": "Benû Mûsâ kardeşler", "has_img": 1, "desc": "İstenildiğinde sıcak veya soğuk su akıtan mekanik kap; teyit bekliyor."}, {"id": "p152-23", "slug": "fizik-ve-teknik-152-23-degisken-sekilli-fiskiye", "name": "Değişken Şekilli Fıskiye", "category": "Fizik ve Teknik", "creator": "İslam mühendislik geleneği", "has_img": 1, "desc": "Suyun basıncını kullanarak periyodik olarak farklı formlar (kalkan, zambak) alan fıskiye."}, {"id": "p154-1", "slug": "askeri-teknoloji-154-1-cekme-guclu-mancinik", "name": "Çekme Güçlü Mancınık (Traction Trebuchet)", "category": "Askeri Teknoloji", "creator": "İslam kuşatma mühendisliği", "has_img": 1, "desc": "Karşıt ağırlıklı mancınık (trebuchet), orta çağın en güçlü kuşatma makinesi ve küresel teknoloji tarihinin en iyi belgelenmiş aktarım vakalarından biridir. Arapça terminoloji (mancanîk, ziyâr, kavs ez-ziyâr) ve teknik literatür (K. ed-Debbâbât ve'l-Menâcnîkât), İslam dünyasının mancınığı sistematik biçimde analiz ettiğini gösterir; Cahen'in araştırmaları, ziyâr yaylı silahın Moğollardan değil, en geç Selahaddin döneminden itibaren bilindiğini kanıtlar. Haçlı seferleri, trebuchet'nin Avrupa'ya geçişinde köprü olmuş; karşıt ağırlık ilkesi, «yerçekimi motoru»nun atası sayılmıştır. Mancınık, koleksiyonda kuşatma çağını temsil eder: barutlu silahlarla birlikte askerî teknolojinin iki büyük faslını oluşturur. Dev ahşap kolları ve taş gülleleri, orta çağın «korku mimarisi»nin parçasıydı; aynı zamanda mühendisliğin prestij nesnesiydi."}, {"id": "p154-2", "slug": "askeri-teknoloji-154-2-denge-agirlikli-mancinik", "name": "Denge Ağırlıklı Mancınık", "category": "Askeri Teknoloji", "creator": "İslam kuşatma mühendisliği", "has_img": 1, "desc": "Karşıt ağırlık (counterweight) prensibiyle çalışan, çok daha ağır mermiler fırlatabilen gelişmiş kuşatma makinesi."}, {"id": "p154-3", "slug": "askeri-teknoloji-154-3-denge-agirlikli-buyuk-mancinik", "name": "Büyük Karşıt Ağırlıklı Mancınık", "category": "Askeri Teknoloji", "creator": "İslam kuşatma mühendisliği", "has_img": 1, "desc": "Kale surlarını yıkmak için tasarlanmış devasa boyutlu karşıt ağırlıklı mancınık."}, {"id": "p155-4", "slug": "askeri-teknoloji-155-4-denge-agirlikli-mancinik", "name": "Denge Ağırlıklı Mancınık (Ok Fırlatıcılı)", "category": "Askeri Teknoloji", "creator": "İslam kuşatma mühendisliği", "has_img": 1, "desc": "Karşıt ağırlık mekanizmasına entegre edilmiş çoklu ok fırlatma sistemi."}, {"id": "p155-5", "slug": "askeri-teknoloji-155-5-denge-agirlikli-mancinik", "name": "Fars Mancınığı ve Sasani Öncülleri", "category": "Askeri Teknoloji", "creator": "İbn en-Nedîm (Fihrist)", "has_img": 1, "desc": "İbn en-Nedîm'in andığı Sasani/Hint kökenli erken mancınık ve şahmerdan tercümeleri."}, {"id": "p155-6", "slug": "askeri-teknoloji-155-6-bocurgatli-buyuk-ok-atar", "name": "Bocurgatlı Büyük Ok Atar", "category": "Askeri Teknoloji", "creator": "el-Enîk / Murdâ et-Tarsûsî", "has_img": 1, "desc": "el-Enîk fi'l-Menâcnîk ve Murdâ'nın Tabşira'sına göre modellenen büyük ok atarı, surlara karşı ağır oklar ve mızraklar fırlatan dev bir «yay kulesi»dir. Çark ve kiriş mekanizması, insan gücünün çok ötesinde bir gerilim depolar. Barut çağında geliştirilen bu aletler, mekanik kuşatma teknolojisinin son büyük ürünleridir."}, {"id": "p155-7", "slug": "askeri-teknoloji-155-7-uc-buyuk-yayli-ok-atar", "name": "Üç Büyük Yaylı Ok Atar (Triple Crossbow-Ballista)", "category": "Askeri Teknoloji", "creator": "Murda b. Ali et-Tarsûsî", "has_img": 1, "desc": "Tek bir mekanizmayla aynı anda üç büyük ok fırlatabilen bileşik balista."}, {"id": "p156-8", "slug": "askeri-teknoloji-156-8-arap-denge-agirlikli-manciniklarin-avrupa-daki-yayilimi", "name": "Arap Denge Ağırlıklı mancınıkların Avrupa'daki Yayılımı", "category": "Askeri Teknoloji", "creator": "", "has_img": 1, "desc": "Antik ağırlıklar, metrolojinin (ölçüm bilimi) en mütevazı ama en bilgilendirici nesneleridir: her taş ve metal parçası, ticaretin, verginin ve güvenin standardının bir fosilidir. İslam dünyası, antik ağırlık sistemlerini (mithkal, dirhem, ukıyye) devralıp standartlaştırmış; muhtesib teşkilatı çarşıdaki ağırlıkları denetleyerek «ölçü ve tartı»yı adaletin simgesi kılmıştır. Fustat (Mısır) ve Nişapür buluntuları, bu standardizasyonun coğrafi genişliğini gösterir. Antik ağırlıklar, koleksiyonda «Antik Objeler» bölümünü terazi bilimi (mizan, karastun, mizan el-hikme) ile bağlar: küçük bir taş parçası, bin yıllık ekonomik tarihin ve bilimsel hassasiyetin taşıyıcısıdır. Müze vitrininde sessiz duran bu nesneler, aslında uygarlığın görünmez altyapısının —güvenin— maddi kanıtıdır."}, {"id": "p156-9", "slug": "askeri-teknoloji-156-9-mancinik-mesafe-ayarlayicili", "name": "Mancınık mesafe Ayarlayıcılı", "category": "Askeri Teknoloji", "creator": "", "has_img": 1, "desc": "Antik ağırlıklar, metrolojinin (ölçüm bilimi) en mütevazı ama en bilgilendirici nesneleridir: her taş ve metal parçası, ticaretin, verginin ve güvenin standardının bir fosilidir. İslam aletin simgesi kılmıştır. Fustat (Mısır) ve Nişapür buluntuları, bu standardizasyonun coğrafi genişliğini gösterir. Antik ağırlıklar, koleksiyonda «Antik Objeler» bölümünü terazi bilimi (mizan, karastun, mizan el-hikme) ile bağlar: küçük bir taş parçası, bin yıllık ekonomik tarihin ve bilimsel hassasiyetin taşıyıcısıdır. Müze vitrininde sessiz duran bu nesneler, aslında uygarlığın görünmez altyapısının —güvenin— maddi kanıtıdır."}, {"id": "p157-14", "slug": "askeri-teknoloji-157-14-osmanli-roketleri", "name": "Osmanlı roketleri", "category": "Askeri Teknoloji", "creator": "", "has_img": 1, "desc": "Antik ağırlıklar, metrolojinin (ölçüm bilimi) en mütevazı ama en bilgilendirici nesneleridir: her taş ve metal parçası, ticaretin, verginin ve güvenin standardının bir fosilidir. İslam dünyası, antik ağırlık sistemlerini (mithkal, dirhem, ukıyye) devralıp standartlaştırmış; muhtesib teşkilatı çarşıdaki ağırlıkları denetleyerek «ölçü ve tartı»yı adaletin simgesi kılmıştır. Fustat (Mısır) ve Nişapür buluntuları, bu standardizasyonun coğrafi genişliğini gösterir. Antik ağırlıklar, koleksiyonda «Antik Objeler» bölümünü terazi bilimi (mizan, karastun, mizan el-hikme) ile bağlar: küçük bir taş parçası, bin yıllık ekonomik tarihin ve bilimsel hassasiyetin taşıyıcısıdır. Müze vitrininde sessiz duran bu nesneler, aslında uygarlığın görünmez altyapısının —güvenin— maddi kanıtıdır."}, {"id": "p158-15", "slug": "askeri-teknoloji-158-15-balistik-tesviye-araci", "name": "Balistik Tesviye Aracı (Açı Ölçer)", "category": "Askeri Teknoloji", "creator": "İslam topçu/kuşatma geleneği", "has_img": 1, "desc": "Denge ağırlıklı büyük mancınık üzerine monte edilen açı ölçer, askerî mühendisliğin bir ölçüm bilimine dönüştüğünün kanıtıdır. Arapça kuşatma literatüründe (el-Enîk fi'l-Menâcnîk, Tabşira) mancınığın kol açısı menzili belirler; ölçekli kadran ve şakül, atıcıya aynı açıyı tekrar tekrar kurma imkânı vererek atışı standartlaştırır. Bu «balistik matematikleştirme», erken modern Avrupa'nın balistik cetvellerini (Tartaglia, Galileo) iki yüzyıl önce haber verir. Açı ölçer, İslam savaş makinelerinin yalnız kaba kuvvet araçları değil, aynı zamanda birer laboratuvar olduğunu gösterir: kuşatma kampı, geometrinin uygulandığı bir okuldu. Koleksiyonda bu küçük düzenek, savaş ile bilim arasındaki diyaloğun sessiz tanığıdır; mancınıkların ahşap dev gövdeleri yanında, zihnin hassasiyetini temsil eder."}, {"id": "p158-16", "slug": "askeri-teknoloji-158-16-atesli-el-silahi", "name": "Erken Ateşli El Silahı", "category": "Askeri Teknoloji", "creator": "Osmanlı/Avrupa topçu geleneği", "has_img": 1, "desc": "Erken top, barut çağının en devrimci ürünüdür: patlayıcı karışımın itki gücünün mermiye dönüştürülmesi, surları, devletleri ve savaşın doğasını yeniden tanımlamıştır. İslam dünyası top teknolojisini hızla benimsemiş; Osmanlıların 1453 İstanbul kuşatmasındaki dev topları, bu birikimin en ünlü uygulaması olmuştur. Döküm teknikleri, barut oranları ve atış cetvelleri, askerî literatürde (ilm-i remy) sistemleşmiştir. Avrupa'daki erken top tasvirleri (Walter de Milemete, 1326) ile İslam kaynakları yan yana okunduğunda, aktarımın çok yönlü olduğu görülür: teknoloji, Akdeniz'in iki yakası arasında bir ping-pong gibi gidip gelmiştir. Top, koleksiyonda yalnız bir silah değil, erken modern devlet ve ekonominin de motorudur; askerî teknoloji bölümünün en ağır parçasıdır."}, {"id": "p158-17", "slug": "askeri-teknoloji-158-17-balistik-skala", "name": "Balistik Skala / Nişangah Cetveli", "category": "Askeri Teknoloji", "creator": "Osmanlı topçu geleneği", "has_img": 1, "desc": "Top ve tüfeklerde mesafeye göre barut miktarını ve nişangah açısını hesaplamaya yarayan dereceli cetvel."}, {"id": "p158-18", "slug": "askeri-teknoloji-158-18-i-stihkam-kuleleri", "name": "Debbâbe (zırhlı kuşatma makinesi)", "category": "Askeri Teknoloji", "creator": "İslam kuşatma mühendisliği", "has_img": 1, "desc": "Debbâbe, surlara yaklaşan istihkâmcıları ok ve ateşten koruyan, tekerlekli ve zırhlı bir «yürüyen siper»dir; adını, deve yavrusu gibi ağır ağır «sürünmesi»nden (debeb) alır. Arapça kuşatma literatürü (K. ed-Debbâbât), deri ve ahşap kaplamalı gövdeyi, tekerlek düzenini ve koçbaşı başlığını ayrıntıyla tarif eder; zahhâfa ve zırhlı arabalar aynı ailenin üyeleridir. Giovanni Fontana'nın 15. yüzyıldaki «alphasat» (ez-zahhâfa) tasviri, üzerindeki Arapça yazıtla, Avrupa'ya aktarımın doğrudan belgesidir. Debbâbe, modern zırhlı araçların ve tankın orta çağ atasıdır; koleksiyonda mancınıkla birlikte «kuşatma mühendisliği»ni temsil eder. Askerî teknolojinin en görsel parçalarından biri olarak, savaşın aynı zamanda bir tasarım problemi olduğunu hatırlatır."}, {"id": "p160-1", "slug": "kimya-160-1-saf-alkol-distilasyonu-icin-aparat", "name": "Gül Suyu Damıtım Düzeneği (ez-Zehrâvî)", "category": "Kimya", "creator": "er-Râzî geleneği", "has_img": 1, "desc": "er‑Râzî'nin Kitâb el‑Esrâr'ındaki distilasyon düzeneği, buharın miğfer (imbik başı) dışında, ayrı bir soğutma bölgesinde yoğunlaştırıldığı bilinen en erken tasarımlardandır. Wiedemann'ın çizdiği taslak, kazan‑imbik‑alıcı üçlüsünün ve soğutma ceketinin geometrisini gösterir. Bu tasarım, damıtma verimini artırmakla kalmaz; «yoğuşma» olgusunu ilk kez bilinçli bir mühendislik problemi olarak ele alır. er‑Râzî'nin düzeneği, Latin Liber secretorum çevirileriyle Avrupa eczane ve simya laboratuvarlarına girmiştir. Koleksiyonda bu düzenek, modern damıtma kolonlarının ve soğutucularının (kondenser) kavramsal atası olarak vitrinin baş köşesindedir."}, {"id": "p160-2", "slug": "kimya-160-2-ucucu-yaglar-ve-alkol-elde-etmek-icin-i-mbik", "name": "Uçucu Yağ ve Alkol İmbiği", "category": "Kimya", "creator": "İslam kimya ve eczacılık geleneği", "has_img": 1, "desc": "İmbik (embîk), damıtma miğferi olarak İslam kimyasının en karakteristik kabıdır; «baş» ve «gaga» kısımlarıyla buharı yoğunlaştırıp alıcı kaba aktarır. Terim, Avrupa dillerine 'alembic' olarak geçmiştir. İmbik, damıtma sanatının İslam kökeninin simgesidir."}, {"id": "p160-3", "slug": "kimya-160-3-gagali-i-mbik", "name": "Gagalı İmbik (Alembic with beak)", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 1, "desc": "Yoğunlaşan sıvıyı dışarı aktarmak için uzun bir 'gaga' (rostrum) çıkıntısına sahip miğfer."}, {"id": "p160-4", "slug": "kimya-160-4-i-mbik", "name": "İmbik (Üst/Alt Gagalı Varyant)", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 1, "desc": "Farklı akış dinamikleri için gaganın miğferin üst veya alt kısmından verildiği imbik varyantları."}, {"id": "p161-5", "slug": "kimya-161-5-arac", "name": "Araç (kimya)", "category": "Kimya", "creator": "İslam kimya geleneği", "has_img": 1, "desc": "Ad belirsiz; havuzda a-ID aranıyor."}, {"id": "p161-6", "slug": "kimya-161-6-ayni-nitelikte-iki-camdan-olusan-kaplar", "name": "Scutellae (İki Parçalı Cam Kap)", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 1, "desc": "«Ruhları çözme» kabı olarak tarif edilen Scutellae, Riccardiana yazmasındaki araç tablosunda (No.13) resmedilmiştir. İki parçalı yapısı, çözme ve yoğunlaştırma işlemlerinin ayrı ayrı kontrol edilmesini sağlar. er-Râzî'nin her kimyasal işlem için özel kap belirlemesi, ona «deneysel kimyanın babası» unvanını kazandıran metodolojik tutumun ta kendisidir."}, {"id": "p161-7", "slug": "kimya-161-7-kor-i-mbik", "name": "Kör İmbik (imbiq a'ma)", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 1, "desc": "Çıkış borusu (gagası) olmayan, kapalı sistemde buharlaşma ve süblimasyon için kullanılan kör imbik."}, {"id": "p162-8", "slug": "kimya-162-8-arac", "name": "Araç (kimya)", "category": "Kimya", "creator": "İslam kimya geleneği", "has_img": 1, "desc": "Ad belirsiz; havuz taraması."}, {"id": "p162-9", "slug": "kimya-162-9-cifte-i-mbik", "name": "Çifte İmbik (Alembic duplicati)", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 1, "desc": "Çifte imbik (Alembic duplicati), miğfer biçimli başlıkla boynuzlu imbiğin birleştirildiği ve er-Râzî aracılığıyla Avrupa'da yaygınlaşan bir damıtma kombinasyonudur (No.31). Damıtma verimini artıran bu düzenek, yüzyıllar boyunca Avrupa kimya ve eczacılık laboratuvarlarının temel ekipmanı olarak «alembic» adıyla yaşamıştır. Boynuzlu form, damıtma geleneğinin İslam kökeninin simgesidir."}, {"id": "p162-10", "slug": "kimya-162-10-balcik-kili-i-yuvarlak-i-mbik", "name": "Ampulla lutata (Balçık Kılıflı Şişe)", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 1, "desc": "Ampulla lutata, balçıkla (lute) sıvanmış şişe anlamına gelir; cam gövde, yüksek ısıya dayanması için kil tabakasıyla kaplanır. Bu «lutlama» tekniği, İslam laboratuvar pratiğinin temel yöntemlerinden biridir ve ısıyı kontrol ederek kabın kırılmasını önler. Şişe, er-Râzî kimyasının maddi kültürünün somut bir tanığıdır."}, {"id": "p162-11", "slug": "kimya-162-11-fitilli-filtre-kupasi", "name": "Fitilli Filtre Kupası", "category": "Kimya", "creator": "er-Râzî geleneği", "has_img": 1, "desc": "h-005 ile aynı nesne; birleştirilmeli."}, {"id": "p163-12", "slug": "kimya-163-12-kendi-kendisini-yelleyen-firin", "name": "Kendi Kendisini Yelleyen Fırın", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 1, "desc": "er-Râzî'nin ametal işleme fırını; konveksiyon akımıyla kendi hava çekişini (draft) sağlayan tasarım."}, {"id": "p163-13", "slug": "kimya-163-13-aludel", "name": "Aludel (el-Uşâl)", "category": "Kimya", "creator": "İslam Kimya Geleneği (Câbir/er-Râzî)", "has_img": 1, "desc": "Aludel (Arapça: el-Uşâl), İslam kimyasının laboratuvar pratiğine yaptığı en kalıcı ve evrensel katkılardan biridir. Simyadan deneysel kimyaya geçiş sürecinde, maddelerin saflaştırılması en kritik adımdı. Câbir b. Hayyân ve er-Râzî, katı haldeki maddeleri (örneğin kükürt, cıva bileşikleri, arsenik veya tıpta kullanılan kafur) ısıtarak buharlaştırmak ve bu buharı daha soğuk bir üst kapta tekrar saf kristaller halinde toplamak (süblimasyon) için 'aludel' adını verdikleri özel bir kap sistemi tasarladılar. Aludel, alttan ısıtılan bir kazan ve üzerine boğum boğum oturan, boynu dar silindirik kaplardan oluşurdu. Isınan madde buharlaşarak yükselir, üst kapların daha soğuk yüzeylerinde yoğuşarak saf halde birikirdi. Bu düzenek, eczacılıkta ilaç hammaddelerinin, metalürjide ise alaşımların hazırlanmasında devrim yaratmıştır. 'Aludel' terimi, 12. yüzyılda Latince'ye çevrilen İslam kimya metinleri aracılığıyla Avrupa'ya geçmiş ve modern kimya laboratuvarlarının standart terminolojisine yerleşmiştir. Bugün dahi kimya mühendisliğinde kullanılan damıtma ve süblimasyon kolonlarının atası, bu İslam laboratuvar ekipmanıdır."}, {"id": "p163-14", "slug": "kimya-163-14-vas-decoctionis-mercuris-civa-isitma-aleti", "name": "Cıva Isıtma/Kaynatma Kabı", "category": "Kimya", "creator": "Geber (Câbir) geleneği", "has_img": 1, "desc": "Liber florum Geberti'de yer alan cıva ısıtma aleti, cıvanın «pişirilmesi» (coction) için tasarlanmış bir fırın düzeneğidir. Halka formlu parçalar, cıva buharının ısıtılmasını ve yoğunlaştırılmasını kontrol eder. Latince çeviri hareketiyle yayılan bu alet, Câbir (Geber) geleneğinin Avrupa kimyasına aktarımının ve cıva kimyasının İslam simyasındaki merkezi yerinin kanıtıdır."}, {"id": "p164-16", "slug": "kimya-164-16-aparatur", "name": "Aparatür", "category": "Kimya", "creator": "İslam kimya geleneği", "has_img": 1, "desc": "Adı belirsiz kimya laboratuvar aparatü; havuzda teyit bekliyor."}, {"id": "p164-17", "slug": "kimya-164-17-yapay-mucevher-imali-icin-firin", "name": "Aparatür", "category": "Kimya", "creator": "İslam kimya geleneği", "has_img": 1, "desc": "Ad belirsiz; havuz taraması."}, {"id": "p164-18", "slug": "kimya-164-18-zosimos-un-tavlama-ocagi", "name": "Zosimos'un Tavlama Ocağı (Sirkeli Kazan)", "category": "Kimya", "creator": "Zosimos / Liber florum Geberti", "has_img": 1, "desc": "«Sirke dolu kazan»lı ocak, Latin Geber (Câbir) külliyatının en etkili eserlerinden Liber florum Geberti'de tarif edilen fırın tipolojisinin içinde, kazanı sirkeyle doldurulan özel bir ısıtma düzeneğidir. Simya pratiğinde sirke (hal), metallerin tasfiyesi ve minerallerin çözülmesi için kullanılan en temel çözücülerden biriydi; fırının kazanının sirkeye ayrılması, işlemin ısısının ve buharının sürecin kimyasına göre özelleştirildiğini gösterir. er-Râzî'nin Sırr el-Esrâr'ında fırınlar, ocaklar ve potalar sistematik biçimde sınıflandırılmış, her işlem için ayrı fırın formu belirlenmişti; sirke kazanlı ocak, bu zengin tipolojinin Avrupa'ya aktarılan üyelerindendir. Düzenek, uzun süreli ve düşük sıcaklıklı «pişirme» sağlayarak modern kimyadaki benmari ve kum banyosu tekniklerinin atası olmuştur. İslam kimyasının Avrupa'ya yalnız maddeleri değil, tam bir laboratuvar mimarisi —fırın, kap, süzgeç (râvük)— devrettiğinin somut kanıtlarından biridir."}, {"id": "p166-1", "slug": "tip-166-1-koter", "name": "Koter «Soğuk Karaciğer»", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "ez-Zehrâvî'nin et-Taşrîf'inde tarif ettiği «soğuk karaciğer» koteri, karaciğer rahatsızlıklarının tedavisinde kullanılan bir dağlama aletidir. İslam tıbbının en karakteristik tedavi yöntemlerinden koterizasyon, ez-Zehrâvî tarafından aletin şekli ve uygulama noktasına göre sistematize edilmiştir. Veliyüddin yazması minyatürlerine dayanarak üretilen bu model, 10. yüzyıl Kurtuba'sının cerrahi aletliğini yansıtır."}, {"id": "p166-2", "slug": "tip-166-2-koter", "name": "Yüz Felci Koteri (mikvât el-lakve)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Yüz felci (lakve) tedavisinde kullanılan bu koter, yüzün belirli noktalarına uygulanan dağlama ile sinir uyarımını hedefler. ez-Zehrâvî, yüz bölgesinde dağlamanın hafif ve kontrollü olması gerektiğini vurgular ve aletin ucunu buna göre tasarlar. Bu alet, İslam tıbbının nörolojik rahatsızlıklara yaklaşımının ve cerrahi aletle tedavi arayışının somut kanıtıdır."}, {"id": "p166-3", "slug": "tip-166-3-katarakt-i-gnesi", "name": "Katarakt İğnesi", "category": "Tıp", "creator": "ez-Zehrâvî / Halîfe", "has_img": 1, "desc": "Katarakt indirme iğnesi; havuzda karşılık aranıyor."}, {"id": "p166-4", "slug": "tip-166-4-mersin-yapragi", "name": "Mersin Yaprağı (âse)", "category": "Tıp", "creator": "Halîfe el-Halebî", "has_img": 1, "desc": "Mersin yaprağı biçimindeki bu alet (âse), adını formunun benzerliğinden alır ve kapak yapışıklıklarını ayırmak için kullanılır. Halîfe el-Halebî'nin el-Kâfî fi'l-Kuhl'ü, 13. yüzyılın en önemli göz hekimliği kitabıdır ve alet çizimleri koleksiyondaki birçok modelin temelini oluşturur. Bu zarif alet, İslam tıbbi alet tasarımındaki estetik-işlev uyumunun simgesidir."}, {"id": "p166-5", "slug": "tip-166-5-nester", "name": "Neşter (mibda') – Şakak Atardamarları", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Şakak atardamarlarının çıkarılması için tasarlanan bu neşter (mibda'), Taşrîf'in ince damar cerrahisi aletlerindendir. ez-Zehrâvî'nin şakak arterinin kesilip dağlanmasına dair tarifi, tıp tarihinde damar cerrahisinin erken kayıtlarından biridir. Aletin ince namlusu ve dengeli sapı, cerrahın hassasiyet ihtiyacının ürünüdür."}, {"id": "p166-6", "slug": "tip-166-6-koterizasyon-aleti", "name": "Koter «Soğuk Karaciğer»", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "ez-Zehrâvî'nin et-Taşrîf'inde tarif ettiği «soğuk karaciğer» koteri, karaciğer rahatsızlıklarının tedavisinde kullanılan bir dağlama aletidir. İslam tıbbının en karakteristik tedavi yöntemlerinden koterizasyon, ez-Zehrâvî tarafından aletin şekli ve uygulama noktasına göre sistematize edilmiştir. Veliyüddin yazması minyatürlerine dayanarak üretilen bu model, 10. yüzyıl Kurtuba'sının cerrahi aletliğini yansıtır."}, {"id": "p166-7", "slug": "tip-166-7-makas", "name": "«Makas Benzeri Alet»", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Bademcik ve yutak tümörleri için tasarlanan «makas benzeri alet», KBB cerrahisi tarihinin en dikkat çekici aletlerindendir. Makas biçimli çeneler, boğazdaki şişkin dokuyu kavrayarak kesip çıkarmayı sağlar. Veliyüddin yazmasında resmedilen bu alet, 10. yüzyıl Kurtuba'sının modern tıbbın bile zor saydığı problemlere cerrahi çözümler geliştirdiğini gösterir. Taşrîf, yüzyıllarca Avrupa cerrahisinin temel metni olarak kalmıştır."}, {"id": "p166-8", "slug": "tip-166-8-kargaburnu", "name": "Kargaburnu (şeft / caft)", "category": "Tıp", "creator": "Halîfe el-Halebî", "has_img": 1, "desc": "Kargaburnu adı verilen bu alet, eğik ucuyla bir kuş gagasını andırır ve göz bölgesindeki ince manipülasyonlar için kullanılır. Biçim-işlev uyumuna dayalı bu tipoloji, İslam cerrahi alet tasarımının karakteristiğidir: her alet, biçimine göre cerrahlarca adlandırılır (orak, mersin yaprağı, kargaburnu...). Bu adlandırma geleneği, Taşrîf ve Kâfî'nin görsel eğitimini de kolaylaştırır."}, {"id": "p166-9", "slug": "tip-166-9-i-ki-dikenli-kanca", "name": "İki Dikenli Kanca (şinnâre)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Ölü cenini çıkarmak için kullanılan iki dikenli kanca (şinnâre), orta çağ jinekolojisinin en hassas aletlerindendir. İki dikenli uç, cenini kontrollü biçimde kavrayarak tahliyeyi kolaylaştırır. ez-Zehrâvî, büyük ustalık gerektiren bu işlemi tüm aşamalarıyla tarif etmiştir. Model, Taşrîf minyatürlerine dayanarak yeniden üretilmiştir."}, {"id": "p167-10", "slug": "tip-167-10-balta-abar", "name": "Tabar («balta», alın toplardamarı bıçağı)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "«Tabar» (balta), ez‑Zehrâvî'nin alın toplardamarını (vena frontalis) açmak için tasarladığı balta biçimli bıçaktır; fasd (kan alma) geleneğinin kafa‑yüz bölgesine özgü ince bir varyantıdır. Balta formu, deriyi tek ve kontrollü bir vuruşla yarmayı sağlar; kenarın açısı, damarı zedelemeden kesim için hesaplanmıştır. Taşrîf minyatürlerinde aletin kullanımı, hasta‑tabip etkileşimiyle birlikte resmedilir. Koleksiyonda tabar, İslam cerrahisinin «bölgeye özel alet» tasarım felsefesinin mikro‑örneğidir; aynı el, neşteri de balta'yı da aynı rasyonaliteyle biçimlendirir."}, {"id": "p167-11", "slug": "tip-167-11-orak-mincel", "name": "Orak (mincel)", "category": "Tıp", "creator": "Halîfe el-Halebî", "has_img": 1, "desc": "Küçük oftalmolojik orak (mincel), kapak yapışıklıkları ve 'tavşan-göz' (ektropiyon) tedavisinde kullanılır. Halîfe el-Halebî, aletini orak biçiminde tasarlayarak kesici kenarın kavisini kontrol etmiştir. Bu alet, İslam göz hekimliğinin alet tipolojisinin çağdaşı Avrupa'dan ne denli zengin olduğunun örneklerinden biridir."}, {"id": "p167-12", "slug": "tip-167-12-makas", "name": "Penseler (kelâlîb, çift)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Kelâlîb adı verilen çift penseler, diş çekiminin temel aletidir ve ez-Zehrâvî tarafından deontoloji (tıbbi etik) bahsinde dahi anılır. Penselerin testere dişli çeneleri dişi sıkıca kavrar; kaldıraç ilkesi çekimi kolaylaştırır. Taşrîf minyatürlerinde resmedilen bu penseler, 18. yüzyıla dek Avrupa'da standart diş çekim aleti olarak kullanılmıştır."}, {"id": "p167-13", "slug": "tip-167-13-basak-kilcigi-pensesi", "name": "Başak Kılçığı Pensesi (kelbetân nuşüliyye)", "category": "Tıp", "creator": "Halîfe el-Halebî", "has_img": 1, "desc": "Perçinli bu pense, göze giren başak kılçığı gibi yabancı cisimleri kavrayıp çıkarmak için tasarlanmıştır. Halîfe el-Halebî, aletin çenelerini yabancı cismi ezmeden tutacak biçimde şekillendirmiştir. Bu alet, orta çağ oftalmolojisinin 'vaka bazlı alet' yaklaşımının ve İslam cerrahisinin pratik zekâsının somut bir örneğidir."}, {"id": "p167-14", "slug": "tip-167-14-balon-siringa", "name": "Piston / Balon Şırınga (zerrâka)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Zerrâka veya mihkan adı verilen pistonlu şırınga, mesaneye ilaç instilasyonu için kullanılan, üroloji tarihinin en özgün aletlerindendir. Emme-basma prensibiyle çalışan piston mekanizması, modern enjektörün doğrudan atasıdır. Bu alet, İslam tıbbının yalnızca tedavi yöntemleri değil, teknolojik icatlar da ürettiğinin somut kanıtıdır."}, {"id": "p167-15", "slug": "tip-167-15-kaziyici", "name": "Soyucu / Raspatorium (micrad)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Kemikleri kesmek ve sıyırmak için kullanılan soyucu (raspatorium), kaza cerrahisinin temel aletlerindendir. ez-Zehrâvî bu aleti, kırık kemik parçalarının temizlenmesi ve nekrotik dokunun uzaklaştırılması için kullanmıştır. Sağlam sapı ve keskin kenarı, savaş cerrahisinin zorlu koşullarına uygun tasarlanmıştır; Taşrîf yüzyıllarca bir savaş cerrahisi el kitabı olarak da kullanılmıştır."}, {"id": "p167-16", "slug": "tip-167-16-i-ki-plakali-speculum", "name": "Rahim Ağzı Açan Vidalı Düzenek (Speculum)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 1, "desc": "Rahim ağzını açmak için kullanılan vidalı düzenek, modern literatürde «iki plakalı speculum uteri» olarak tanınır. İki plaka, merkezdeki vida ile kontrollü biçimde açılarak doğum kanalını muayene ve müdahale için genişletir. Bu alet, modern jinekolojik aletlerin İslam tıbbından doğduğunu gösteren en çarpıcı örneklerden biridir."}, {"id": "p167-17", "slug": "tip-167-17-eskilerin-el-ev-il-aleti", "name": "«Eskilerin Aleti» (el-evâ'il)", "category": "Tıp", "creator": "Antik/İslam geleneği", "has_img": 1, "desc": "ez-Zehrâvî'nin «eskilerin» (el-evâ'il) aleti diye andığı bu düzenek, antik dönemden devralınan ve cenin tahliyesinde kullanılan bir cihazdır. ez-Zehrâvî'nin önceki geleneklerden gelen aletleri kendi tasarımlarıyla birlikte kayda geçirmesi, onun tarih bilincine sahip bir bilim adamı olduğunu gösterir. Bu büyük ahşap-metal alet, antik-İslam jinekoloji zincirinin halkasıdır."}, {"id": "narrated-15-1", "slug": "astronomi-anlatili-15-mer-a-rasathanesi-ve-buyuk-sekstanti", "name": "Meraga Rasathanesi ve Büyük Sekstantı", "category": "Astronomi", "creator": "Hulagu / Reşideddin / İlhanlı devleti", "has_img": 1, "desc": "Merağa Rasathanesi, yalnız bir gözlem evi değil; kütüphanesi, atölyeleri, vakıf geliri ve uluslararası bilgin kadrosuyla tarihin ilk kurumsal bilim komplekslerinden biridir. Hulagu'nun himayesi ve Reşideddin'in idaresiyle kurulan bu yapı, bilimin devlet tarafından finanse edilip örgütlendiği modern araştırma enstitülerinin orta çağ prototipidir. Kazı kalıntılarındaki kütüphane temelleri, bu kurumsal büyüklüğün maddi kanıtıdır. Koleksiyonda Merağa'nın mirası, bilimin «bireysel deha»dan «kurumsal üretim»e geçtiği andır."}, {"id": "narrated-16-2", "slug": "astronomi-anlatili-16-mu-eyyeded-n-el-ur-nin-cift-kadranli-aleti", "name": "Mü'eyyededin el-'Urdi'nin Çift Kadranlı Aleti", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî", "has_img": 1, "desc": "Çift Kadranlı Alet (el-Âle Zât er-Rub'ayn), el-Urdî'nin Merâğa Rasathanesi için geliştirdiği dördüncü alettir. İslam astronomi geleneğinde kadranlar (rub') genellikle tek bir düzlemde (örneğin sadece meridyen duvarında) kullanılırdı. el-Urdî, iki ayrı kadranı birbirine dik veya tamamlayıcı açılarla yerleştirerek, tek bir gözlemle birden fazla trigonometrik veriyi aynı anda kaydetmeyi başarmıştır. Bu tasarım, özellikle Güneş'in ve Ay'ın meridyen geçişleri sırasındaki hassas konumlarını belirlerken, aletin kendi içindeki mekanik sapmalarını (kalibrasyon hatalarını) sıfırlamak için kullanılan 'çapraz okuma' yönteminin fiziksel karşılığıydı. İki kadranın aynı anda farklı açılardan gelen ışığı veya nişangâhı yakalaması, rasathane personelinin verileri karşılıklı teyit etmesine olanak tanımış, bu da Merâğa'nın 'Zîc-i İlhanî' çizelgelerindeki inanılmaz hassasiyetin sırlarından biri olmuştur."}, {"id": "narrated-17-3", "slug": "astronomi-anlatili-17-mu-eyyeded-n-el-ur-nin-mukemmel-aleti", "name": "Müeyyededîn el-Urdî'nin Mükemmel Aleti", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî", "has_img": 1, "desc": "Merâğa Rasathanesi'nin «Mükemmel Alet»i (el-âle el-kâmile), döneminin en sofistike ve çok işlevli gözlem cihazıdır. el-Urdî'nin kendi buluşu olan bu alet, cetvel pergeli, kılavuz ray, döner taban ve hassas nişangâhları birleştirerek hem yükseklik hem de azimut ölçümlerini eşzamanlı ve mikron hassasiyetinde yapabilir. Ptoleme'nin hantal «armiller küre»sinin ve sınırlı «paralaks cetveli»nin ötesine geçen bu modüler tasarım, rasathane aletlerinin «kapalı katalog» dışındaki, deneysel ve yaratıcı yüzünü temsil eder. Aletin adı, onun yalnızca bir araç değil, aynı zamanda bir «tasarım felsefesi» olduğunu gösterir. Koleksiyonda Mükemmel Alet, Merâğa'nın «altın standardı»dır; rasathanenin kurumsal ve entelektüel iddiasının pirinç ve ahşaba dökülmüş halidir."}, {"id": "narrated-20-5", "slug": "astronomi-anlatili-20-dresden-gokkuresi", "name": "Gökyüzü Küresi (Merâğa Rasathanesi'nde)", "category": "Astronomi", "creator": "Merâğa atölyesi", "has_img": 1, "desc": "Merâğa Rasathanesi'ndeki gök küresi, gözlem aletlerinin yanı sıra rasathanenin «eğitim ve temsil» işlevini de üstlenirdi: yıldız konumları, takımyıldızlar ve koordinat çizgileriyle işlenmiş küre, gökyüzünün taşınabilir bir haritasıydı. Küre yapımı (kürecilik), İslam dünyasında bağımsız bir zanaat‑bilim dalıydı; Bağdat'tan Semerkant'a atölyeler, pirinç küreler üzerine binlerce yıldız adını kazırdı. Merâğa küresi, el‑Urdî'nin alet kitabıyla birlikte okunduğunda, rasathanenin yalnız ölçüm değil, kozmoloji üretimi merkezi olduğu anlaşılır. Koleksiyonda bu küre, çemberli küreler zincirinin İlhanlı halkasıdır."}, {"id": "narrated-21-6", "slug": "astronomi-anlatili-21-musebbehe-bi-l-men-tik", "name": "Müşebbehe bi'l-Menâtık (Yıldız Mesafe Aleti)", "category": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Yıldızlar Arası Mesafe Aleti (Müşebbehe bi'l-Menâtık), Takiyyeddîn'in İstanbul Rasathanesi için bizzat icat ettiğini belirttiği en özgün cihazlardan biridir (VIII. Alet). Klasik rasathane aletleri genellikle bir cismin ufka veya meridyene göre konumunu ölçerken, Takiyyeddîn doğrudan iki gök cismi arasındaki 'açısal mesafeyi' ölçmeye odaklanmıştır. Bu alet, özellikle kuyruklu yıldızların yörüngelerini, gezegenlerin birbirlerine göre kavuşumlarını ve Ay'ın paralaksını hesaplamak için kritik öneme sahipti. Takiyyeddîn, bu aleti tasarlarken Merâğa ve Semerkant rasathanelerindeki paralaks cetvellerini temel almış, ancak aletin nişangâh ve bölüntü (taksimat) hassasiyetini 16. yüzyılın metalurji ve optik bilgisiyle birleştirerek çok daha ileri bir seviyeye taşımıştır. Takiyyeddîn'in bu aletle yaptığı gözlemler, onun 'el-Kevâkibü'd-Düreriyye' adlı zîc'inde (astronomik çizelgeler) yer bulmuş ve dönemin Avrupa rasathaneleriyle (Tycho Brahe'nin Uraniborg'u) boy ölçüşebilen, hatta bazı sabit yıldız kataloğu verilerinde onları aşan bir hassasiyet sunmuştur. Alet, Osmanlı bilim tarihinin deneysel ve enstrümantal zenginliğinin en somut kanıtlarından biridir."}, {"id": "narrated-24-7", "slug": "usturlaplar-anlatili-24-nast-lus-usturlabi", "name": "Nastülüs Usturlabı", "category": "Usturlaplar", "creator": "Nastülüs", "has_img": 1, "desc": "En eski tarihli İslam usturlaplarından; Nastülüs imzalı."}, {"id": "narrated-25-8", "slug": "usturlaplar-anlatili-25-sultan-melik-el-esref-in-usturlabi", "name": "Sultan Melik el-Eşref'in Usturlabı", "category": "Usturlaplar", "creator": "el-Melik el-Eşref Ömer b. Yûsuf", "has_img": 1, "desc": "el-Melik el-Eşref'in Aletleri, İslam bilim tarihinde 'hükümdar-bilgin' kavramının en çarpıcı kanıtlarından biridir. 13. yüzyılın sonlarında Yemen'de hüküm süren Resûlî hanedanından el-Melik el-Eşref, sadece sarayını koruyan bir komutan değil, aynı zamanda gökyüzünü gözlemleyen ve alet tasarlayan bir astronomdu. 'Mu'în et-Tullâb' (Öğrencilerin Yardımcısı) adlı eserinde, Yemen'in coğrafi enlemine (yaklaşık 13° Kuzey) özel olarak kalibre edilmiş, dönemin standart Memlük veya Mağrip usturlaplarından tamamen farklı trigonometrik ağlara (mukantaralar) sahip usturlaplar tasarladığını anlatır. Daha da ilgisi, el-Eşref'in sadece gökyüzünü gözlemlemekle kalmayıp, zamanı ölçmek için karmaşık mekanik su saatleri (clepsydra) ve mum saatleri tasarlamasıdır. Onun risalelerindeki çizimler, el-Cezerî'nin Diyarbakır'daki mühendislik mirasının Yemen'e kadar ulaştığını ve burada hükümdar seviyesinde geliştirildiğini gösterir. el-Eşref'in aletleri, İslam dünyasının 'merkez' (Bağdat, Kahire, Şam) dışındaki 'çevre' (Yemen) bölgelerinde dahi bilimsel üretimin ne denli yüksek ve özgün olduğunun kanıtıdır."}, {"id": "narrated-26-9", "slug": "usturlaplar-anlatili-26-es-sehl-en-n-s-b-r-usturlabi", "name": "es-Sehl en-Nisaburi Usturlabı", "category": "Usturlaplar", "creator": "Johannes Regiomontanus", "has_img": 1, "desc": "Johannes Regiomontanus, Avrupa astronomisinin İslam mirasıyla kurduğu bağın kilit figürüdür. Arapça kaynaklardan (Battani, Zerkali) ve alet geleneğinden beslenen Regiomontanus, Ephemerides'i ve gözlem aletleriyle Avrupa'nın bilimsel uyanışını hızlandırmıştır. Koleksiyonda Regiomontanus, İslam astronomisinin Avrupa'daki «öğrencisi» ve «devamcısı»dır; bilginin sınırları aşan zincirinin halkasıdır."}, {"id": "narrated-27-10", "slug": "usturlaplar-anlatili-27-el-ucend-nin-usturlabi", "name": "el-Hucendî'nin Usturlabı", "category": "Usturlaplar", "creator": "Ebû Mahmûd el-Hucendî", "has_img": 1, "desc": "el-Hucendî'nin 374/984'te Rey'de imal ettiği usturlap, günümüze ulaşan en eski ve en güzel usturlaplardandır. Gravür zarafeti ve taksimat hassasiyeti, Büveyhî dönemi alet yapımı okulunun olgunluğunu yansıtır. Bu alet, aynı ustanın Rey'deki dev sekstantı inşa eden bir gözlemci-mühendis olduğunun da kanıtıdır."}, {"id": "narrated-28-11", "slug": "usturlaplar-anlatili-28-sultan-ii-beyazit-usturlabi", "name": "Sultan II. Beyazıt Usturlabı", "category": "Usturlaplar", "creator": "Osmanlı atölyesi", "has_img": 1, "desc": "1680 tarihli bu Osmanlı usturlabı, klasik geleneğin Osmanlı topraklarındaki geç ama yetkin bir örneğidir. Cami muvakkithanelerinde namaz vakitlerinin belirlenmesi ve astronomi eğitimi için kullanılan bu aletler, Osmanlı bilim hayatının sürekliliğini gösterir. Parça, 17. yüzyılda usturlabın hala canlı olduğunun maddi kanıtıdır."}, {"id": "narrated-29-12", "slug": "usturlaplar-anlatili-29-ez-zer-l-nin-evrensel-usturlabi", "name": "Evrensel Disk (eş-şafiha ez-zerkâliyye, ez-Zerkâlî)", "category": "Usturlaplar", "creator": "Ebû İshâk İbrahim ez-Zerkâlî", "has_img": 1, "desc": "Evrensel Disk (eş-Şafiha ez-Zerkâliyye), İslam astronomi aletleri tarihinin en büyük 'yazılım/donanım' devrimlerinden biridir. Klasik usturlaplar, kullanıcının bulunduğu coğrafi enleme göre özel olarak kazınmış iç disklere (safâ'ih) ihtiyaç duyardı; bir astronom seyahat ettiğinde yanında düzinelerce farklı levha taşımak zorundaydı. 11. yüzyılda Toledo'da yaşayan ez-Zerkâlî, stereografik projeksiyon matematiğini ustaca kullanarak, ekvator düzlemini merkeze alan öyle bir disk tasarladı ki, bu disk dünyanın neresine giderseniz gidin (Kutuplardan Ekvatora) tek bir ayar vidasıyla tüm gökyüzünü ve zamanı hesaplamaya olanak tanıyordu. Bu alet, Orta Çağ'da 'Saphaea' adıyla Latince'ye çevrilmiş, Avrupa'da Regiomontanus ve Kepler gibi isimlerin temel başvuru kaynağı haline gelmiştir. ez-Zerkâlî'nin bu evrensel diski, sadece bir gözlem aracı değil, küresel trigonometriyi düzleme indiren kusursuz bir 'analog bilgisayar'dır. Aletin arka yüzündeki sinüs ve kosinüs eğrileri, kullanıcının karmaşık astronomik problemleri (namaz vakitleri, kıble yönü, gezegen konumları) saatler süren hesaplamalar yerine, disk üzerindeki ipleri gererek saniyeler içinde çözmesini sağlıyordu."}, {"id": "narrated-30-13", "slug": "usturlaplar-anlatili-30-i-bn-es-serr-c-in-evrensel-usturlabi", "name": "İbn es-Serrâc'ın Evrensel Usturlabı", "category": "Usturlaplar", "creator": "Ahmed b. es-Serrâc", "has_img": 1, "desc": "Evrensel Usturlap, İslam astronomi aletleri tarihinin 'yazılım standardizasyonu' konusundaki en büyük arayışlarının somut bir sonucudur. Klasik usturlaplar, her bir coğrafi enlem için ayrı ayrı kazınmış iç disklere ihtiyaç duyardı; bu da seyahat eden alimler için ciddi bir lojistik yüktü. 11. yüzyılda ez-Zerkâlî'nin teorize ettiği 'evrensel disk' fikri, 14. yüzyılda Şamlı usta Ahmed b. es-Serrâc tarafından mekanik ve metalürjik bir başyapıta dönüştürülmüştür. es-Serrâc'ın usturlaplarında, ekvatoral ve ufki projeksiyonları aynı anda barındıran, karmaşık dişli ve kayar mekanizmalarla donatılmış iç diskler bulunur. Kullanıcı, aletin dışındaki bir ayar düğmesiyle kendi bulunduğu enlemi 'seçer' ve aletin içindeki trigonometrik ağ (mukantaralar) otomatik olarak o enleme göre hizalanırdı. Bu alet, Memlük saraylarında diplomatik hediyeler olarak da kullanılmış, İslam dünyasının bilimsel üstünlüğünü Avrupa elçilerine gösteren birer 'teknolojik güç gösterisi' işlevi görmüştür. es-Serrâc'ın hayatta kalan nadir eserleri, bugün dünya müzelerinde İslam metal işçiliğinin (hâkkâklık) ulaşılmaz zirveleri olarak sergilenmektedir."}, {"id": "narrated-31-14", "slug": "usturlaplar-anlatili-31-oxford-usturlabi", "name": "Oxford Usturlabı", "category": "Usturlaplar", "creator": "Kusta b. Lüka", "has_img": 1, "desc": "Kusta b. Lüka'nın küresel usturlabı, aynı geleneğin bir diğer önemli temsilcisidir; Baalbekli Hristiyan-Arap bilgin, çevirileri ve özgün eserleriyle Bağdat okulunun alet literatürünü zenginleştirmiştir. Küresel usturlap risalesi, Harrani'nin eseriyle birlikte okunmuş ve Avrupa'ya aktarılmıştır."}, {"id": "narrated-32-15", "slug": "usturlaplar-anlatili-32-el-mizz-nin-usturlap-kadrani", "name": "el-Mizzî Usturlap Kadranı", "category": "Usturlaplar", "creator": "Alâeddîn Ali b. İbrahim İbn eş-Şâtir / el-Mizzî", "has_img": 1, "desc": "Şam ekolüne ait usturlap kadranı; teyit bekliyor."}, {"id": "narrated-34-16", "slug": "astronomi-anlatili-34-eb-ca-fer-el-zin-in-ekvatoryumu", "name": "Ebû Ca'fer el-Hâzîn'in Ekvatoryumu", "category": "Astronomi", "creator": "Ebû Ca'fer el-Hâzîn", "has_img": 1, "desc": "Zîc eş-Şafâ'ih, adını usturlabın enlem dairelerini taşıyan 'şafiha' (levha) kelimesinden alan ve astronomik çizelgelerle (zîc) birleşen özel bir gözlem geleneğini temsil eder. 4./10. yüzyılın önde gelen astronomu Ebû Ca'fer el-Hâzîn'in bu aleti, gök cisimlerinin konumlarını hem sayısal çizelgelerle hem de levha üzerindeki geometrik izdüşümle doğrulama imkânı sunuyordu. Bu yaklaşım, İslam astronomisinde kuram ile gözlem aleti arasındaki kopmaz bağın erken bir kanıtıdır."}, {"id": "narrated-35-17", "slug": "astronomi-anlatili-35-ez-zer-l-nin-ekvatoryumu", "name": "ez-Zerkâlî Ekvatoryumu Modeli (eş-Şafiha ez-Zîciyye)", "category": "Astronomi", "creator": "Ebû İshâk ez-Zerkâlî", "has_img": 1, "desc": "ez-Zerkâlî Ekvatoryumu (Safiha Zîciyye), İslam dünyasının 'analog bilgisayar' tarihindeki en büyük devrimlerinden biridir. 11. yüzyılda bir astronomun Mars'ın veya Jüpiter'in gökyüzündeki konumunu (boylamını) bulması için, Ptoleme'nin episikl ve eksantrik modellerine dayalı, saatler süren küresel trigonometri hesaplamaları yapması gerekirdi. ez-Zerkâlî, bu zihinsel yükü ortadan kaldırmak için iç içe geçen bronz disklerden, kayar cetvellerden ve gerilmiş iplerden oluşan bir 'mekanik simülatör' icat etti. Kullanıcı, diskin dışındaki takvimi o günün tarihine ayarladığında, içerideki gezegen diskleri (Merkür, Venüs, Mars, Jüpiter, Satürn) otomatik olarak o günkü konumlarına hizalanıyor ve kullanıcı gezegenin burcunu ve derecesini doğrudan okuyabiliyordu. Bu alet, Endülüs üzerinden Avrupa'ya geçmiş, Kastilya Kralı X. Alfonso'nun 'Libros del saber' adlı eserinde 'Lámina universal' olarak detaylandırılmış ve 14. yüzyılda Avrupa'daki meşhur 'Equatorium' geleneğini başlatmıştır. Koleksiyondaki modern rekonstrüksiyonlar, ez-Zerkâlî'nin bu kayıp mekanik dehasını, günümüz ziyaretçilerinin fiziksel olarak dokunup deneyimleyebileceği bir formda yeniden canlandırmaktadır."}, {"id": "narrated-36-18", "slug": "astronomi-anlatili-36-eb-e-alt-in-ekvatoryumu", "name": "Ebû eş-Şalt'ın Ekvatoryumu", "category": "Astronomi", "creator": "Ebû eş-Şalt el-Endülüsî", "has_img": 1, "desc": "Endülüslü astronom Câbir b. Eflah'ın (Geber filius Afflae) Ptoleme'yi eleştirerek geliştirdiği ekvatoryal gözlem aleti, Avrupa'da «Torquetum» adıyla bilinen ve Rönesans astronomisinin (Regiomontanus, Apianus) en popüler aletlerinden birinin doğrudan öncülüdür. Torquetum, gökyüzünün üç farklı koordinat sistemini (ufuk, ekvator, ekliptik) tek bir mekanizmada birleştirerek okumayı kolaylaştırır. Câbir b. Eflah'ın İslam astronomisindeki «eleştirel» (hey'et) geleneğe katkısı, bu aletin mekanik tasarımında somutlaşır. Koleksiyonda Torquetum, İslam astronominin yalnızca teorik metinlerle değil, aynı zamanda mekanik alet tasarımlarıyla da Avrupa bilim devrimini nasıl beslediğinin çarpıcı bir kanıtıdır."}, {"id": "narrated-37-19", "slug": "astronomi-anlatili-37-cems-d-el-k-s-nin-analog-astronomik-bilgisayari", "name": "Cemşîd el-Kâşî'nin Analog Astronomik Bilgisayarı", "category": "Astronomi", "creator": "Gıyâseddîn el-Kâşî", "has_img": 1, "desc": "el-Kâşî'nin Tabak el-Menâtık'ı; gezegen boylam/enlem bilgisayarı."}, {"id": "narrated-38-20", "slug": "astronomi-anlatili-38-kavusum-levhasi", "name": "Kavuşum Levhası", "category": "Astronomi", "creator": "Gıyaseddin el-Kaşi", "has_img": 1, "desc": "Semerkant'ın dahi matematikçisi Gıyaseddin el-Kaşi'nin «Tabak el-Menatık» (Ekvatoryumlar) adlı eseri ve bu eser için tasarladığı mekanik aletler, gezegenlerin boylam ve enlemlerini hesapsız okutan orta çağın en gelişmiş «analog bilgisayarları»dır. Kaşi, Merkür'ün eliptik yörüngesini çizmek için icat ettiği özel pergelleri ve döner diskleri bu alette birleştirir. Bu mekanik sentez, Antikiteranya düzeneğinden sonra insanlık tarihinin bilinen en sofistike dişli ve geometrik uygulamalarındandır. Koleksiyonda Tabak el-Menatık, bilginin «hesaplanabilir» değil, «çevrilebilir ve okunabilir» bir makineye dönüştüğü; silikon öncesi bilgi işlem tarihinin kurucu anıdır."}, {"id": "narrated-40-21", "slug": "astronomi-anlatili-40-el-bir-n-nin-mekanik-ay-takvimi", "name": "«Ay Kutusu» (hukk el-kamer, mekanik-astronomik takvim)", "category": "Astronomi", "creator": "Ebû Reyhân el-Bîrûnî", "has_img": 1, "desc": "el-Bîrûnî'nin tarif ettiği «Ay kutusu» (hukk el-kamer), güneş ve ayın hareketlerini dişli çark oranlarıyla simüle eden mekanik-astronomik bir takvimdir. Bu düzenek, daha sonra el-İşfehânî tarafından mükemmelleştirilecek analog bilgisayar geleneğinin ilk halkasıdır. el-Bîrûnî'nin yalnız bir âlim değil, bir makine tasarımcısı olduğunun somut kanıtıdır."}, {"id": "narrated-41-22", "slug": "saatler-anlatili-41-el-zin-nin-kendi-kendine-donen-kureli-saati", "name": "Kendi Çevresinde Dönen Küreli Alet", "category": "Saatler", "creator": "Muhammed b. Ahmed el-Hâzimî", "has_img": 1, "desc": "453/1061 tarihli bu alet, gökküresinin hareketini mekanik olarak taklit eden eşsiz bir düzeneğidir. Pirinç küre, cam tüp ve sehpadan oluşan model, el-Hâzimî'nin 'Gökküresinin Hareketine Dair' risalesindeki tariflere dayanır. Kürenin kendi çevresinde eşit hareketle dönmesi, gökyüzünün günlük dönüşünü masa üstünde izlenebilir kılar; bu, orta çağın 'planetaryum' deneyimidir."}, {"id": "narrated-42-23", "slug": "saatler-anlatili-42-i-bn-es-s-tir-in-yakutlar-kutusu", "name": "İbn eş-Şâtır'ın Yakutlar Kutusu", "category": "Saatler", "creator": "Alâeddîn İbn eş-Şâtır", "has_img": 1, "desc": "'Vakitler Sandığı' anlamına gelen Şandük el-Yavâkît, Şam'daki Emevi Camii muvakkithanesinde görev yapan İbn eş-Şâtir'in çok işlevli astronomik kompendiumudur. Güneş ve yıldız saatlerini, namaz vakitlerini ve gezegen konumlarını tek bir kutu içinde birleştiren alet, muvakkit geleneğinin teknik zirvesidir. İbn eş-Şâtir'in gezegen modelleri, yüzyıl sonra Kopernik'inkilerle matematiksel özdeşlik gösterecektir."}, {"id": "narrated-44-24", "slug": "cografya-ve-seyrusefer-anlatili-44-el-i-dr-s-nin-kayip-dunya-haritasi", "name": "el-İdrisi'nin Kayıp Dünya Haritası", "category": "Coğrafya ve Seyrüsefer", "creator": "Piri Reis (Ahmed Muhiddin Piri)", "has_img": 1, "desc": "Piri Reis'in 1513 tarihli dünya hari
