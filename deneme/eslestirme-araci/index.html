a'ya aktarımıyla şekillenmiştir."}, {"id": "a401", "slug": "yeni-a401-mimari-statik-kubbe", "title": "Mimari Statik ve Kubbe İnşaatı (Mimar Sinan)", "creator": "Mimar Sinan ve Osmanlı Mimari Geleneği", "kisa": "Mimar Sinan'ın devasa kubbelerin yanal itme kuvvetlerini yarım kubbe ve fil ayaklarıyla zemine indirdiği, kurşun levhalar ve pandantiflerle depreme dirençli hale getirdiği anıtsal mimari statik sistemi.", "uzun": "Mimari Statik ve Kubbe İnşaatı, İslam-Osmanlı mühendisliğinin taşa ve mekana hükmettiği en yüce zirvedir. Mimar Sinan, 'ustalık eserim' dediği Selimiye ve 'çıraklık eserim' dediği Süleymaniye'de, sadece estetik bir mekan değil, kusursuz bir fizik ve statik laboratuvarı kurmuştur. Devasa merkezi kubbelerin dışarı doğru yayılan yıkıcı itme kuvvetlerini (lateral thrust), kademeli yarım kubbeler, pandantifler ve dıştaki gizli payandalarla (flying buttresses) zemine simetrik olarak dağıtmıştır. Sinan'ın en dahiyan malzeme mühendisliği buluşlarından biri, kubbe kasnaklarının ve duvarların arasına yerleştirdiği 'kurşun levhalar'dır. Bu kurşun, sarsıntı anında eriyip esneyerek taşların birbirini kırmasını engelliyor, yapıya 'kendi kendini onaran' bir esneklik (damping) kazandırıyordu. Ayrıca camilerin iç hava akımını (ventilasyon) ve is (kurum) birikmesini önlemek için kubbe merkezlerine özel basınç odaları ve bacalar tasarlamıştır. Sinan'ın yapıları, Rönesans Avrupası'nın (Brunelleschi, Michelangelo) kubbe arayışlarıyla eşzamanlı ve onlardan çok daha sağlam, depreme dirençli mühendislik harikalarıdır."}, {"id": "a402", "slug": "yeni-a402-bimaristan-mimarisi", "title": "Bimaristan Mimarisi (Nûreddîn Hastanesi)", "creator": "İslam Tıp ve Mimari Geleneği (Bimaristan Kurumları)", "kisa": "Şam'daki Nûreddîn Bimaristanı; havalandırma (malqaf), su terapisi ve akustik mühendisliğini birleştirerek hastaların iyileşme sürecini hızlandıran devrim niteliğinde tıp-mimari kompleksi.", "uzun": "Bimaristan Mimarisi, İslam medeniyetinin tıbbı sadece farmakoloji ve cerrahiyle değil, aynı zamanda mekân, ışık, su ve ses ile tedavi eden bütüncül (holistik) bir bilim olarak gördüğünün en somut kanıtıdır. Şam'daki Nûreddîn Bimaristanı (1154) ve Anadolu'daki Divriği Darüşşifası, hastaların iyileşme sürecini hızlandırmak için mimariyi bir 'tıbbi cihaz' gibi tasarlamıştır. Merkez avludaki şadırvandan geçen su kanalları, hem mekânı soğutur (doğal klima) hem de çıkan su sesiyle hastaların sinir sistemini yatıştırırdı; bu, modern 'ses terapisi'nin (white noise) erken bir uygulamasıdır. 'Malqaf' adı verilen rüzgar kuleleri, çöl sıcaklığında dahi içeride sürekli bir hava sirkülasyonu sağlayarak enfeksiyon riskini azaltırdı. Akıl hastaları için ayrılan bölümlerde ise zincirler yerine müzik (musikâr), su sesi ve çiçek kokuları kullanılırdı. Avrupa'da akıl hastalarının 'deli' damgasıyla zincire vurulduğu veya yakıldığı bir çağda, İslam bimaristanları onları birer 'hasta' olarak görüp müzik ve suyla tedavi ediyordu. Bu mimari anlayış, modern hastane tasarımındaki 'iyileştirici çevre' (healing environment) kavramının yüzyıllar öncesindeki öncüsüdür."}, {"id": "a402b", "slug": "yeni-a402b-mukarnas-kalibi", "title": "Mukarnas Kalıbı ve Geometrik İnşa", "creator": "İslam Mimari ve Geometri Geleneği", "kisa": "Mukarnas (sarkıt) dizimleri için alçı ve ahşaptan oyulmuş, karmaşık 3 boyutlu fraktal geometrinin taş ve sıvaya aktarılmasını sağlayan mimari kalıp ve şablonlar.", "uzun": "Mukarnas Kalıbı, İslam mimarisinin estetik zirvesi olan 'sarkıt' (mukarnas) kubbe ve nişlerinin ardındaki gizli matematiksel ve mühendislik dehasını ifşa eden nesnelerdir. Dışarıdan bakıldığında organik, petek benzeri veya kristal bir yapı gibi görünen mukarnaslar, aslında son derece katı geometrik kurallara (özellikle Gıyâseddîn el-Kâşî'nin formüle ettiği algoritmalara) dayanan, 2 boyutlu çizimlerin 3 boyutlu uzaya izdüşümüdür. Bu karmaşık strüktürlerin inşa edilebilmesi için, usta mimarlar ahşap ve alçıdan 'kalıplar' (şablonlar) üretirdi. Her bir mukarnas hücresi (bâz), bu kalıplar kullanılarak dökülür veya yontulur, ardından devasa bir 3 boyutlu yapboz gibi kubbenin veya eyvanın iç yüzeyine monte edilirdi. Bu kalıplar, İslam geometrisinin sadece düzlem üzerinde (tezhip veya çini) kalmayıp, yerçekimine ve statik kuvvetlerine meydan okuyan 'yapısal bir mühendisliğe' dönüştüğünün en somut kanıtıdır. Koleksiyondaki bu kalıplar, mimarlık tarihinin ilk 'parametrik/algoritmik' tasarım araçlarıdır."}, {"id": "a403", "slug": "yeni-a403-kagit-uretimi", "title": "Kağıt Üretimi ve Değirmenleri", "creator": "İslam Endüstri ve Mühendislik Geleneği", "kisa": "Çin'den alınan kağıt hamuru teknolojisini su değirmenleriyle mekanize ederek endüstriyel ölçekte üreten, İslam 'Bilgi Devrimi'nin ve kütüphanelerinin maddi altyapısı.", "uzun": "Kağıt Üretimi ve Değirmenleri, İslam medeniyetinin bilimsel ve kültürel 'Altın Çağı'nı mümkün kılan en kritik endüstriyel altyapıdır. 751 Talas Savaşı'nda esir alınan Çinli kağıt ustaları, Semerkant'ta İslam dünyasının ilk kağıt fabrikasını kurmuşlardır. Ancak Çinliler kağıt hamurunu insan veya hayvan gücüyle döverek üretirken, İslam mühendisleri bu süreci su değirmenlerine entegre ederek mekanize etmişlerdir. Su çarklarının döndürdüğü devasa tokmaklar (kübit), keten, kenevir ve pamuklu paçavraları havuzlarda dövüp selüloz hamuruna dönüştürüyordu. Bu mekanizasyon, kağıdın çok ucuz ve seri bir şekilde üretilmesini sağladı. Abbâsî Halifesi Hârunürreşîd ve Me'mûn dönemlerinde Bağdat'ta kurulan kâğıt fabrikaları, Beytü'l-Hikme'nin (Bilgelik Evi) devasa çeviri hareketini ve milyonlarca ciltlik kütüphanelerin doğmasını sağladı. Kağıt teknolojisi daha sonra Şam, Kahire, Kuzey Afrika ve Endülüs'ün Xativa şehrine yayıldı. Avrupa, kağıtla ilk kez Endülüs ve Sicilya üzerinden tanıştı. 12. yüzyılda İspanya'da kurulan ilk kağıt değirmenleri, yüzyıllar sonra Gutenberg'in matbaasını besleyecek ve Avrupa'daki bilimsel devrimin (Rönesans) maddi zeminini hazırlayacaktı. İslam kağıt endüstrisi, bilginin demokratikleşmesinin tarihteki ilk büyük itici gücüdür."}, {"id": "a404", "slug": "yeni-a404-ipek-bukme-tezgahlari", "title": "İpek Bükme Tezgahları", "creator": "İslam ve İtalyan Tekstil Mühendisliği", "kisa": "İpek ipliğini büken, çiftleyen ve saran; su veya hayvan gücüyle çalışan, karmaşık dişli ve makara sistemlerine sahip erken dönem mekanize tekstil fabrikası tezgahları.", "uzun": "İpek Bükme Tezgahları, insanlık tarihinin 'mekanize endüstri' kavramıyla ilk tanıştığı devasa makinelerdir. İpek, ham kozadan çıkarıldığında tek başına kullanılamayacak kadar ince ve zayıftır; birden fazla telin bükülerek (throwing) birleştirilmesi ve sarılması gerekir. İslam dünyasında (özellikle İran, Suriye ve Endülüs'te) bu zahmetli el işini mekanize etmek için, su çarkları veya hayvan gücüyle dönen, onlarca makarayı ve bükme milini eşzamanlı olarak çalıştıran devasa ahşap ve dişli makineler icat edilmiştir. Bu 'ağır tekstil teknolojisi', İpek Yolu ticaretinin katma değerini İslam atölyelerinde tutuyordu. 1607'de İtalyan mühendis Vittorio Zonca'nın 'Novo Teatro di Machine' adlı eserinde çizdiği ve Avrupa'nın ilk ipek fabrikalarında (İtalya ve Fransa) kullanılan devasa bükme tezgahları, yapısal ve kinematik olarak İslam/Asya kökenli bu makinelerin birebir kopyasıdır. Bu tezgahlar, 18. yüzyıldaki Sanayi Devrimi'nin 'fabrika sistemi' mantığının tarihsel ve kavramsal atalarıdır."}, {"id": "a405", "slug": "yeni-a405-cam-seramik-firinlari", "title": "Cam ve Seramik Fırınları (İznik/Suriye)", "creator": "İslam Seramik ve Cam Ustaları", "kisa": "1200°C'yi aşan sıcaklıkları günlerce stabil tutabilen termodinamik harikası 'updraft' fırınlar; kobalt, bakır ve gümüş oksitlerle metalik yansımalı (lüster) cam ve çini üreten endüstriyel tesisler.", "uzun": "Cam ve Seramik Fırınları, İslam kimyasının ve malzeme bilimlerinin ateşle imtihanının sanayi ölçeğindeki laboratuvarlarıdır. İznik'in efsanevi çinilerini, Suriye'nin lüster (metalik yansımalı) camlarını ve Memlük kandillerini üreten bu devasa 'updraft' (yukarı çekişli) fırınlar, 1200°C'yi aşan sıcaklıkları günlerce stabil tutabilen termodinamik harikalardı. Fırınların iç astarlarında kullanılan 'tın el-hikme' (bilge kili) ve sır formülleri, İslam kimyagerlerinin (er-Râzî, el-Bîrûnî) mineraloji birikiminin pratik yansımasıdır. Özellikle 'İznik Kırmızısı' (bakır oksidin indirgen ortamda pişirilmesiyle elde edilen mercan kırmızısı) ve 'Kobalt Mavisi', küresel ticaret ağlarının (İpek ve Porselen Yolu) en değerli sırlarıydı. İslam seramikçileri, Çin porseleninin beyazlığını taklit etmek için hamurlarına 'frit' (cam tozu) ekleyerek 'fritware' adı verilen yarı-porselen bir malzeme icat etmişlerdir. Koleksiyondaki bu fırınlar, toprağın ve kumun nasıl mücevhere dönüştüğünün; İslam sanatının estetik zirvesinin ardındaki ateş, kimya ve mühendislik disiplininin belgesidir."}, {"id": "a410", "slug": "yeni-a410-mukemmel-alet-kamile", "title": "Mükemmel Alet (el-Âle el-Kâmile)", "creator": "Müeyyededîn el-Urdî", "kisa": "Merâğa Rasathanesi'nin en karmaşık aleti; cetvel pergeli, kılavuz ray, döner taban ve hassas nişangâhları birleştirerek hem yükseklik hem de azimut ölçümlerini eşzamanlı ve mikron hassasiyetinde yapabilen çok işlevli cihaz.", "uzun": "Mükemmel Alet (el-Âle el-Kâmile), Merâğa Rasathanesi'nin 'altın standardı'dır. El-Urdî'nin üç özgün buluşunun zirvesi sayılan bu alet, döneminin en sofistike ve çok işlevli gözlem cihazıdır. Cetvel pergeli, kılavuz ray, döner taban ve hassas nişangâhları birleştirerek hem yükseklik hem de azimut ölçümlerini eşzamanlı ve mikron hassasiyetinde yapabilir. Ptoleme'nin hantal 'armiller küre'sinin ve sınırlı 'paralaks cetveli'nin ötesine geçen bu modüler çözüm, gözlem sırasında sürekli ayar gerektiren karmaşık işlemleri tek bir hareketle çözer. Aletin adı, onun yalnızca bir araç değil, aynı zamanda bir 'tasarım felsefesi' olduğunu gösterir. El-Urdî, bu aleti 650/1252 yılında icat ettiğini belirtir. Koleksiyonda Mükemmel Alet, Merâğa'nın kurumsal ve entelektüel iddiasının pirinç ve ahşaba dökülmüş halidir; rasathanenin 'mükemmellik' arayışının somut kanıtıdır."}, {"id": "a412", "slug": "yeni-a412-ekinoksal-cember-istanbul", "title": "Ekinoksal Çember (İstanbul Rasathanesi)", "creator": "Takiyyeddîn er-Râsıd", "kisa": "Takiyyeddîn'in İstanbul Rasathanesi için tasarladığı; Güneş'in ekinoks (gece-gündüz eşitliği) anlarını hassasiyetle belirlemek için ekvator düzlemine yerleştirilmiş dereceli çember.", "uzun": "Ekinoksal Çember (Halkat el-İstivâ'), Takiyyeddîn'in İstanbul Rasathanesi'ndeki IV. aletidir. Güneş'in ekvator düzlemini kestiği (gece ve gündüzün eşitlendiği) ekinoks anlarını hassasiyetle tespit etmek için tasarlanmıştır. Çember, tam ekvator düzlemine paralel olarak yerleştirilir ve iç yüzeyi hassas bir şekilde taksimatlandırılır. Güneş ışınları bu çemberin içine girdiğinde, ekinoks gününde ışığın çemberin tam ortasındaki ince bir yarıktan geçmesi veya gölgenin simetrik olarak düşmesi beklenir. Takiyyeddîn, bu aleti Merâğa geleneğinden (el-Urdî'nin ekinoksal halkasından) devralmış, ancak boyutlarını ve hassasiyetini artırarak Osmanlı rasathanesine uyarlamıştır. Bu çember, tropikal yılın uzunluğunu hesaplamak ve takvimleri (özellikle Nevruz ve Ramazan başlangıçlarını) kusursuz ayarlamak için kritik öneme sahipti. Koleksiyonda ekinoksal çember, zamanın 'sıfır noktasını' belirleyen alettir; gece ve gündüzün eşitlendiği an, bu çemberin ortasında durur."}, {"id": "a418", "slug": "yeni-a418-cift-kadranli-sekkaziyye", "title": "Çift Kadranlı Şekkâziyye (el-Merîdînî)", "creator": "Cemâleddîn el-Merîdînî", "kisa": "el-Merîdînî'nin Kahire ekolünde mükemmelleştirdiği; ez-Zerkâlî geleneğinin devamı olan, çift kadranlı yapısıyla hem evrensel hem de yerel hesaplamaları yapabilen gelişmiş şekkâziyye.", "uzun": "Çift Kadranlı Şekkâziyye, 15. yüzyıl Kahire'sinin astronomik mirasının zirvesidir. Cemâleddîn el-Merîdînî, ez-Zerkâlî'nin 11. yüzyılda başlattığı 'evrensel disk' geleneğini alıp, Kahire'nin ileri matematik ve metalurji atölyelerinde 'çift kadranlı' bir yapıya kavuşturmuştur. Bu alet, ön ve arka yüzündeki farklı projeksiyon katmanları sayesinde, kullanıcının hem namaz vakitlerini (yerel ufuk) hem de gezegen konumlarını (evrensel ekliptik) tek bir alette, karmaşık hesaplamalara girmeden okumasını sağlar. el-Merîdînî'nin bu aletleri ve üzerine yazdığı risaleler, o kadar meşhur olmuştur ki, 15. ve 16. yüzyılda Avrupa'da (örneğin Peter Apian) üretilen 'çift kadranlar' ve 'meteoroskoplar' doğrudan onun modellerinin imitasyonudur. Koleksiyonda bu alet, İslam biliminin Avrupa Rönesans alet yapımcılarına 'gizli' ama derin etkisinin somut kanıtıdır."}, {"id": "a420", "slug": "yeni-a420-el-mizzi-sinus-kadrani", "title": "Sinüs Kadranı (el-Mizzî Kadranı, 734/1334)", "creator": "Muhammed b. Ahmed el-Mizzî", "kisa": "Muhammed b. Ahmed el-Mizzî'nin 734/1334'te Şam'da imal ettiği sinüs kadranı; usturlapların arka yüzündeki sinüs kadranından bağımsız, tek başına çalışan erken kadran tipi.", "uzun": "Sinüs Kadranı (er-Rub' el-Müceyyeb), İslam kadran geleneğinin en erken ve en kusursuz örneklerinden biridir. Muhammed b. Ahmed el-Mizzî'nin 734/1334 tarihinde Şam'da imal ettiği bu kadran, bugün St. Petersburg'da muhafaza edilen orijinaline dayanılarak rekonstrükte edilmiştir. Kadranın ön yüzünde, sinüs ve kosinüs hesaplamaları için 'mebsût' (uzanmış/tanjant) ve 'menküs' (ters/kotanjant) çizgileri kazınmıştır. Kadranın merkezinden sarkan şakül (çekül), güneşin yüksekliğini doğrudan derece cinsinden gösterir. Usturlapların arka yüzündeki sinüs kadranından bağımsız olarak, tek başına çalışan bu kadran tipi, muvakkitlerin günlük pratiğini büyük ölçüde kolaylaştırmıştır. İbn eş-Şâtır'ın Şam'daki Emevî Camii muvakkithanesinde kullandığı kadranlar bu geleneğe dayanır. Koleksiyonda bu kadran, 'matematiksel bir keşfin (sinüs fonksiyonu) gündelik bir alete dönüşümünün simgesidir'."}, {"id": "a421", "slug": "yeni-a421-es-sihab-sinus-kadrani", "title": "Ali b. eş-Şihâb'ın Sinüs Kadranı (735/1335)", "creator": "Ali b. eş-Şihâb", "kisa": "Ali b. eş-Şihâb'ın 735/1335'te imal ettiği ve üzerine Muhammed b. el-Guzûlî'nin kazıma yaptığı sinüs kadranı; Şam kadran geleneğinin el-Mizzî'den sonraki nesli.", "uzun": "Ali b. eş-Şihâb'ın Sinüs Kadranı, Şam kadran geleneğinin el-Mizzî'den sonraki neslini temsil eder. 735/1335 yılında imal edilen bu kadranın üzerine, Muhammed b. el-Guzûlî tarafından ek kazıma yapılmıştır. Kadran, 1859'dan kısa bir süre önce Şam'da Arabist Alois Sprenger tarafından Londralı kütüphaneci William Morley için satın alınmış ve böylece Avrupa'ya taşınmıştır. Kadranın ön yüzünde sinüs kadranı skalaları, gölge kareleri ve nişangâh bulunur. Arka yüzü boş bırakılmıştır. Kadranın pirinç yüzeyi, asitle kazınmış (hâkkedilmiş) ince çizgilerle süslenmiştir; bu kazıma tekniği, Memlük dönemi metal işçiliğinin zarafetini gösterir. Koleksiyonda bu kadran, İslam bilimsel aletlerinin 'kültürel yolculuğunu' temsil eder; Şam'dan Londra'ya uzanan bir bilgi aktarımının sessiz tanığıdır."}, {"id": "a422", "slug": "yeni-a422-destur-kadrani-daire", "title": "Destur Kadranı (Dâ'iret ed-Destûr)", "creator": "İslam Muvakkit Geleneği", "kisa": "'Destur' (bölümleme/kural) kelimesinden adını alan; belirli bir enlem için namaz vakitlerini doğrudan okumayı sağlayan özel kadran tipi.", "uzun": "Destur Kadranı (Dâ'iret ed-Destür), İslam kadran geleneğinin en pratik ve en 'kurallaştırılmış' tipidir. 'Destur' kelimesi, 'bölümleme', 'kural' veya 'standart' anlamına gelir; bu kadran, belirli bir şehir için namaz vakitlerini (sabah, öğle, ikindi, akşam, yatsı) doğrudan okumayı sağlayan özel skalalarla donatılmıştır. Kadranın üzerine, o şehrin enlemine göre hesaplanmış 'destur çizgileri' kazınmıştır; güneşin yüksekliği nişangâhla ölçüldükten sonra, şakülün işaretlediği nokta doğrudan namaz vaktini gösterir. İbn eş-Şâtır'ın Şam geleneğinde ve el-Merîdînî'nin Kahire geleneğinde destur kadranlarının örnekleri vardır. Koleksiyonda destur kadranı, 'matematiğin ibadete hizmetkarlığı'nın en somut ifadesidir; karmaşık küresel trigonometri hesaplamaları, tek bir kadran yüzeyinde 'kurallaştırılmış' bir okumaya indirgenmiştir."}, {"id": "a424", "slug": "yeni-a424-mukantara-kadrani-magrip", "title": "Mukantara Kadranı (Mağrip Kökenli)", "creator": "Mağrip Muvakkit Geleneği", "kisa": "60 eşit bölüme ayrılmış çeyrek daire formunda Mağrip kökenli kadran; yükseklik yayı 90'lık taksimata sahip, kiriş mesafelerini sinüs değerlerine çeviren özel yaylarla donatılmıştır.", "uzun": "Mukantara Kadranı, Mağrip coğrafyasının kadran geleneğinin özgün formudur. Enstitünün mülkiyetinde bulunan bu kadran, Mağrip kökenlidir ve 10./16. veya 11./17. yüzyılda imal edilmiş olması mümkündür. Arka yüzü boştur. 60 eşit bölüme ayrılmıştır ve adı da buradan gelmektedir; yükseklik yayı 90'lık taksimata sahiptir. Mebsût ve menküs çizgilerine ait iki sistem dışında, yarım daire biçiminde iki yay (bir tanesi sinüs çizgisi üzerinde, diğeri kosinüs çizgisi üzerinde) bulunmaktadır; bunlar kiriş mesafelerini sinüs değerlerine çevirmek içindir. İkindi namazı vaktini belirlemek için de bir yay bulunmaktadır. İki nişangâhtan birisi eksiktir. Koleksiyonda mukantara kadranı, Mağrip kadran geleneğinin 'yerel' formunu ve Mağrip'in İslam astronomi mirasına katkısını temsil eder; Endülüs-Mağrip-Kahire üçgeninin matematiksel sentezidir."}, {"id": "a425", "slug": "yeni-a425-mevsimsel-saat-kadrani", "title": "Mevsimsel Saat Kadranı", "creator": "İslam Muvakkit Geleneği", "kisa": "Gündüz ve gecenin her birinin 12'şer eşit olmayan parçaya bölündüğü mevsimsel saat sistemini gösteren kadran; yazın gündüz saatleri uzun, kışın kısa.", "uzun": "Mevsimsel Saat Kadranı ve Muvakkit Geleneği, İslam dünyasının 'zaman' kavramını nasıl yaşadığını gösteren en temel belgedir. İslam dünyasında zaman, yalnızca 'eşit saatler' (modern saat) olarak değil, aynı zamanda 'mevsimsel saatler' (sa'ât zamâniyye) olarak da ölçülürdü. Gündüz ve gece, her biri 12'şer eşit olmayan parçaya bölünürdü; bu parçaların uzunluğu mevsime göre değişirdi. Yazın gündüz saatleri uzun, kışın kısa; gece saatleri ise tam tersi olurdu. Bu sistem, namaz vakitlerinin, oruç başlangıç ve bitişlerinin, tarım işlerinin ve günlük yaşamın ritmini belirlerdi. Muvakkitler, her şehir için mevsimsel saat çizelgeleri hazırlar; bu çizelgeler cami muvakkithanelerinde asılırdı. Koleksiyonda mevsimsel saat kadranı, 'zamanın kültürel ve astronomik boyutunu' temsil eder; modern saat anlayışından farklı, doğayla uyumlu bir zaman ritminin belgesidir. Bu kadran, Mısır'daki Kıpti takvimi geleneğiyle ve İbn Yünis'in Kahire zîciyle de ilişkilidir."}, {"id": "a426", "slug": "yeni-a426-safiha-camia", "title": "Ebû eş-Şalt'ın Kapsamlı Diski (Safîha Câmîa)", "creator": "Ebû eş-Şalt el-Endülüsî", "kisa": "Ebû eş-Şalt'ın kapsamlı disk risalesinde tarif ettiği; limbus, deferentler, ekuant daireleri ve episikl disklerinden oluşan, Mars'ın ölçümü için ayarlanmış mekanik ekvatoryum.", "uzun": "Ebû eş-Şalt'ın Kapsamlı Diski (Safîha Câmîa), Endülüs ekvatoryum geleneğinin en gelişmiş örneklerinden biridir. Pirinç, hâkkedilmiş malzemeden yapılan bu alet, 275 mm çapında olup bir episikl diski ve iki ip ile birlikte çalışır. Aletin ön yüzünde limbus (dış çember), deferentler (taşıyıcı daireler), ekuant daireleri ve episikl diskleri bulunur; bu bileşenler, gezegenlerin düzensiz görünen hareketlerini (anomalileri) mekanik olarak simüle eder. Model, Beyrut'taki aşırı zarar görmüş bir yazmadan alınan çizime dayanır; episikl merkezindeki kesim açıkça görülebilir. Ebû eş-Şalt, bu aletle yalnızca gezegen boylamlarını değil, aynı zamanda Mars'ın retrograd (geri) hareketini de mekanik olarak göstermeyi başarmıştır. Koleksiyonda bu disk, Endülüs'ün 'mekanik astronomi' geleneğinin canlı bir kanıtıdır."}, {"id": "a427", "slug": "yeni-a427-ibn-es-satir-merkur-modeli", "title": "İbn eş-Şâtır'ın Merkür Modeli", "creator": "Alâeddîn Alî b. İbrâhîm İbn eş-Şâtır", "kisa": "İbn eş-Şâtır'ın Batlamyus'un ekvatorunu ortadan kaldıran alternatif Merkür modeli; Kopernik'in yüzyıl sonraki modeliyle matematiksel özdeşlik gösteren kinematik çözüm.", "uzun": "İbn eş-Şâtır'ın Merkür Modeli, İslam astronomisinin 'teorik devrimi'nin en parlak meyvelerinden biridir. Şam Emevi Camii'nin başmuvakkidi olan İbn eş-Şâtır, Batlamyus'un gezegen modelindeki ekvator noktasının fiziksel tutarsızlığını çözmek için alternatif bir kinematik model geliştirmiştir. Merkür'ün düzensiz görünen hareketini, düzgün dairesel hareketlerin bileşimiyle açıklayan bu model, Kopernik'in 'De Revolutionibus' adlı eserindeki Merkür modeliyle matematiksel olarak özdeştir. Bu keşif, İslam astronomisinin yalnız 'kopyacı' değil, aynı zamanda 'yenilikçi' olduğunu ve Kopernik Devrimi'nin köklerinin Şam muvakkithanesinde yattığını gösterir. Koleksiyonda bu model, bilimin sınırları ve yüzyılları aşan evrensel doğasının kanıtıdır."}, {"id": "a431", "slug": "yeni-a431-fil-saati", "title": "Fil Saati", "creator": "İsmâil b. er-Rezzâz el-Cezerî", "kisa": "el-Cezerî'nin tasarladığı; Hint fili, Çin ejderhaları, Arap figürleri ve Yunan hidrolik teknolojisini birleştiren, her yarım saatte bir otomatik olarak çalışan devasa anıtsal su saati.", "uzun": "Fil Saati, İslam mühendisliğinin ve dünya mekanik tarihinin en ikonik, en çok kültürlü başyapıtıdır. el-Cezerî bu saati tasarlarken dönemin bilinen dünyasının sembollerini bir araya getirmiştir: Hint alt kıtasını temsil eden fil, Çin'i temsil eden ejderhalar, İslam/Abbâsî medeniyetini temsil eden sarıklı figürler ve Antik Yunan'dan miras kalan hidrolik (su akışı) teknolojisi. Saatin kalbinde, filin karnındaki gizli bir su haznesi ve suyun yavaşça dolmasını sağlayan bir 'akış düzenleyici' (orifice/flow regulator) bulunur. Hazne dolduğunda bir şamandıra mekanizması tetiklenir, filin üzerindeki mahout (fil sürücüsü) figürü elindeki çekiçle filin başına vurur, tepedeki kuş figürü öter ve ejderhaların ağzından sarkan toplar düşerek her yarım saati görsel ve işitsel bir şova dönüştürür. Bu düzenekteki 'akış düzenleyici' valf, suyun basıncı ne olursa olsun akış hızını sabit tutan, modern mühendislikteki 'geri besleme' (feedback) ve 'oransal kontrol' valflerinin Orta Çağ'daki atasıdır. Koleksiyonda Fil Saati, zamanın sadece ölçülmediği, aynı zamanda estetik ve diplomatik bir gösteriye dönüştüğü anı temsil eder."}, {"id": "a432", "slug": "yeni-a432-sifreli-kilit-sandik", "title": "Şifreli Kilit (12 Harfli Sandık Kilidi)", "creator": "İsmâil b. er-Rezzâz el-Cezerî", "kisa": "el-Cezerî'nin tasarladığı; Arap alfabesinden 12 harfi taşıyan döner halkalardan oluşan, sadece doğru kelime/kombinasyon hizalandığında iç pimler serbest kalarak açılan mekanik sandık kilidi.", "uzun": "Şifreli Kilit (kufî yukfelu 'alâ şandûk...), el-Cezerî'nin eserinin son bölümünde anlattığı ve mekanik kriptoloji tarihinin en parlak buluşlarından biridir. Kilit, dışarıdan bakıldığında üzerinde Arap alfabesi harflerinin kazılı olduğu 12 adet döner pirinç halkadan (kadrandan) oluşur. Her halkanın iç yüzeyinde, belirli bir derinlikte oyulmuş çentikler bulunur. Kilit yalnızca, halkalar döndürülerek 12 harfli spesifik bir kelime veya şifre (örneğin bir şiir dizesi veya hükümdarın adı) tam olarak hizalandığında, içerideki emniyet pimleri bu çentiklere düşer ve sürgü serbest kalarak sandığın açılmasına izin verir. Yanlış bir harf girildiğinde pimlerden en az biri bloke olur. Bu düzenek, 19. yüzyılda James Sargent tarafından patentlenen modern kombinasyonlu kasa kilitlerinin tam 700 yıl öncesindeki, üstelik çok daha zarif ve sanatsal bir versiyonudur. el-Cezerî, bu kilitle 'güvenlik' kavramını fiziksel güçten (kalınlıktan) alıp 'entelektüel bir bilgiye' (şifreye) dayandırmıştır."}, {"id": "a432b", "slug": "yeni-a432b-samdanli-mum-saati", "title": "Şamdanlı Mum Saati ve Şahin Otomatı", "creator": "İsmâil b. er-Rezzâz el-Cezerî", "kisa": "el-Cezerî'nin tasarladığı; mum yandıkça eriyen balmumunun ağırlık azalmasını bir makara sistemiyle ölçen, her saat başı şahin figürünün gagasındaki bilyeyi bronz kaseye bıraktığı portatif mum saati.", "uzun": "Şamdanlı Mum Saati, el-Cezerî'nin 'zamanı ölçmek için suya veya güneşe bağımlı kalmama' arayışının en estetik sonucudur. Kendinden önceki ustaların mum saatlerini yetersiz ve hatalı bulan el-Cezerî, mumun yanma hızındaki tutarsızlıkları gidermek için dâhiyane bir mekanizma kurmuştur. Standart boy, ağırlık ve çaptaki özel bir mum, rüzgardan korunaklı cam bir fanusun içine yerleştirilir. Mumun tabanına bağlı bir ip ve makara sistemi (ağırlık ve cıva düzenekli) devreye girer. Mum yandıkça ve boyu kısaldıkça, tabandaki ağırlık azalır ve karşıt ağırlık (counterweight) mekanizmayı yukarı çeker. Bu mekanik hareket, saatin dışındaki bir şahin figürünün gagasındaki bilyeyi her saat başı bir çanağa bırakmasına neden olur. Bu saat, su saatlerinin donma veya buharlaşma riski olmayan, geceleyin veya kapalı odalarda zamanı hassasiyetle ölçen bir 'masaüstü kronometresi' işlevi görmüştür. el-Cezerî, mumun kimyasal yapısını (saf balmumu ve fitil kalınlığı) standartlaştırarak, yanma hızını sabit bir matematiksel değere (sabit kütle kaybı) bağlamıştır."}, {"id": "a433", "slug": "yeni-a433-dort-surgulu-kilit", "title": "Dört Sürgülü Kapı Kilidi", "creator": "İsmâil b. er-Rezzâz el-Cezerî", "kisa": "Dört farklı yöne (sağ, sol, yukarı, aşağı) eşzamanlı olarak açılan sürgülere sahip; sadece özel tasarlanmış, kancalı ve tırnaklı bir anahtarın karmaşık bir dansıyla açılabilen saray kapısı kilidi.", "uzun": "Dört Sürgülü Kapı Kilidi, el-Cezerî'nin hırsızlara ve kötü niyetli kişilere (târih) karşı geliştirdiği mutlak güvenlik protokolüdür. Standart kapı kilitleri tek bir sürgüye dayanır ve maymuncukla veya güç kullanılarak kırılabilir. el-Cezerî ise kapının içine, dört farklı yöne (sağa, sola, yukarıya ve aşağıya) uzanan dört ayrı sürgü yerleştirmiştir. Bu sürgüleri hareket ettirmek için standart bir anahtar işe yaramaz; kilidin içine sokulan özel anahtarın, belirli bir açıda döndürülmesi, çekilmesi ve içindeki gizli tırnakların sürgülerin arkasına kancalanması gerekir. Anahtar dışarı çekildiğinde mekanizma kilitlenir ve sürgüler elle veya aletle zorlanamaz. el-Cezerî, bu kilidi tasarlarken 'hiç kimse sürgülemekle korunan şeye erişemez' diyerek, mekanik mühendisliğin fiziksel direnç sınırlarını o dönemin metalurjisiyle zirveye taşımıştır."}, {"id": "a433b", "slug": "yeni-a433b-civali-saat-muradi", "title": "Cıvalı Saat (Kitâb es-Sirâr)", "creator": "Ebü'l-Halef el-Murâdî", "kisa": "Su saatlerinin iklimsel sorunlarını aşmak için su yerine cıva (simâb) kullanan; episkiklik dişli trenleriyle çalışan ve Avrupa mekanik saatçiliğini derinden etkileyen Endülüs saati.", "uzun": "Cıvalı Saat, Endülüslü mühendis Ebü'l-Halef el-Murâdî'nin 11. yüzyılda yazdığı 'Kitâb es-Sirâr' adlı eserinde tarif ettiği, hidrolik saatçilik tarihinin en sıra dışı buluşlarından biridir. Antik Çağ'dan beri kullanılan su saatleri (clepsydra), suyun buharlaşması, kışın donması veya sıcaklığa bağlı olarak viskozitesinin değişmesi gibi kronik sorunlar yaşıyordu. el-Murâdî, bu hidrolik çıkmazı çözmek için su yerine cıva (simâb) kullanmayı teklif etmiştir. Cıvanın yüksek yoğunluğu, sıfıra yakın buharlaşma oranı ve sıcaklıkla hacminin nispeten sabit kalması, saatin çok daha yavaş, düzenli ve dış iklim koşullarından etkilenmeden çalışmasını sağlıyordu. Daha da çarpıcısı, el-Murâdî bu cıva akışını, Ptoleme'nin gezegen modellerinden ilham alarak tasarladığı 'episkiklik dişli' (epicyclic gear) sistemlerine bağlamıştır. Bu dişliler, Güneş'in ve Ay'ın zodyak üzerindeki hareketlerini simüle ediyordu. el-Murâdî'nin bu cıva bazlı mekanizmaları, 13. yüzyılda İspanyol kralı X. Alfonso'nun 'Libros del Saber' adlı eserine çevrilerek Avrupa'nın mekanik saatçilik tarihini başlatan kıvılcım olmuştur."}, {"id": "a434b", "slug": "yeni-a434b-programlanabilir-muzik-otomati", "title": "Programlanabilir Müzik Otomatı", "creator": "Benû Mûsâ b. Şâkir", "kisa": "Su veya hava basıncıyla çalışan, üzerindeki çıkıntılar (pin) değiştirilerek farklı melodiler çalınabilen, tarihin ilk 'programlanabilir' makinesi.", "uzun": "Programlanabilir Müzik Otomatı (el-Âle elletî tuzammiru bi-nefsihâ), Benû Mûsâ kardeşlerin 'Kitâb el-Hiyel' adlı eserinde anlattığı ve sibernetik tarihinin en büyük devrimlerinden biri olan cihazdır. Bu otomat, temelde bir su saati mekanizmasıyla (veya körükle) döndürülen silindirik bir tambur ve bu tambura bağlı hava üfleyen flüt sistemidir. Ancak asıl dâhiyane buluş, tamburun üzerindeki 'çıkıntılar' (pinler) ve kaldıraçlardır. Benû Mûsâ, tamburun üzerindeki çıkıntıların yerlerini ve uzunluklarını değiştirerek (yani silindiri 'yeniden programlayarak') makinenin farklı melodiler, farklı ritimler ve farklı makamlar çalmasını sağlamışlardır. Bu, insanlık tarihinde bir makinenin fiziksel gövdesinden (donanım) bağımsız olarak, ona dışarıdan bir komut dizisi (yazılım/program) yüklenebileceğinin ilk kanıtıdır. 19. yüzyıldaki müzik kutuları, delikli kartlarla çalışan piyanolar ve nihayetinde modern bilgisayarların 'değiştirilebilir program' mantığı, doğrudan bu 9. yüzyıl Bağdat otomatının mirasçısıdır. Bu alet, sibernetiğin ve otomasyonun kurucu belgesidir."}, {"id": "a435", "slug": "yeni-a435-on-iki-kapili-mum-saati", "title": "On İki Kapılı Endülüs Mum Saati", "creator": "Endülüs Saat ve Otomat Geleneği", "kisa": "Her saat başı 12 kapıdan birinin açılarak içinden bir figürün çıktığı veya bir bilyenin düştüğü, Endülüs saraylarında kullanılan anıtsal ve görsel mum saati.", "uzun": "On İki Kapılı Endülüs Mum Saati, İslam Batısı'nın (Endülüs ve Mağrip) mekanik saatçilikteki estetik ve mühendislik zirvesini temsil eder. Bu saat, uzun ve kalın bir balmumu silindirin, arkasında dönen karmaşık bir dişli ve makara sistemiyle çalışır. Saatin ön yüzünde, günün 12 saatini temsil eden 12 küçük kapı (pencere) bulunur. Mum yandıkça ve mekanizma ilerledikçe, her saat başı bu kapılardan biri otomatik olarak açılır; içinden renkli bir figür çıkar veya metal bir bilye yuvarlanarak dışarıdaki bir çanağa düşer ve işitsel bir sinyal (çın) üretir. Günün sonunda 12 kapının tamamı açılmış olur ve saat yeniden kurulurdu. Bu 'görsel ve işitsel' zaman anlatımı, Orta Çağ Avrupası'nda (özellikle Kastilya Kralı X. Alfonso'nun sarayında) büyük bir hayranlıkla karşılanmış, Latince'ye çevrilen Endülüs saat risaleleri, Avrupa'nın ilk mekanik kule saatlerinin (örneğin Strasbourg ve Padova saatlerinin) otomat figürlerine (jack) doğrudan ilham vermiştir."}, {"id": "a435b", "slug": "yeni-a435b-tavus-kuslu-abdest-otomati", "title": "Tavus Kuşlu Abdest Otomatı", "creator": "İsmâil b. er-Rezzâz el-Cezerî", "kisa": "el-Cezerî'nin tasarladığı; tavus kuşu formundaki çeşmeden su aktığında, yanındaki mekanik hizmetçi figürünün otomatik olarak sabunu ve havluyu uzattığı hidro-mekanik abdest otomatı.", "uzun": "Tavus Kuşlu Abdest Otomatı, el-Cezerî'nin hidrolik mühendisliği günlük saray ritüellerine ve 'insan-makine etkileşimine' uyarladığı en zarif başyapıtıdır. Bu düzenek, saray misafirlerinin veya hükümdarın el yıkaması için tasarlanmıştır. Tavus kuşunun gagasından su akmaya başladığında, suyun haznedeki seviyesi değişir ve bir şamandıra-valf mekanizmasını tetikler. Bu mekanik sinyal, tavus kuşunun yanında duran mekanik bir 'hizmetçi' (gulâm) figürüne iletilir. Hizmetçi figürü, kolundaki mekanik mafsalı kullanarak elindeki sabunu misafire doğru uzatır. Yıkama işlemi bitip su kesildiğinde, ikinci bir valf devreye girer ve hizmetçi bu kez diğer elindeki havluyu uzatır. Bu otomat, sadece suyu pompalamakla kalmaz, aynı zamanda çevresel bir eyleme (suyun akışına ve durmasına) yanıt veren, sensör (şamandıra) ve aktüatör (mekanik kol) mantığıyla çalışan erken bir 'robot'tur. el-Cezerî bu aletle, makinenin insana hizmet edebileceği fikrini Orta Çağ'da somutlaştırmıştır."}, {"id": "a436", "slug": "yeni-a436-degisken-sekilli-fiskiye", "title": "Değişken Şekilli Fıskiye", "creator": "el-Cezerî ve Benû Mûsâ Geleneği", "kisa": "İçindeki gizli hidrolik valfler ve gecikme odaları sayesinde, suyu periyodik olarak farklı formlarda (bazen bir kalkan/siper, bazen bir mızrak, bazen bir zambak) fışkırtan tiyatro fıskiyesi.", "uzun": "Değişken Şekilli Fıskiye, İslam bahçe mimarisinin ve hidrolik mühendisliğinin ziyaretçilerde 'hayret' (şaşkınlık) uyandırmak için kullandığı en büyüleyici cihazdır. el-Cezerî ve ondan yüzyıllar önce Benû Mûsâ, suyun basıncını kullanarak kendi kendine açılıp kapanan, yön değiştiren valfler (mekanik zamanlayıcılar) icat etmişlerdir. Bu fıskiyenin tabanında, suyun doldukça bir şamandırayı iterek valfi kapattığı, boşaldıkça valfi tekrar açtığı 'gecikme odaları' bulunur. Bu döngü sayesinde, fıskiyeden fışkıran suyun şekli belirli aralıklarla değişir: Önce su geniş bir kubbe (kalkan) formunda yayılır, ardından aniden daralarak uzun bir mızrak (sütun) formuna dönüşür, bazen de bir zambak çiçeği gibi etrafa saçılır. Saray bahçelerine gelen elçiler ve konuklar, suyun kendi kendine 'şekil değiştirdiğini' sanarak büyülendirlerdi. Bu 'periyodik akış kontrolü', modern pnömatik ve hidrolik sistemlerdeki 'zaman röleleri'nin ve 'osilatör valflerin' Orta Çağ'daki atasıdır."}, {"id": "a437", "slug": "yeni-a437-dort-yonlu-valf", "title": "Dört Yönlü Valf / Musluk Dağıtıcı", "creator": "Benû Mûsâ b. Şâkir", "kisa": "Tek bir ana borudan gelen suyu (veya farklı sıcaklıktaki suları), iç mekanizması döndürülerek dört farklı çıkışa veya karışım oranına yönlendiren çok yollu pirinç valf.", "uzun": "Dört Yönlü Valf, Benû Mûsâ kardeşlerin 'Kitâb el-Hiyel' adlı eserinde tarif ettiği ve modern tesisat mühendisliğinin 'dağıtıcı vana' (diverter valve) kavramının tarihteki ilk örneğidir. Abbâsî saraylarının hamamlarında ve bahçelerinde, sıcak ve soğuk suyun veya farklı kokulu esansların karıştırılarak akıtılması bir lüks ve mühendislik gösterisiydi. Benû Mûsâ, içi oyuk, üzerinde farklı açıklıklar bulunan döner bir silindir (tıpa) ve onu saran dış bir gövdeden oluşan bir valf tasarladılar. Kullanıcı valfin kolunu çevirdiğinde, içerideki kanallar hizalanıyor ve suyun akış yönü (veya karışım oranı) anında değişiyordu. Bu mekanizma, sadece suyu yönlendirmekle kalmıyor, aynı zamanda basıncı dengeleyerek boruların patlamasını da önlüyordu. Bu 'çok yollu valf' prensibi, yüzyıllar sonra buharlı makinelerin buhar dağıtım sistemlerinde (slide valve) ve günümüzün modern kombi/musluk bataryalarında aynen kullanılmaktadır."}, {"id": "a437b", "slug": "yeni-a437b-astrolojik-otomatlar", "title": "Astrolojik Otomatlar (Kitâb el-Esrâr Figürleri)", "creator": "Ebü'l-Halef el-Murâdî", "kisa": "el-Murâdî'nin tasarladığı; Güneş'in ve Ay'ın zodyak üzerindeki hareketlerini episkiklik dişlilerle takip eden ve bu konumlara göre yılan, akrep veya kuş figürlerini hareket ettiren astrolojik otomatlar.", "uzun": "Astrolojik Otomatlar, Endülüslü mühendis el-Murâdî'nin 'Kitâb es-Sirâr' adlı eserinde tarif ettiği, astronomi, astroloji ve mekanik mühendisliğin iç içe geçtiği büyüleyici cihazlardır. Bu otomatlar, sadece zamanı ölçmekle kalmaz, aynı zamanda gökyüzünün o anki durumunu mekanik bir tiyatroya dönüştürürdü. el-Murâdî, karmaşık episkiklik (iç içe dönen) dişli trenleri kullanarak Güneş'in ve Ay'ın burçlar kuşağındaki (zodyak) anlık konumlarını hesaplayan bir mekanizma kurmuştur. Bu dişlilerin ürettiği mekanik veri, dışarıdaki figürlere aktarılırdı: Örneğin, Güneş Akrep burcuna girdiğinde mekanik bir akrep figürü iğnesini çıkarır; Yılan burcundaysa mekanik bir yılan tıslayarak veya kıvrılarak hareket ederdi. Bu düzenekler, Orta Çağ insanının gökyüzüne duyduğu mistik ve bilimsel ilginin mekanik yansımasıdır. el-Murâdî'nin bu dişli sistemleri, 14. yüzyılda Avrupa'da geliştirilecek olan mekanik astronomik saatlerin (örneğin Strasbourg ve Prag saat kulelerinin) doğrudan atasıdır."}, {"id": "a438", "slug": "yeni-a438-leonardo-karsilastirma", "title": "Leonardo ile Karşılaştırmalı Vinç ve Su Düzenekleri", "creator": "İslam Mühendisliği ve Rönesans Osmostu", "kisa": "el-Cezerî'nin 1206'da çizdiği krank-biyel, sonsuz vida ve palanga mekanizmalarının, Leonardo da Vinci'nin 15. yüzyıldaki Codex Atlanticus çizimleriyle yan yana sunularak teknolojik aktarımı (osmoz) belgeleyen karşılaştırmalı rekonstrüksiyon.", "uzun": "Leonardo ile Karşılaştırmalı Vinç ve Su Düzenekleri, bilim tarihinin en büyük 'gizli aktarım' hikayelerinden birini ifşa eden küratöryel bir başyapıttır. Leonardo da Vinci'nin meşhur Codex Atlanticus'unda çizdiği su kaldırma vidaları, krank mekanizmaları ve karmaşık palanga (makara) sistemleri, yüzyıllar boyunca 'Rönesans dehasının sıfırdan yarattığı' mucizeler olarak kabul edilmiştir. Ancak Fuat Sezgin ve Donald R. Hill gibi tarihçilerin karşılaştırmalı analizleri, Leonardo'nun çizimlerindeki kinematik zincirlerin, dişli oranlarının ve hatta perspektif hatalarının, el-Cezerî'nin 1206 tarihli 'el-Câmi' adlı eserindeki ve Benû Mûsâ'nın 'Kitâb el-Hiyel'indeki çizimlerle şaşırtıcı derecede yapısal benzerlikler taşıdığını ortaya koymuştur. İslam el yazmaları, Haçlı Seferleri, İspanyol-Arap çeviri hareketleri veya Venedik tüccarları aracılığıyla İtalyan atölyelerine sızdığında, Leonardo bu öncülleri yalnızca 'kopyalamamış', kendi mühendislik sezgisiyle dönüştürmüştür. Bu karşılaştırmalı sunum, dehanın boşlukta değil, birikimin omuzlarında yükseldiğinin; İslam hidroliğinin Floransa'nın kanallarında nasıl yeniden aktığının en somut belgesidir."}, {"id": "a438b", "slug": "yeni-a438b-kadeh-formlu-su-saati", "title": "Kadeh Formlu Su Saati (Sifon Mekanizması)", "creator": "İsmâil b. er-Rezzâz el-Cezerî", "kisa": "el-Cezerî'nin tasarladığı; kadeh formundaki haznede biriken suyun belirli bir seviyeye ulaştığında sifonla boşaldığı ve bu sırada ejderha ile kuş figürlerinin hareket ettiği masaüstü su saati.", "uzun": "Kadeh Formlu Su Saati, el-Cezerî'nin hidrolik ve pnömatik prensipleri birleştirerek yarattığı en şaşırtıcı 'sürpriz' saatlerinden biridir. Bu saat, dışarıdan bakıldığında zarif bir metal kadeh veya vazo gibi görünür. Ancak içinde, suyun yavaşça dolduğu gizli bir hazne ve bu hazneye bağlı bir 'sifon' (devrik kova / tipping bucket) mekanizması bulunur. Su hazneye doldukça şamandıra yükselir; ancak su belirli bir kritik seviyeye (eşik değere) ulaştığında, sifon prensibi devreye girer ve haznedeki su aniden ve hızla alttaki boşaltma tankına akar. Bu ani su akışı, bir dizi makara ve ipi çekerek saatin dışındaki ejderha figürünün ağzını açmasına ve bir kuş figürünün ötmesine neden olur. Bu 'eşik değeri' ve 'ani boşalma' mantığı, modern elektronikteki 'flip-flop' devrelerinin ve dijital mantığın (0'dan 1'e geçiş) hidrolik karşılığıdır. el-Cezerî, suyun yüzey gerilimini ve atmosfer basıncını kullanarak, zamanı sürekli değil, 'kesikli' (digital/discrete) aralıklarla ölçen bir mekanizma kurmuştur."}, {"id": "a439", "slug": "yeni-a439-ceneli-ekskavator", "title": "Çeneli Ekskavatör (Su Altı Kavrama Düzeneği)", "creator": "İsmâil b. er-Rezzâz el-Cezerî", "kisa": "Nehir veya deniz dibine batan değerli eşyaları (hazineleri) veya enkazı, yüzeyden yönetilen uzun kollar ve kapanan çenelerle kavrayıp çıkaran erken dönem su altı robotu.", "uzun": "Çeneli Ekskavatör, el-Cezerî'nin 'nesneleri sulardan kaldırmak için' tasarladığı ve robotik tarihinin en erken 'uzaktan kumandalı' cihazlarından biri olan düzeneğidir. Dicle nehri gibi hızlı akan veya derin sularda batan gemi yüklerini, hazineleri veya inşaat enkazını dalgıçlar (o dönem için ölümcül bir risk) olmadan çıkarmak imkansızdı. el-Cezerî, uzun ahşap veya metal kolların ucuna, makara ve ip sistemleriyle kontrol edilen 'kapanan çeneler' (kıskaçlar) monte etti. Yüzeydeki bir operatör, kolları suya indiriyor, çenelerin hedef nesnenin etrafına kapanmasını sağlıyor ve ardından ana halatı çekerek çenelerin kilitlenmesini ve nesneyi su yüzeyine taşımasını sağlıyordu. Bu mekanizma, insan elinin ulaşamayacağı derinliklerde ve tehlikeli ortamlarda 'mekanik bir el' kullanma fikrinin ilk uygulamasıdır. Bugün limanlarda kullanılan devasa 'grab' (kavrayıcı) vinçlerin ve Mars rover'larındaki robotik kolların temel kinematik mantığı, bu 12. yüzyıl Diyarbakır atölyesinde çözülmüştür."}, {"id": "a439b", "slug": "yeni-a439b-kuyu-kovasi-zinciri", "title": "Kuyu Kovası Zinciri ve Sonsuz Vidalar", "creator": "İslam Hidrolik Mühendisliği", "kisa": "Derin kuyulardan ve su basan maden ocaklarından suyu kesintisiz olarak yüzeye taşımak için, iki makara arasına gerilmiş sonsuz bir zincire bağlı toprak/ahşap kovalardan oluşan hidrolik düzenek.", "uzun": "Kuyu Kovası Zinciri, İslam hidrolik mühendisliğinin 'sürekli döngü' (continuous loop) mantığını dikey taşımacılığa uyguladığı en pratik buluşlarından biridir. Sâkiye (kovalı çark) tarlalara su basarken, 'kuyu kovası zinciri' (chain of pots) çok daha derin kuyulardan ve su basan maden ocaklarından suyu tahliye etmek için kullanılırdı. İki büyük kasnağın arasına gerilmiş halat veya zincir üzerine, eşit aralıklarla toprak veya ahşap kovalar bağlanırdı. Hayvan gücü veya su çarkıyla döndürülen bu sistem, kovaları dibe indirip suyla dolduruyor, ardından yüzeye çıkarıp devasa bir tekneye (havuza) boşaltıyordu. Bu 'sonsuz döngü' mekanizması, 16. yüzyılda Georgius Agricola'nın meşhur 'De Re Metallica' (Metaller Üzerine) adlı eserinde Avrupa madenciliğinin standart drenaj sistemi olarak çizilmiştir. Koleksiyondaki bu düzenek, suyun ve cevherin yerçekimine karşı nasıl yenildiğinin; modern asansörlerin ve bant konveyörlerin felsefi atasıdır."}, {"id": "a439c", "slug": "yeni-a439c-dakika-saniye-saat", "title": "Dakika ve Saniye Gösteren Mekanik Saat", "creator": "Takiyyeddîn er-Râsıd", "kisa": "Takiyyeddîn'in İstanbul Rasathanesi için tasarladığı; helezoni zemberek (yay) tahrikli, eşapman mekanizmalı ve tarihte ilk kez 'dakika' ve 'saniye' ibreleri taşıyan hassas mekanik saat.", "uzun": "Takiyyeddîn'in Dakika ve Saniye Gösteren Mekanik Saati, 16. yüzyılın en iddialı kronometrik projelerindendir. Rasathane gözlemlerinde (özellikle yıldız geçişlerinde / transit) saniye hassasiyeti gerektiği için, dönemin Avrupa ve İslam su/kum saatleri yetersiz kalmış; Takiyyeddîn kendi 'astronomik saatini' kurmaya girişmiştir. 'el-Kevâkibü'd-Düreriyye' adlı eserinde, Avrupa'dan ithal edilen saatlerin sadece 'saat' gösterdiğini, kendi tasarladığı saatlerin ise kadranında 'dakika' ve 'saniye' halkalarını da barındırdığını gururla belirtir. Bu saatler, helezoni zemberek (yay) tahrikli olup, enerjinin eşit aralıklarla salınmasını sağlayan 'vergül' (verge) veya 'çapa' (anchor) tipi eşapman (kaçış) mekanizmalarıyla donatılmıştı. Takiyyeddîn, saatin 'zamanı bölme' mantığını matematiksel olarak inceleyerek, rasathanedeki yıldız geçişlerini saniyesine kadar kaydedebilmesini sağlayan yerli bir saat endüstrisi kurma vizyonunu ortaya koymuştur. Bu saatler, Tycho Brahe'nin Avrupa'daki rasathanesinde kullandığı saatlerle eşzamanlı ve teknolojik olarak yarışır düzeydedir."}, {"id": "a440", "slug": "yeni-a440-ridvan-es-saati-su-saati", "title": "Rıdvân es-Sâ'âtî'nin Su Saati (Şam Emeviye)", "creator": "Rıdvân b. Muhammed es-Sâ'âtî", "kisa": "Şam Emeviye Camii'nin girişinde yer alan; zodyak kuşağı, dönen diskler, düşen bilyeler ve otomat şahin figürleriyle donatılmış, şehrin ritmini yöneten devasa anıtsal su saati.", "uzun": "Rıdvân es-Sâ'âtî'nin Su Saati, İslam dünyasının kamusal alandaki en görkemli ve en karmaşık zaman ölçüm cihazıdır. 12. yüzyılda Şam'ın kalbi olan Emeviye Camii'nin doğu kapısının üzerine inşa edilen bu devasa saat, sadece zamanı göstermekle kalmıyor, aynı zamanda gökyüzünün (zodyak) o anki durumunu da simüle ediyordu. Saatin ön yüzünde, Güneş'in ve Ay'ın burçlar kuşağındaki hareketini taklit eden döner diskler, her saat başı pencerelerden çıkan renkli figürler ve metal bilyeleri çanaklara bırakarak ses çıkaran bronz şahinler bulunuyordu. Rıdvân ve babası, bu saatin mevsimsel saatlere (gece ve gündüzün değişen uzunluğuna) göre kalibrasyonunu yapan, suyun akış hızını ve şamandıra mekanizmalarını her gün ayarlayan birer 'kronometrik rahip' gibiydiler. Bu saat, İbn Cübeyr ve İbn Battûta gibi ünlü seyyahların seyahatnamelerinde 'dünyanın harikalarından biri' olarak övgüyle anılmıştır."}, {"id": "a441", "slug": "yeni-a441-yel-degirmeni-sistan", "title": "Yel Değirmeni (Sistan / Panemone)", "creator": "İslam Endüstri ve Mühendislik Geleneği", "kisa": "Sistan'ın meşhur '120 günlük rüzgarlarını' yakalamak için tasarlanmış; kamış ve ahşap kanatlı, dikey eksenli (panemone) ilk endüstriyel yel değirmenleri.", "uzun": "Sistan Yel Değirmeni, insanlık tarihinin rüzgar enerjisini 'endüstriyel' ölçekte kullandığı ilk tesistir. İran ve Afganistan sınırındaki Sistan bölgesi, '120 günlük rüzgarları' adı verilen, son derece güçlü ve düzenli esen mevsimsel rüzgarlarıyla ünlüydü. 9. yüzyıl İslam coğrafyacıları (örneğin el-Makdisî ve İbn Havkal), bu bölgede yüzlerce yel değirmeninin yan yana dizilerek devasa bir un ve su pompalama fabrikası gibi çalıştığını hayranlıkla kaydetmişlerdir. Avrupa'nın Orta Çağ'daki yatay eksenli (pervane tipi) yel değirmenlerinin aksine, İslam mühendisleri 'dikey eksenli' (panemone) bir tasarım geliştirmişlerdir. Değirmenin şaftı yere dik duruyor, etrafına monte edilen kamıştan veya ahşaptan yassı kanatlar, rüzgarın yönü ne olursa olsun (kuleyi rüzgara çevirmeye gerek kalmadan) dönerek değirmen taşını doğrudan tahrik ediyordu. Bu dikey eksenli tasarım, günümüz modern 'Darrieus' tipi dikey rüzgar türbinlerinin (VAWT) doğrudan tarihsel atasıdır ve İslam dünyasının aerodinamik ve mekanik mühendislikteki vizyonerliğini kanıtlar."}, {"id": "a445", "slug": "yeni-a445-nureddin-bimaristani-akustik", "title": "Nûreddîn Bimaristanı ve Akustik Mimari", "creator": "Nûreddîn Zengî ve İslam Mimari Geleneği", "kisa": "Şam'daki Nureddin Bimaristanı; suyun şırıltısının ve musikâr seslerinin hastaların sinir sistemini sakinleştireceği şekilde (akustik mühendislik) tasarlanmış anıtsal hastane mimarisi.", "uzun": "Nûreddîn Bimaristanı, İslam mimarisinin 'hümanist ve bütüncül (holistik)' şifa vizyonunun taşa kazınmış halidir. Orta Çağ Avrupası'nda akıl hastaları 'içine şeytan girmiş' kabul edilerek yakılırken veya zindanlara atılırken, Şam'daki Nureddin Hastanesi'nde onlar birer 'hasta' olarak görülür ve tedavi edilirdi. Hastanenin mimarisi, psiko-akustik bir mühendislik harikasıydı: Avlunun ortasındaki şadırvandan akan suyun sesi, kubbelerin ve eyvanların geometrisi sayesinde hastaların odalarına belirli bir frekansta (beyaz gürültü / white noise etkisi yaratacak şekilde) yankılanırdı. Bu su sesi, haftanın belirli günlerinde avluda çalınan 'musikâr' ve 'santur' gibi çalgıların makamsal titreşimleriyle birleşerek, manik veya melankolik hastaların beyinlerindeki kaotik dalgaları senkronize ederdi (entrainment). Mimari, burada sadece bir yapı değil, tıbbi bir 'alet' ve 'reçete' olarak işlev görüyordu. Bu yapı, mimarinin insan psikolojisi üzerindeki fiziksel etkisini yüzyıllar öncesinden kavrayan İslam dehasının belgesidir."}, {"id": "a446", "slug": "yeni-a446-cam-ufleme-mineleme", "title": "Cam Üfleme ve Mineleme (Memlük Kandilleri)", "creator": "Suriye ve Mısır Cam Ustaları", "kisa": "Suriye ve Mısır atölyelerinde üretilen; kobalt mavisi, altın yaldız ve mine (enamel) teknikleriyle bezenmiş, İslam mimarisinin ve ticaretinin en zarif cam başyapıtları (Memlük kandilleri).", "uzun": "Cam Üfleme ve Mineleme, İslam kimyasının estetik ve mimariyle buluştuğu en şeffaf zirvedir. Memlükler döneminde Kahire ve Şam, küresel cam üretiminin başkentiydi. İslam cam ustaları, İbn el-Heysem'in optik ve er-Râzî'nin kimya birikimini kullanarak, cam yüzeyine 'mine' (düşük sıcaklıkta eriyen renkli cam tozları) ve altın yaldız uygulama tekniklerini mükemmelleştirdiler. Bu teknikle üretilen devasa Memlük cami kandilleri, sadece birer aydınlatma aracı değil, üzerinde Kuran ayetleri ve sultanların armalarının kobalt mavisi ve kırmızı mineyle işlendiği 'ışık saçan hat sanatı' eserleriydi. Bu kandiller, Venedik tüccarları aracılığıyla Avrupa'ya taşınmış; Rönesans Avrupası'nın kiliselerini ve saraylarını aydınlatırken, Venedik'in meşhur Murano cam ustalarına 'orientleştirici' (orientalizing) tarzda ilham vermiştir. Koleksiyondaki bu kandiller, ateşin, kumun ve kimyanın nasıl birer ışık hüzmesine dönüştüğünün kanıtıdır."}, {"id": "a447", "slug": "yeni-a447-kumas-baski-damgalari", "title": "Kumaş Baskı Damgaları", "creator": "İslam Tekstil Geleneği", "kisa": "Pamuklu ve ipekli kumaşlara seri, simetrik ve karmaşık desenler basmak için kullanılan; ahşaptan oyulmuş veya metalden dökülmüş tekstil baskı damgaları (blokları).", "uzun": "Kumaş Baskı Damgaları, İslam dünyasının tekstil endüstrisinde 'seri üretim' ve 'standardizasyon' kavramlarını nasıl uyguladığının sessiz tanıklarıdır. El ile nakış yapmak veya dokumak aylar süren bir süreçken, İslam atölyeleri (özellikle Mısır'ın Fustat şehri ve İran'ın İsfahan bölgesi) ahşaptan oyulmuş devasa 'damga' (baskı blokları) kullanarak kumaşları metrelerce hızla desenleyebiliyordu. Bu damgalar, karmaşık arabesk, geometrik veya figürlü (örneğin Rüstem'in ejderha ile savaşı) motifleri taşırdı. Ancak asıl mühendislik, kullanılan boyaların kimyasındaydı: İslam boyacıları, boyanın kumaşa nüfuz edip yıkamayla akmaması için 'mordan' (şap, demir veya kalay tuzları) adı verilen kimyasal sabitleyiciler kullanırlardı. Bu baskı kumaşlar, Haçlı Seferleri ve İpek Yolu ticaretiyle Avrupa'ya taşınmış; Avrupa'daki 'Basmatik' (chintz) çılgınlığını ve 18. yüzyıl tekstil sanayisinin doğuşunu tetikleyen ana ithalat kalemi olmuştur."}, {"id": "a448", "slug": "yeni-a448-maden-dokum-kaliplari", "title": "Maden Döküm Kalıpları (Nişâpür)", "creator": "Nişâpür Metalurji Atölyeleri", "kisa": "Nişâpür atölyelerinde bulunan; erimiş bronz ve pirincin dökülerek şamdan, kilit, kandil ve tokalar gibi günlük eşyaların seri olarak üretildiği taş ve metal döküm kalıpları.", "uzun": "Maden Döküm Kalıpları, İslam dünyasının sadece 'el işçiliği' (zanaat) değil, aynı zamanda 'endüstriyel seri üretim' kapasitesine sahip bir medeniyet olduğunun arkeolojik kanıtıdır. Horasan'ın Nişâpür şehrinde yapılan kazılarda, 9. ile 12. yüzyıllar arasına ait yüzlerce taş ve bakır alaşım döküm kalıbı bulunmuştur. Bu kalıplar, iki parçalı (negatif) formlardan oluşur ve içlerine erimiş pirinç veya bronz dökülerek kilitler, şamdanlar, at koşum takımları ve kandiller saniyeler içinde çoğaltılırdı. İslam metalurjisi, 'kayıp mum' (lost-wax) yöntemiyle tekil ve sanat eseri niteliğinde heykeller/astrolaplar üretebilirken; bu kalıplar aracılığıyla da ordunun, sarayın ve halkın günlük metal ihtiyaçlarını karşılayan devasa bir 'fabrikasyon' altyapısı kurmuştur. Bu kalıplar, Orta Çağ İslam ekonomisinin metalürjik omurgasını ve standartlaşma vizyonunu temsil eder."}, {"id": "a449", "slug": "yeni-a449-pota-celigi-damask", "title": "Pota Çeliği ve Damask Dökümü (Wootz)", "creator": "İslam Metalurji Geleneği", "kisa": "Demir, cam kırığı ve organik karbonun (yaprak/odun) kapalı potalarda yüksek ısıda eritilmesiyle elde edilen; su yüzeyinde dalgalı desenler (su deseni) bırakan efsanevi Şam (Damask) çeliğinin döküm süreci.", "uzun": "Pota Çeliği ve Damask Dökümü, İslam metalurjisinin ve malzeme bilimlerinin dünyaya armağan ettiği en ölümcül ve en estetik başyapıttır. Haçlı Seferleri sırasında Avrupalıların karşılaştığında dehşete düştüğü 'Şam Kılıçları', ipek bir mendili havada kesebilecek kadar keskin, bir zırhı parçalayacak kadar sert, ancak bir kalkanın üzerinde bükülebilecek kadar esnekti. Bu çeliğin sırrı, İslam ustalarının (özellikle Horasan ve Hindistan bağlantılı) kapalı kil potalar içinde demiri, cam kırıklarını (cürufu ayırmak için) ve karbon kaynağı olan organik maddeleri 1200°C'de günlerce pişirmesiyle (Wootz süreci) elde ediliyordu. Soğutma sürecinde çeliğin içinde oluşan mikroskobik 'sementit' (demir karbür) ağları ve karbon nanotüp benzeri yapılar, kılıcın yüzeyinde o meşhur 'su' (damask) desenlerini yaratıyordu. Bu pota çeliği teknolojisi, 18. yüzyılda Avrupa'da modern çelik endüstrisinin (örneğin Benjamin Huntsman'ın pota çeliği) doğmasına kadar aşılamamış bir metalürjik zirvedir."}, {"id": "a450", "slug": "yeni-a450-rahmaniyeler", "title": "Rahmâniyeler (Hint Okyanusu Seyir Risaleleri)", "creator": "Şihâbeddîn İbn Mâcid", "kisa": "Hint Okyanusu'nun muson rüzgarlarını, akıntılarını, sığlıklarını ve yıldız navigasyonunu şiirsel ve matematiksel bir dille anlatan, denizcilerin 'kutsal kitabı' sayılan seyir risaleleri.", "uzun": "Rahmâniyeler, İslam denizciliğinin (ilm el-bahr) ansiklopedik hafızasıdır. 15. yüzyılda İbn Mâcid ve ardından Süleyman el-Mehrî tarafından kaleme alınan bu risaleler, sadece birer 'harita' değil, okyanusun yaşayan bir organizma olarak tarif edildiği oşinografik başyapıtlardır. İbn Mâcid, muson rüzgarlarının (mevsimlik rüzgarlar) tam olarak hangi günlerde yön değiştirdiğini, Malakka Boğazı'ndaki gelgitlerin matematiğini ve Kızıldeniz'deki gizli mercan resiflerini şiirsel bir dille (kaside) yazmıştır; böylece denizciler bu şiirleri ezberleyerek karanlıkta ve fırtınada hayatta kalabiliyorlardı. Risaleler, her limanın kendine özgü bir 'dip imzası' (kumun rengi, çamurun kokusu) olduğunu kaydeder. Bu eserler, Portekizlilerin Hint Okyanusu'na girdiklerinde karşılaştıkları devasa bilgi birikiminin kaynağıdır; Avrupalı kaşifler, İslam denizcilerinin bu 'Rahmâniye'lerini ele geçirerek veya onlardan satın alarak küresel ticaret ağlarına hakim olmuşlardır."}, {"id": "a451", "slug": "yeni-a451-deniz-usturlabi", "title": "Deniz Usturlabı (Mariner's Astrolabe)", "creator": "İslam ve İberya Usturlap Ustaları", "kisa": "Gemi güvertesindeki rüzgar ve sarsıntılardan etkilenmemesi için gövdesi delikli (aerodinamik) ve ağır bronzdan dökülmüş, sadece gök cismi yüksekliği ölçmeye yarayan sadeleştirilmiş usturlap.", "uzun": "Deniz Usturlabı (Mariner's Astrolabe), İslam astronomi aletlerinin okyanusların vahşi koşullarına göre 'evrimleşmiş' halidir. Klasik usturlaplar, ince pirinç levhalardan yapılan, rüzgarın en hafif esintisinde bile savrulan hassas cihazlardı. İslam ve Endülüs kökenli alet yapımcıları, açık denizlerde Güneş'in veya Kutup Yıldızı'nın yüksekliğini ölçmek için aletin gereksiz tüm astrolojik ve takvim fonksiyonlarını attılar. Geriye sadece kalın, ağır bronzdan dökülmüş bir halka ve üzerinde rüzgarın geçip gitmesi için büyük delikler (aerodinamik boşluklar) bulunan bir kadran kaldı. Bu ağır ve delikli yapı, gemi güvertesindeki şiddetli rüzgarlarda dahi aletin sarkaç gibi sabit kalmasını sağlıyordu. 15. ve 16. yüzyılda Portekiz ve İspanyol kalyonlarının kaptan köşkünde bulunan bu aletler, İslam usturlap geleneğinin (özellikle ez-Zerkâlî ve İbn eş-Şâtir ekolünün) küresel keşifleri mümkün kılan 'dayanıklı' (rugged) versiyonlarıdır."}, {"id": "a451b", "slug": "yeni-a451b-semerkant-dev-kadrani", "title": "Semerkant Dev Kadranı (Fakhri Sextant)", "creator": "Uluğ Bey ve Semerkant Ekolü", "kisa": "Uluğ Bey'in Semerkant Rasathanesi için inşa ettirdiği; 40 metre yarıçaplı, toprağın içine oyulmuş devasa mermer meridyen sekstantı. Teleskop öncesi çağın en büyük ve en hassas gözlem aleti.", "uzun": "Semerkant Dev Kadranı (Sextant-ı Sultâniyye), İslam astronomi tarihinin ve dünya bilim tarihinin en anıtsal mühendislik harikalarından biridir. Uluğ Bey, gözlem aletlerindeki açısal okuma hatalarını minimize etmenin tek yolunun aletin yarıçapını büyütmek olduğunu kavramış ve 40 metre (yaklaşık 118 Fakhri arşını) yarıçaplı devasa bir sekstant inşa ettirmiştir. Aletin yayı, toprağın içine kazılan derin bir hendeğin içine, cilalı mermer bloklar döşenerek oluşturulmuştur. Güneş'in veya yıldızların ışığı, rasathanenin üstündeki delikten girerek bu mermer kanalın üzerindeki ölçeğe düşüyor; Ali Kuşçu ve el-Kâşî gibi astronomlar karanlık hendekte gölgenin/ışığın düştüğü milimetrik noktayı okuyorlardı. Bu devasa 'sabit alet', Güneş'in ekliptik eğimini ve yıldızların meridyen yüksekliklerini o kadar hassas ölçmüştür ki, Uluğ Bey'in hesapladığı tropikal yıl uzunluğu (365 gün 5 saat 49 dakika 15 saniye), modern uydularla hesaplanan değerden sadece 32 saniye farklıdır. Koleksiyonda bu alet, 'mimari ile astronominin' buluştuğu, taşın ve mermerin gökyüzünü ölçtüğü anıtsal bir zaferdir."}, {"id": "a452", "slug": "yeni-a452-kristal-mercekler", "title": "Kristal Mercekler ve Okuma Taşları", "creator": "İslam Optik ve Cam Zanaatı Geleneği", "kisa": "İbn el-Heysem'in optik yasalarına dayanarak kuvars ve beril kristallerinden yontulmuş; presbiyopi (yakını görememe) tedavisinde ve harita okumada kullanılan erken dönem büyüteçler.", "uzun": "Kristal Mercekler ve Okuma Taşları, İslam optik biliminin (ilm el-menâzır) günlük hayata ve denizciliğe dokunduğu en hassas nesnelerdir. İbn el-Heysem, ışığın küresel ve parabolik yüzeylerdeki kırılma açılarını matematiksel olarak çözdükten sonra, yaşlılıkta görme bozukluğu (presbiyopi) çeken alimler ve ince detaylı haritaları (portolanları) okumak zorunda olan denizciler için 'okuma taşları' (reading stones) üretilmeye başlanmıştır. Kuvars, beril ve şeffaf camdan yontulan bu dışbükey (konveks) mercekler, metinlerin veya haritaların üzerine konulduğunda harfleri büyütüyordu. İslam dünyasındaki cam üfleme ve kristal yontma zanaatının zirvesi olan bu mercekler, Endülüs ve Sicilya üzerinden Venedik'e geçmiş; 13. yüzyılda İtalya'da ilk 'giyilebilir gözlüklerin' icadına doğrudan zemin hazırlamıştır. Bir denizcinin pusula diskindeki milimetrik dereceleri veya Piri Reis'in haritasındaki ince kıyı çizgilerini okuyabilmesi, bu İslam optik mirasının sayesindedir."}, {"id": "a453", "slug": "yeni-a453-kitabi-bahriye", "title": "Kitâb-ı Bahriye (Denizcilik Ansiklopedisi)", "creator": "Piri Reis", "kisa": "Piri Reis'in Akdeniz ve Ege'nin her koyunu, demir atılacak güvenli limanlarını, tatlı su kaynaklarını ve tehlikeli kayalıklarını şiirsel bir dille anlattığı eşsiz denizcilik ansiklopedisi.", "uzun": "Kitâb-ı Bahriye, dünya denizcilik literatürünün en kapsamlı ve en pratik 'yerel bilgi' (local knowledge) ansiklopedisidir. Piri Reis, 1513 tarihli dünya haritasıyla küresel vizyonunu kanıtladıktan sonra, Akdeniz'in kaptanlarına hitaben 'Kitâb-ı Bahriye'yi kaleme almıştır. Bu eser, sıradan bir harita kitabı değildir; Ege ve Akdeniz kıyılarındaki her bir koyun kaç gemi alabileceğini, hangi kuyularda tatlı su bulunduğunu, rüzgarın hangi dağdan eseceğini ve sığlıkların rengini anlatan, kaptanların hayatta kalma kılavuzudur. Piri Reis, bu bilgileri İslam denizcilerinin (İbn Mâcid) Hint Okyanusu'nda kurduğu 'Rahmâniye' geleneğini Akdeniz'e uyarlayarak sistematize etmiştir. Eserdeki portolan (seyir) haritaları, pusula gülleri ve romb çizgileriyle donatılmıştır. Kitâb-ı Bahriye, İslam-Osmanlı kartografyasının sadece 'kopyacı' değil, denizi bizzat yaşayarak, koklayarak ve ölçerek haritalayan bir 'müellif' güce sahip olduğunun en büyük kanıtıdır."}, {"id": "a453b", "slug": "yeni-a453b-altazimut-aleti", "title": "Zâtü's-Semt ve'l-İrtifâ' (Altazimut Aleti)", "creator": "İslam Rasathane Mühendisliği Geleneği", "kisa": "Gök cisimlerinin hem ufuk üzerindeki yönünü (azimut) hem de ufuktan yüksekliğini (irtifa) aynı anda ölçen; modern teleskop kundaklarının atası olan iki eksenli rasathane aleti.", "uzun": "Zâtü's-Semt ve'l-İrtifâ' (Semt ve Yükseklik Aleti), İslam rasathanelerinin gökyüzünü 'ufuk koordinat sisteminde' taramak için kullandığı en kritik mekanik düzektir. Antik Çağ'daki armiller küreler ekliptik veya ekvator koordinatlarına göre çalışırken, İslam mühendisleri (özellikle Merâğa'da el-Urdî ve İstanbul'da Takiyyeddîn) gökyüzünü gözlemcinin bulunduğu noktaya göre (ufuk düzlemi) ölçen aletler geliştirmişlerdir. Bu alet, yatay düzlemde 360° dönen bir azimut halkası ve bu halkanın üzerine dik olarak monte edilmiş, dikey düzlemde dönen bir irtifa (yükseklik) kadranından oluşur. Gözlemci, nişangâhı yıldıza kilitlediğinde, alttaki halka yıldızın kuzeyden saat yönündeki açısını (semt), yandaki kadran ise ufuktan yüksekliğini (irtifa) aynı anda verir. Bu 'iki eksenli' (Altazimuth) kundak mantığı, yüzyıllar sonra Galileo'nun ve Newton'un teleskoplarını yerleştireceği kundakların, bugün ise dev radyo teleskoplarının ve füze radarlarının temel mekanik prensibidir."}, {"id": "a454", "slug": "yeni-a454-kinnine", "title": "Kınnıne (Cannutum)", "creator": "Ebû Bekir er-Râzî", "kisa": "er-Râzî'nin Sırr el-Esrâr'ında sistematize ettiği, uçucu maddelerin (ruhların) çözülmesi, süblimasyonu ve yoğunlaştırılması için kullanılan özel cam veya seramik laboratuvar kaplarının ortak adı.", "uzun": "Kınnıne (veya kınmne), er-Râzî'nin Sırr el-Esrâr'ında sistematize ettiği, uçucu maddelerin (ruhların) çözülmesi, süblimasyonu ve yoğunlaştırılması için kullanılan özel cam veya seramik laboratuvar kaplarının ortak adıdır. Bu kapların formu, kimyasal reaksiyonun ısıl ve basınç dinamiklerine göre şekillenirdi. İslam kimyasının Latince'ye çevrilmesiyle bu terim 'cannina' veya 'cannutum' olarak Avrupa simya literatürüne girmiş, Rönesans eczanelerinin ve modern kimya laboratuvarlarının standart cam eşyalarının (balon, retort) kavramsal atası olmuştur. er-Râzî, her kimyasal işlem için özel kap belirleyerek (örneğin asitler için kalın cidarlı, uçucu yağlar için uzun boyunlu) deneysel kimyanın metodolojik tutumunu kurmuştur. Koleksiyonda kınnıne, bilimin yalnızca fikirlerle değil, kelimeler ve kaplarla da sınırları aştığının; Arapça bir terimin Avrupa'nın cam üfleme tezgahlarında nasıl yankılandığının sessiz tanığıdır. Bu kaplar, kimya tarihinin ilk sistematik envanterinin maddi kültürüdür."}, {"id": "a454b", "slug": "yeni-a454b-portolan-romb-agi", "title": "Portolan Haritalar ve Romb Ağı", "creator": "İslam ve Akdeniz Kartografya Geleneği", "kisa": "Pusula güllerinden çıkan ve denizleri bir ağ gibi ören 'romb çizgileri' (rhumb lines); kaptanların rüzgar durumuna göre en kısa seyir rotasını cetvelle çizmesini sağlayan geometrik altyapı.", "uzun": "Portolan Haritalar ve Romb Ağı, İslam denizciliğinin astronomik bilgisinin kağıt üzerindeki geometrik yansımasıdır. Orta Çağ'ın ünlü 'Portolan' haritalarına baktığınızda, denizlerin üzerini bir örümcek ağı gibi kaplayan çizgiler görürsünüz. Bunlar 'romb çizgileri' (rhumb lines) olarak bilinir. Fuat Sezgin'in çığır açan araştırmaları, bu çizgilerin sanıldığı gibi sadece rüzgar yönleri olmadığını; İslam denizcilerinin (İbn Mâcid) kullandığı 15 sabit yıldızın doğuş/batış noktalarından türeyen 32'lik 'hane' sisteminin haritaya aktarılmış hali olduğunu kanıtlamıştır. Arapça 'ahnârî' olarak adlandırılan bu kavisler, Avrupa dillerine 'rumb' olarak geçmiştir. Kaptan, pusulasındaki yönü haritadaki bu ağa yerleştirerek, Akdeniz'in veya Atlantik'in neresinde olursa olsun, hedef limana giden manyetik rotayı cetvelle çizebiliyordu. Bu 'ağ', okyanusların kaotik boşluğunu, matematiksel olarak aşılabilir bir 'yol haritasına' dönüştüren ilk küresel altyapıdır."}, {"id": "a455", "slug": "yeni-a455-ibn-macid-hane-sistemi", "title": "İbn Mâcid'in 'Hane' Sistemi", "creator": "Şihâbeddîn İbn Mâcid", "kisa": "Ufku rüzgar yönlerine göre değil, 15 sabit yıldızın gökyüzündeki doğuş ve batış noktalarına göre 32 'haneye' bölen astronomik navigasyon teorisi.", "uzun": "İbn Mâcid'in 'Hane' Sistemi, denizcilik tarihinin en büyük 'yanlış anlaşılmalarını' düzelten astronomik bir dehadır. Yüzyıllar boyunca Avrupa'da pusula disklerindeki 32'lik bölümlemenin (rüzgar gülü) rüzgarların estiği coğrafi yönlerden (Tramontana, Greco vb.) türediğine inanılıyordu. Ancak Fuat Sezgin, İbn Mâcid'in 'Kitâb el-Fevâ'id' adlı eserini inceleyerek bu tezi kökten çürütmüştür. İslam denizcileri, ufku rüzgarlara göre değil, gökyüzündeki 15 sabit yıldızın (örneğin Şi'râ-yı Yemânî, Kalb el-Akreb) doğuş ve batış ufuk noktalarına göre 32 'haneye' (eve) bölmüşlerdi. Bu astronomik bölümleme, rüzgar dursa veya değişse bile gökyüzü sabit olduğu için kaptana mutlak ve değişmez bir yön referansı sağlıyordu. Avrupa'ya geçen bu sistem, zamanla 'rüzgar gülü' olarak yanlış adlandırılsa da, kökeni tamamen İslam astronomisine ve 'yıldız kerteriz' bilimine dayanır. Bu teori, astronominin denizciliğe, denizciliğin ise küresel coğrafyaya armağanıdır."}, {"id": "a455b", "slug": "yeni-a455b-golge-karesi", "title": "Gölge Karesi (el-Murabba' el-Müzebba)", "creator": "İslam Usturlap ve Muvakkit Ustaları", "kisa": "Usturlapların arka yüzünde bulunan; 12'lik veya 60'lık bölümlere ayrılmış, cisimlerin gölge boyundan yüksekliklerini ve ulaşılmaz mesafeleri hesaplamayı sağlayan trigonometrik ızgara.", "uzun": "Gölge Karesi (el-Murabba' el-Müzebba), İslam astronomi aletlerinin sadece gökyüzüne değil, aynı zamanda yeryüzüne de bakan 'çift yönlü' doğasının kanıtıdır. Usturlapların ve kadranların arka yüzünün bir köşesine kazınan bu kare ızgara, 'Umbra Recta' (Düz Gölge / Tanjant) ve 'Umbra Versa' (Ters Gölge / Kotanjant) olarak ikiye ayrılır. Gözlemci, bir minarenin, bir dağın veya bir kalenin tepesine nişangâhı doğrulttuğunda, alhidadenin kestiği gölge karesindeki değer, o cismin yüksekliğini veya aradaki mesafeyi basit bir orantıyla (benzer üçgenler prensibiyle) bulmasını sağlar. Bu ızgara, İslam mimarlarının devasa kubbelerin yüksekliğini hesaplamasında, orduların kale surlarının boyunu ve kuşatma mesafelerini belirlemesinde ve muvakkitlerin namaz vakitlerini gölge boyundan tayin etmesinde kullanılan evrensel bir 'hesap motoru'ydu. Koleksiyonda gölge karesi, astronominin yeryüzündeki pratiğe (mühendislik ve mimariye) dokunduğu noktadır."}, {"id": "a457", "slug": "yeni-a457-zic-i-sultani", "title": "Zîc-i Sultânî (Uluğ Bey Astronomi Çizelgeleri)", "creator": "Uluğ Bey ve Semerkant Ekolü", "kisa": "Uluğ Bey'in Semerkant Rasathanesi'nde derlettiği; 1018 yıldızın konumunu, gezegen hareketlerini ve trigonometrik cetvelleri içeren, teleskop öncesi çağın en kusursuz 'veri tabanı' (Zîc).", "uzun": "Zîc-i Sultânî, bir 'alet' olmaktan ziyade, İslam astronomisinin ürettiği en büyük 'yazılım ve veri tabanı' başyapıtıdır. Uluğ Bey, Semerkant'taki devasa rasathanesinde Gıyâseddîn el-Kâşî ve Ali Kuşçu gibi dev matematikçilerle birlikte, Batlamyus'un 'Almagest'inden beri süregelen yıldız kataloğu geleneğini sıfırdan, kendi gözlemleriyle revize etmiştir. Zîc-i Sultânî, 1018 yıldızın ekliptik boylam ve enlemlerini, o güne kadar görülmemiş bir hassasiyetle (saniye mertebesinde) listeler. Ayrıca sinüs ve tanjant tabloları, gezegenlerin kavuşum dönemleri ve takvim dönüşümleri bu eserde standartlaştırılmıştır. Bu 'veri tabanı', 16. yüzyılda Avrupa'ya taşınmış; Tycho Brahe'nin ve Johannes Kepler'in gezegen yasalarını formüle ederken kullandıkları en güvenilir 'ham veri' kaynağı olmuştur. Koleksiyonda Zîc-i Sultânî, bilimin sadece pirinç ve mermerden değil, aynı zamanda 'küsursuz veri'den inşa edildiğinin anıtsal kanıtıdır."}, {"id": "a458", "slug": "yeni-a458-rub-el-halka", "title": "Rub’ el-Halka (Halkalı Kadran)", "creator": "İslam Mîkât ve Seyahat Geleneği", "kisa": "İç içe geçmiş pirinç halkalardan oluşan; güneşin ışığını içerdeki skalaya düşürerek zamanı gösteren ve kıble yönünü bulmayı sağlayan, İslam dünyasının 'cep saati' ve pusulası.", "uzun": "Rub' el-Halka (Halkalı Kadran / Astronomical Ring Dial), İslam mîkât mühendisliğinin 'minimalist' ve 'portatif' dehasının zirvesidir. Dıştaki büyük halka meridyen düzlemini, ortadaki halka ekvatoru, içteki küçük halka ise ekliptiği temsil eder. Aletin içine yerleştirilmiş kayan bir gnomon (iğne), o günün tarihine (burcuna) göre ayarlanır. Alet güneşe doğru tutulduğunda, gnomonun gölgesi iç halkadaki saat çizgilerine düşer ve zamanı gösterir. Halkaların birbirine göre dönme açıları kullanılarak coğrafi enlem ve kıble yönü de hesaplanabilir. Bu alet, çölü geçen bir kervanın, denizde bir geminin veya sefere çıkan bir ordunun 'cebindeki rasathane'ydi. 16. yüzyılda Avrupa'ya aktarıldığında 'Astronomical Ring' adıyla denizcilerin ve kâşiflerin standart donanımı haline gelmiştir. Koleksiyonda bu halka, zamanın ve uzayın avuca sığdırıldığı en zarif mekanik bulmacadır."}, {"id": "a459", "slug": "yeni-a459-muvakkithane", "title": "Muvakkithane (Zaman ve Astronomi Kurumu)", "creator": "İslam Şehircilik ve Vakıf Geleneği", "kisa": "Camilerin avlularında yer alan; muvakkitlerin (astronom-zaman ölçücüler) usturlaplar ve kadranlarla namaz vakitlerini, kıbleyi ve takvimi hesapladığı kurumsal 'zaman ve astronomi ofisi'.", "uzun": "Muvakkithane, İslam medeniyetinin bilimi kurumsallaştırdığı ve halka açtığı en özgün 'mekansal enstrüman'dır. İslam şehirlerinde zaman, soyut bir kavram değil, ibadetin ve sosyal yaşamın tam kalbinde yer alan somut bir olguydu. Camilerin avlularına inşa edilen bu küçük ama donanımlı binalar, birer 'kamusal rasathane' işlevi görürdü. İçeride görevli 'muvakkit', vakıf gelirleriyle maaşını alan, usturlaplar, kadranlar, kum saatleri ve zîclerle (astronomi cetvelleri) donatılmış profesyonel bir bilim adamıydı. Muvakkit, her gün güneşin hareketini izler, ezan vaktini hassasiyetle belirler, hilalin doğuşunu gözlemleyerek Ramazan ve Bayram ilanlarını yapar, hatta halkın saatlerini ayarlaması için 'ayar usturlapları' bulundururdu. Mimar Sinan'ın İstanbul'da inşa ettiği muvakkithaneler, mimari estetik ile bilimsel işlevselliğin kusursuz birleşimidir. Koleksiyonda muvakkithane, bilimin saraydan sokağa, elitlerden halka indiği kurumsal bir köprüdür."}, {"id": "a460", "slug": "yeni-a460-ibn-es-satir-usturlabi", "title": "İbn eş-Şâtır'ın Usturlabı", "creator": "Alâeddîn Alî b. İbrâhîm İbn eş-Şâtır", "kisa": "İbn eş-Şâtır'ın tasarladığı; Şam ekolünün teorik derinliğini yansıtan, çok katmanlı 'rete' (örümcek) ağına ve evrensel projeksiyon yeteneklerine sahip, muvakkitler için üretilmiş başyapıt usturlap.", "uzun": "İbn eş-Şâtır'ın Usturlabı, teorik astronomi dehasının pratik metal işçiliğiyle buluştuğu eşsiz bir başyapıttır. Şam Emeviye Camii'nin başmuvakkidi olan İbn eş-Şâtır, sadece Kopernik'ten 150 yıl önce Batlamyus sisteminin hatalarını düzelten gezegen modelleri (Tûsî Çifti ve Merkür Modeli) geliştirmekle kalmamış, bu matematiksel derinliği usturlap tasarımına da yansıtmıştır. Onun tasarladığı usturlaplar, klasik modellerden çok daha karmaşık 'rete' (örümcek/ağ) yapılarına, birden fazla enlemi aynı anda okumayı sağlayan evrensel projeksiyonlara ve arka yüzlerinde namaz vakitlerini doğrudan veren özel 'destur' kadranlarına sahipti. İbn eş-Şâtır için usturlap, sadece bir gözlem aleti değil, aynı zamanda kendi geliştirdiği yeni gezegen teorilerini test ettiği bir 'analog simülatör'dü. Koleksiyonda bu usturlap, İslam bilim tarihinin 'teorisyen' ile 'zanaatkâr'ın aynı bedende (İbn eş-Şâtır) nasıl mükemmelleştiğinin kanıtıdır."}];
const TAM = [{"id": "p104-1", "slug": "astronomi-104-1-al-uddevle-nin-414-1023-civarinda-hemed-n-daki-rasathanesinin-ana-alet", "name": "'Ala'uddevle'nin (414/1023 civarında)Hemedan'daki rasathanesinin Ana Aleti", "category": "Astronomi", "creator": "Alâüddevle rasathanesi ekibi (İbn Sînâ çevresi)", "has_img": 1, "desc": "Hemedân Rasathanesi Ana Aleti, İslam bilim tarihinin en parlak dönemlerinden birinin somut tanığıdır. Kâkûyî hükümdarı Alâüddevle'nin (ö. 1041) himayesinde kurulan bu rasathane, yalnızca bir gözlem istasyonu değil, aynı zamanda dönemin en önemli entelektüel merkeziydi. Rasathanede çalışan İbn Sînâ (980-1037), tıp ve felsefe alanındaki anıtsal eserlerinin yanı sıra astronomik gözlemler de yapıyordu. Onun 'eş-Şifâ' adlı ansiklopedik eserinin astronomi bölümü, bu rasathanedeki gözlemlere dayanmaktadır. Ebû Naşr b. Irak (ö. y. 1036) ise küresel trigonometrinin temel problemlerini çözmüş ve gezegen modelleri üzerine çalışmıştır. Rasathanenin ana aleti, ahşap astar üzerine altın kaplama pirinç skaladan oluşan, yaklaşık 36 cm çapında bir gözlem diskiydi. Bu disk, gök cisimlerinin meridyen geçiş anındaki yüksekliklerini ölçmek için kullanılıyordu. Ölçümler, gezegenlerin konumlarını belirlemek, tutulmaları hesaplamak ve astronomik çizelgeleri (zîc) güncellemek için kritik öneme sahipti. Hemedân Rasathanesi, İslam dünyasında 'rasathane' kavramının kurumsallaşma sürecinde önemli bir halkadır; Bağdat'taki Şemmâsiyye ve Kâsiyün rasathanelerinin geleneğini sürdürmüş, ardından gelecek olan Merâğa, Semerkant ve İstanbul rasathanelerine model teşkil etmiştir."}, {"id": "p104-2", "slug": "astronomi-104-2-cemberli-kure", "name": "Çemberli Küre, Merâğa Rasathanesi'nde", "category": "Astronomi", "creator": "Müeyyededin el-Urdi", "has_img": 1, "desc": "Merağa Rasathanesi'nin çemberli küresi, el-Urdi'nin Aletler Kitabı'nda ayrıntıyla tasvir edilir; en dıştaki meridyen halkası, büyük enlem halkası, ekliptik ve kolur çemberleri göksel koordinat sistemlerini temsil eder. Beş kişilik bir ekibin aynı anda işlettiği bu küre, orta çağın en sistematik rasathanesinin üç boyutlu simgesidir."}, {"id": "p104-3", "slug": "astronomi-104-3-gundonumu-halkasi", "name": "Gündönümü Halkası", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî (Merâğa Rasathanesi)", "has_img": 1, "desc": "Gündönümü Halkası (Halkat el-İnkılâb), Merâğa Rasathanesi'nin gözlem aletleri programının temel bileşenlerinden biridir. Bu halka, güneşin ekliptik üzerindeki en kuzey (yaz gündönümü, Yengeç dönencesi) ve en güney (kış gündönümü, Oğlak dönencesi) konumlarını belirlemek için kullanılıyordu. Halka, ekliptik düzlemine dik olarak yerleştirilmiş ve güneşin yıl içindeki hareketini izlemek üzere tasarlanmıştı. El-Urdî'nin tasarımında bu halka, Beş Halkalı Gözlem Küresi'nin (el-Âle el-Halkiyye) bir parçası olarak da kullanılıyordu. Gündönümü halkası, ekliptik eğiminin (obliquity) ölçülmesi için kritik öneme sahipti; bu ölçüm, takvim hesaplamaları, mevsim belirleme ve tarımsal planlama için temel veriyi sağlıyordu. El-Urdî, bu halkayı tasarlarken Ptoleme'nin Almagest'indeki armiller küre geleneğinden yararlanmış, ancak aleti daha pratik ve hassas hale getirmek için özgün değişiklikler yapmıştır. Merâğa Rasathanesi'nde yapılan gündönümü gözlemleri, ekliptik eğiminin Ptoleme'nin verdiği değerden (23°51'20\") farklı olduğunu ortaya koymuş ve bu değer sonraki yüzyıllarda yapılan gözlemlerle doğrulanmıştır. Bu, İslam astronomisinin yalnızca antik bilgiyi aktarmakla kalmayıp, onu eleştirel bir şekilde test ettiğini ve geliştirdiğini gösteren somut bir örnektir."}, {"id": "p104-4", "slug": "astronomi-104-4-ekinoksal-cember", "name": "Ekinoksal Çember (halkat el-istivâ')", "category": "Astronomi", "creator": "Müeyyededin el-Urdi", "has_img": 1, "desc": "el-Urdi'nin Ptoleme'den devralıp geliştirdiği ekinoksal çember (halkat el-istiva'), güneşin burçlar dairesinde gündönümü noktalarına girişini belirlemeye yarar. Taksimatlı dikey meridyen halkası ve sabit ekvator çemberi, ekinoks tarihinin hassas tespitini sağlıyordu. Bu alet, Merağa'nın takvim ve gözlem programının temel taşlarından biridir."}, {"id": "p104-5", "slug": "astronomi-104-5-mukemmel-alet", "name": "Mükemmel Alet (el-Âle el-Kâmile)", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî", "has_img": 1, "desc": "Mükemmel Alet (el-Âle el-Kâmile), adından da anlaşılacağı üzere el-Urdî'nin kendi dönemindeki tüm gözlem aletlerinin eksiklerini gidermek için tasarladığı, rasathanenin 'zirve' cihazıdır. Bu alet, temelde büyük bir cetvel pergeli ile dikey bir kılavuz rayın (şahmerdan benzeri bir mekanizma) birleşiminden oluşuyordu. Pergelin bir ucu merkezde sabitken, diğer ucu kılavuz ray üzerinde inip kalkabiliyor; bu sayede gökyüzünün farklı bölgelerindeki cisimlerin açısal mesafeleri, devasa bir pergel çiziyormuşçasına hassas bir şekilde ölçülebiliyordu. el-Urdî bu aleti tasarlarken, Ptoleme'nin 'Organon' (Aletler) adlı eserindeki hantal ve sabit düzeneklerin, değişken gözlem koşullarına uyum sağlayamadığını tespit etmiş ve 'Mükemmel Alet' ile bu statik yapıyı dinamik bir mühendislik harikasına dönüştürmüştür. Alet, hem yıldızlar arası mesafeleri ölçebiliyor, hem de gezegenlerin enlem/boylam sapmalarını izleyebiliyordu. Bu aletin tasarımı, İslam mühendisliğinin teorik geometriyi devasa metal ve ahşap yapılara uygulama konusundaki eşsiz yeteneğinin bir belgesidir."}, {"id": "p105-6", "slug": "astronomi-105-6-r-ey-eski-tahran-rasathanesi", "name": "Rey Rasathanesi (el-Hucendî)", "category": "Astronomi", "creator": "Ebu Mahmud el-Hucendi", "has_img": 1, "desc": "el‐Hucendi'nin Rey'de (bugünkü Tahran'ın güneyi) Büveyhi sultanı Fahreddevle'yi ikna ederek kurduğu rasathanedeki sekstant, yaklaşık 20 metre yarıçapıyla döneminin en büyük gözlem yayıydı. Bu dev aletle yapılan gözlemler, ekliptik eğiminin zamanla sürekli küçüldüğü sonucunu verdi; Sabit b. Kurra'nın trepidasyon (hareket el‐ikbal ve'l‐idbar) hipoteziyle başlayan tartışma, böylece yeni bir deneysel zemine taşındı. Sekstantın kalıntısı, «büyüklük = hassasiyet» ilkesinin İslam astronomisindeki en cesur uygulamasıdır. Koleksiyonda Rey sekstantı, Semerkant'ın 40 metrelik yayının habercisi olarak sergilenir."}, {"id": "p105-7", "slug": "astronomi-105-7-hareket-edebilir-nisang-hli-alet", "name": "Nişangâh (hareketli, diopter)", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî", "has_img": 1, "desc": "Hareket Edebilir Nişangâhlı Alet, el-Urdî'nin 'Risâle fî Keyfiyyet er-Raşad' adlı eserinde Merâğa Rasathanesi için tasarladığı üçüncü alet olarak detaylandırılır. Antik ve erken İslam dönemi gözlem aletlerinde nişangâhlar (diopterler) genellikle sabit eksenlere bağlıydı ve gözlemcinin gökyüzündeki hızlı hareket eden cisimleri (gezegenler, kuyruklu yıldızlar) takip etmesini zorlaştırıyordu. el-Urdî, bu sorunu çözmek için nişangâhı hem azimut (yatay) hem de yükseklik (dikey) eksenlerinde bağımsız olarak dönebilen bir mekanizmaya oturtmuştur. Bu alet, gök cisimlerinin ufuk üzerindeki konumlarını (semt ve irtifâ) eşzamanlı ve çok daha yüksek bir hassasiyetle okumaya olanak tanıyordu. Aletin mekanik esnekliği, rasathane ekibinin (ki bu ekip beş kişilik bir gözlem heyetinden oluşuyordu) koordineli çalışmasını kolaylaştırmış, tutulma ve kavuşum gözlemlerindeki hata payını minimize etmiştir. Bu serbest hareketli nişangâh prensibi, yüzyıllar sonra Avrupa rasathanelerindeki teodolitlerin ve modern transit aletlerin atası sayılır."}, {"id": "p105-8", "slug": "astronomi-105-8-cift-bacakli-ale", "name": "Makara-İp Düzeneği (kadran cetvelleri için)", "category": "Astronomi", "creator": "Müeyyededin el-Urdi", "has_img": 1, "desc": "«Çift Bacaklı Alet» (el-ale zat eş-şu'beteyn), bir pergelin bacakları gibi menteşe ile birbirine bağlı iki dev cetvelden oluşan, Merağa'nın en özgün trigonometrik aletidir. Bacaklardan biri yatay konumda sabit durur ve okuma skalası taşır; nişangahla donatılmış diğeri ise hedefe doğrultulur ve ucundaki şakül ile yatay bacak üzerinde bir nokta işaretler. Yatay cetvelin başından şa
