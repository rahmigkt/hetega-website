çgen Tabanlı Tesviye Aleti", "category": "Tesviye ve Geometri", "creator": "İslam geometri geleneği", "has_img": 0, "desc": "İnşaat ve arazi ölçümlerinde kullanılan üçgen tabanlı su terazisi."}, {"id": "physical-asset-50-1", "slug": "tesviye-ve-geometri-fiziksel-50-ucgen-tabanli-tesviye-aleti-leveling-instrument-triangle-base", "name": "Üçgen Tabanlı Tesviye Aleti (Leveling Instrument, Triangle Base)", "category": "Tesviye ve Geometri", "creator": "Ömer Hayyâm / el-Kâşî / Ebû Sehl el-Kühî", "has_img": 0, "desc": "Geometri ölçüm ve çizim aletleri, İslam matematiğinin soyut cebiri maddeye indirdiği atölye araçlarıdır. Ömer Hayyâm'ın kübik denklemleri konik kesitlerin (parabol, hiperbol) kesişimiyle çözerken kullandığı «mükemmel tam pergel» (barkâr kâmil tâmm) ve el‑Kâşî'nin eliptik yörüngeleri çizen özel cetvelleri, yalnız birer çizim aracı değil, aynı zamanda birer «analog bilgisayar»dır. Ebû Sehl el‑Kühî'nin aletleri, mimari mukarnasların ve kubbe geometrilerinin kağıt üzerinde kusursuzca kurgulanmasını sağlamıştır. Koleksiyonda bu aletler, matematiğin mimariyle, astronominin mühendislikle buluştuğu; cetvel ve pergelin, imparatorlukların kubbelerini ve rasathanelerini inşa ettiği o görünmez eşikte durur."}, {"id": "physical-asset-51-1", "slug": "cografya-ve-seyrusefer-fiziksel-51-i-bn-s-n-nin-tesviye-aleti-leveling-instrument-by-ibn-sina", "name": "İbn Sînâ'nın Tesviye Aracı", "category": "Coğrafya ve Seyrüsefer", "creator": "Ebû Alî İbn Sînâ", "has_img": 0, "desc": "İbn Sînâ'nın tesviye aracı, büyük filozof‑hekimin pratik mühendislik bilgisinin de derin olduğunu gösterir. Suyun ve yapının düzlemini kontrol etmek için tasarlanan bu araç, İbn Sînâ'nın ansiklopedik dehasının (felsefe, tıp, fizik) «saha mühendisliği»ne uzanan koludur. İslam bilim geleneğinde teorik bilgi (ilm) ile pratik uygulama (amel) arasındaki sınırın ne denli geçirgen olduğunun kanıtıdır. Koleksiyonda bu araç, «filozofun terazisi»dir; soyut aklın yeryüzünü düzlediği andır."}, {"id": "physical-asset-43-1", "slug": "fizik-ve-teknik-fiziksel-43-enduluslu-i-bn-luy-n-un-tesviye-skalasi-levelling-scale-by-ibn-luyun", "name": "Endülüslü İbn Luyun'un Tesviye Skalası (Levelling Scale by Ibn Luyun)", "category": "Fizik ve Teknik", "creator": "İbn el-Heysem", "has_img": 0, "desc": "İbn el‐Heysem'in «alet el‐inkas» (yansıma aleti), düzlem, küresel, silindirik ve konik aynalarda yansıma yasalarını deneysel olarak ölçen bir optik laboratuvarıdır. Bu alet, aynı zamanda Avrupa'da «Problema Alhazeni» (Alhazen's Problem) olarak bilinen ünlü geometri probleminin çözümünde kullanılmıştır: «Verilen bir noktadan çıkan ışığın, küresel bir aynadan yansıyarak başka bir noktaya ulaşması». Bu problem, 4. dereceden denklemlere götürmüş; Avrupa'da Fermat, Huygens ve l'Hopital gibi dev matematikçileri yüzyıllarca meşgul etmiştir. İbn el‐Heysem'in aleti, yalnız optik değil, aynı zamanda cebir ve konik kesitler geometrisinin de pratik laboratuvarıdır. Koleksiyonda bu düzenek, İslam‐Avrupa matematik diyaloğunun en kalıcı düğüm noktasını temsil eder; bir optik aleti, aslında bir denklem çözme makinesidir."}, {"id": "physical-asset-52-1", "slug": "fizik-ve-teknik-fiziksel-52-el-marr-kus-nin-tesviye-skalasi-levelling-scale-by-al-marrakusi", "name": "el-Marrâkuşî Tesviye Skalası", "category": "Fizik ve Teknik", "creator": "Hasan el-Marrâkuşî", "has_img": 0, "desc": "İbn el‑Heysem'in «âlet el‑inkâs» (yansıma aleti), düzlem, küresel, silindirik ve konik aynalarda yansıma yasalarını deneysel olarak ölçen bir optik laboratuvarıdır. Bu alet, aynı zamanda Avrupa'da «Problema Alhazeni» (Alhazen's Problem) olarak bilinen ünlü geometri probleminin çözümünde kullanılmıştır: «Verilen bir noktadan çıkan ışığın, küresel bir aynadan yansıyarak başka bir noktaya ulaşması». Bu problem, 4. dereceden denklemlere götürmüş; Avrupa'da Fermat, Huygens ve l'Hôpital gibi dev matematikçileri yüzyıllarca meşgul etmiştir. İbn el‑Heysem'in aleti, yalnız optik değil, aynı zamanda cebir ve konik kesitler geometrisinin de pratik laboratuvarıdır. Koleksiyonda bu düzenek, İslam‑Avrupa matematik diyaloğunun en kalıcı düğüm noktasını temsil eder; bir optik aleti, aslında bir denklem çözme makinesidir."}, {"id": "physical-asset-53-1", "slug": "cografya-ve-seyrusefer-fiziksel-53-uzun-pergel-long-compasses", "name": "Uzun Pergel", "category": "Coğrafya ve Seyrüsefer", "creator": "Müeyyededîn el-Urdî", "has_img": 0, "desc": "Büyük çaplı daireler çizen uzun pergel; rasathane ve mimari için."}, {"id": "physical-asset-45-1", "slug": "cografya-ve-seyrusefer-fiziksel-45-buyuk-yarim-daireler-cizen-pergel-compasses-for-drawing-large-semicirc", "name": "Büyük Yarım Daire Pergeli", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam geometri geleneği", "has_img": 0, "desc": "Büyük yarıçaplı daireleri parça parça çizmek için tasarlanmış özel pergel."}, {"id": "physical-asset-54-1", "slug": "cografya-ve-seyrusefer-fiziksel-54-kure-uzerinde-uc-noktadan-merkez-bulma-aleti-instrument-for-establishi", "name": "el-Cezerî'nin Daire Merkezi Aleti", "category": "Coğrafya ve Seyrüsefer", "creator": "İsmail el-Cezerî", "has_img": 0, "desc": "el-Cezerî'nin el-Câmi' adlı kapsamlı eserinde yer alan bu esnek pirinç alet, bir küre üzerindeki herhangi üç noktadan geçen çemberin merkezini bulmaya ve açı belirlemeye yarar. Küresel geometrinin 'üç noktadan çember' problemini pratik bir araca dönüştüren alet, el-Cezerî'nin yalnızca bir mekanikçi değil, aynı zamanda yaratıcı bir geometriçi olduğunu da gösterir."}, {"id": "physical-asset-55-1", "slug": "cografya-ve-seyrusefer-fiziksel-55-konik-kesitler-cizen-pergel-compasses-for-drawing-conic-sections", "name": "Mükemmel Tam Pergel (barkâr kâmil)", "category": "Coğrafya ve Seyrüsefer", "creator": "Ebû Sehl el-Kühî", "has_img": 0, "desc": "el-Kühî'nin konik kesit çizen pergel tasarımı; İslam geometrisinin zirvesi."}, {"id": "physical-asset-25-1", "slug": "cografya-ve-seyrusefer-fiziksel-25-konik-kesitler-cizen-pergel-i-kinci-model-compasses-for-drawing-conic-", "name": "Ko el-Bîrûnî", "has_img": 0, "desc": "el-Bîrûnî'nin İstî'âb'ındaki daireleri ve düz çizgileri bölümlemek için icat ettiği menteşeli düzenek."}, {"id": "physical-asset-46-1", "slug": "tesviye-ve-geometri-fiziksel-46-acilir-kapanir-cifte-cetvel-foldable-double-ruler-mastar-musenn", "name": "Usturlap Yapım Aletleri (destür, torna)", "category": "Tesviye ve Geometri", "creator": "Ebû Reyhân el-Bîrûnî", "has_img": 0, "desc": "Usturlap imalatında destür ve torna düzenekleri."}, {"id": "physical-asset-47-1", "slug": "cografya-ve-seyrusefer-fiziksel-47-egik-uclu-pergel-compasses-with-bend-points", "name": "Eğik Uçlu Pergel", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam geometri geleneği", "has_img": 0, "desc": "Kalın yüzeylerde veya özel açılarda çizim yapmak için tasarlanmış eğik uçlu pergel."}, {"id": "physical-asset-136", "slug": "cografya-ve-seyrusefer-fiziksel-136-egik-uclu-pergel-compasses-with-bend-points", "name": "Eğik Uçlu Pergel (Compasses with Bend Points)", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam geometri geleneği", "has_img": 0, "desc": "Büyük daireleri tek hamlede çizmek için normal pergeller yetersiz kaldığından, İslam geometri ustaları vidalanabilir uzatma…"}, {"id": "physical-asset-232", "slug": "optik-fiziksel-232-i-bnu-l-heysem-in-isik-kirilmasi-yansimasi-gozlem-aleti-observation-in", "name": "İbn el-Heysem Optik Aletleri", "category": "Optik", "creator": "Hasan İbn el-Heysem", "has_img": 0, "desc": "İbn el‑Heysem'in optik aletleri grubu, deneysel bilimin kurucu düzeneklerini bir araya getirir: camera obscura (beyt muzlim) ışığın doğrusal yayılımını kanıtlar; âlet el‑inkâs (yansıma aleti) küresel ve silindirik aynalarda yansıma yasalarını ölçer; Ay Işığını Gözlemleme Aleti (s. 174‑177) ay ışığının karakterini sorgular. «İbn el‑Heysem Problemi» (Problema Alhazeni) ve aksi‑den ışık deneyleri, optiği geometrik‑deneysel bir disipline dönüştürmüştür. Roger Bacon'dan Peckham'a Avrupa optiği bu grubun omzunda yükselir. Koleksiyonda grup, «deney yöntemi»nin maddi doğum belgeleridir; modern laboratuvarın orta çağdaki prototipleri."}, {"id": "physical-asset-236", "slug": "optik-fiziksel-236-ay-isigini-gozlemleme-aleti-instrument-for-observing-moonlight", "name": "Ay Işığı Deney Düzeneği (Makale fî Dav' el-Kamer)", "category": "Optik", "creator": "Hasan İbn el-Heysem", "has_img": 0, "desc": "Ay Işığı Deney Düzeneği, İbn el-Heysem'in 'Makale fî Dav' el-Kamer' (Ay Işığı Üzerine Risale) adlı eserinde anlattığı ve deneysel bilimin en zarif örneklerinden biri olan test ortamıdır. Antik Çağ'da ve erken Orta Çağ'da Ay'ın kendi ışığını ürettiğine veya en azından Güneş gibi 'ısıtıcı' bir etkiye sahip olduğuna dair yaygın bir inanış vardı. İbn el-Heysem bu hipotezi çürütmek için devasa parabolik (yakıcı) aynalar kullanmış, Ay ışığını bu aynalarla tek bir odak noktasında toplamıştır. Odağa hassas termal ölçüm araçları (eriyen balmumu, yanan pamuk vb.) yerleştirmiş, ancak odak noktasında hiçbir ısı artışı veya yanma gerçekleşmediğini gözlemlemiştir. Ardından camera obscura (karanlık oda) düzeneğiyle Ay ışığının doğrusal yayıldığını ve sadece yansıma (refleksiyon) olduğunu kanıtlamıştır. Bu deney, gök cisimlerinin fiziksel doğasının sadece matematiksel modellerle değil, laboratuvar ortamında deneysel olarak da sınanabileceğini gösteren, astrofizik ve optik tarihinin en kritik kilometre taşlarından biridir."}, {"id": "physical-asset-61-1", "slug": "kimya-fiziksel-61-kan-alma-miktarini-olcen-kaplar-instruments-for-measuring-blood-after-", "name": "Kan Alma Miktarını Ölçen Kaplar (Instruments for measuring blood after bloodletting)", "category": "Kimya", "creator": "Alaeddin Ali b. İbrahim İbn eş-Şatir", "has_img": 0, "desc": "Şam Emevi Camii'nin başmuvakkidi İbn eş‐Şatir'in icat ettiği «el‐alet el‐camia» (kapsamlı/evrensel alet), tüm enlemlerde ve tüm astronomik problemlerde kullanılabilen çok işlevli bir usturlap/kadran sentezidir. Bu alet, ez‐Zerkali'nin evrensel disk (safiha zerkaliyye) geleneğinin 14. yüzyıldaki zirvesidir; farklı enlem plakalarını taşımaya gerek bırakmadan, stereografik projeksiyonun incelikleriyle her yerde çalışır. İbn eş‐Şatir'in aleti, yalnız pratik bir araç değil, aynı zamanda onun ünlü gezegen teorisinin («Tusi Çifti» ile Batlamyus eleştirisi) mekanik yansımasıdır. Kopernik'in yüzyıl sonra kullanacağı matematiksel modellerin sahibi olan bu muvakkit, alet yapımında da aynı dehayı gösterir. Koleksiyonda el‐alet el‐camia, İslam astronomisinin hem teoride hem pratikte kendi «devrimini» yarattığının maddi kanıtıdır."}, {"id": "physical-asset-145", "slug": "tip-fiziksel-145-cerrahi-aletler-seti-medical-surgical-instruments-ez-zehr-v", "name": "Cerrahi Aletler Listesi (ez-Zehrâvî)", "category": "Tıp", "creator": "Ebü'l-Kâsım ez-Zehrâvî", "has_img": 0, "desc": "ez‑Zehrâvî'nin Taşrîf'inde tarif ettiği cerrahi neşterler (mibda') ve kan alma bıçakları (hacm), orta çağ cerrahisinin en temel ve en hassas aletleridir. ez‑Zehrâvî, çeliğin kalitesinden sapın ergonomisine, keskinlik açısından damarın derinliğine kadar neşter tasarımının tüm parametrelerini sistematize etmiştir. «Maskeli neşter» (mihdac) gibi hasta psikolojisini gözeten tasarımlar, İslam tıbbının etik ve insani duyarlılığını yansıtır. Bu aletler, Gerard of Cremona'nın Latince çevirisiyle Avrupa'ya geçmiş; 18. yüzyıla dek «Albucasis neşterleri» adıyla standart cerrahi donanımı olarak kalmıştır. Koleksiyonda neşterler, Taşrîf'in 172 aletlik envanterinin çekirdeğidir; modern cerrahinin keskin ucunun bin yıllık atasıdır."}, {"id": "physical-asset-224", "slug": "kimya-fiziksel-224-ortopedi-germe-banki-orthopaedic-bench-scamnum", "name": "Ortopedik Aletler (grup)", "category": "Kimya", "creator": "Ebü'l-Kasım ez-Zehravi", "has_img": 0, "desc": "Germe bankı ve kargılı koterler grubu."}, {"id": "physical-asset-93", "slug": "kimya-fiziksel-93-temel-i-mbik-alembic", "name": "İmbik (embîk/enâbîk)", "category": "Kimya", "creator": "İslam kimya geleneği", "has_img": 0, "desc": "Damıtma miğferi; kimyasal laboratuva  "slug": "kimya-fiziksel-203-yuvarlak-tabanli-cam-siseler-i-mbikler-phials-retorts-with-a-round-bas", "name": "Yuvarlak Tabanlı Cam Şişeler / İmbikler (Phials / Retorts with a round base)", "category": "Kimya", "creator": "İslam kimya geleneği (er-Razi)", "has_img": 0, "desc": "İmbik (embik), damıtma miğferi olarak İslam kimyasının en karakteristik kabıdır; «baş» ve «gaga» kısımlarıyla buharı yoğunlaştırıp alıcı kaba aktarır. Terim, Avrupa dillerine 'alembic' olarak geçmiştir. İmbik, damıtma sanatının İslam kökeninin simgesidir."}, {"id": "physical-asset-204", "slug": "kimya-fiziksel-204-yuvarlak-tabanli-cam-siseler-i-mbikler-phials-retorts-with-a-round-bas", "name": "Yuvarlak Tabanlı Cam Şişeler / İmbikler (Phials / Retorts with a round base)", "category": "Kimya", "creator": "İslam kimya geleneği (er-Razi)", "has_img": 0, "desc": "İmbik (embik), damıtma miğferi olarak İslam kimyasının en karakteristik kabıdır; «baş» ve «gaga» kısımlarıyla buharı yoğunlaştırıp alıcı kaba aktarır. Terim, Avrupa dillerine 'alembic' olarak geçmiştir. İmbik, damıtma sanatının İslam kökeninin simgesidir."}, {"id": "physical-asset-201", "slug": "kimya-fiziksel-201-balcik-kilifli-yuvarlak-i-mbik-round-retort-sheathed-in-clay", "name": "Balçık Kılıflı Yuvarlak İmbik (Round retort sheathed in clay)", "category": "Kimya", "creator": "Ebu Bekir er-Razi", "has_img": 0, "desc": "Ampulla lutata, balçıkla (lute) sıvanmış şişe anlamına gelir; cam gövde, yüksek ısıya dayanması için kil tabakasıyla kaplanır. Bu «lutlama» tekniği, İslam laboratuvar pratiğinin temel yöntemlerinden biridir ve ısıyı kontrol ederek kabın kırılmasını önler. Şişe, er-Razi kimyasının maddi kültürünün somut bir tanığıdır."}, {"id": "physical-asset-205", "slug": "kimya-fiziksel-205-genis-agizli-kaplar-karaf-vessel-with-wide-necks-carafe", "name": "Geniş Ağızlı Kaplar / Karaf (Vessel with wide necks / carafe)", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 0, "desc": "Geniş boğazlı kap, er-Râzî'nin laboratuvar envanterinde maddelerin çözülmesi ve karıştırılması için kullanılan pratik bir cam kaptır. Geniş ağzı, malzemenin kolayca eklenip çıkarılmasını sağlar; renksiz cam, kimyacının reaksiyonu gözlemlemesine imkân verir. er-Râzî'nin kap tipolojisi —her işlem için ayrı kap— simyayı kimyaya dönüştüren metodolojik tutumun temelidir."}, {"id": "physical-asset-206", "slug": "kimya-fiziksel-206-genis-agizli-kaplar-karaf-vessel-with-wide-necks-carafe", "name": "Geniş Ağızlı Kaplar / Karaf (Vessel with wide necks / carafe)", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 0, "desc": "Cannina, geniş boğazlı kap ailesinin bir diğer örneğidir ve adını er-Râzî'nin kap listesinin Latince geleneğinden alır. «Ruhların» (uçucu maddelerin) çözülmesi ve kristallendirilmesi için kullanılan bu cam kaplar, Riccardiana ve Bologna yazmalarıyla Avrupa'ya aktarılmıştır. Kap, İslam laboratuvar terminolojisinin Latince bilim diline geçtiğinin kanıtıdır."}, {"id": "physical-asset-200", "slug": "kimya-fiziksel-200-topuz-ve-kure-seklinde-cam-kaplar-mace-shaped-and-sphere-shaped-glass-", "name": "Cornu (boynuz formlu huni/kap)", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 0, "desc": "Boynuz formlu huni (Cornu), kimyasal ayrıştırma ve aktarma işlemlerinde kullanılan küçük bir cam kaptır. Boynuz biçimi, sıvıların kontrollü biçimde akıtılmasını sağlar. er-Râzî'nin kap listesinde ve Latince çevirilerde yer alan bu form, Avrupa laboratuvarlarında yüzyıllarca 'cornue' (retort) adıyla yaşamıştır. Retort, damıtma tarihinin İslam kökeninin simgesidir."}, {"id": "physical-asset-207", "slug": "kimya-fiziksel-207-topuz-ve-kure-seklinde-cam-kaplar-mace-shaped-and-sphere-shaped-glass-", "name": "Topuz ve Küre Şeklinde Cam Kaplar (Mace-shaped and Sphere-shaped Glass vessels)", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 0, "desc": "er‑Râzî'nin Sırr el‑Esrâr'ındaki «fırınlar, ocaklar, potalar, destilasyon kapları» listesi, kimya tarihinin ilk sistematik laboratuvar envanteridir. Her işlem —çözme, süblimleme, damıtma, kavurma— kendi kabını ve kendi ısı rejimini gerektirir; bu «işlem‑kap eşlemesi», modern kimya mühendisliğinin ünite operasyonları kavramının habercisidir. Liste, tın el‑hikme (yapay kil) gibi malzeme bilgisiyle birlikte okunur. Latince çevirilerle Avrupa'ya geçen bu tipoloji, yüzyıllarca «Geber» adıyla anılan laboratuvar kültürünün çekirdeği olmuştur. Koleksiyonda grup, kimyanın «mutfak eşyası»ndan bilimsel aparata yükselişinin haritasıdır."}, {"id": "physical-asset-184", "slug": "kimya-fiziksel-184-ruhlarin-cozunmesi-i-cin-kap-ve-duzenek-vessel-and-apparatus-for-the-d", "name": "Cannutum / Caxa (ruhları çözme kabı)", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 0, "desc": "Arapça 'kınmne' kelimesinden türeyen Cannutum, Riccardiana yazmasındaki araç tablosunda resmedilen bir «ruhları çözme» kabıdır. İnce uzun formu, buharların yoğunlaşmasını ve toplanmasını kontrol eder. er-Râzî'nin her kabı işlevine göre adlandırması ve resmettirmesi, kimya tarihinde laboratuvar ekipmanının ilk sistematik standardizasyonu sayılır."}, {"id": "physical-asset-187", "slug": "kimya-fiziksel-187-fitilli-filtre-kupasi-capillary-filter-beaker", "name": "Fitilli Filtre Kupası (kapiler filtre)", "category": "Kimya", "creator": "er-Râzî geleneği", "has_img": 0, "desc": "Kapiler (fitilli) filtreleme kabı; destillatio per filtrum yönteminin aracı. a-177/a-178 arasında teyit bekliyor."}, {"id": "physical-asset-196", "slug": "kimya-fiziksel-196-kuresel-cozunme-kabi-cornu-a-spherical-device-for-dissolution-cornu", "name": "Küresel Çözünme Kabı / Cornu (A Spherical device for dissolution / Cornu)", "category": "Kimya", "creator": "Ebu Bekir er-Razi", "has_img": 0, "desc": "Boynuz formlu huni (Cornu), kimyasal ayrıştırma ve aktarma işlemlerinde kullanılan küçük bir cam kaptır. Boynuz biçimi, sıvıların kontrollü biçimde akıtılmasını sağlar. er-Razi'nin kap listesinde ve Latince çevirilerde yer alan bu form, Avrupa laboratuvarlarında yüzyıllarca 'cornue' (retort) adıyla yaşamıştır. Retort, damıtma tarihinin İslam kökeninin simgesidir."}, {"id": "physical-asset-208", "slug": "kimya-fiziksel-208-kuresel-cozunme-kabi-cornu-a-spherical-device-for-dissolution-cornu", "name": "Küresel Çözünme Kabı / Cornu (A Spherical device for dissolution / Cornu)", "category": "Kimya", "creator": "Ebu Bekir er-Razi", "has_img": 0, "desc": "Boynuz formlu huni (Cornu), kimyasal ayrıştırma ve aktarma işlemlerinde kullanılan küçük bir cam kaptır. Boynuz biçimi, sıvıların kontrollü biçimde akıtılmasını sağlar. er-Razi'nin kap listesinde ve Latince çevirilerde yer alan bu form, Avrupa laboratuvarlarında yüzyıllarca 'cornue' (retort) adıyla yaşamıştır. Retort, damıtma tarihinin İslam kökeninin simgesidir."}, {"id": "physical-asset-164", "slug": "kimya-fiziksel-164-kendi-kendisini-yelleyen-firin-kiln-that-fans-itself", "name": "\"Kendi Kendisini Yelleyen\" Fırın (Kiln that 'fans itself')", "category": "Kimya", "creator": "Ebu Bekir er-Razi", "has_img": 0, "desc": "Ebu Bekir er-Razi'nin tasarladığı «kendi kendisini yelleyen» fırın (nafih nefsehu), körük gerektirmeden baca etkisiyle kendi hava akımını üreten bir fırındır. Çelik üçayak ve pişirilmiş kil gövde, kimyasal işlemler için sabit ve kontrollü bir ısı sağlar. İşgücünden ve enerjiden tasarruf eden bu tasarım, İslam laboratuvar mühendisliğinin en özgün örneklerinden biridir."}, {"id": "physical-asset-168", "slug": "optik-fiziksel-168-civa-isitma-kaynatma-kabi-vas-decoctionis-mercuris", "name": "Cıva Isıtma / Kaynatma Kabı (Vas decoctionis mercuris)", "category": "Optik", "creator": "Geber (Cabir) geleneği / Liber florum Geberti", "has_img": 0, "desc": "Liber florum Geberti'de yer alan cıva ısıtma aleti, cıvanın «pişirilmesi» (coction) için tasarlanmış bir fırın düzeneğidir. Halka formlu parçalar, cıva buharının ısıtılmasını ve yoğunlaştırılmasını kontrol eder. Latince çeviri hareketiyle yayılan bu alet, Cabir (Geber) geleneğinin Avrupa kimyasına aktarımının ve cıva kimyasının İslam simyasındaki merkezi yerinin kanıtıdır."}, {"id": "physical-asset-166", "slug": "kimya-fiziksel-166-aludel-sublimasyon-kabi", "name": "Aludel (Süblimasyon Kabı)", "category": "Kimya", "creator": "İslam Kimya Geleneği (Câbir/er-Râzî)", "has_img": 0, "desc": "Kükürt, cıva, arsenik ve kafur gibi maddelerin saflaştırılması için kullanılan, üst üste dizilen silindirik toprak/cam kaplardan oluşan süblimasyon düzeneği."}, {"id": "physical-asset-173", "slug": "kimya-fiziksel-173-kimyasal-i-slemler-i-cin-firin-kiln-for-chemical-operations", "name": "Câbir'in Fırın ve Ocakları", "category": "Kimya", "creator": "Câbir b. Hayyân geleneği", "has_img": 0, "desc": "Câbir külliyatındaki fırın (tennûr) ve ocak tipleri, simyanın «ısı rejimleri» bilimidir: her madde ve her işlem, kendi fırınını talep eder. Kil‑tuğla gövdeli tennûr'lar, kademeli ısı bölmeleri ve kül tablalarıyla, modern fırın mühendisliğinin kavramsal atalarıdır. Câbir'in «dereceli ısı» öğretisi, Latince Geber çevirileriyle Avrupa'ya geçmiş; Paul Kraus'un gösterdiği gibi bu külliyat, İslam simyasının en büyük sentezidir. Koleksiyonda Câbir fırınları, kimyanın «ateş terbiyesi» olarak başladığı anı temsil eder; er‑Râzî'nin laboratuvar envanterinin teorik öncülüdür."}, {"id": "physical-asset-174", "slug": "kimya-fiziksel-174-kimyasal-i-slemler-i-cin-firin-kiln-for-chemical-operations", "name": "Kimyasal İşlemler İçin Fırın (Kiln for chemical operations)", "category": "Kimya", "creator": "", "has_img": 0, "desc": "İslam laboratuvarlarının standart ısıtma ünitesi olan bu fırın (*kanun* veya *athanor*), farklı sıcaklık derecelerine ihtiyaç…"}, {"id": "physical-asset-159", "slug": "kimya-fiziksel-159-aslan-ayakli-kazan-lion-footed-cauldron", "name": "Sirke Dolu Kazanlı Ocak", "category": "Kimya", "creator": "Geber (Câbir) geleneği", "has_img": 0, "desc": "Liber florum Geberti geleneğinde su banyosu ve sirke kazanı olarak kullanılan aslan ayaklı kazan."}, {"id": "physical-asset-165", "slug": "kimya-fiziksel-165-aslan-ayakli-kazan-lion-footed-cauldron", "name": "Aslan Ayaklı Kazan (Lion-footed cauldron)", "category": "Kimya", "creator": "Ebû Bekir er-Râzî", "has_img": 0, "desc": "«Sirke dolu kazan»lı ocak, Latin Geber (Câbir) külliyatının en etkili eserlerinden Liber florum Geberti'de tarif edilen fırın…"}, {"id": "physical-asset-158", "slug": "kimya-fiziksel-158-yapay-mucevher-i-mali-i-cin-firin-apparatus-for-making-artificial-prec", "name": "Yapay Mücevher İmali Fırını", "category": "Kimya", "creator": "Liber florum Geberti geleneği", "has_img": 0, "desc": "Vas decoctionis elixir, Liber florum Geberti'de iksirin «pişirilmesi» için tarif edilen fırın düzeneğidir. Halka formlu ve dereceli parçalar, uzun süreli ve kontrollü ısı sağlar. Bu fırın, İslam kimyasının Avrupa'ya devrettiği simya fırını tipolojisinin parçasıdır."}, {"id": "physical-asset-163", "slug": "kimya-fiziksel-163-yapay-mucevher-i-mali-i-cin-firin-apparatus-for-making-artificial-prec", "name": "Yapay Mücevher İmali Fırını", "category": "Kimya", "creator": "Liber florum Geberti geleneği", "has_img": 0, "desc": "Vas decoctionis elixir, Liber florum Geberti'de iksirin «pişirilmesi» için tarif edilen fırın düzeneğidir. Halka formlu ve dereceli parçalar, uzun süreli ve kontrollü ısı sağlar. Bu fırın, İslam kimyasının Avrupa'ya devrettiği simya fırını tipolojisinin parçasıdır."}, {"id": "physical-asset-170", "slug": "kimya-fiziksel-170-zosimos-un-tavlama-ocagi-sirkeli-kazan-kiln-of-zosimos-hearth-with-vin", "name": "Zosimos'un Tavlama Ocağı / Sirkeli Kazan (Kiln of Zosimos / Hearth with vinegar)", "category": "Kimya", "creator": "Zosimos geleneği", "has_img": 0, "desc": "«Sirke dolu kazan»lı ocak, Latin Geber (Câbir) külliyatının en etkili eserlerinden Liber florum Geberti'de tarif edilen fırın…"}, {"id": "physical-asset-295", "slug": "fizik-ve-teknik-fiziksel-295-terazi-balance", "name": "İbreli Terazi (kabbân)", "category": "Fizik ve Teknik", "creator": "el-İsfizârî / İslam metroloji", "has_img": 0, "desc": "İbreli terazi (kabbân), İslam çarşısının en yaygın tartı aleti ve aynı zamanda teorik bir bilimin konusudur: «ilm el-karastûn» (kantar bilimi). el-İsfizârî'nin İrşâd'ı ve Sabit b. Kurra'nın Kitâb el-Karastûn'u, kaldıraç ilkesini matematikleştirerek ibreli terazinin kuramını kurmuş; karşıt ağırlığın konumunu oranlarla belirlemiştir. Kabbân, ticarette, vergide ve darphanede vazgeçilmezdi; muhtesib teşkilatı çarşıdaki kantarların doğruluğunu denetler, «ölçü ve tartı» devletin meşruiyetinin parçası sayılırdı. Tek kollu tasarımı, küçük bir sürgüyle ağır yüklerin tartılmasını sağlayarak modern baskülün atası olmuştur. Bu alet, gündelik ekonomik hayat ile teorik mekaniği birbirine bağlayan nadir nesnelerdendir; İslam uygarlığının yalnız «yüksek bilim» değil, bir metroloji (ölçüm) kültürü de ürettiğinin en somut kanıtıdır."}, {"id": "physical-asset-111", "slug": "fizik-ve-teknik-fiziksel-111-ozgul-agirligin-sayisal-olarak-belirlenmesi-numerical-determination-of", "name": "Özgül Ağırlığın Sayısal Olarak Belirlenmesi (Numerical Determination of Specific Gravity)", "category": "Fizik ve Teknik", "creator": "Abdurrahman el-Hazini", "has_img": 0, "desc": "el-Hazini'nin sıvıların özgül ağırlığını sayısal olarak belirlemek için geliştirdiği areometre, orta çağın en sofistike fizik aletlerinden biridir. Hakkedilmiş pirinç gövde ve cam silindir, sıvıların yoğunluğunu şaşırtıcı bir hassasiyetle ölçer. Bu alet, İslam «terazi bilimi» geleneğinin zirvesi ve modern hidrometrenin doğrudan atasıdır."}, {"id": "physical-asset-255", "slug": "fizik-ve-teknik-fiziksel-255-areometre-yogunluk-olcer-areometer", "name": "el-Hâzinî Areometresi", "category": "Fizik ve Teknik", "creator": "Abdurrahmân el-Hâzinî", "has_img": 0, "desc": "el-Hâzinî'nin sıvıların özgül ağırlığını sayısal olarak belirlemek için geliştirdiği areometre, orta çağın en sofistike fizik aletlerinden biridir. Hâkkedilmiş pirinç gövde ve cam silindir, sıvıların yoğunluğunu şaşırtıcı bir hassasiyetle ölçer. Bu alet, İslam «terazi bilimi» geleneğinin zirvesi ve modern hidrometrenin doğrudan atasıdır."}, {"id": "physical-asset-269", "slug": "fizik-ve-teknik-fiziksel-269-helezonlu-pompa-arsimet-vidasi-screw-pump", "name": "Konik Valf (Benû Mûsâ)", "category": "Fizik ve Teknik", "creator": "İslam mühendislik geleneği", "has_img": 0, "desc": "Arşimed vidası (su burgusu), tarihin en eski ve en kalıcı su kaldırma makinelerindendir: eğik bir boru içinde dönen helezon, suyu sürekli ve nazikçe yükseltir. İslam dünyası, vidayı antik mirastan devralıp sulamada, madenlerde ve gemi sintinesinde kullanmış; Latince çeviriler ile Agricola ve Leonardo'nun çizimleri, Avrupa'ya aktarımı belgelemiştir. Vida, sâkiye ve pompalarla birlikte İslam «su uygarlığı»nın üç büyük üyesidir; şehirlerin çeşmeleri, hamamları ve bahçeleri bu zincirle beslenmiştir. Günümüzde hâlâ modern mühendislikte (vida pompaları, türbinler) kullanılan bu düzenek, koleksiyonda teknolojinin 2300 yıllık sürekliliğinin temsilcisidir. Basitliği, zarafeti ve verimliliğiyle, «iyi tasarım»ın zaman tanımadığının kanıtıdır."}, {"id": "physical-asset-223", "slug": "fizik-ve-teknik-fiziksel-223-kovali-su-dolabi-bucket-chain-noria", "name": "Sâkiye (kovalı çark)", "category": "Fizik ve Teknik", "creator": "İslam mühendislik geleneği", "has_img": 0, "desc": "Sâkiye, İslam tarım devriminin iki büyük su kaldırma makinesinden biridir (diğeri nâ'ûra/dolap). Hayvan gücüyle döndürülen çark, kova zinciriyle kuyudan veya ırmaktan suyu yükseltip sulama kanalına boşaltır; dişli sistemi (pinion ve büyük çark) hayvanın gücünü katlar. Endülüs'ten Pencap'a sâkiye, sulanabilir tarım alanını genişletmiş; şeker kamışı, pamuk ve narenciye gibi yeni ürünleri Akdeniz'e taşımıştır. Gıcırtılı çarkın sesi, kırsal ses peyzajının parçası olmuş, şiire ve atasözlerine girmiştir. Bugün hâlâ bazı bölgelerde kullanılan sâkiye, İslam mühendisliğinin «yeşil» enerji teknolojisi olarak mirasıdır; koleksiyonda değirmenler ve pompalar zincirinin halkası olarak, suyun İslam uygarlığındaki merkezi yerini hatırlatır: su, yalnız nimet değil, aynı zamanda bir mühendislik nesnesiydi."}, {"id": "physical-asset-143", "slug": "fizik-ve-teknik-fiziksel-143-tympanum-tekerlek-bicimli-su-dolabi", "name": "Tympanum (Tekerlek Biçimli Su Dolabı)", "category": "Fizik ve Teknik", "creator": "İslam mühendislik geleneği", "has_img": 0, "desc": "Sakiye, İslam tarım devriminin iki büyük su kaldırma makinesinden biridir (diğeri na'ura/dolap). Hayvan gücüyle döndürülen çark, kova zinciriyle kuyudan veya ırmaktan suyu yükseltip sulama kanalına boşaltır; dişli sistemi (pinion ve büyük çark) hayvanın gücünü katlar. Endülüs'ten Pencap'a sakiye, sulanabilir tarım alanını genişletmiş; şeker kamışı, pamuk ve narenciye gibi yeni ürünleri Akdeniz'e taşımıştır. Gıcırtılı çarkın sesi, kırsal ses peyzajının parçası olmuş, şiire ve atasözlerine girmiştir. Bugün hala bazı bölgelerde kullanılan sakiye, İslam mühendisliğinin «yeşil» enerji teknolojisi olarak mirasıdır; koleksiyonda değirmenler ve pompalar zincirinin halkası olarak, suyun İslam uygarlığındaki merkezi yerini hatırlatır: su, yalnız nimet değil, aynı zamanda bir mühendislik nesnesiydi."}, {"id": "physical-asset-287", "slug": "fizik-ve-teknik-fiziksel-287-cezer-nin-hayvan-gucuyle-calisan-su-kaldirma-tesisi", "name": "el-Cezerî'nin Su Kaldıran Aleti", "category": "Fizik ve Teknik", "creator": "İsmail el-Cezerî", "has_img": 0, "desc": "el-Cezerî'nin su kaldıran aletlerinin beşinci kısmındaki ikinci düzenek, hayvan veya su gücüyle döndürülen kepçeli bir zincirle suyu yükseğe taşır. Model, dişli ve krank sisteminin verimliliğini gözler önüne serer. el-Cezerî'nin su makineleri, Arşimed'den Benû Mûsâ'ya uzanan teknoloji zincirinin zirvesi ve modern pompaların habercisidir."}, {"id": "physical-asset-282", "slug": "fizik-ve-teknik-fiziksel-282-cezer-nin-su-carki-tahrikli-pompa-i-stasyonu", "name": "Cezeri'nin Su Çarkı Tahrikli Pompa İstasyonu", "category": "Fizik ve Teknik", "creator": "İsmail el-Cezeri", "has_img": 0, "desc": "el-Cezeri'nin su kaldıran aletlerinin beşinci kısmındaki ikinci düzenek, hayvan veya su gücüyle döndürülen kepçeli bir zincirle suyu yükseğe taşır. Model, dişli ve krank sisteminin verimliliğini gözler önüne serer. el-Cezeri'nin su makineleri, Arşimed'den Benu Musa'ya uzanan teknoloji zincirinin zirvesi ve modern pompaların habercisidir."}, {"id": "physical-asset-234", "slug": "cografya-ve-seyrusefer-fiziksel-234-gemi-degirmeni-ship-s-mill", "name": "Gemi Değirmeni (Ship's mill)", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam mühendislik geleneği", "has_img": 0, "desc": "Gemi değirmeni (caraba), demirli bir tekneye monte edilen su çarkının nehir akıntısıyla döndürülmesiyle çalışan dahiyane bir düzeneğidir. Dicle ve Fırat'ta yaygın olarak kullanılan bu değirmenler, akışın kinetik enerjisini öğütme işine dönüştürürdü. Gemi değirmeni, İslam hidro-mühendisliğinin en özgün ürünlerinden biri olarak yüzyıllarca kent yaşamının parçası oldu."}, {"id": "physical-asset-252", "slug": "fizik-ve-teknik-fiziksel-252-yel-degirmeni-windmill", "name": "Yel Değirmeni (Windmill)", "category": "Fizik ve Teknik", "creator": "İslam mühendislik geleneği", "has_img": 0, "desc": "Yel değirmeni (raha), ilk kez Sistan'da (bugünkü İran-Afganistan sınırı) belgelenen ve İslam dünyasının en önemli enerji icatlarından biridir. Dikey eksenli değirmenler, rüzgar gücüyle tahıl öğütüp su çekiyordu. Haçlı seferleri ve Endülüs yoluyla Avrupa'ya aktarılan yel değirmeni, sanayi öncesi enerji devriminin İslam kökeninin simgesidir."}, {"id": "physical-asset-147", "slug": "fizik-ve-teknik-fiziksel-147-sicak-havayla-calisan-doner-dondurucu-apparatus-turning-by-means-of-ho", "name": "Sıcak Havayla Çalışan Döner Döndürücü (Apparatus turning by means of hot air)", "category": "Fizik ve Teknik", "creator": "Leonardo da Vinci", "has_img": 0, "desc": "Leonardo da Vinci'nin Codex Atlanticus'taki su kaldırma makinesi, İslam mekanik geleneği ile Avrupa Rönesansı arasındaki diyaloğun en ünlü örneklerindendir: krank-biyel kolu sistemi, kova zinciri ve valf fikirleri, el-Cezeri ve Benu Musa'da açık öncellere sahiptir. Leonardo, bu öncelleri yalnız «kopyalamamış», kendi çizim dili ve mühendislik sezgisiyle dönüştürmüştür; ancak çözümlerin benzerliği, Akdeniz'in teknik bilgisinin ortak bir havuz olduğunu gösterir. Bu makine, koleksiyonda Doğu-Batı aktarımını görünür kılan «karşılaştırmalı parça»dır; Takiyyeddin'in iki pistonlu cihazıyla aynı zincirin iki ucunu oluşturur. Leonardo'nun dehası, İslam mühendisliğinin birikimiyle buluştuğunda, modern makine çağının kapısı aralanmıştır."}, {"id": "physical-asset-68-1", "slug": "fizik-ve-teknik-fiziksel-68-mekanik-cevirme-sis-duzenegi-apparatus-for-turning-roast-meat", "name": "Ağırlık Tahrikli Şiş Çeviricisi", "category": "Fizik ve Teknik", "creator": "Takiyyeddîn er-Râsıd", "has_img": 0, "desc": "Üçüncü düzenek, inen bir ağırlığın potansiyel enerjisini dişli oranlarıyla büyüterek şişi döndürür; Takiyyeddîn burada «küçük gücü büyük işe çevirme» problemini, saatçiliğin eşapman ve dişli bilgisini mutfak teknolojisine taşıyarak çözer. Ağırlığın düşüş hızını düzenleyen kaçış mekanizması, dönme hızını sabitler; böylece şiş, ateş karşısında eşit pişirme sağlar. Bu düzenek, el‑Cezerî'nin ağırlıklı otomatları ile Avrupa'nın zemberekli saatleri arasındaki teknik sürekliliğin halkasıdır. Koleksiyonda üçlü serinin (buhar‑sıcak hava‑ağırlık) son üyesi olarak, 16. yüzyıl Osmanlı mühendisinin enerji kaynaklarını sistematik biçimde karşılaştıran yöntemini gösterir."}, {"id": "physical-asset-243", "slug": "fizik-ve-teknik-fiziksel-243-ta-iyyudd-n-in-disli-cark-mekanizmali-vinci-hoist-lifting-system-with-", "name": "Hoist-Lifting gear drive (Takiyyeddîn)", "category": "Fizik ve Teknik", "creator": "Takiyyeddîn er-Râsıd", "has_img": 0, "desc": "İki pistonlu su çıkarma cihazı, Takiyyeddîn'in et-Turuk es-Seniyye'sinde ve Leonardo da Vinci'nin notalarında paralel olarak karşımıza çıkan, Doğu-Batı teknik yaratıcılığının en ünlü örneklerindendir. Piston-valf sistemi, dönme hareketini pompalama işine çevirerek modern pompanın temelini kurar. Bu cihaz, İslam mekanik geleneğinin Avrupa Rönesansı'na etkisinin somut kanıtıdır."}, {"id": "physical-asset-245", "slug": "fizik-ve-teknik-fiziksel-245-ta-iyyudd-n-in-palangasi-block-and-tackle-by-taqiyaddin", "name": "Block and tackle (Takiyyeddîn)", "category": "Fizik ve Teknik", "creator": "Takiyyeddîn er-Râsıd", "has_img": 0, "desc": "İki pistonlu su çıkarma cihazı, Takiyyeddîn'in et-Turuk es-Seniyye'sinde ve Leonardo da Vinci'nin notalarında paralel olarak karşımıza çıkan, Doğu-Batı teknik yaratıcılığının en ünlü örneklerindendir. Piston-valf sistemi, dönme hareketini pompalama işine çevirerek modern pompanın temelini kurar. Bu cihaz, İslam mekanik geleneğinin Avrupa Rönesansı'na etkisinin somut kanıtıdır."}, {"id": "physical-asset-225", "slug": "fizik-ve-teknik-fiziksel-225-devridaim-makinesi-perpetuum-mobile", "name": "Villard de Honnecourt Makine Çizimleri", "category": "Fizik ve Teknik", "creator": "Villard de Honnecourt / İslam geleneği", "has_img": 0, "desc": "Perpetuum mobile (sürekli hareket düzeneği), mekanik tarihinin en baştan çıkarıcı hayalidir: dışarıdan enerji almadan sonsuza dek işleyen makine. İslam kaynakları (kendi kendine yelleyen fırın, sonsuz ışık lambası, el-Muradi otomatları) ve Avrupa notları (Villard de Honnecourt'un ağırlıklı çarkı), bu tasarımlarla doludur; imkansızlık ancak 19. yüzyıl termodinamiğiyle kesinleşmiştir. Ancak bu hayal verimsiz değildi: sürekli hareket arayışı, dişli dizilerini, eşapmanları ve kendi kendini düzenleyen mekanizmaları —kısaca modern makine mühendisliğinin alet kutusunu— üretmiştir. Koleksiyonda perpetuum mobile, insan yaratıcılığının sınırlarını ve doğa yasalarıyla diyaloğunu gösteren «kavramsal bir otomat»tır; mekanik bölümünün en felsefi parçası olarak, bilimin yalnız çözümlerden değil, verimli hayallerden de beslendiğini hatırlatır."}, {"id": "physical-asset-127", "slug": "fizik-ve-teknik-fiziksel-127-n-redd-n-zeng-b-m-rist-ni-sam-the-nureddin-hospital", "name": "Leonardo'nun Çevirme Kollu Kuyu Kovası Zinciri", "category": "Mimari", "creator": "Nûreddîn Zengî", "has_img": 0, "desc": "Musikâr, İslam bimaristanlarında (hastanelerinde) akıl hastalarının müzikle tedavisinde kullanılan üflemeli bir çalgıdır. Şam'daki Nureddin Hastanesi (1154) gibi kurumlarda, belirli makamların (neva, segâh, zengüle) belirli ruhsal durumlara iyi geldiği teorisiyle müzisyenler istihdam edilirdi. el‑Kindî'den İbn Sînâ'ya uzanan «makam‑etki» literatürü, müziği bir «ilaç» olarak görür; musikâr bu ilacın ses taşıyıcısıdır. Bu uygulama, modern müzikoterapinin tarihsel atasıdır ve İslam tıbbının yalnız bedeni değil, ruhu da tedavi eden bütüncül yaklaşımının simgesidir. Koleksiyonda musikâr, tıp ile sanatın en zarif buluşmasını temsil eder; şifa, burada ses dalgalarıyla gelir."}, {"id": "physical-asset-221", "slug": "askeri-teknoloji-fiziksel-221-cekme-guclu-mancinik-traction-trebuchet", "name": "Çekme Güçlü Mancınık (Traction Trebuchet)", "category": "Askeri Teknoloji", "creator": "İslam kuşatma mühendisliği", "has_img": 0, "desc": "Karşıt ağırlıklı mancınık (trebuchet), orta çağın en güçlü kuşatma makinesi ve küresel teknoloji tarihinin en iyi belgelenmiş aktarım vakalarından biridir. Arapça terminoloji (mancanik, ziyar, kavs ez-ziyar) ve teknik literatür (K. ed-Debbabat ve'l-Menacnikat), İslam dünyasının mancınığı sistematik biçimde analiz ettiğini gösterir; Cahen'in araştırmaları, ziyar yaylı silahın Moğollardan değil, en geç Selahaddin döneminden itibaren bilindiğini kanıtlar. Haçlı seferleri, trebuchet'nin Avrupa'ya geçişinde köprü olmuş; karşıt ağırlık ilkesi, «yerçekimi motoru»nun atası sayılmıştır. Mancınık, koleksiyonda kuşatma çağını temsil eder: barutlu silahlarla birlikte askeri teknolojinin iki büyük faslını oluşturur. Dev ahşap kolları ve taş gülleleri, orta çağın «korku mimarisi»nin parçasıydı; aynı zamanda mühendisliğin prestij nesnesiydi."}, {"id": "physical-asset-222", "slug": "askeri-tekno on büyük ürünleridir."}, {"id": "physical-asset-35-1", "slug": "askeri-teknoloji-fiziksel-35-asan-er-ramm-in-cilgin-roketi-su-ustunde-giden-torpido", "name": "Hasan er-Rammah'ın \"Çılgın Roketi\" / Su Üstünde Giden Torpido", "category": "Askeri Teknoloji", "creator": "Hasan er-Rammah", "has_img": 0, "desc": "Hasan er-Rammah'ın el-Furusiyye'sinde tarif edilen «hareket eden ve yanan yumurta», kendinden tahrikli torpidonun bilinen en erken örneği sayılır. Barut ve neft dolu bakır gövde, roket itkisiyle su yüzeyinde kendi kendine ilerler. Bu düzenek, modern torpido kavramını yaklaşık yedi yüzyıl önceleyen bir askeri deha ürünüdür ve İslam dünyasının ateşli silahlar tarihindeki öncü rolünün en çarpıcı kanıtıdır."}, {"id": "physical-asset-132", "slug": "askeri-teknoloji-fiziksel-132-za-fa-sahmerdan-kocbasli-zirhli-araba", "name": "Savaş Makineleri (grup)", "category": "Askeri Teknoloji", "creator": "Giovanni Fontana / Arap öncül", "has_img": 0, "desc": "Giovanni Fontana'nın tasvir ettiği sürülebilir şahmerdan koçbaşı, üzerindeki «alphasat» (ez-zahhâfa) Arapça yazıtıyla, bu aletin Arap geleneğinden devralındığının doğrudan kanıtıdır. Zırhlı arabalar içinde surlara yanaştırılan koçbaşları, İslam kuşatma sanatının temel araçlarındandı. Bu çizim, Avrupa askerî mühendisliğinin İslam dünyasından beslenişinin belgesidir."}, {"id": "physical-asset-1-1", "slug": "tesviye-ve-geometri-fiziksel-1-paralaks-cetveli-parallactic-ruler-tycho-brahe-instrument-iv", "name": "Genişletilmiş Paralaks Cetveli (Tycho)", "category": "Tesviye ve Geometri", "creator": "Tycho Brahe", "has_img": 0, "desc": "Tycho Brahe'nin İstanbul ve Merâğa rasathanelerindeki paralaks cetvellerinin Avrupa'daki ardılı."}, {"id": "physical-asset-2-1", "slug": "astronomi-fiziksel-2-duvar-kadrani-mural-quadrant-tycho-brahe-instrument-vi", "name": "Ahşap Büyük Kadran (Tycho)", "category": "Astronomi", "creator": "Tycho Brahe", "has_img": 0, "desc": "Takiyyeddîn'in İstanbul Rasathanesi için tasarladığı V. alet, tik ağacınd mii", "category": "Mimari", "creator": "Mimar Sinan", "has_img": 0, "desc": "Mimar Sinan'ın 'ustalık eserim'; tek bir devasa kubbe altında toplanan, sekiz fil ayağına oturan kusursuz geometrik ve statik başyapıt."}, {"id": "physical-asset-44-1", "slug": "fizik-ve-teknik-fiziksel-44-sultan-ahmed-camii-i-stanbul-the-sultan-ahmed-mosque-blue-mosque", "name": "İnşa / Mimari Teknik Aletleri", "category": "Mimari", "creator": "Sedefkâr Mehmed Ağa", "has_img": 0, "desc": "Mimari bölümündeki inşa teknikleri ve yardımcı aletler (kubbe, mukarnas kalıpları vb.)."}, {"id": "physical-asset-45-2", "slug": "fizik-ve-teknik-fiziksel-45-osmanli-terazisi-ottoman-balance", "name": "Osmanlı Terazisi (Ottoman Balance)", "category": "Fizik ve Teknik", "creator": "Bizans atölyesi", "has_img": 0, "desc": "Ad 'Osmanlı' fakat mevcutYapimci 'Bizans atölyesi'; insan teyidi şart (Dumbarton Oaks bizans terazisi olabilir)."}, {"id": "physical-asset-46-2", "slug": "fizik-ve-teknik-fiziksel-46-oylum-hacim-olcekleri-measures-of-capacity", "name": "Oylum (Hacim) Ölçekleri", "category": "Fizik ve Teknik", "creator": "İslam metroloji geleneği", "has_img": 0, "desc": "Antik ağırlıklar, metrolojinin (ölçüm bilimi) en mütevazı ama en bilgilendirici nesneleridir: her taş ve metal parçası, ticaretin, verginin ve güvenin standardının bir fosilidir. İslam dünyası, antik ağırlık sistemlerini (mithkal, dirhem, ukıyye) devralıp standartlaştırmış; muhtesib teşkilatı çarşıdaki ağırlıkları denetleyerek «ölçü ve tartı»yı adaletin simgesi kılmıştır. Fustat (Mısır) ve Nişâpür buluntuları, bu standardizasyonun coğrafi genişliğini gösterir. Antik ağırlıklar, koleksiyonda «Antik Objeler» bölümünü terazi bilimi (mîzân, karastûn, mîzân el-hikme) ile bağlar: küçük bir taş parçası, bin yıllık ekonomik tarihin ve bilimsel hassasiyetin taşıyıcısıdır. Müze vitrininde sessiz duran bu nesneler, aslında uygarlığın görünmez altyapısının —güvenin— maddi kanıtıdır."}, {"id": "physical-asset-47-2", "slug": "tip-fiziksel-47-makas-bicimli-kaldirac-lever-in-form-of-scissors", "name": "Funyalı Seramik Bombalar", "category": "Tıp", "creator": "İslam mühendislik geleneği", "has_img": 0, "desc": "Otomatlar ve saatler grubu, İslam «makine kültürü»nün en göz alıcı ve en felsefi cephesidir. Benû Mûsâ'nın 9. yüzyıldaki Hileler Kitabı, programlanabilir müzik otomatları ve kendi kendine yanan lambalarla «yapay hayat»ın ilk tariflerini verir. el‑Cezerî'nin 1206'daki el‑Câmi'si, kâtipli su saatleri, şifreli kilitler ve otomatik hizmetkârlarla saray hayatını mekanikleştirir. el‑Murâdî'nin Endülüs'teki Sırlar Kitabı, yılan oynatıcısı figürleriyle robotiğin erken örneklerini sunar. Bu otomatlar, yalnız eğlence değil, aynı zamanda hidrostatik, dişli mekaniği ve sibernetiğin laboratuvarlarıydı. Koleksiyonda bu grup, insanın doğayı taklit etme (mimesis) arzusunun en zarif ürünleridir; orta çağın robotları, modern otomasyonun atasıdır."}, {"id": "physical-asset-48-2", "slug": "fizik-ve-teknik-fiziksel-48-isi-etkisiyle-su-kaldirmak-i-cin-duzenek-apparatus-for-lifting-water-b", "name": "Seramik Bombalar (fitilli)", "category": "Fizik ve Teknik", "creator": "Takiyyeddîn er-Râsıd", "has_img": 0, "desc": "Takiyyeddîn'in buharla çalışan döner şiş çeviricisi, buhar gücünün mekanik harekete dönüştürüldüğü bilinen en erken düzeneklerden biridir: kazanda kaynayan suyun buharı, bir lüleden çıkarak kanatçıklı bir çarkı döndürür; ısıtma spirali ve durdurma supabı, sistemi kontrol edilebilir kılar. Bu tasarım, Avrupa'da Branca (1629) ve Papin'den on yıllar önce, buhar türbini ilkesini pratik bir mutfak otomasyonuna uygulamıştır. Model, kazanı ve supabıyla birlikte yeniden inşa edilmiş; pirinç‑bakır işçiliği Osmanlı metal sanatının inceliğini sergilemiştir. Koleksiyonun «vitrin» parçalarından olan bu düzenek, sanayi devriminin köklerinin İslam mühendisliğinde olduğunu anlatan en çarpıcı nesnedir; buhar çağı, saray mutfağında başlamıştır."}, {"id": "physical-asset-57-2", "slug": "askeri-teknoloji-fiziksel-57-arap-denge-agirlikli-man       <input type="checkbox" ${selectedYeni === item.id ? 'checked' : ''} ${matched ? 'disabled' : ''}>
      <div class="info">
        <div class="meta">${item.id} · ${item.creator}</div>
        <h3>${item.title}</h3>
        <p>${item.uzun || item.kisa}</p>
        ${matched ? '<div class="badge-matched">✓ eşleşti</div>' : ''}
      </div>`;
    if(!matched){
      div.onclick = () => { selectedYeni = (selectedYeni === item.id ? null : item.id); renderYeni(); updateMatchBar(); };
    }
    wrap.appendChild(div);
  });
}

function renderTam(){
  const q = document.getElementById('search-tam').value.trim().toLowerCase();
  const wrap = document.getElementById('list-tam');
  wrap.innerHTML = '';
  let shown = 0;
  for(const item of TAM){
    if(q && !(item.name.toLowerCase().includes(q) || item.creator.toLowerCase().includes(q) || item.category.toLowerCase().includes(q) || item.id.toLowerCase().includes(q) || item.slug.toLowerCase().includes(q) || (item.desc && item.desc.toLowerCase().includes(q)))) continue;
    shown++;
    if(shown > 150) continue; // performans icin sinir, arama daraltinca daha fazlasi gorunur
    const matched = isMatched(item.id, 'tam');
    const isSel = selectedTam.has(item.id);
    const div = document.createElement('div');
    div.className = 'card' + (matched ? ' matched' : '') + (isSel ? ' selected' : '');
    div.innerHTML = `
      <input type="checkbox" ${isSel ? 'checked' : ''} ${matched ? 'disabled' : ''}>
      <div class="info">
        <div class="meta">${item.category} · ${item.creator}${item.has_img ? ' · 📷' : ''}</div>
        <h3>${item.name}</h3>
        ${item.desc ? `<p>${item.desc}</p>` : ''}
        ${matched ? '<div class="badge-matched">✓ eşleşti</div>' : ''}
      </div>`;
    if(!matched){
      div.onclick = () => {
        if(selectedTam.has(item.id)) selectedTam.delete(item.id); else selectedTam.add(item.id);
        renderTam(); updateMatchBar();
      };
    }
    wrap.appendChild(div);
  }
  if(shown > 150){
    const note = document.createElement('p');
    note.className = 'empty-note';
    note.textContent = `${shown} sonuç bulundu, ilk 150 gösteriliyor — daraltmak için arama kutusunu kullan.`;
    wrap.prepend(note);
  }
}

function updateMatchBar(){
  const bar = document.getElementById('matchBar');
  const text = document.getElementById('matchBarText');
  if(selectedYeni && selectedTam.size > 0){
    const y = YENI.find(x=>x.id===selectedYeni);
    const names = [...selectedTam].map(id => TAM.find(x=>x.id===id).name);
    const label = selectedTam.size === 1 ? names[0] : `${selectedTam.size} kayıt: ${names.join(', ')}`;
    text.innerHTML = `<b>${y.title}</b> (${y.id}) &nbsp;↔&nbsp; <b>${label}</b>`;
    bar.classList.add('active');
  } else {
    bar.classList.remove('active');
  }
}

function clearSelection(){
  selectedYeni = null; selectedTam = new Set();
  renderYeni(); renderTam(); updateMatchBar();
}

function confirmMatch(){
  if(!selectedYeni || selectedTam.size === 0) return;
  const y = YENI.find(x=>x.id===selectedYeni);
  selectedTam.forEach(tamId => {
    const t = TAM.find(x=>x.id===tamId);
    matches.push({
      yeni_id: y.id, yeni_title: y.title, yeni_slug: y.slug,
      tam_id: t.id, tam_name: t.name, tam_slug: t.slug, tam_category: t.category
    });
  });
  saveMatches();
  selectedYeni = null; selectedTam = new Set();
  renderAll();
}

function removeMatch(idx){
  matches.splice(idx, 1);
  saveMatches();
  renderAll();
}

function renderMatchesTable(){
  const wrap = document.getElementById('matches-table-wrap');
  document.getElementById('match-count').textContent = matches.length;
  if(matches.length === 0){
    wrap.innerHTML = '<p class="empty-note">Henüz eşleştirme yapılmadı.</p>';
    return;
  }
  let rows = matches.map((m, i) => `
    <tr>
      <td>${m.yeni_id}</td>
      <td>${m.yeni_title}</td>
      <td style="text-align:center">↔</td>
      <td>${m.tam_id}</td>
      <td>${m.tam_name}</td>
      <td>${m.tam_category}</td>
      <td><button onclick="removeMatch(${i})">Geri al</button></td>
    </tr>`).join('');
  wrap.innerHTML = `<table class="matches-table"><thead><tr>
    <th>Yeni ID</th><th>Yeni Başlık</th><th></th><th>Gerçek ID</th><th>Gerçek Kayıt</th><th>Kategori</th><th></th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

function renderAll(){
  renderYeni(); renderTam(); updateMatchBar(); renderMatchesTable();
  document.getElementById('stat-yeni').textContent = (YENI.length - matches.length) + ' / ' + YENI.length + ' yeni kayıt kaldı';
  document.getElementById('stat-matched').textContent = matches.length + ' eşleşme yapıldı';
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(matches, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'hetega_eslestirmeler.json';
  a.click();
}

function copyJSON(){
  navigator.clipboard.writeText(JSON.stringify(matches, null, 2)).then(()=>alert('Kopyalandı! Bunu Claude'+String.fromCharCode(39)+'a yapıştırabilirsin.'));
}

function resetAll(){
  if(!confirm('Tüm eşleştirmeler silinsin mi?')) return;
  matches = [];
  saveMatches();
  renderAll();
}

renderAll();
</script>
</body>
</html>
