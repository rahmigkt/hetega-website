ik iğne, açık denizlerin sert dalgalarında kullanılamaz derecede hantaldı. İslam mühendisleri, iğneyi ve üzerine monte edilen karton diski, iç içe geçen pirinç halkalar (kardano süspansiyonu) içine asarak, gemi ne kadar yalpalarlarsa yalpalasın pusulanın yerçekimi sayesinde daima yatay kalmasını sağladılar. İbn Mâcid ve Süleyman el-Mehrî'nin metinlerinde detaylandırılan bu pusulalar, genellikle 'balık' (semeke) formunda yontulmuş manyetik iğneler kullanırdı. Bu alet, sadece yönü göstermekle kalmaz, aynı zamanda kaptanın rüzgarın geliş açısını (bolina) ve okyanus akıntılarının sapmasını hesaplamasına olanak tanıyan bir 'seyir bilgisayarı' işlevi görürdü. Vasco da Gama'nın Hint Okyanusu'nu geçerken kullandığı pusulalar, doğrudan bu İslam-Arap teknolojisinin kopyasıydı."}, {"id": "a169", "slug": "yeni-a169-mizan-el-hikme", "title": "Mîzân el-Hikme (Hidrostatik Terazi)", "creator": "Abdurrahmân el-Hâzinî ve el-İsfizârî", "kisa": "Beş kefeli, kayar sürgülü ve hidrostatik prensiplere dayalı; metallerin alaşım oranlarını ve taşların saflığını suyun kaldırma kuvvetiyle ölçen devrim niteliğinde analitik terazi.", "uzun": "Mîzân el-Hikme (Bilgelik Terazisi), İslam fizik ve metroloji tarihinin en karmaşık ve en hassas cihazıdır. 12. yüzyılda Selçuklu saraylarında darphane ve kuyumculuk işlemleri, altın-gümüş alaşımlarının (örneğin sikkelerin ayarının) kesin olarak tespit edilmesini gerektiriyordu. el-Hâzinî, Arşimed prensibini kullanarak beş ayrı kefeye sahip, üzerinde kayar sürgüler (ağırlıklar) bulunan devasa bir terazi tasarladı. Maddenin önce havadaki, ardından suyun içindeki ağırlığı bu teraziyle ölçülüyor; terazi kolu üzerindeki hassas bölüntüler ve el-Hâzinî'nin geliştirdiği 's = 10000 : a' formülü kullanılarak maddenin özgül ağırlığı saniyeler içinde okunuyordu. 'Hikme' (bilgelik) kelimesi, bu terazinin yalnızca maddi nesneleri değil, doğanın gizli yoğunluk yasalarını da ortaya çıkardığı inancını yansıtır. Bu terazi, Galileo'nun 1586'da tasarlayacağı 'La Bilancetta'nın doğrudan tarihsel ve mekanik öncülüdür."}, {"id": "a173", "slug": "yeni-a173-eczacilik-havani", "title": "Eczacılık Havanı ve Tokmağı (Hâvün)", "creator": "İslam Eczacılık ve Farmakoloji Geleneği", "kisa": "Minerallerin, kurutulmuş otların ve baharatların toz haline getirilip standart dozlarda (mithkal/dirhem) tartılarak ilaç (macun, şurup) hazırlanması için kullanılan ağır pirinç veya bazalt havanlar.", "uzun": "Eczacılık Havanı (Hâvün), İslam dünyasında eczacılığın (saydalaniyye) tıptan bağımsız, profesyonel bir meslek olarak doğuşunun fiziksel sembolüdür. Bağdat, Kahire ve Endülüs'teki 'sûk el-attârin' (kokucular/eczacılar çarşısı), bu havanların ritmik sesleriyle yankılanırdı. er-Râzî ve İbn Sînâ, ilaçların (özellikle zehirli olabilecek minerallerin ve ağır metallerin) vücuda eşit dağılabilmesi için 'mikron' seviyesinde toz haline getirilmesini şart koşmuşlardır. Bu havanlar, sıradan mutfak havanlarından farklı olarak, asitli maddelere (örneğin sirke veya limon tuzuna) dayanıklı özel pirinç alaşımlarından veya sert bazalt taşından oyulurdu. Tokmakların (deste) sapı, eczacının saatlerce süren öğütme işlemi sırasında bileğini sakatlamaması için ergonomik olarak kalınlaştırılır, tabanı ise havanın içine tam oturacak şekilde küresel bir geometriye sahip olurdu. Havanın kenarları, tozun dışarı saçılmasını önlemek için içe doğru eğimliydi. Bu havanlarda ezilen tozlar, ardından 'mîzân' (terazi) ile hassas bir şekilde tartılır ve 'mithkal' (yaklaşık 4.5 gram) birimlerinde hastalara reçete edilirdi."}, {"id": "a174", "slug": "yeni-a174-eczacilik-terazisi", "title": "Eczacılık ve Kuyumcu Terazisi (Mîzân)", "creator": "İslam Metroloji ve Muhtesib Geleneği", "kisa": "Eczacılıkta ilaç dozajlarını ve kuyumculukta alaşım oranlarını hassas bir şekilde tartmak için kullanılan; muhtesib tarafından mühürlenmiş pirinç teraziler ve standart ağırlık taşları.", "uzun": "Eczacılık Terazisi ve Ağırlıklar (Mîzân), İslam medeniyetinin bilimi, ticareti ve kamu sağlığını tek bir noktada birleştirdiği en kritik araçtır. İslam eczacılığında (saydalaniyye) bitkisel özlerin yanı sıra cıva, arsenik, antimon ve bakır gibi ağır metaller/zehirler de ilaç olarak kullanılırdı. Bu maddelerin 'mithkal' (yaklaşık 4.5 gram) veya 'habbe' (bir arpa tanesi ağırlığı) gibi mikron düzeyindeki standartlarla tartılması hayati önem taşıyordu; bir miligramlık sapma hastayı iyileştirmek yerine zehirleyebilirdi. Bu nedenle İslam devletlerinde 'muhtesib' (çarşı denetçisi) adı verilen bir kamu görevlisi, eczanelerin ve kuyumcuların terazilerini haftalık olarak denetler, kalibrasyonları bozuk terazileri kırar ve tartılan ağırlık taşlarını (dirhem) devlet mührüyle mühürlerdi. Arkeolojik kazılarda (örneğin Nişâpür ve Fustat) bulunan bronz, cam ve akik taşından oyma ağırlıklar, üzerlerindeki 'Allah', 'Bereket' veya halifenin adını taşıyan yazıtlarla, ölçmenin ve adaletin kutsal bir eylem olarak görüldüğünü kanıtlar. Bu terazi sistemi, modern eczacılık terazilerinin ve uluslararası metroloji enstitülerinin manevi atasıdır."}, {"id": "a175", "slug": "yeni-a175-yapay-mucevher-firinlari", "title": "Yapay Mücevher İmali Fırınları", "creator": "Câbir b. Hayyân (Geber) Geleneği", "kisa": "Doğal değerli taşları (yakut, zümrüt) ve renkli camları taklit etmek için; özel metal oksitlerin ve cam tozlarının günlerce kontrollü ısıda (tavlama) kristalleştirildiği simyasal fırınlar.", "uzun": "Yapay Mücevher İmali Fırınları, İslam simyasının 'doğayı taklit etme' (mimesis) arzusunun en estetik ve en teknolojik ürünüdür. Câbir b. Hayyân ve onun Latince 'Geber' külliyatını takip eden simyacılar, minerallerin yerin derinlikindeki ısı ve basınç altında oluştuğunu teorize etmişlerdi. Bu süreci laboratuvarda hızlandırmak için, bakır oksit (zümrüt yeşili), kobalt (mavi) veya demir (yakut kırmızısı) içeren cam ve silika tozlarını, özel astarlı potalar içinde günlerce sabit bir sıcaklıkta (tavlama/annealing) tutan fırınlar tasarladılar. Bu fırınlar, ısının homojen bir şekilde dağılmasını sağlayan karmaşık hava kanallarına sahipti. Soğutma süreci (yavaş soğutma) kristallerin çatlamasını önlemek için hayati önem taşıyordu ve bu 'termal şok' kontrolü, İslam metalürjisinin en ileri sırlarından biriydi. Koleksiyondaki bu fırın modelleri, kimyanın sadece maddeyi dönüştürmekle kalmayıp, doğanın estetiğini ve optik kusursuzluğunu laboratuvar ortamında yeniden yaratabileceğine dair erken bir inancın belgesidir."}, {"id": "a178", "slug": "yeni-a178-gul-suyu-damitim", "title": "Gül Suyu Damıtım Düzeneği", "creator": "Şemseddîn ed-Dımeşkî ve İslam Eczacılık Geleneği", "kisa": "Şam'ın meşhur gül sularını ve tıbbi esansları endüstriyel ölçekte üretmek için kullanılan; çoklu cam balonlar, boynuzlu imbikler ve külhanlardan oluşan devasa damıtım fırını.", "uzun": "Gül Suyu Damıtım Düzeneği (ez-Zücâc el-Hikmî / Bilge Camı), İslam kimyasının tıp, eczacılık ve ticaret kesişiminde yarattığı en zarif endüstriyel tesistir. Orta Çağ'da 'gül suyu' sadece bir kozmetik değil, aynı zamanda kalp çarpıntısını yatıştıran, bayılmaları açan ve yaraları temizleyen stratejik bir tıbbi malzemeydi. Şam ve Endülüs'teki eczacılar, bu esansı tonlarca üretmek için 'ez-Zücâc el-Hikmî' adını verdikleri özel cam fırınlar tasarladılar. Bu düzeneğin en çarpıcı özelliği, 'boynuzlu imbikler'di. Külhanın ortasından yukarı doğru yükselen ısı, etrafına dizilmiş onlarca cam balonun (imbiklerin) içindeki gül yapraklarını buharlaştırıyor; buhar, imbiklerin 'gaga' (rostrum) adı verilen uzun boyunlarından geçerek soğuk alıcı kaplarda saf esans olarak yoğuşuyordu. Şemseddîn ed-Dımeşkî, bu cam düzeneklerin saydamlığı sayesinde damıtma sürecinin (rengin ve sıvı seviyesinin) ilk kez gözle izlenip kontrol edilebildiğini yazar. Bu 'çoklu paralel damıtma' sistemi, günümüz modern parfümeri ve petrokimya endüstrisindeki 'fraksiyonel distilasyon' kolonlarının felsefi ve mekanik atasıdır."}, {"id": "a184", "slug": "yeni-a184-sakiye-naura", "title": "Sâkiye (Kovalı Su Çarkı) ve Nâ'ûra", "creator": "İslam Mühendislik ve Tarım Geleneği", "kisa": "Hayvan veya nehir gücüyle dönen, üzerindeki toprak veya ahşap kovalarla suyu kademeli olarak onlarca metre yükseğe taşıyan, İslam 'Yeşil Devrimi'nin belkemiği hidrolik pompa.", "uzun": "Sâkiye ve Nâ'ûra, İslam medeniyetinin 'su uygarlığı' olmasının mühendislik omurgasıdır. Sâkiye, genellikle öküz veya at gibi koşum hayvanlarının döndürdüğü yatay bir dişli çarkın, dikey bir kovalı çarkı hareket ettirmesi prensibiyle çalışır. Nâ'ûra ise nehirlerin akıntı gücünü kullanarak kendi kendine dönen devasa su dolaplarıdır (örneğin Hama'daki meşhur dolaplar). İslam mühendisleri (Benû Mûsâ ve el-Cezerî), bu çarkların akslarına segment dişliler ve krank mekanizmaları ekleyerek verimliliği artırmış, suyun kesintisiz olarak tarlaların en yüksek teraslarına çıkmasını sağlamışlardır. Bu hidrolik altyapı olmadan, İslam dünyasının Endülüs'ten Hindistan'a kadar yayılan 'Yeşil Devrimi' (şeker kamışı, pamuk, pirinç ve turunçgil gibi yüksek su ihtiyacı olan endüstriyel bitkilerin tarımı) asla gerçekleşemezdi. Bu makineler, Rönesans Avrupası'nın madencilik ve drenaj mühendisliğinin de doğrudan ilham kaynağı olmuştur."}, {"id": "a188", "slug": "yeni-a188-balistik-tesviye-araci", "title": "Balistik Tesviye Aracı (Mîzân el-ard)", "creator": "Murdâ b. Alî et-Tarsûsî ve ez-Zerdkâş", "kisa": "Karşıt ağırlıklı mancınıkların ve topların namlu/kol açısını hassasiyetle ayarlayarak, atışın tam olarak hedefe (belirli bir mesafeye) düşmesini sağlayan geometrik tesviye ve açı ölçer alet.", "uzun": "Balistik Tesviye Aracı (Mîzân el-ard), İslam savaş makinelerinin yalnızca kaba kuvvet araçları değil, aynı zamanda birer 'laboratuvar' olduğunun en net kanıtıdır. Bir mancınığın veya erken dönem topun fırlattığı merminin nereye düşeceği, kolun bırakılma açısına (veya namlunun elevasyonuna) bağlıydı. Tarsûsî ve ez-Zerdkâş, bu açıyı göz kararı değil, matematiksel olarak ayarlamak için mancınığın gövdesine yerleştirilen 'mîzân el-ard' (yer terazisi/tesviye aracı) adlı bir düzenek geliştirdiler. Bu alet, üzerinde dereceli bölmeler bulunan bir kadran ve ortasından sarkan bir şakülden (çekül) oluşuyordu. Kumandan, hedefin mesafesine göre balistik cetvellerden (skala) gerekli açıyı okuyor ve mancınıkçıların makineyi tam o açıya sabitlemesini sağlıyordu. Bu küçük pirinç veya ahşap düzenek, kuşatma kampının geometrinin uygulandığı bir okul olduğunun; savaş ile bilim arasındaki diyaloğun sessiz ama kusursuz tanığıdır. Modern topçuluk bilimindeki 'klinometre' ve 'nişangâh' mantığının Orta Çağ'daki atasıdır."}, {"id": "a189", "slug": "yeni-a189-karsi-agirlikli-mancinik", "title": "Karşı Ağırlıklı Mancınık (Trebuşet)", "creator": "İslam Kuşatma Mühendisliği (İbn Erenbuğâ ez-Zerdkâş)", "kisa": "Kısa koldaki karşı ağırlığın düşme gücüyle uzun koldaki gülleyi fırlatan, insan gücüne ihtiyaç duymayan devasa kuşatma makinesi.", "uzun": "Karşı Ağırlıklı Mancınık (Trebuşet), İslam askerî mühendisliğinin balistik alanındaki en büyük devrimidir. Antik Çağ'da ve erken İslam döneminde kullanılan mancınıklar, onlarca askerin aynı anda ipleri çekmesiyle (traction) çalışırdı; bu da insan gücünün senkronizasyon sorunları nedeniyle atış hızını ve isabet oranını düşürüyordu. İslam mühendisleri (özellikle ez-Zerdkâş ve Tarsûsî geleneği), kısa kaldıraç koluna insan gücü yerine devasa taşlar veya demir kütlelerden oluşan bir 'karşı ağırlık' (counterweight) kutusu ekleyerek bu sorunu çözmüştür. Karşı ağırlığın yerçekimi ivmesiyle düşmesi, uzun koldaki sapanı muazzam bir kinetik enerjiyle fırlatıyordu. Bu sayede hem manevra mürettebatı azaltılmış hem de güllenin başlangıç hızı ve menzili kritik ölçüde artırılmıştır. İslam kaynakları, bu makinelerin 'Arap', 'Türk/Fars' ve 'Frenk/Bizans' varyantlarını ayrıntıyla tarif eder. 1291 yılındaki Akka (Accon) kuşatmasında Memlük ordusunun kullandığı bu devasa makineler, Haçlıların Doğu'daki varlığının sonunu getiren teknik faktörlerden biri olmuştur. Avrupa'ya aktarılan bu teknoloji, Orta Çağ'ın sonlarına kadar kale surlarını yıkan en etkili silah olarak kalmıştır."}, {"id": "a190", "slug": "yeni-a190-seramik-bomba", "title": "Seramik Bomba (İkrîh Borucuklu)", "creator": "İslam Askerî Mühendislik Geleneği", "kisa": "İçine barut, neft veya kimyasal maddeler doldurulan, fitil (ikrîh) ile ateşlenip fırlatılan, parça tesirli ve yakıcı erken dönem el bombası.", "uzun": "Seramik Bomba (İkrîh Borucuklu), İslam askerî mühendisliğinin piroteknik ve kimya alanındaki en ölümcül buluşlarından biridir. 7./13. yüzyılda Eyyûbî ve Memlük orduları, Haçlı kalelerini kuşatırken veya Moğol süvarilerine karşı savunma yaparken bu el bombalarını yaygın olarak kullanmışlardır. Bomba, el bombası formunda özel olarak tasarlanmış, kalın cidarlı seramik bir kaptan oluşurdu. İçine güherçile, kükürt, kömür karışımı (barut), yanıcı neft (petrol) ve düşmanda panik/boğulma yaratmak için sönmemiş kireç veya zehirli otlar doldurulurdu. Kabın ağzında 'ikrîh' adı verilen bir fitil borusu bulunur; bu fitil ateşlendikten sonra bomba mancınıkla veya elle düşman saflarına fırlatılırdı. Seramik kap, hedefe çarptığında parçalanarak hem şarapnel etkisi yaratır hem de içindeki yakıcı/kimyasal maddeleri etrafa saçıyordu. Carsten Niebuhr ve modern arkeologların Kahire ve Şam kazılarında bulduğu bu seramik bombalar, üzerlerindeki dekorasyonlar nedeniyle uzun yıllar 'parfüm şişesi' veya 'kum saati' sanılmış; ancak içlerindeki kimyasal kalıntıların analizi, bunların dünyanın ilk el bombaları olduğunu kanıtlamıştır. Bu teknoloji, kimyasal ve patlayıcı silahların savaş tarihine girişinin en somut arkeolojik belgesidir."}, {"id": "a192", "slug": "yeni-a192-erken-top-atesli-silah", "title": "Erken Top ve Ateşli Silah Tasvirleri", "creator": "İslam Askerî Mühendisliği", "kisa": "14. yüzyıl İslam yazmalarında (örneğin Leningrad C 686) tasvir edilen; barutun itki gücü olarak kullanıldığı, namlulu erken top ve ateşli silah çizimleri.", "uzun": "Erken Top ve Ateşli Silah Tasvirleri, savaş tarihinin en büyük kırılma noktasının İslam dünyasındaki yankılarını belgeleyen eşsiz görsel kanıtlardır. Hasan er-Rammâh'ın 13. yüzyılda saflaştırdığı barut, başlangıçta seramik bombalar (kavarır) ve roketlerde kullanılmıştı. Ancak 14. yüzyıla ait 'el-Mahzûr' ve Leningrad C 686 gibi İslam yazmalarında, barutun kapalı bir metal (bronz veya demir) namlu içinde yakılarak, genişleyen gazların basıncıyla gülle fırlatan 'top' tasvirleri ortaya çıkar. Bu çizimler, ateşli silahların sadece Çin'den gelen bir 'havai fişek' olmadığını, İslam metalurjisinin döküm teknikleri ve ballistik hesaplarıyla birleşerek nasıl ölümcül bir 'kuşatma ve sahra silahına' dönüştüğünü gösterir. Avrupa'daki ilk top tasvirlerinden (örneğin Walter de Milemete'nin 1326 çizimi) hemen öncesine veya eşzamanlılığına denk gelen bu İslam belgeleri, barut teknolojisinin küresel yayılımındaki 'kayıp halkaları' doldurmaktadır."}, {"id": "a194", "slug": "yeni-a194-perpetuum-mobile", "title": "Perpetuum Mobile (Sürekli Hareket Çarkları)", "creator": "İslam Mekanik Geleneği", "kisa": "Çarkın içine yerleştirilen cıva hazneleri veya kayan ağırlıklar sayesinde, ağırlık merkezinin asla dengeye gelmeyeceği varsayılarak tasarlanmış 'kendi kendine sonsuza dek dönen' mekanik çarklar.", "uzun": "Perpetuum Mobile (Sürekli Hareket), İslam ve Orta Çağ mühendisliğinin doğanın en derin sırlarına (enerji ve hareket) duyduğu tutkunun mekanik bir rüyasıdır. İslam mekanikçileri (ve onların çizimlerinden etkilenen Avrupalı mimar Villard de Honnecourt), bir çarkın içine cıva dolu bölmeler veya mafsallı ağırlıklar yerleştirerek, çark döndükçe ağırlık merkezinin sürekli olarak bir tarafa kayacağını ve bu dengesizliğin çarkı sonsuza dek döndüreceğini hayal etmişlerdir. Termodinamiğin ikinci yasası (sürtünme ve enerji kaybı) henüz bilinmediği için, bu çarklar kağıt üzerinde kusursuz çalışıyor, ancak pratikte duruyorlardı. Bu 'başarısız' denemeler, aslında mühendislik tarihinin en değerli arayışlarıdır; çünkü bu çarkları inşa etmeye çalışırken sürtünme, dişli oranları, ağırlık dağılımı ve akışkanlar mekaniği üzerine devasa bir deneysel birikim oluşmuştur. Bu sürekli hareket arayışı, yüzyıllar sonra saatçilikteki 'zemberek' (yay) ve mekanik enerji depolama sistemlerinin doğmasına zemin hazırlamıştır."}, {"id": "a195", "slug": "yeni-a195-areometre", "title": "Areometre / Fiziksel Terazi", "creator": "İslam Fizik ve Metroloji Geleneği", "kisa": "Sıvıların yoğunluğunu ve metallerin saflığını ölçmek için kullanılan, cam silindir ve kalibre edilmiş daldırma cisimlerinden oluşan erken dönem areometre / piknometre.", "uzun": "Areometre (Mîzân et-Tabîî / Fiziksel Terazi), İslam fizikçilerinin Arşimed'in hidrostatik prensiplerini laboratuvar tezgâhına indirdiği anı temsil eder. Ebû Bekir er-Râzî, kimyasal çözeltilerin, şurupların ve asitlerin yoğunluklarını ölçmek için içi sıvıyla dolu bir cam silindir ve bu silindire batırıldığında sıvının yoğunluğuna göre farklı derinliklerde yüzen/batan kalibre edilmiş ağırlıklar (veya cam şişeler) tasarlamıştır. Bu alet, terazinin kefine gerek kalmadan, sadece 'kaldırma kuvveti' farkı kullanılarak sıvının özgül ağırlığını anında okumayı sağlıyordu. el-Bîrûnî ise bu prensibi genişleterek, değerli taşların (yakut, zümrüt) ve metallerin saflığını test eden hassas piknometreler geliştirmiştir. Bu cam areometreler, 17. yüzyılda Galileo'nun 'bilancetta'sına ve modern petrol/kimya endüstrisinin yoğunluk ölçerlerine giden yolun ilk ve en zarif adımıdır. İslam eczacılığında ilaçların standart dozajda üretilmesi, büyük ölçüde bu 'fiziksel terazi' sayesinde mümkün olmuştur."}, {"id": "a197", "slug": "yeni-a197-arsimed-vidasi", "title": "Arşimed Vidası (Su Burgusu)", "creator": "İslam Sulama ve Mekanik Mühendisliği Geleneği", "kisa": "Suyu yerçekimine karşı helezoni (sarmal) bir boru içinde yukarı taşıyan, İslam'ın 'Tarım Devrimi'nin belkemiği hidrolik pompa.", "uzun": "Arşimed Vidası (Su Burgusu), Antik Yunan'da gemilerdeki suyu tahliye etmek için icat edilmiş olsa da, onu devasa bir medeniyet inşasının ve 'İslam Yeşil Devrimi'nin motoruna dönüştürenler İslam mühendisleridir. İslam dünyası, 8. yüzyıldan itibaren bu helezoni vidayı, Dicle, Fırat, Nil ve Endülüs nehirlerinde hayvan veya nehir akıntısı gücüyle döndürülen devasa sulama istasyonlarının merkezine yerleştirmiştir. el-Cezerî'nin 1206 tarihli eserinde ve Takiyyeddîn'in 16. yüzyıl mekanik kitaplarında tarif edilen bu vidalı pompalar, suyu kademeli olarak onlarca metre yükseğe çıkararak çöl ve yarı-çöl bölgelerde 'teraslı tarım' ve 'şeker kamışı/pamuk' gibi yüksek su ihtiyacı olan endüstriyel bitkilerin yetiştirilmesini mümkün kılmıştır. İslam mühendisleri, vidanın iç yüzeyindeki sürtünmeyi azaltmak için özel ahşap ve reçine kaplamalar geliştirmiş, mil yataklarında bronz burçlar kullanarak dönemin en verimli hidrolik makinelerini üretmişlerdir. Bu teknoloji, Endülüs üzerinden Avrupa'ya geçmiş ve Rönesans Avrupası'nın madencilik ve drenaj mühendisliğinin temelini oluşturmuştur."}, {"id": "a202", "slug": "yeni-a202-clepsydra-antik", "title": "Clepsydra (Antik Su Saati Geleneği)", "creator": "Antik Gelenek (Ktesibios/Arşimed hattı)", "kisa": "Antik Çağ'ın su saati geleneği, Ktesibios ve Arşimed gibi bilginlerin çalışmalarıyla gelişmiştir. Bu gelenek, İslam dünyasına aktarılmış ve İslam mühendislerinin elinde daha da geliştirilmiştir.", "uzun": "Clepsydra, Antik Çağ'ın su saati geleneğinin en önemli temsilcisidir. Bu gelenek, Ktesibios ve Arşimed gibi bilginlerin çalışmalarıyla gelişmiştir. Su saatleri, suyun kontrollü akışıyla zamanı ölçer ve bu sayede zaman oldukça hassas bir şekilde ölçülebilir. Bu gelenek, İslam dünyasına aktarılmış ve İslam mühendislerinin elinde daha da geliştirilmiştir. İslam mühendisleri, su saatlerini daha da geliştirerek, kâtipli su saatleri, fincan saatleri ve diğer gelişmiş su saati düzeneklerini tasarlamışlardır. Koleksiyonda clepsydra, su saati geleneğinin en eski temsilcisidir; zamanın suyla ölçüldüğü, saatin suyla aktığı büyülü bir düzeneği temsil eder."}, {"id": "a205", "slug": "yeni-a205-tin-el-hikme", "title": "Tın el-Hikme (Bilge Kili)", "creator": "İslam Kimya ve Metalürji Geleneği", "kisa": "Kimya fırınlarının, imbiklerin ve potaların iç yüzeylerini kaplamak için kullanılan; ısıya, asitlere ve termal şoka dayanıklı özel kil, kum ve organik bağlayıcı karışımı (yapay kil).", "uzun": "Tın el-Hikme (Bilge Kili / Hikmet Kili), İslam laboratuvar pratiğinin malzeme bilimindeki (seramik mühendisliği) en kritik ve en 'gizli' sırlarından biriydi. Simyacılar ve kimyagerler, metalleri eritirken veya güçlü asitleri (örneğin kral suyu / aqua regia) damıtırken, standart toprak kapların erimesi, çatlaması veya kimyasal reaksiyona girerek deneyi bozmasıyla sürekli karşılaşıyorlardı. Câbir ve er-Râzî, bu sorunu çözmek için farklı coğrafyalardan (Samos, Mısır, Ermenistan) getirilen killeri, kumu, tuzu ve at kılı/yün gibi organik bağlayıcıları belirli oranlarda karıştırarak 'tın el-hikme' adını verdikleri bir macun geliştirdiler. Bu macun, cam kapların (ampulla lutata) dışına sıvanarak termal şoku önlüyor; fırınların ve potaların içine astarlanarak eriyen metallerin duvara yapışmasını engelliyordu. Ayrıca imbiklerin ek yerlerini tamamen sızdırmaz (hermetik) hale getirmek için kullanılan bu macun, 'hermetik felsefe' ve 'hermetik kapama' terimlerinin kökenidir. Bu 'yapay kil', İslam kimyasının görünmez ama vazgeçilmez altyapısıdır."}, {"id": "a206", "slug": "yeni-a206-buhar-turbini-sis-cevirici", "title": "Buharla Çalışan Döner Şiş Çeviricisi (Buhar Türbini)", "creator": "Takiyyeddîn er-Râsıd", "kisa": "Takiyyeddîn'in tasarladığı; kazanda kaynayan suyun buharının bir lüleden çıkarak kanatçıklı bir çarkı döndürdüğü ve bu dönme hareketinin şiş çevirmeye aktarıldığı erken dönem buhar türbini.", "uzun": "Buharla Çalışan Döner Şiş Çeviricisi, buhar gücünün mekanik harekete dönüştürüldüğü bilinen en erken ve en pratik düzeneklerden biridir. Takiyyeddîn, 'et-Turuk es-Seniyye' adlı eserinin altıncı bölümünde bu makineyi detaylandırır. Kapalı bir kazanda kaynayan suyun buharı, ucundaki dar bir lüleden (memeden) yüksek basınçla çıkarak karşıdaki kanatçıklı bir çarka (türbine) çarpar ve çarkı döndürür. Bu dönme hareketi dişliler aracılığıyla ocaktaki et şişine aktarılır. Isıtma spirali ve durdurma supabı, buharın basıncını ve şişin dönme hızını kontrol edilebilir kılar. Bu tasarım, Avrupa'da buhar türbininin ilk teorik çizimlerini yapan Branca'dan (1629) ve Papin'den tam 70 yıl öncesine aittir. Takiyyeddîn, termodinamiğin henüz adının konmadığı bir çağda, buharın kinetik enerjisini nicel bir mühendislik hesaplamasıyla işe dönüştürmüştür. Sanayi Devrimi'nin kökleri, saray mutfağındaki bu şiş çeviricide gizlidir."}, {"id": "a209", "slug": "yeni-a209-kehribar-miknatis", "title": "Kehribar ve Mıknatıs Taşı", "creator": "İslam Mineraloji Geleneği", "kisa": "Sürtünmeyle statik elektrik yüklenen kehribar (kehrubâ) ve demiri çeken doğal mıknatıs taşı (mağnâtis); İslam mineralojisinin 'görünmez kuvvetler' üzerine ilk sistematik gözlemleri.", "uzun": "Kehribar ve Mıknatıs Taşı, İslam mineralojisinin ve erken fiziğin, doğadaki 'görünmez kuvvetleri' (elektrostatik ve manyetizma) anlama çabasının somut nesneleridir. el-Kazvînî ve el-Bîrûnî gibi bilginler, Baltık denizinden ticaret yollarıyla İslam dünyasına gelen kehribarı (Arapça/Farsça: kehrubâ - 'saman çeken') detaylıca incelemişlerdir. Kehribarın yüne sürtüldüğünde hafif cisimleri çekmesi, onlar için maddenin 'ruh' (câzibe) taşıdığının kanıtıydı. İlginçtir ki, Yunanca kehribar anlamına gelen 'elektron' kelimesi, yüzyıllar sonra William Gilbert tarafından bu çekim kuvvetini tanımlamak için kullanılmış ve modern 'elektrik' biliminin adı buradan türemiştir. Ancak kelimenin kökenindeki 'saman çeken' anlamı, doğrudan Farsça/Arapça 'kehrubâ' kelimesinin çevirisidir. Aynı şekilde manyetit (mağnâtis) taşlarının pusulalarda (kardan sistemi) ve tıpta (sinir hastalıklarının tedavisinde) kullanımı, İslam dünyasında manyetizmanın pratik bir mühendislik disiplinine dönüştüğünü gösterir."}, {"id": "a224", "slug": "yeni-a224-katipli-su-saati", "title": "Kâtipli Su Saati (el-Cezerî)", "creator": "İsmail el-Cezerî", "kisa": "el-Cezerî'nin «zamanı yazan» otomatı: ortada oturan kâtip figürü, elindeki yazı kamışıyla dönen bir diski işaret eder; galeri halkası (şurfa) 217,5 kısma bölünmüş olup, gün ve gece saatlerinin farklı uzunluklarını (mevsimsel saat) hassasiyetle temsil eder.", "uzun": "Kâtipli su saati, el-Cezerî'nin «zamanı yazan» otomatıdır: ortada oturan kâtip figürü, elindeki yazı kamışıyla dönen bir diski işaret eder; galeri halkası (şurfa) 217,5 kısma bölünmüş olup, gün ve gece saatlerinin farklı uzunluklarını (mevsimsel saat) hassasiyetle temsil eder. Hidrostatik basınç, şamandıra ve dişli treni, kâtibin kolunu her saat başı hareket ettirir. Wiedemann'ın çizimiyle yeniden canlanan bu düzenek, «mekanik-estetik» birliğin zirvesidir: saat, yalnız ölçmez, aynı zamanda «anlatır». Su saati (clepsydra) geleneğinin en rafine ürünlerinden biri olan bu düzenek, Antik Çağ'dan İslam dünyasına aktarılan su saati geleneğinin, İslam mühendislerinin elinde nasıl bir sanat eserine dönüştüğünü gösterir. Koleksiyonda kâtipli saat, otomatlar bölümünün kalbidir; zamanın insan eliyle değil, insan benzeri bir el tarafından yazıldığı büyülü andır."}, {"id": "a225", "slug": "yeni-a225-ispanyol-arap-saatleri", "title": "İspanyol-Arap Saatleri (Bölüm)", "creator": "Endülüs Saat Geleneği", "kisa": "İspanyol-Arap saatleri, İspanya'daki Müslüman ve Hristiyan kültürlerin etkileşimiyle gelişmiş ve Avrupa saat geleneğine önemli katkılarda bulunmuştur. el-Murâdî, İbn eş-Şâtir ve diğer Endülüslü bilginler, bu geleneğin en önemli temsilcileridir.", "uzun": "İspanyol-Arap saatleri, İspanya'daki Müslüman ve Hristiyan kültürlerin etkileşimiyle gelişmiş ve Avrupa saat geleneğine önemli katkılarda bulunmuştur. Bu gelenek, Endülüs'teki Müslüman bilginlerin saat yapımındaki uzmanlığını ve bu bilginin Avrupa'ya aktarımını temsil eder. İspanyol-Arap saatleri, su saatleri, mum saatleri ve güneş saatleri gibi farklı türlerde saatleri içerir. Bu saatler, İspanya'daki camilerde, medreselerde ve saraylarda yaygın olarak kullanılmıştır. İspanyol-Arap saatleri, Avrupa saat geleneğine önemli katkılarda bulunmuş ve Avrupa'daki saat yapım tekniklerinin gelişmesine katkıda bulunmuştur. Koleksiyonda İspanyol-Arap saatleri, Endülüs saat geleneğinin en önemli temsilcileridir; zamanın farklı kültürler arasında aktarıldığı, saatin bir kültür köprüsü olduğu büyülü bir düzeneği temsil eder."}, {"id": "a228", "slug": "yeni-a228-gemi-modelleri", "title": "Gemi Modelleri (Dav ve Bağla)", "creator": "İslam Gemi İnşaatı Geleneği", "kisa": "Hint Okyanusu'nun karakteristik, çivisiz (halatla dikilmiş) ve mercan resiflerine çarpmada esneklik sağlayan 'Dav' ve 'Bağla' tipi gemilerin mühendislik modelleri.", "uzun": "Gemi Modelleri (Dav ve Bağla), İslam denizciliğinin 'üç boyutlu arşivi' ve hidrodinamik dehasının kanıtıdır. Hint Okyanusu'ndaki 'Dav' (Dhow) gemileri, Avrupa'nın çivi ve çekiçle inşa ettiği sert gövdeli gemilerinin aksine, Hint cevizi liflerinden (koyr) yapılan halatlarla 'dikilerek' (bağla) inşa edilirdi. Bu çivisiz yapı, geminin Kızıldeniz ve Basra Körfezi'ndeki ölümcül mercan resiflerine çarptığında parçalanmak yerine esnemesini ve hayatta kalmasını sağlıyordu. Ayrıca İslam denizcilerinin kullandığı 'geç yelken' (üçgen/latina yelken), gemilerin rüzgara karşı (bolina) çok daha dar açılarla ilerlemesine olanak tanıyordu. Portekizliler, 15. yüzyılda Afrika kıyılarını keşfederken kullandıkları meşhur 'Karavela' gemilerini, tam olarak bu İslam 'Dav' teknelerinin geç yelken ve esnek gövde mantığıyla inşa etmişlerdir. Koleksiyondaki modeller, denizcilik tarihinin Doğu'dan Batı'ya akan 'gizli' mühendislik mirasını temsil eder."}, {"id": "a230", "slug": "yeni-a230-mecra-kadrani", "title": "Mecra (Küresel Usturlapta Yükseklik Kadranı)", "creator": "Câbir b. Sinan el-Harrânî Geleneği", "kisa": "Küresel usturlabın meridyen çemberine monte edilen; gök cisimlerinin yüksekliğini (irtifa) ve zenit mesafesini ölçmeye yarayan, alhidadenin küresel karşılığı olan kadran bileşeni.", "uzun": "Mecra, küresel usturlabın 'gözü'dür. Düzlem usturlapta arka yüzde dönen düz bir cetvel (alhidade) varken, küresel usturlapta bu işlevi kürenin meridyen çemberi üzerine oturtulan kavisli bir kadran (mecra) üstlenir. Mecra, üzerinde nişangâhlar (diopterler) taşır ve kürenin yüzeyi boyunca kayarak hedef yıldıza veya güneşe kilitlenir. Bu sayede cismin ufuktan yüksekliği veya zenit mesafesi doğrudan küre üzerindeki derece taksimatından okunur. Harrânî ve Kustâ b. Lükâ'nın risalelerinde ayrıntılanan bu parça, küresel usturlabı 'kendi kendine yeten' bir gözlem istasyonu kılar. Mecra'nın varlığı, İslam alet yapımcılarının her geometriye (düzlem, küresel, silindirik) uygun ölçüm arayüzleri tasarlayabildiklerinin; mekaniği matematiğe kusursuzca uyarladıklarının kanıtıdır."}, {"id": "a234", "slug": "yeni-a234-alhidade", "title": "Alhidade (Açı Cetveli)", "creator": "İslam Astronomi Geleneği", "kisa": "Usturlabın veya kadranın arka yüzünde, merkez etrafında dönen ve üzerinde iki delikli nişangâh (diopter) bulunan; güneşin veya yıldızın yüksekliğini ölçmeye yarayan açı cetveli.", "uzun": "Alhidade (Arapça: el-idâda), usturlabı salt bir 'hesap makinesi' olmaktan çıkarıp gerçek bir 'gözlem aleti'ne dönüştüren yegâne parçadır. Usturlabın arka yüzünde, merkezdeki bir pim etrafında dönen bu cetvelin her iki ucunda, üzerinde ince birer delik bulunan dik lameller (nişangâhlar) bulunur. Gözlemci, usturlabı kulpundan (asma halkasından) havada asılı tutarak alhidadeyi Güneş'e veya bir yıldıza doğrultur; ışığın her iki delikten aynı anda geçmesini sağladığında, cetvelin uçları dış çemberdeki (limbus) derece skalasında gök cisminin yüksekliğini (irtifa) gösterir. İslam ustaları, özellikle Güneş gözlemlerinde gözün zarar görmemesi ve ışık saçılmasının (flare) engellenmesi için nişangâh deliklerinin çaplarını ve iç yüzeylerinin karartılmasını optimize etmişlerdir. Alhidadesız bir usturlap, sadece süslü bir pirinç levhadır; alhidade ile birlikte o, gökyüzünü avuca indiren bir 'yerçekimi referanslı bilgisayar'a dönüşür. Bu basit ama kusursuz mekanik parça, İslam rasathanelerindeki devasa duvar kadranlarında da (örneğin Merâğa ve Semerkant) aynı optik prensiplerle, ancak metrelerce uzunluğunda kullanılmıştır."}, {"id": "a239", "slug": "yeni-a239-bes-halkali-kure", "title": "Beş Halkalı Gözlem Küresi (Zât el-Halak)", "creator": "Müeyyededîn el-Urdî", "kisa": "Merâğa Rasathanesi'nin beş halkalı gözlem küresi; meridyen, büyük meridyen, ekliptik, kolur ve enlem halkalarından oluşan, beş kişilik ekiple işletilen anıtsal armiller küre.", "uzun": "Beş Halkalı Gözlem Küresi (Zât el-Halak), Merâğa Rasathanesi'nin 'takım çalışması' biliminin anıtıdır. El-Urdî'nin Aletler Kitabı'ndaki tarife göre bu küre, gökyüzünün koordinat sistemlerini temsil eden beş (veya altı) halkadan oluşur: 1. Hareketsiz olarak kuzey-güney yönünde bulunan meridyen halkası, 2. Hareketli büyük meridyen halkası, 3. Ekliptik halkası, 4. Kolur halkası (Arapça hâmile, 'taşıyan'), 5. Ekliptik kutupları boyunca devam eden küçük meridyen halkası ve 6. İki nişangâhla donatılmış enlem halkası. Bütün halkalar kompleksini taşıyan ufuk halkası, altı çubuk yoluyla aynı büyüklükteki bir temel halkaya bağlıdır. Aletler kitabının verdiği bilgilere göre bu gözlem aracıyla çalışmak için beş kişi gerekmekteydi. Koleksiyonda beş halkalı küre, gökyüzünün 'mekanik modeli'dir; evren, pirinç halkaların içinde döner."}, {"id": "a242", "slug": "yeni-a242-kusayr-amra", "title": "Kuşayr Amra Gök Haritası", "creator": "Emevî Saray Geleneği", "kisa": "Ürdün çölündeki Emevî kasrının hamam kubbesine fresk tekniğiyle işlenmiş; yaklaşık 400 yıldızı, takımyıldızları ve zodyak kuşağını içeren, İslam dünyasının bilinen en eski gök haritası.", "uzun": "Kuşayr Amra Gök Haritası, İslam sanat ve bilim tarihinin en büyüleyici ve en erken belgelerinden biridir. 1902'de Alois Musil tarafından Ürdün çölünde keşfedilen bu Emevî çöl sarayının hamam (caldarium) kubbesinde, gökyüzünün muhteşem bir freski yer alır. 711-715 yıllarına tarihlenen bu kubbede, yaklaşık 400 yıldız, bilinen takımyıldızlar (örneğin Büyükayı, Avcı) ve burçlar kuşağı (zodyak) koordinatlarıyla birlikte tasvir edilmiştir. Harita, düz bir zemine değil, kubbenin 3 boyutlu eğimine gökküresinin içinden bakıyormuşçasına (içbükey perspektif) işlenmiştir. Fritz Saxl ve Arthur Beer'in astronomi-tarihsel analizleri, bu haritanın Helenistik/Bizans astronomi geleneğinin İslam dünyasındaki ilk büyük yankısı olduğunu kanıtlamıştır. Haritadaki bazı takımyıldız isimlerinin ve konumlarının Arapça/İslami astronomiye geçişteki 'kayıp halka' olması, Kuşayr Amra'yı sadece bir sanat eseri değil, aynı zamanda İslam biliminin doğuşuna tanıklık eden eşsiz bir arkeolojik rasathane kalıntısı yapar."}, {"id": "a246", "slug": "yeni-a246-memunun-dunya-haritasi", "title": "Me'mûn'un Dünya Haritası", "creator": "Me'mûn Okulu Astronomları", "kisa": "Halife Me'mûn'un emriyle, Ptoleme'nin antik haritasındaki hataları saha ölçümleriyle düzeltmek için hazırlanan; İslam dünyasının ilk kurumsal ve deneysel dünya haritası.", "uzun": "Me'mûn'un Dünya Haritası (el-Sûretü'l-Arz), İslam kartografyasının ve jeodezisinin doğum belgesidir. 9. yüzyılda Bağdat'a çevrilen Ptoleme'nin 'Coğrafya'sı, dönemin mutlak otoritesi kabul ediliyordu. Ancak Halife Me'mûn ve onun Şam (Kâsiyün) ile Bağdat (Şemmâsiyye) rasathanelerindeki astronomları (Habeş el-Hâsib, Yahya b. Ebî Mansûr, el-Hârizmî), Ptoleme'nin Akdeniz'in uzunluğunu ve Asya'nın doğu sınırlarını ciddi şekilde hatalı çizdiğini fark ettiler. Me'mûn, imparatorluğun dört bir yanına (Sina çölünden Hint sınırlarına) astronomlar ve matematikçiler göndererek, meridyen derecesinin uzunluğunu ve şehirlerin gerçek enlem/boylamlarını ölçtürdü. Bu devasa saha verileriyle, Ptoleme'nin haritasını revize eden ve İslam coğrafyasının gerçek boyutlarını yansıtan yeni bir dünya haritası (el-Sûretü'l-Arz) çizdirdiler. Bu harita, İslam dünyasının antik mirası sadece 'kopyalamadığını', onu deneysel olarak 'test edip düzelttiğini' (tahlîk) gösteren en erken kartografik manifestodur. Bu çalışma, yüzyıllar sonra el-İdrîsî'nin ve Piri Reis'in haritalarının temelini oluşturacaktır."}, {"id": "a249", "slug": "yeni-a249-buyuk-daire-pergeli", "title": "Büyük Daire Pergeli", "creator": "Takiyyeddîn er-Râsıd", "kisa": "Takiyyeddîn'in rasathane aletlerinin imalatı için tasarladığı; metrelerce yarıçaplı kadran yaylarını çizebilen, gözlem aletlerinin hassasiyetinin ön koşulu olan özel büyük daire pergeli.", "uzun": "Büyük Daire Pergeli, İstanbul Rasathanesi'nin 'meta-aleti'dir; aletleri doğuran alettir. Takiyyeddîn, sekiz astronomi aleti ve bir astronomik saat yanında, bu pergeli de tarif eder; alet yapımı bilgisini rasathane pratiğine ekler. Metrelerce yarıçaplı kadran yaylarını çizebilen bu özel düzenek, gözlem aletlerinin hassasiyetinin ön koşuludur. Çünkü bir kadranın taksimatı, ancak kusursuz bir daire yayı üzerine kazınabilir; eğer yay eğri veya eksikse, tüm ölçümler kayar. Takiyyeddîn'in pergeli, vidalanabilir uzatma parçalarına sahip, büyük daireleri parça parça çizebilen bir mekanizmadır. Koleksiyonda büyük daire pergeli, 'aletleri doğuran alet' olarak özel bir yere sahiptir; bilimin altyapısına, yani atölyeye açılan kapıdır. Bu pergel olmadan, İstanbul Rasathanesi'nin kadranları, usturlapları ve küreleri var olamazdı."}, {"id": "a250", "slug": "yeni-a250-kasiyun-rasathanesi", "title": "Şam (Kâsiyün) Rasathanesi Aletleri", "creator": "Hâlid b. Abdülmelik el-Merverrûdî", "kisa": "Halife Me'mûn'un emriyle Şam'ın Kâsiyün Dağı'nda kurulan, Ptoleme'nin verilerini test etmek ve Dünya'nın çevresini ölçmek için kullanılan ilk kurumsal İslam rasathanesinin gözlem aletleri.", "uzun": "Şam (Kâsiyün) Rasathanesi Aletleri, İslam bilim tarihinin 'deneysel doğrulama' (tahlîk) çağını başlatan yadigârlardır. 9. yüzyılın başlarında Halife Me'mûn, Yunanca'dan çevrilen Ptoleme'nin Almagest'indeki astronomik parametrelerin (ekliptik eğimi, presesyon, gezegen periyotları) hala geçerli olup olmadığını test etmek için dev bir bilim projesi başlattı. Hâlid el-Merverrûdî başkanlığındaki ekip, Şam'ın Kâsiyün Dağı'na ve Bağdat'ın Şemmâsiyye semtine iki eşzamanlı rasathane kurdu. Burada, dönemin en büyük metal ve ahşap ustalarına, Ptoleme'nin tarif ettiği 'armiller küre' (zât el-halak), dev gnomonlar (mikyas) ve meridyen halkaları döküldü. Bu aletlerle yapılan gözlemler sonucunda, Ptoleme'nin hesapladığı ekliptik eğiminin (23°51') hatalı olduğu tespit edildi ve Me'mûn astronomları bunu 23°33' olarak düzeltti. Kâsiyün Rasathanesi, İslam dünyasında bilimin sadece 'kitaplardan okunmak' değil, 'doğada aletlerle test edilmek' zorunda olduğunun ilan edildiği ilk kurumsal merkezdir. Bu aletler, Merâğa ve İstanbul rasathanelerinin manevi ve teknik atasıdır."}, {"id": "a257", "slug": "yeni-a257-sabuncuoglu-cerrahi-aletleri", "title": "Sabuncuoğlu'nun Cerrahi Aletleri", "creator": "Şerefeddin Sabuncuoğlu", "kisa": "Şerefeddin Sabuncuoğlu'nun 1465'te Fatih Sultan Mehmed'e sunduğu, 140 minyatürle donatılmış Türkçe cerrahi ansiklopedisindeki özgün cerrahi aletler ve müdahale teknikleri.", "uzun": "Sabuncuoğlu'nun Cerrahi Aletleri, İslam tıp tarihinin 'klasik' birikiminin Osmanlı pratiğiyle ve Türkçe'yle buluştuğu en önemli dönüm noktasıdır. Sabuncuoğlu, 400 yıl önce Endülüs'te ez-Zehrâvî'nin kurduğu cerrahi alet geleneğini devralmış, ancak onunla yetinmeyerek Amasya Bimarhanesi'ndeki kendi klinik gözlemlerini eklemiştir. Cerrâhiyyetü'l-Hâniyye adlı eseri, sadece aletlerin nasıl kullanılacağını değil, aynı zamanda hastaya nasıl yaklaşılacağını, ameliyat sırasındaki etik kuralları ve hijyen prensiplerini de içerir. Sabuncuoğlu, meme kanseri tümörlerinin cerrahi olarak çıkarılması, epilepsi tedavisi için kafatasına yapılan müdahaleler ve zor doğumlarda kullanılan kancalar konusunda dönemin Avrupa'sının çok ötesinde teknikler geliştirmiştir. Eserdeki 140 minyatür, cerrahların aletleri nasıl tuttuğundan hastanın nasıl pozisyonlandırıldığına kadar her detayı resmeder; bu da eseri, tıp eğitiminde kullanılan ilk 'görsel ders kitabı' (atlas) yapar. Sabuncuoğlu, 'denemediğim hiçbir şeyi yazmadım' diyerek deneysel tıbbın Osmanlı'daki en güçlü savunucusu olmuştur."}, {"id": "a279", "slug": "yeni-a279-ankebut", "title": "Ankebut (Örümcek)", "creator": "İslam Usturlap Ustaları Geleneği", "kisa": "Usturlabın ön yüzünde dönen, zodyak kuşağını ve gökkürenin en parlak yıldızlarını (Sirius, Vega, Aldebaran) temsil eden ajurlu, oymalı pirinç plaka.", "uzun": "Ankebut (Arapça: Örümcek/Ağ), usturlabın kalbi ve görsel şaheseridir. Mater (ana gövde) içine yerleştirilen enlem plakalarının (safâ'ih) üzerinde dönen bu ajurlu plaka, gökküresinin kutuptan düzleme (stereografik) izdüşümünü temsil eder. Dış çemberi ekliptiği (Güneş'in yıllık yörüngesini) gösterirken, üzerindeki sivri uçlar (mürîler) en parlak sabit yıldızların (örneğin Şi'râ-yı Yemânî / Sirius) gökyüzündeki konumlarını işaret eder. İslam ustaları, ankebutu tasarlarken hem astronomik doğruluğu korumak hem de metalin dayanıklılığını sağlamak için inanılmaz bir geometrik ve sanatsal deha sergilemişlerdir. Her ustanın 'imzası' ve estetik zevki ankebutun oyulmuş desenlerinde (arabeskler, çiçek motifleri, geometrik düğümler) gizlidir. Kullanıcı ankebutu döndürdükçe, gece gökyüzünü avucunda canlandırır; yıldızların doğuş ve batış saatleri, namaz vakitleri ve burçların konumu bu metalik dans ile hesaplanır. Koleksiyondaki ankebut örnekleri, İslam dünyasında bilimin 'soğuk' bir matematik değil, estetik ve ruhani bir arayış olduğunun en net kanıtıdır."}, {"id": "a290", "slug": "yeni-a290-guherçile-tasfiyesi", "title": "Güherçile Tasfiyesi ve Barut Kimyası", "creator": "Necmeddîn Hasan er-Rammâh", "kisa": "Doğal güherçilenin (potasyum nitrat) kimyasal işlemlerle saflaştırılarak, kükürt ve kömürle belirli oranlarda karıştırılıp sistematik bir patlayıcı (barut) haline getirilmesi süreci.", "uzun": "Güherçile Tasfiyesi ve Barut Kimyası, İslam kimyasının savaş meydanındaki en ölümcül ama en mühendislik harikası uygulamasıdır. Barutun hammaddesi olan güherçile (potasyum nitrat), Çin'den İslam dünyasına geldiğinde 'kar tuzu' veya 'Çin tuzu' olarak biliniyordu ancak doğal haliyle safsızlıklar içeriyor ve düşük bir yanma hızına sahipti. Hasan er-Rammâh, 'el-Furûsiyye' adlı eserinde güherçilenin nasıl saflaştırılacağını (tasfiye) adım adım anlatır: Doğal güherçile suda çözülür, içine kül suyu (potasyum karbonat) eklenerek kalsiyum ve magnezyum safsızlıkları çöktürülür, ardından süzülüp yavaşça buharlaştırılarak saf, iğne benzeri kristaller elde edilir. er-Rammâh, bu saf güherçileyi kükürt ve söğüt kömürüyle karıştırarak, tam olarak modern siyah barut formülü olan %75 güherçile, %10 kükürt ve %15 kömür oranına ulaşmıştır. Bu kimyasal optimizasyon, barutun sadece 'yanan' bir madde olmaktan çıkıp, seramik bombaları ve roketleri (tayyâr) fırlatabilecek 'patlayıcı' bir güce (gaz basıncına) kavuşmasını sağlamıştır."}, {"id": "a297", "slug": "yeni-a297-musikar", "title": "Musikâr (Bimaristan Müzik Terapisi)", "creator": "İslam Psikiyatri ve Müzik Geleneği", "kisa": "Şam Nureddin ve Edirne II. Bayezid Bimaristanlarında akıl hastalarının rehabilitasyonunda kullanılan; belirli makamlarla ruhsal çöküntüyü ve maniyi tedavi eden üflemeli çalgı.", "uzun": "Musikâr, İslam tıbbının en hümanist ve en vizyoner uygulamalarından biri olan 'psikiyatrik müzikoterapi'nin fiziksel sembolüdür. Orta Çağ Avrupası'nda akıl hastaları 'içine şeytan girmiş' kabul edilerek yakılırken veya zincire vurulurken, İslam bimaristanlarında (örneğin 1154'te Şam'daki Nureddin Hastanesi veya 1488'de Edirne'deki II. Bayezid Külliyesi) onlar birer 'hasta' olarak görülür ve tedavi edilirdi. Hastanenin mimarisi, suyun şırıltısının hastaları sakinleştireceği şekilde (akustik mühendislik) tasarlanır; ayrıca haftanın belirli günlerinde hastane avlusunda müzisyenler konser verirdi. İslam hekimleri (el-Kindî, İbn Sînâ, Gevrekzâde), makamların insan fizyolojisi üzerindeki etkilerini sistematize etmişlerdi: Örneğin 'rast' makamı neşe ve canlılık verirken, 'hüseynî' huzur, 'segâh' ise uykusuzluk çekenlere uyku getirirdi. Musikâr (bir tür ney veya kaval), bu ses dalgalarını hastanın sinir sistemine ileten bir 'frekans jeneratörü' işlevi görüyordu. Bu uygulama, 20. yüzyılda bilimsel olarak kanıtlanacak olan 'ses frekanslarının beyin dalgaları (alfa/teta) üzerindeki etkisi'nin yüzyıllar öncesindeki klinik uygulamasıdır."}, {"id": "a298", "slug": "yeni-a298-santur", "title": "Santur (Bimaristan Müzik Terapisi)", "creator": "İslam Psikiyatri ve Müzik Geleneği", "kisa": "Bimaristanlarda müzik tedavisinin en önemli telli çalgısı; çekiçlerle (zahme) vurularak çalınan, makam teorisine göre ruhsal ve fizyolojik şifa dağıtan akustik enstrüman.", "uzun": "Santur, İslam bimaristanlarında müzik terapisinin en önemli ve en sofistike telli çalgısıydı. Ahşap bir kasa üzerine gerilmiş onlarca metal ve ipek telden oluşan bu enstrüman, küçük tahta çekiçlerle (zahme) vurularak çalınırdı. Santurun tıbbi önemi, onun üretebildiği 'titreşim zenginliği' ve 'harmonik katmanlar'dı. Minyatürlerde santurcu, hastane avlusundaki şadırvanın tam karşısına oturtulur; suyun ritmik sesi ile santurun titreşimleri birleşerek hastaların beyinlerindeki kaotik dalgaları (psişik gürültüyü) senkronize ederdi (entrainment). İslam tıp literatüründe, santurun 'zengüle' makamında çalındığında kalp çarpıntısını (aritmi) dindirdiği, 'büselik' makamında ise derin depresyondaki (melankoli) hastaları hayata bağladığı kayıtlıdır. Bu enstrüman, Edirne'deki II. Bayezid Darüşşifası'nda (1488) kurumsal bir 'reçete' olarak uygulanmış; hastalara haftada üç gün, günde iki saat santur dinleme seansları düzenlenmiştir. Santur, tıbbın sadece kimyasal moleküllerle (ilaç) değil, akustik fizik ve estetikle de iyileştirme gücüne sahip olduğunun kanıtıdır."}, {"id": "a299", "slug": "yeni-a299-karton-pusula-diski", "title": "Karton Pusula Diski (Kardan / Rüzgâr Gülü)", "creator": "İslam Denizcilik Geleneği (İbn Mâcid Ekolü)", "kisa": "Manyetik iğnenin üzerine monte edilen, 32 kollu rüzgâr gülü ve 15 sabit yıldızın astronomik方位 (yön) verilerini taşıyan karton disk; modern pusulanın 'akıllanan' yüzü.", "uzun": "Karton Pusula Diski, İslam denizcilik biliminin (ilm el-bahr) küresel ticarete yaptığı en büyük katkılardan biridir. Çin'den gelen manyetik iğne, başlangıçta sadece 'güneyi gösteren' basit bir araçtı. İslam denizcileri, bu iğnenin üzerine, ufkun 32'ye bölündüğü bir karton disk yerleştirdiler. Fuat Sezgin'in çığır açan araştırmaları, bu 32 bölümün sanıldığı gibi sadece rüzgar yönleri olmadığını; Arap denizcilerinin 'hane' (yıldız evi) sistemine dayanan, 15 sabit yıldızın (örneğin Sirius, Aldebaran) doğuş ve batış noktalarını gösteren astronomik bir kadran olduğunu kanıtlamıştır. Bu disk, 'kardano' (halkalı) süspansiyon sistemiyle geminin yalpalanmasına karşı dengelenerek, açık denizde 'kör uçuş' çağını başlatmıştır. Portekizli kaşifler bu diski İslam kaptanlarından devralmış; Avrupa'daki 'rüzgâr gülü' (compass rose) geleneği ve modern bussole bu İslam-Arap astronomik mirasının doğrudan bir uzantısı olarak gelişmiştir."}, {"id": "a300", "slug": "yeni-a300-toleta-de-marteloio", "title": "Toleta de Marteloio (Denizcilik Trigonometri Cetveli)", "creator": "İslam / Akdeniz Denizcilik Geleneği", "kisa": "Rüzgara karşı zikzak çizerek (bolina) ilerleyen gemilerin, ana rotadan ne kadar saptığını ve hedefe kalan gerçek mesafeyi trigonometrik olarak hesaplamasını sağlayan denizcilik tablosu/cetveli.", "uzun": "Toleta de Marteloio, İslam ve Akdeniz denizciliğinin 'uygulamalı trigonometri' konusundaki ustalığının kanıtıdır. Orta Çağ'da yelkenli gemiler, rüzgarın tam tersi yönüne (örneğin doğudan esen rüzgarda batıya) düz bir çizgide gidemezlerdi; rüzgarı çaprazdan alarak zikzaklar (bolina) çizmek zorundaydılar. Ancak bu zikzaklar, geminin hedefinden ne kadar saptığını ve ne kadar 'fazla' yol katettiğini hesaplamayı imkansız kılıyordu. İslam matematikçilerinin ve denizcilerinin geliştirdiği 'Toleta de Marteloio' (Hesap Tablosu), kaptanlara bu karmaşık trigonometrik problemi (sinüs ve kosinüs hesaplarını) önceden hazırlanmış basit bir çarpma/bölme tablosuyla çözme imkanı veriyordu. Kaptan, rüzgar gülündeki 'çarşaf' (rüzgar yönü) sayısına bakarak, 100 millik bir zikzakın ana rotaya ne kadar ilerleme (avanzo) ve ne kadar sapma (largo) yarattığını saniyeler içinde okuyabiliyordu. Bu pratik matematik, coğrafi keşiflerin 'matemati̇ksel di̇reksi̇yonu'dur; dünyanın haritasını yeniden çizen kaşiflerin gizli silahıdır."}, {"id": "a304", "slug": "yeni-a304-iskandil", "title": "İskandil (Kurşunlu Derinlik Ölçer)", "creator": "İslam Denizcilik Geleneği", "kisa": "Geminin omurgasından denize indirilen; ucundaki kurşun ağırlıkla derinliği ölçen, altındaki yağlı/sabunlu yüzey sayesinde deniz dibinden çamur, kum veya mercan numunesi getiren seyir aleti.", "uzun": "İskandil, İslam denizcilerinin (özellikle İbn Mâcid ve el-Mehrî'nin) sığ sular, mercan resifleri ve gizli kayalıklarla dolu Hint Okyanusu ve Kızıldeniz'de hayatta kalmasını sağlayan en hayati alettir. İskandil, ucunda ağır bir kurşun bulunan ve üzerinde kademeli (kulaç) düğümler atılmış uzun bir ipten oluşurdu. Ancak İslam denizcilerinin buna eklediği dahiyan özellik, kurşunun alt kısmının içine oyulmuş bir çukur ve buraya yerleştirilen 'donanma' (yağ, sabun veya katran karışımı) idi. Kurşun dibe ulaştığında, bu yapışkan yüzey deniz tabanındaki materyali (ince kum, siyah çamur, kırık mercan veya kayalık) kendine yapıştırarak gemiye geri dönüyordu. Kaptan, sadece 'derinliği' değil, aynı zamanda 'dibin rengini ve dokusunu' analiz ederek, gece karanlığında veya sisli havalarda dahi gemisinin tam olarak hangi körfezin veya haliçin önünde olduğunu, demir atmanın güvenli olup olmadığını anlayabiliyordu. Bu 'dip analizi', İslam seyir risalelerindeki (Rahmâniyeler) en detaylı ve en pratik navigasyon verileridir."}, {"id": "a305", "slug": "yeni-a305-kible-pusulasi-namaz-pergeli", "title": "Kıble Pusulası ve Namaz Vakitleri Pergeli", "creator": "İslam Muvakkit Geleneği", "kisa": "Manyetik iğne ile üzerine farklı şehirlerden Mekke'nin yönünü (kıble) gösteren koordinat haritası kazınmış, seyyahların cebinde taşıdığı dini-astrofiziksel kompas.", "uzun": "Kıble Pusulası, İslam medeniyetinin dini bir vecibeyi (namazda Kâbe'ye dönmek) en ileri düzey matematik ve manyetizma bilgisiyle çözmesinin somut bir zaferidir. İslam coğrafyasının devasa boyutları, Müslüman seyyahların ve tüccarların bilinmeyen diyarlarda kıble yönünü bulmasını zorunlu kıldı. Muvakkitler, pusulanın kapağının içine veya kadranına, dünyanın farklı bölgelerinden Mekke'ye olan azimut açılarını (kıble yönü) içeren detaylı bir koordinat haritası kazıdılar. Kullanıcı pusulayı yere yatay olarak koyup kuzeyi bulduğunda, kadran üzerindeki harita sayesinde kendi bulunduğu şehirden Mekke'nin tam hangi derecede olduğunu görebiliyordu. Yanında bulunan 'namaz pergeli' ise Güneş'in o günkü deklinasyonuna göre gölge boyunu hesaplayarak ikindi ve yatsı vakitlerini belirliyordu. Bu alet, bilimin halkın günlük ibadet ritmine nasıl hizmet ettiğinin; büyük rasathane aletlerinin halk düzeyindeki, cepte taşınan karşılığıdır."}, {"id": "a306", "slug": "yeni-a306-backstaff", "title": "Backstaff (Bağlantı Sopası)", "creator": "İslam ve İber Denizcilik Sentezi", "kisa": "Güneş'e doğrudan bakmadan, arkadan düşürülen gölge yardımıyla ufuk açısını ölçen; gözlemcinin gözlerini koruyan ergonomik seyir aleti.", "uzun": "Backstaff (Bağlantı Sopası), İslam ve İber Yarımadası denizciliğinin optik ve ergonomik dehasının bir ürünüdür. Klasik Yakup Sopası (Kamal/Balestilha) kullanılırken denizciler, Güneş'in yüksekliğini ölçmek için doğrudan güneşe bakmak zorunda kalıyor, bu da zamanla körlüğe ve ciddi retina hasarlarına yol açıyordu. İslam optikçilerinin (İbn el-Heysem geleneği) ışığın yansıma ve gölge geometrisi üzerine yaptıkları çalışmalar, denizciliğe 'arkadan gözlem' (back-observation) tekniğini armağan etmiştir. Bu alette, gözlemci sırtını Güneş'e döner; aletin üzerindeki bir perdenin veya çubuğun gölgesi, ufuk çizgisini gösteren alt nişangâhın üzerine düşürülür. Böylece Güneş'in yüksekliği, göze hiçbir zarar vermeden hassasiyetle ölçülür. 16. yüzyılda İngiliz kaptan John Davis tarafından Avrupa'da popülerleştirilen 'Davis Quadrant'ın kökleri, Endülüs ve İslam denizcilerinin bu 'gölge geometrisi' çözümlerine dayanır. Koleksiyonda bu alet, bilimin insan bedenini korumaya yönelik ne denli hümanist ve pratik çözümler ürettiğinin kanıtıdır."}, {"id": "a308", "slug": "yeni-a308-tusi-cifti", "title": "Tûsî Çifti (Gezegenler Modeli)", "creator": "Nasîreddîn et-Tûsî", "kisa": "Nasîreddîn et-Tûsî'nin geliştirdiği; Batlamyus'un ekvator problemini çözen, Kopernik'in yüzyıl sonra kullanacağı matematiksel modelin özdeşi olan kinematik gezegen modeli.", "uzun": "Tûsî Çifti, İslam astronomisinin en büyük teorik başarılarından biridir ve Kopernik Devrimi'nin matematiksel öncülüdür. Nasîreddîn et-Tûsî, Batlamyus'un gezegen modelindeki 'ekvator' (equant) noktasının fiziksel tutarsızlığını fark etmiş ve alternatif bir kinematik model geliştirmiştir. Tûsî Çifti, bir dairenin iç yüzeyinde yuvarlanan daha küçük bir dairenin, belirli bir noktasının doğrusal bir hareket üretmesi prensibine dayanır. Bu model, gezegenlerin düzensiz görünen hareketlerini, düzgün dairesel hareketlerin bileşimiyle açıklar. Kopernik, 'De Revolutionibus' adlı eserinde aynı matematiksel modeli (Tusi-couple) kullanarak, Batlamyus sisteminin fiziksel tutarsızlığını çözmüştür. Koleksiyonda Tûsî Çifti, İslam astronomisinin 'teorik devrimi'nin simgesidir; bilimin yalnız gözlemle değil, matematiksel yaratıcılıkla da ilerlediğinin kanıtıdır."}, {"id": "a320", "slug": "yeni-a320-birunin-piknometresi", "title": "el-Bîrûnî'nin Piknometresi", "creator": "Ebû Reyhân el-Bîrûnî", "kisa": "el-Bîrûnî'nin değerli taşların ve metallerin özgül ağırlığını hassasiyetle ölçmek için icat ettiği; tabanı geniş, boynu dar ve silindirik cam/seramik ölçüm kabı (piknometre).", "uzun": "el-Bîrûnî'nin Piknometresi, İslam mineralojisinin ve deneysel fiziğin en zarif buluşlarından biridir. Gazneli sarayındaki hazinedarların ve kuyumcuların, kendisine getirdikleri yakut, zümrüt veya altın-gümüş alaşımlarının saflığını (veya sahteliğini) test etmesi gerekiyordu. el-Bîrûnî, bu iş için standart döküm kalıplarının hacim sabitliği sağlamadığını fark edip, 'konik bir şekle sahip, geniş tabanlı ve dar boyunlu' özel bir cam kap (piknometre) tasarladı. Kap önce boş, sonra suyla dolu, en son da su ve test edilecek mineralle dolu olarak hassas terazilerde tartılıyordu. Suyun taşan hacmi ve ağırlık farkı kullanılarak maddenin özgül ağırlığı hesaplanıyordu. el-Bîrûnî'nin 'Kitâb el-Cemâhir'de kuvars, zümrüt, yakut ve çeşitli metaller için hesapladığı özgül ağırlık değerleri, 19. yüzyıl modern fizikçilerinin ölçümleriyle virgülüne kadar örtüşmektedir. Bu cam kap, kimyanın ve jeolojinin 'niteliksel' (görsel) tanımlamadan 'niceliksel' (sayısal) bilime geçtiği anın fiziksel kanıtıdır."}, {"id": "a320b", "slug": "yeni-a320b-cetvel-pergeli", "title": "Cetvel Pergeli (Mükemmel Alet Bileşeni)", "creator": "Müeyyededîn el-Urdî", "kisa": "Merâğa'nın Mükemmel Aleti'nin kalbinde yer alan; kılavuz ray üzerinde kayan, menteşeli ve ince ayar vidalarıyla donatılmış, açıları mikron hassasiyetinde okumayı sağlayan cetvel pergeli.", "uzun": "Cetvel Pergeli, Merâğa'nın Mükemmel Aleti'nin 'kalbi'dir. Kılavuz ray üzerinde kayan, menteşeli ve ince ayar vidalarıyla donatılmış bu pergel/cetvel mekanizması, gözlemcinin nişangâhı hedefe kilitledikten sonra açısal mesafeyi doğrudan ölçekten okumasını sağlar. Pergel bacaklarının üst taraflarına ikişer nişangâh yerleştirilir; bunlar yıldızların gözlemini ve bacakların sinüslerinin bulunmasını sağlar. Açının bulunması şöyle olur: Ölçü tahtasının her iki kılavuz yivine ve her iki yan tarafına merkez noktalarından açılan çizgiler, pergel bacaklarının hareketini belirler. El-Urdî'nin Aletler Kitabı'nda ve Takiyyeddîn'in Sidretü Müntehâ'sında ayrıntılanan bu bileşen, rasathane aletlerinin 'kaba devler' değil, saatçilik hassasiyetinde tasarlanmış 'makine'ler olduğunu gösterir. Koleksiyonda cetvel pergeli, büyük bilimin küçük ama kusursuz mekanik sırlarını temsil eder."}, {"id": "a321", "slug": "yeni-a321-duvar-kadrani-gelenegi", "title": "Duvar Kadranı Geleneği", "creator": "Duvar Kadranı Geleneği (el-Battânî/el-Urdî/Takiyyeddîn)", "kisa": "el-Battânî'den (9. yy) Merâğa ve İstanbul rasathanelerine uzanan; meridyen geçişlerini ve Güneş'in deklinasyonunu ölçmek için duvara sabitlenmiş büyük boyutlu kadran geleneği.", "uzun": "Duvar Kadranı Geleneği, İslam rasathane mimarisinin 'omurgası'dır. 9. yüzyılda el-Battânî'nin Rakka'daki rasathanesinde kullandığı duvar kadranı (labina), 13. yüzyılda Merâğa'da el-Urdî tarafından, 16. yüzyılda İstanbul'da Takiyyeddîn tarafından ve 18. yüzyılda Delhi'de Jai Singh II tarafından yeniden inşa edilmiştir. Bu 700 yıllık kesintisiz gelenek, duvar kadranının rasathane mimarisinin vazgeçilmez bileşeni olduğunu gösterir. Kadran, meridyen düzlemine (kuzey-güney hattına) sabitlenir ve Güneş'in veya yıldızların meridyenden geçiş anındaki yüksekliğini ölçer. İstanbul Rasathanesi'ndeki ahşap duvar kadranı, yaklaşık 2,5 metre yarıçapındaydı ve tik ağacından yapılmıştı. Koleksiyonda duvar kadranı geleneği, bilimin 'kurumsal hafızası'dır; her rasathane, bir öncekinin kadranını devralır ve geliştirir."}, {"id": "a322", "slug": "yeni-a322-nandana-dagi-deneyi", "title": "Nandana Dağı Deneyi (Dünya Yarıçapı)", "creator": "Ebû Reyhân el-Bîrûnî", "kisa": "el-Bîrûnî'nin Nandana Dağı'nın zirvesinden ufuk çizgisinin eğim açısını (dip açısı) ölçerek, karmaşık küresel trigonometri formülleriyle Dünya'nın yarıçapını hassasiyetle hesapladığı jeodezik deney.", "uzun": "Nandana Dağı Deneyi, İslam coğrafyasının ve deneysel biliminin en büyük zihinsel ve matematiksel sıçramalarından biridir. Abbâsî halifesi Me'mûn'un 9. yüzyıldaki 'çölde düz mesafe ölçerek' Dünya'nın çevresini bulma yöntemi, arazi engebeli olduğu için ciddi hatalar barındırıyordu. el-Bîrûnî, Gazneli Mahmud'un Hindistan seferlerine katıldığında, Nandana Dağı'nın zirvesine çıkarak yepyeni bir jeodezik yöntem uyguladı. Önce dağın yüksekliğini (iki farklı noktadan tepe açısını ölçerek) hesapladı. Ardından dağın zirvesinden, devasa bir usturlap ve şakül kullanarak ufuk çizgisinin (horizon) tam olarak ne kadar aşağıda kaldığını (dip açısını) ölçtü. Bu iki veriyi (dağın yüksekliği ve ufuk eğimi), kendi geliştirdiği küresel trigonometri formüllerine (sinüs ve kosinüs kuralları) yerleştirerek Dünya'nın yarıçapını hesapladı. Bulduğu sonuç (yaklaşık 6339 km), 19. yüzyıl uydu ölçümlerine kadar aşılamamış bir hassasiyet rekorudur. Bu deney, bilimin sadece 'gözlem' değil, aynı zamanda 'soyut matematiksel modelleme' ile evreni nasıl ölçebileceğinin kanıtıdır."}, {"id": "a322b", "slug": "yeni-a322b-azimut-kadrani", "title": "Azimut Kadranı (Büyük Yarım Daire)", "creator": "Takiyyeddîn er-Râsıd", "kisa": "Takiyyeddîn'in İstanbul Rasathanesi için tasarladığı; gök cisimlerinin azimutunu (ufuk yönünü) ölçmek için kullanılan büyük yarıçaplı yarım daire kadranı.", "uzun": "Azimut Kadranı (Büyük Yarım Daire), İstanbul Rasathanesi'nin 'panoramik gözü'dür. Takiyyeddîn'in sekiz aletinden biri olan bu kadran, gök cisimlerinin azimutunu (ufuk üzerindeki yönünü, kuzeyden saat yönünde derece cinsinden) ölçmek için tasarlanmıştır. Kadran, ufuk düzlemine paralel olarak yerleştirilir ve üzerinde 360°'lik taksimat bulunur. Gözlemci, nişangâhı hedefe doğrulttuğunda, kadran üzerindeki gösterge ucu azimut değerini okur. Bu alet, Tycho Brahe'nin Uranienburg'daki 'semicirculus magnus azimuthalis' adlı aletiyle eşzamanlı ve bağımsız olarak geliştirilmiştir; iki rasathane arasındaki teknolojik osmozun kanıtıdır. Koleksiyonda azimut kadranı, gökyüzünün 'pusulası'dır; yıldızların ufuktaki yönünü belirleyen mekanik bir rehberdir."}, {"id": "a328", "slug": "yeni-a328-piri-reis-haritasi", "title": "Piri Reis Haritası (1513)", "creator": "Piri Reis", "kisa": "Piri Reis'in 1513'te çizdiği; Kolomb'un kayıp haritası, İslam portolanları ve antik kaynakları sentezleyen, Amerika kıtasının ve Afrika kıyılarının en erken ve en hassas Osmanlı tasviri.", "uzun": "Piri Reis Haritası (1513), İslam ve Akdeniz kartografyasının küresel keşiflerle buluştuğu en büyüleyici belgedir. Topkapı Sarayı'nda bulunan bu ceylan derisi harita, Piri Reis'in Yavuz Sultan Selim'e sunduğu ve kendi ifadesiyle 'yirmi kadar eski ve yeni haritayı' (aralarında Kolomb'un kayıp haritasının, Ptoleme haritalarının ve İslam denizcilerinin portolanlarının bulunduğu) sentezleyerek çizdiği bir başyapıttır. Haritadaki 'pusula gülleri' (rüzgâr gülleri) ve bunları birbirine bağlayan 'romb çizgileri', İslam denizcilerinin (İbn Mâcid geleneği) Akdeniz ve Kızıldeniz'de kullandıkları matematiksel seyir ağlarının (marteloio) doğrudan bir yansımasıdır. Piri Reis, 'Kitâb-ı Bahriye' adlı denizcilik ansiklopedisinde Ege ve Akdeniz kıyılarını, liman derinliklerini ve tatlı su kaynaklarını o kadar hassas betimlemiştir ki, bu eser yüzyıllar sonra dahi denizcilerin el kitabı olmuştur. 1513 haritası, İslam kartografyasının sadece 'kopyacı' değil, küresel coğrafyayı aktif olarak haritalayan ve sentezleyen bir güç olduğunun en net kanıtıdır."}, {"id": "a350", "slug": "yeni-a350-usturlap-tahti-kursi", "title": "Usturlap Tahtı (Kürsî) ve Asma Halkası", "creator": "İslam Alet Yapımcıları Geleneği", "kisa": "Usturlabın üst kısmında asma halkasını taşıyan 'kürsî' (taht) ve aletin dik konumda tutulmasını sağlayan halka; ustanın adının kazındığı kimlik noktası.", "uzun": "Usturlap Tahtı (Kürsî) ve Asma Halkası, aletin 'kinematik kalbi'dir. Kürsî, usturlabın üst kenarına (tavk) monte edilen, üzerinde asma halkasının (cilâka) bulunduğu küçük kaide veya tahttır. Bu halka sayesinde usturlap dik konumda tutulur ve yerçekimiyle hizalanır; halka olmadan usturlap yalnızca süslü bir pirinç levhadır. Kürsî'nin iç yanına ustanın adı, yapım tarihi ve bazen sipariş verenin adı kazınır; bu, aletin 'kimlik kartı'dır. Nastülüs'ün 927 tarihli usturlabında kürsî'nin iç yanına 'Nastülüs' adı kazınmıştır. İslam ustaları, kürsî'nin geometrisini öyle ayarlamışlardır ki, alet rüzgârda veya elde titrediğinde bile dengede kalır. Halkanın çapı, aletin ağırlık merkeziyle uyumlu olmalıdır; aksi halde usturlap eğilir ve tüm ölçümler kayar. Koleksiyonda kürsî ve halka, usturlabın 'tahtı'dır; gökyüzü bu tahttan sarkar, zaman bu tahtla ölçülür."}, {"id": "a351", "slug": "yeni-a351-usturlap-alhidadesi", "title": "Usturlap Alhidadesi", "creator": "İslam Alet Yapımcıları Geleneği", "kisa": "Usturlabın arka yüzünde merkezi bir pim etrafında dönen ve üzerinde iki delikli nişangâh (diopter) bulunan cetvel; gök cisminin yüksekliğini (irtifa) doğrudan ölçer.", "uzun": "Alhidade (Arapça: el-ıdâda, 'sayan/sayıyı gösteren'), usturlabın arka yüzünde merkezi bir pim etrafında dönen ve üzerinde iki delikli nişangâh (diopter) bulunan cetveldir. Gözlemci, bu cetveli güneşe veya yıldıza doğrultarak ışığın her iki delikten geçmesini sağlar; cetvelin uçları, dış çemberdeki derece skalasında gök cisminin yüksekliğini (irtifa) gösterir. Alhidade, usturlabı salt bir 'hesap makinesi' olmaktan çıkarıp 'gözlem aleti'ne dönüştüren yegâne parçadır. İslam ustaları, nişangâh deliklerinin çapını ve cetvelin balansını mikron hassasiyetinde ayarlayarak, aletin elde asılıyken dahi titremeden hedefi yakalamasını sağlamışlardır. Nastülüs'ün 927 tarihli usturlabından Takiyyeddîn'in İstanbul Rasathanesi'ndeki devasa ahşap kadranına kadar her ölçüm aletinin kalbinde bir alhidade vardır. Koleksiyonda alhidade, usturlabın 'gözü' olarak sergilenir; pirinç bir cetvel, insan bakışını gökyüzüne kenetler."}, {"id": "a352", "slug": "yeni-a352-usturlap-mater", "title": "Usturlap Mater (Ana Gövde)", "creator": "İslam Alet Yapımcıları Geleneği", "kisa": "Usturlabın dış çemberi ve tabanını oluşturan, iç disklerin ve örümceğin barındığı ana gövde; derece skalası ve asma halkası bu yapıya monte edilir.", "uzun": "Usturlap Mater (el-umm / Ana Gövde), usturlabın 'bedeni'dir; tüm kozmos bu bedenin içine sığar. Mater, dış çemberiyle 360 derecelik skalayı taşıyan, iç yüzünde (vech) enlem disklerinin (safâ'ih) oturduğu ve arka yüzünde (zahr) trigonometrik hesaplamaların yapıldığı temel pirinç levhadır. İslam ustaları, mater'in kalınlığını ve ağırlığını öyle ayarlamışlardır ki, alet elde asılıyken yerçekimiyle dengede durur ve alhidade ile yapılan ölçümlerde titreme olmaz. Mater'in üst kısmındaki 'kürsî' (taht/kaide), asma halkasını taşır; bu halka sayesinde usturlap dik konumda tutulur ve ufuk düzlemine matematiksel olarak paralel hale gelir. İç disklere kazınan enlem dereceleri, farklı şehirler (Bağdat, Şam, Kahire, Toledo) için ayrı ayrı hazırlanır; böylece tek bir mater ile tüm İslam coğrafyasında gözlem yapılabilir. Koleksiyonda mater, usturlabın 'kalbi' değil, 'bedeni' olarak sergilenir; kozmosun sığdığı pirinç bir evren."}, {"id": "a353", "slug": "yeni-a353-enlem-plakalari", "title": "Enlem Plakaları (Safâ'ih)", "creator": "İslam Coğrafya ve Astronomi Geleneği", "kisa": "Usturlabın ana gövdesi (mater) içine yerleştirilen; her biri belirli bir coğrafi enlem (iklim) için stereografik projeksiyonla kazınmış ufuk, yükseklik (mukantaralar) ve azimut eğrilerini içeren pirinç levhalar.", "uzun": "Enlem Plakaları (Safâ'ih), usturlabın 'yazılım disketleri'dir. Klasik bir İslam usturlabının 'mater' adı verilen ana gövdesinin içine, genellikle 3 ila 7 adet ince pirinç plaka üst üste yerleştirilir. Her plakanın yüzeyinde, belirli bir coğrafi enlem (örneğin 33° Bağdat, 30° Kahire, 39° Buhara veya 41° İstanbul) için stereografik projeksiyonla hesaplanmış ufuk çizgisi, yükseklik daireleri (almukantarat) ve azimut (yön) eğrileri kazınmıştır. Bir usturlap sahibi, seyahat ettiği şehrin enlemine uygun plakayı en üste alarak aleti o coğrafya için yeniden kalibre ederdi. İslam coğrafyasının genişliği, alet yapımcılarını devasa bir koordinat veri tabanı oluşturmaya zorlamıştır. Bazı nadir usturlaplarda, plakanın arka yüzüne o enlemdeki önemli şehirlerin isimleri ve kıble yönünü gösteren eğriler dahi işlenmiştir. Bu plakalar, donanım (aletin kendisi) aynı kalırken, coğrafya değiştikçe yazılımın (plakanın) değiştiği, modern bilgisayar mantığının Orta Çağ'daki en zarif fiziksel karşılığıdır."}, {"id": "a354", "slug": "yeni-a354-usturlap-ankebut", "title": "Usturlap Ankebut (Örümcek/Ağ)", "creator": "İslam Alet Yapımcıları Geleneği", "kisa": "Usturlabın ön yüzünde dönen, ajurlu pirinç ağ; ekliptik (burçlar kuşağı) ve parlak sabit yıldızların konumlarını taşır, döndürüldüğünde gökyüzünün anlık durumunu simüle eder.", "uzun": "Usturlap Ankebut (Örümcek / Ağ / Rete), usturlabın 'ruhu'dur; gece gökyüzünü avucunda canlandırır. Ajurlu (delikli) pirinç bir ağ olarak tasarlanan ankebut, üzerinde ekliptik (burçlar kuşağı) ve parlak sabit yıldızların konumlarını taşır. Ankebut döndürüldüğünde, gökyüzünün anlık durumunu simüle eder; saatler, namaz vakitleri ve burçlar bu dönüşle hesaplanır. İslam ustaları, ankebut'u yalnızca işlevsel değil, aynı zamanda estetik bir başyapıt olarak tasarlamışlardır; arabesk motifler, dört yaprak tezyinatlar ve 'melek formlu' merkezler, bu ağları birer mücevhere dönüştürür. Batı dillerinde 'rete' (ağ) adıyla anılan bu bileşen, astronomi ile mücevher sanatının kesiştiği eşsiz bir nesnedir. Koleksiyonda ankebut, usturlabın 'kalbi' olarak sergilenir; pirinç bir ağ, binlerce yıllık yıldız bilgisini taşır."}, {"id": "a355", "slug": "yeni-a355-usturlap-arka-yuzu", "title": "Usturlap Arka Yüzü (zahr)", "creator": "İslam Alet Yapımcıları Geleneği", "kisa": "Usturlabın arka yüzünde yer alan sinüs/kosinüs kareleri, gölge kadranları (zıll), takvim daireleri ve astrolojik evlerden oluşan trigonometrik hesaplama yüzeyi.", "uzun": "Usturlap Arka Yüzü (zahr), aletin 'matematiksel motoru'dur. 360 derecelik dış çemberin içinde, sinüs ve kosinüs (mebsût ve menküs) hesaplamaları için kareler, gölge uzunlukları (zıll) için tanjant/kotanjant skalaları, gezegenlerin yönettiği saatler (eşit olmayan saatler) ve astrolojik evler (erbâb el-vucûh) yer alır. Bu yüzey, kullanıcının uzun trigonometrik hesaplamalar yapmasına gerek kalmadan, orantı ve geometri yoluyla açıları, mesafeleri ve zamanı okumasını sağlar. Arka yüzdeki takvim dairesi, güneşin burçlar kuşağındaki konumunu belirlemeye yarar; gölge kadranı ise bir cismin gölge uzunluğundan güneşin yüksekliğini hesaplar. İslam ustaları, bu yüzeyi yalnızca işlevsel değil, aynı zamanda estetik bir kompozisyon olarak tasarlamışlardır; her bir skala, hat sanatının zarafetiyle kazınmıştır. Koleksiyonda arka yüz, usturlabın 'beyni' olarak sergilenir; trigonometri, pirinç üzerinde dans eder."}, {"id": "a356", "slug": "yeni-a356-usturlap-mihver", "title": "Usturlap Mihver (Eksen/Kutb Pimi)", "creator": "İslam Alet Yapımcıları Geleneği", "kisa": "Usturlabın merkezinde tüm döner parçaları (mater, safâ'ih, ankebut, alhidade) bir arada tutan ve eksen görevi gören merkezi pim; 'at' (feres) adı verilen kilitleme vidasıyla sabitlenir.", "uzun": "Usturlap Mihver (Eksen / Kutb Pimi), aletin 'omurgası'dır; tüm kozmos bu tek pim etrafında döner. Mihver, mater'in, iç disklerin (safâ'ih), örümceğin (ankebut) ve alhidade'nin ortasında bulunan bir deliğe sokulan ve bunları bir arada tutan merkezi pindir. Bu pimin ucundaki deliğe sokulan 'at' (feres) adı verilen küçük bir kama veya vida, disklerin ve örümceğin yerinden çıkmasını engeller. Mihver'in geometrik kusursuzluğu, aletin tüm ölçümlerinin doğruluğunu belirler; eğer pim eğri veya gevşekse, tüm gökyüzü modeli kayar. İslam ustaları, mihver'i sertleştirilmiş çelikten veya pirinç alaşımından döverek, sürtünmeyi minimize eden ve yüzlerce yıl dayanacak bir eksen yaratmışlardır. Koleksiyonda mihver, usturlabın 'kalp atışı' olarak sergilenir; gökyüzü bu pim etrafında döner, zaman bu pimle ölçülür."}, {"id": "a356b", "slug": "yeni-a356b-neyrizi-kuresel-usturlap-yorumlari", "title": "en-Neyrîzî'nin Küresel Usturlap Yorumları", "creator": "el-Fadl b. Hâtim en-Neyrîzî", "kisa": "en-Neyrîzî'nin küresel usturlap üzerine yazdığı ve aletin geometrik ispatlarını, kullanım kılavuzlarını içeren; Harrânî geleneğini sistematize eden kurucu metin.", "uzun": "en-Neyrîzî'nin Küresel Usturlap Yorumları, İslam astronomisinin yalnızca alet üretmekle kalmayıp, onun ardındaki 'soyut matematiği' de nasıl kurduğunun belgesidir. 'Kitâb fî el-'Amel bi-l-Asturlâb el-Kuravî' adlı risalesi, bu konudaki Arapça metinlerin en erken ve en sistematik olanıdır. en-Neyrîzî, küresel usturlap üzerindeki dairelerin (ekliptik, ekvator, meridyen) kesişimlerini ve küresel trigonometri problemlerinin alet üzerinde nasıl çözüleceğini adım adım ispatlamıştır. Onun bu eseri, yüzyıllar sonra İspanya'da Kastilya Kralı X. Alfonso'nun 'Libros del saber de astronomia' adlı eserine çevrilerek Avrupa'ya aktarılmıştır. İlginçtir ki, bu alet tipi Avrupa'da pratikte pek ilgi görmemiş, ancak teorik mirası Rönesans astronomisini derinden etkilemiştir. Koleksiyonda bu metin, 'aletin zihinsel tasarımı'nı temsil eder."}, {"id": "a357", "slug": "yeni-a357-usturlap-asma-halkasi", "title": "Usturlap Asma Halkası", "creator": "İslam Alet Yapımcıları Geleneği", "kisa": "Usturlabın üst kısmındaki kürsîye monte edilen, aletin dik konumda asılarak yerçekimiyle hizalanmasını sağlayan halka; ölçümlerin doğruluğu için kritik referans noktası.", "uzun": "Usturlap Asma Halkası, aletin 'yerçekimi referansı'dır; gökyüzü bu halkadan sarkar. Kürsî'ye (taht/kaide) monte edilen bu halka sayesinde usturlap dik konumda tutulur ve alhidade ile ön yüzdeki mukantaralar, ufuk düzlemine matematiksel olarak paralel hale gelir. Halka olmadan usturlap yalnızca süslü bir pirinç levhadır; halka ile birlikte o, gökyüzünü avuca indiren bir 'yerçekimi referanslı bilgisayar'a dönüşür. İslam ustaları, halkanın ağırlık merkezini ve kürsî'nin geometrisini öyle ayarlamışlardır ki, alet rüzgârda veya elde titrediğinde bile dengede kalır. Bu basit ama dahiyan tasarım, modern şakül (çekül) ve su terazisi mantığının astronomiye uygulanmasıdır. Koleksiyonda asma halkası, büyük bilimin küçük ama kusursuz mekanik sırlarını temsil eder; yerçekiminin astronomiyle buluştuğu tek noktadır."}, {"id": "a358", "slug": "yeni-a358-gosterge-ucu", "title": "Gösterge Ucu (Merâğa Aletleri)", "creator": "Müeyyededîn el-Urdî", "kisa": "Merâğa aletlerinde D çemberi yüzünde kayan göstergenin ucu; açısal okumanın yapıldığı, parallax hatasını minimize edecek şekilde tasarlanmış sivri ama yassı pirinç temas noktası.", "uzun": "Gösterge Ucu, Merâğa aletlerinde açısal okumanın yapıldığı hassas temastır. D çemberi (veya ilgili ölçekli yay) yüzünde kayan bu uç, gözlemcinin nişangâhı hedefe kilitledikten sonra açıyı okuduğu noktadır. Ucun sivri ama yassı formu, parallax (göz kayması) hatasını minimize etmek için tasarlanmıştır. Bu mikro-bileşen, rasathane aletlerinin 'okuma arayüzü'dür; devasa yapıların ürettiği devasa veriler, bu küçücük pirinç ucun gösterdiği milimetrelik çizgide anlam kazanır. El-Urdî'nin tasarımında, gösterge ucu yalnızca bir 'iğne' değil, aynı zamanda bir 'dönüştürücü'dür; açısal mesafeyi doğrusal bir okumaya çevirir. Koleksiyonda gösterge ucu, gözlemcinin gözü ile matematiksel veri arasındaki son ve en kritik köprüdür."}, {"id": "a358b", "slug": "yeni-a358b-kilavuz-ray", "title": "Kılavuz Ray (Cetvel Pergeli Yatağı)", "creator": "Müeyyededîn el-Urdî", "kisa": "Merâğa'nın Mükemmel Aleti'nde, cetvel pergeli başının dikey olarak inip çıktığı; iki dikey sütundan oluşan ve pergel bacaklarının uzunluğuna uygun boyda hazırlanmış kılavuz ray.", "uzun": "Kılavuz Ray, Merâğa'nın Mükemmel Aleti'nin 'ray sistemi'dir. El-Urdî'nin tarifine göre, 'İçinde cetvel pergeli başının aşağı yukarı hareket edebilecek kılavuz rayı, pergel bacaklarının uzunluğuna uygun bir boyda hazırlanmış iki dikey sütundan meydana gelir.' Bu ray, cetvel pergelinin tepe noktasının dikey olarak yukarı ve aşağı hareket etmesini sağlar. Rayın pürüzsüzlüğü ve dikeyliği, gözlemin hatasını sıfıra indiren kritik faktördür. Pergelin ayakları tabanda ufki olarak bulunan geniş ölçü tahtası içine sağa sola hareket edecek şekilde yerleştirilir. Bu sayede gözlemci, nişangâhı hedefe kilitledikten sonra açısal mesafeyi doğrudan ölçekten okuyabilir. Koleksiyonda kılavuz ray, büyük bilimin küçük ama kusursuz mekanik sırlarını temsil eder; rasathane aletlerinin 'kaba devler' değil, saatçilik hassasiyetinde tasarlanmış 'makine'ler olduğunu gösterir."}, {"id": "a359", "slug": "yeni-a359-demir-eksen", "title": "Demir Eksen (Döner Haç Düzenek)", "creator": "Müeyyededîn el-Urdî", "kisa": "Merâğa'nın Mükemmel Aleti'nde, ölçü tahtasını ve haç şeklindeki bütünün ortasını taşıyan; taştan bir temel üzerinde dönen, demirden yapılmış merkezi eksen.", "uzun": "Demir Eksen (Döner Haç Düzenek), Merâğa'nın Mükemmel Aleti'nin 'omurgası'dır. El-Urdî'nin tarifine göre, 'Eksen taştan, tahta bir sandık ile kaplı bir temele oturtulur. Eksenin üst ucuna ölçü tahtasını taşıyan haç şeklindeki bütünün ortası oturtulur. Bu, madeni eksenin etrafında haç şeklinde dönebilecek durumdadır.' Bu demir eksen, aletin tüm hareketli parçalarını (cetvel pergeli, kılavuz ray, ölçü tahtası) bir arada tutar ve 360° azimut dönüşünü mümkün kılar. Eksenin pürüzsüzlüğü ve dikeyliği, gözlemin hatasını sıfıra indiren kritik faktördür. Taştan temel, titreşimi absorbe eder; tahta sandık ise metalin sıcaklık değişimlerinden etkilenmesini önler. Koleksiyonda demir eksen, büyük aletlerin 'kalp atışı'dır; gökyüzü bu eksen etrafında döner, zaman bu eksenle ölçülür."}, {"id": "a361", "slug": "yeni-a361-catal-pim", "title": "Çatal Pim (Enlem Halkası Mekanizması)", "creator": "Müeyyededîn el-Urdî", "kisa": "Merâğa'nın beş halkalı küresinde, ekliptik kutupları boyunca dönen enlem halkasının taşıyıcı çembere bağlanmasını ve serbestçe dönmesini sağlayan çatal formundaki metal pim.", "uzun": "Çatal Pim, Merâğa'nın beş halkalı küresinde 'eklem' görevi gören kritik bir mekanik bileşendir. Enlem halkası, ekliptik kutupları boyunca küçük bir meridyen çemberi olarak döner ve üzerinde iki nişangâh bulunur. Bu halkanın taşıyıcı çembere (B çemberi) bağlanması ve serbestçe dönmesi, çatal formundaki bir pim mekanizmasıyla sağlanır. Çatal pim, halkanın hem taşıyıcıya sabitlenmesini hem de kendi ekseni etrafında dönmesini mümkün kılar; bu, modern ekvatoryal kundaklardaki 'deklinasyon ekseni'nin erken bir versiyonudur. El-Urdî'nin bu tasarımı, birden fazla eksenin eşzamanlı ve bağımsız dönmesini sağlayan ilk rasathane mekanizmalarından biridir. Koleksiyonda çatal pim, büyük aletlerin küçük sırlarını anlatır; bir metal parçası, gökyüzünün iki eksenini birleştirir."}, {"id": "a362", "slug": "yeni-a362-tasiyici-cember", "title": "Taşıyıcı Çember (Kolur Halkası)", "creator": "Müeyyededîn el-Urdî", "kisa": "Merâğa küresinde ekliptik çemberini ve diğer iç halkaları sırtında taşıyan, gökyüzünün koordinat sistemlerini bir arada tutan kolur çemberi (B çemberi / el-halka el-hâmile).", "uzun": "Taşıyıcı Çember (Kolur Halkası / el-halka el-hâmile), Merâğa küresinin 'omurgası'dır. Bu çember, ekliptiği (A çemberi) ve diğer iç halkaları sırtında taşır; gökyüzünün koordinat sistemlerini bir arada tutan iskelettir. Taşıyıcı çemberin geometrik kusursuzluğu, tüm ölçümlerin temelini oluşturur; eğer bu çember eğilirse, tüm evren modeli çöker. El-Urdî, bu çemberi pirinçten döktürmüş ve üzerindeki derece taksimatını mikron hassasiyetinde kazıtmıştır. Çember, ekliptik kutupları etrafında döner ve enlem halkasının hareketini mümkün kılar. Bu tasarım, Ptoleme'nin armiller küresindeki 'taşıyıcı halka' kavramının İslam mühendisliğindeki en gelişmiş versiyonudur. Koleksiyonda taşıyıcı çember, astronomik aletlerin 'omurgası'dır; gökyüzünün ağırlığını taşıyan pirinç bir halka, kozmosun düzenini rasathanenin avlusuna indirir."}, {"id": "a376", "slug": "yeni-a376-kadranlar-bolumu", "title": "Kadranlar Bölümü (Rub' ve Gölge Aletleri)", "creator": "İslam Muvakkit ve Astronomi Geleneği", "kisa": "İslam astronomisinin ve zaman ölçümünün (muvakkithane) en yaygın, en pratik ve matematiksel olarak en yoğun alet ailesi; rub' (çeyrek daire), sinüs kadranı, gölge kareleri ve mevsimsel saatler.", "uzun": "Kadranlar Bölümü, İslam astronomisinin 'halk düzeyindeki' karşılığıdır; büyük rasathane aletlerinin cami avlusuna inmiş halidir. Usturlabın pahalı ve karmaşık pirinç işçiliğine alternatif olarak geliştirilen çeyrek daire (rub') formu, tek bir yüzeyde hem gözlem (nişangâhla yükseklik ölçme) hem de hesaplama (sinüs/kosinüs, tanjant/kotanjant, gölge kareleri) işlevlerini birleştirir. İslam matematikçilerinin (el-Battânî, Ebü'l-Vefâ) küresel trigonometriye kattığı sinüs ve tanjant fonksiyonları, bu kadranların üzerine kazınan 'mebsût' ve 'menküs' çizgileriyle somutlaşır. Cami avlularında, medreselerde ve denizcilikte kullanılan bu aletler, namaz vakitlerinin, kıble yönünün ve coğrafi koordinatların belirlenmesinde standart donanımdı. Koleksiyonda bu bölüm, matematiğin halkın günlük ibadet ve yaşam ritmine indiği; soyut cebirin pirinç bir çeyrek daire üzerinde nasıl 'okunabilir' bir pratiğe dönüştüğünün haritasıdır. Bilim-ibadet-eğitim üçlüsünün kesiştiği noktadır."}, {"id": "a385", "slug": "yeni-a385-kible-pusulasi", "title": "Kıble Pusulası", "creator": "İslam Muvakkit ve Denizcilik Geleneği", "kisa": "Manyetik pusula iğnesi ile üzerine farklı şehirlerden Mekke'nin yönünü (kıble) ve mesafesini gösteren koordinat haritası kazınmış kadranın birleşimi; cepte taşınabilir dini-astrofiziksel kompas.", "uzun": "Kıble Pusulası, İslam medeniyetinin dini bir vecibeyi (namazda Kâbe'ye dönmek) en ileri düzey matematik ve manyetizma bilgisiyle çözmesinin somut bir zaferidir. 13. yüzyıldan itibaren İslam coğrafyasının devasa boyutları (Endülüs'ten Çin'e), Müslüman seyyahların ve tüccarların bilinmeyen diyarlarda kıble yönünü bulmasını zorunlu kıldı. Muvakkitler, usturlapların veya kadranların arka yüzüne, dünyanın farklı bölgelerinden Mekke'ye olan azimut açılarını (kıble yönü) ve mesafeleri içeren detaylı bir koordinat haritası kazıdılar. Bu haritanın merkezine ise manyetik bir pusula iğnesi yerleştirildi. Kullanıcı pusulayı yere yatay olarak koyup kuzeyi bulduğunda, kadran üzerindeki harita sayesinde kendi bulunduğu şehirden Mekke'nin tam hangi derecede olduğunu görebiliyor ve namazını o yöne yönelerek eda edebiliyordu. Osmanlı döneminde bu aletler, padişahların sefer çadırlarında ve kervanbaşların heybelerinde bulunan vazgeçilmez birer 'cep rasathanesi' idi. Kıble pusulası, manyetizmanın pratik hayata ve ibadete entegre edildiği, İslam jeodezisinin en zarif mekanik uygulamasıdır."}, {"id": "a390", "slug": "yeni-a390-anatomik-resim-serileri", "title": "Anatomik Resim Serileri (Beşli Seri)", "creator": "İslam Anatomi Geleneği (Teşrih)", "kisa": "İnsan bedeninin iskelet, sinir, kas, atardamar ve üreme sistemlerini şematik olarak özetleyen; kadavra diseksiyonu yerine 'zihinsel harita' çıkaran beşli anatomik çizim serisi.", "uzun": "Anatomik Resim Serileri (Beşli Seri), İslam ve erken Rönesans tıp yazmalarında (örneğin Mansûr b. İlyas'ın 14. yüzyıldaki 'Teşrîh-i Manşurî'si veya Bodleian Fraser 201 yazması) karşılaşılan, insan bedeninin sistemlerini şematik olarak özetleyen ikonografik bir devrimdir. İslam dünyasında kadavra diseksiyonu (teşrih), dini hassasiyetler nedeniyle nadiren yapılırdı. Bu açığı kapatmak için İslam hekimleri, İskenderiye kökenli antik bilgileri ve İbn Sînâ ile İbn en-Nefîs'in (küçük kan dolaşımını bulan hekim) teorik fizyoloji keşiflerini birleştirerek 'beşli seri' adı verilen standartlaştırılmış çizimler ürettiler. Bu şemalarda beden, gerçekçi bir et yığını olarak değil; iskelet, sinir ağı, kas lifleri, atardamar/toplardamar ağacı ve üreme organları (genellikle hamile bir rahim ve embriyo ile) gibi 5 ayrı 'katman' veya 'sistem' halinde, sanki bir elektrik devresi şeması gibi çizilirdi. Bu çizimler, tıp öğrencilerinin ameliyat masasına geçmeden önce bedenin 'iç mimarisini' zihinlerinde 3 boyutlu olarak canlandırmalarını sağlayan pedagojik araçlardı. Vesalius'un 16. yüzyılda çizeceği modern anatominin görsel altyapısı, bu İslam şemalarının Avrup
