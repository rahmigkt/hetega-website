kül ile işaretlenmiş noktaya kadar olan mesafenin, hareketli bacağın uzunluğuna oranı, nişan alınan yüksekliğin kosinüs değerini doğrudan verir. Bu basit ama derin geometri, küresel trigonometrinin pratik bir uygulamasıdır ve uzun hesaplamaları mekanik bir okumaya indirger. Koleksiyonda bu alet, «yoksul malzeme-zengin matematik» ilkesinin simgesidir; ahşap ve pirinç, gökyüzünün en soyut açılarını somut sayılara dönüştürür."}, {"id": "p105-9", "slug": "astronomi-105-9-azimut-olcen-buyuk-yarim-daire", "name": "Azimut ve Yükseklik Aleti", "category": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Takiyyeddîn'in İstanbul Rasathanesi için tasarladığı azimut-yükseklik aleti, gökyüzünü iki eksende birden tarayabilen evrensel bir gözlem düzeneğidir. Toplam 220 cm yüksekliğindeki pirinç skala ve 167 cm'lik kiriş cetveli, dönemin en büyük hassas mekanik düzenekleri arasındadır. Alet, modern teleskop kundaklarının 'altazimut' prensibinin 16. yüzyıldaki habercisidir."}, {"id": "p105-10", "slug": "astronomi-105-10-dikey-olcek-uzerinden-sinus-belirleme-aleti", "name": "Dikey Ölçek üzerinden sinüs Belirleme Aleti", "category": "Astronomi", "creator": "Müeyyededin el-Urdi", "has_img": 1, "desc": "el‐Urdi'nin 7. ve 8. aletleri, «genişletilmiş paralaks cetveli» olarak tanımlanır: dikey olarak döndürülebilen payanda, herhangi bir azimut için ayarlanabildiğinden kullanım alanı 7. aletten daha büyüktür. Paralaks (ikhtilaf el‐manzar), Ay ve gezegenlerin gerçek konumunu belirlemenin anahtarıdır; bu cetveller, sorunu mekanik bir okumaya indirger. 8. alet, bir yıldızın yüksekliğini ve azimutunu birlikte vererek bir dizi astronomi problemini çözer. Koleksiyonda bu ikili, Merağa ekolünün «problemi alete çevirme» yönteminin en verimli örneklerindendir."}, {"id": "p105-11", "slug": "astronomi-105-11-duvar-kadran", "name": "Duvar Kadran", "category": "Astronomi", "creator": "Müeyyededin el-Urdi", "has_img": 1, "desc": "Duvar kadranı, gök cisimlerinin meridyenden geçiş yüksekliklerini ölçen rasathane aletlerinin en temel ve en hassas olanıdır. el-Battani'den beri İslam dünyasında bilinen bu alet, Merağa'da Müeyyededin el-Urdi'nin elinde anıtsal boyutlara ulaşmıştır: tik ağacından kadranın yarıçapı yaklaşık 2,5 metreyi buluyordu. Merkezine takılan ve yarıçapa eşit uzunluktaki alhidade ile güneşin yüksekliği, ekliptik eğimi ve gözlem yerinin enlemi belirleniyordu. Model, el-Urdi'nin Aletler Kitabı'ndaki çizimlere dayanır."}, {"id": "p106-12", "slug": "astronomi-106-12-halkali-kure", "name": "Çemberli Küre (İstanbul Rasathanesi)", "category": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "İstanbul Rasathanesi Çemberli Küresi, Takiyyeddîn'in 1577'de kurduğu rasathanenin en gözde ve en karmaşık aletlerinden biriydi. Antik Çağ'dan beri gökyüzünün 3 boyutlu bir modelini oluşturmak için kullanılan 'armiller küre' (zât el-halak) geleneği, Takiyyeddîn tarafından 16. yüzyılın imkanlarıyla yeniden yorumlanmıştır. Bu küre, iç içe geçen ve üzerinde hassas derece bölüntüleri (taksimat) bulunan bronz halkalardan oluşuyordu. Takiyyeddîn, Merâğa'daki el-Urdî'nin tespit ettiği metal halkaların kendi ağırlıklarıyla esneme (sehim) sorununu çözmek için, halkaların kalınlık/çap oranlarını yeniden hesaplamış ve pirinç yataklardaki sürtünmeyi minimize eden yeni mafsal sistemleri icat etmiştir. Bu küre sayesinde, 1577'de İstanbul semalarında beliren meşhur 'Büyük Kuyruklu Yıldız'ın yörüngesi ve paralaksı, Tycho Brahe'nin Danimarka'daki rasathanesiyle neredeyse aynı günlerde ve aynı hassasiyetle ölçülmüştür. Takiyyeddîn'in bu küresi, İslam astronomisinin Avrupa Bilimsel Devrimi ile eşzamanlı ve bağımsız olarak zirveye ulaştığının en somut fiziksel kanıtıdır."}, {"id": "p106-13", "slug": "astronomi-106-13-ahsap-kadran", "name": "Ahşap Duvar Kadranı", "category": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Takiyyeddîn'in V. aleti; alhidadeli büyük ahşap duvar kadranı."}, {"id": "p106-14", "slug": "astronomi-106-14-paralaks-cetveli", "name": "Genişletilmiş Paralaks Cetveli", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî", "has_img": 1, "desc": "el‑Urdî'nin 7. ve 8. aletleri, «genişletilmiş paralaks cetveli» olarak tanımlanır: dikey olarak döndürülebilen payanda, herhangi bir azimut için ayarlanabildiğinden kullanım alanı 7. aletten daha büyüktür. Paralaks (ikhtilâf el‑manzar), Ay ve gezegenlerin gerçek konumunu belirlemenin anahtarıdır; bu cetveller, sorunu mekanik bir okumaya indirger. 8. alet, bir yıldızın yüksekliğini ve azimutunu birlikte vererek bir dizi astronomi problemini çözer. Koleksiyonda bu ikili, Merâğa ekolünün «problemi alete çevirme» yönteminin en verimli örneklerindendir."}, {"id": "p106-15", "slug": "astronomi-106-15-yukseklikleri-ve-azimutlari-olcmeye-yarayan-alet", "name": "Yükseklikleri ve Azimutları Ölçmeye Yarayan Alet", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî", "has_img": 1, "desc": "Yükseklik ve Azimut Ölçme Aleti, el-Urdî'nin Merâğa rasathane envanterindeki sekizinci aletidir. Gözlemci için en zorlu görevlerden biri, gökyüzünde hızla ilerleyen bir cismin (örneğin bir kuyruklu yıldız veya gezegen) hem yüksekliğini hem de azimutunu eşzamanlı olarak kaydetmektir; çünkü biri ölçülürken diğeri değişir. el-Urdî, yatay (azimut) dairesi ile dikey (yükseklik) kadranını iç içe geçen döner eksenlerle birleştirerek bu sorunu çözmüştür. Alet, silindirik bir duvar veya kule üzerine yerleştirilmiş, taksimatlı (dereceli) çemberler ve makara-ip düzenekleriyle donatılmıştı. Gözlemci nişangâhı cisme doğrulttuğunda, hem yatay düzlemdeki gösterge azimutu, hem de dikey düzlemdeki gösterge yüksekliği aynı anda okunabiliyordu. Bu 'bileşik koordinat okuma' sistemi, modern rasathanelerdeki 'Alt-Azimuth' (Altazımunt) kundaklarının felsefi ve mekanik atasıdır. Tycho Brahe'nin yüzyıllar sonra Hven adasındaki rasathanesinde kurduğu benzer aletler, doğrudan bu Merâğa geleneğinin mirasçılarıdır."}, {"id": "p106-16", "slug": "astronomi-106-16-duvar-kadrani", "name": "Duvar Kadranı (İstanbul)", "category": "Astronomi", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Meridyen yükseklikleri ölçen büyük duvar kadranı."}, {"id": "p107-17", "slug": "astronomi-107-17-paralaks-cetveli", "name": "Paralaks Cetveli", "category": "Astronomi", "creator": "İslam rasathane geleneği", "has_img": 1, "desc": "Paralaks ölçümü için cetvel; teyit bekliyor."}, {"id": "p107-18", "slug": "astronomi-107-18-cift-bacakli-alet", "name": "Çift Bacaklı Alet", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî", "has_img": 1, "desc": "Çift Bacaklı Alet (el-Âle Zât eş-Şu'beteyn), el-Urdî'nin beşinci aletidir ve rasathanenin en anıtsal yapılarından biriydi. Ptoleme'nin 'Üçlü Cetvel' (Paralaktik Kurallar) geleneğinden esinlenerek tasarlanan bu alet, gökyüzü cisimlerinin meridyenden geçerkenki (öğlen) maksimum yüksekliklerini ölçmek için kullanılıyordu. Aletin en kritik yeniliği, 'çift bacak' (şu'beteyn) adı verilen destek yapısı ve ucunda bulunan hassas şakül (çekül) sistemiydi. Dönemin devasa ahşap ve metal aletleri, kendi ağırlıkları veya rüzgâr gibi dış etkenler nedeniyle milimetrik eğilmelere maraz kalabiliyor, bu da açısal ölçümlerde ciddi hatalara yol açıyordu. el-Urdî, aletin dikey düzlemini sürekli olarak denetlemek ve gerekirse kalibre etmek için ayarlanabilir şaküller ekleyerek, aletin mutlak dikeyliğini garanti altına almıştır. Bu mekanik zekâ, Merâğa Rasathanesi'nin ekliptik eğimi (meyl) ölçümlerinde Antik Çağ'ın ve erken İslam döneminin verilerini aşmasını sağlamıştır."}, {"id": "p107-19", "slug": "astronomi-107-19-duvar-kadrani", "name": "Duvar Kadranı", "category": "Astronomi", "creator": "Tycho Brahe", "has_img": 1, "desc": "Tycho Brahe'nin 1576'da inşa ettiği Quadrans maximus, yaklaşık 6 metre yarıçapıyla Avrupa'nın en büyük duvar kadranıydı. Ancak bu anıtsal tasarımın öncülleri, Merâğa ve İstanbul rasathanelerindeki dev kadranlardır; duvar kadranı geleneği el-Battânî'den beri İslam dünyasında yaşıyordu. Tycho'nun kadranı, İslam rasathane mühendisliğinin Avrupa'ya dolaylı mirasının bir anıtı olarak okunmalıdır."}, {"id": "p107-20", "slug": "astronomi-107-20-yildizlarin-birbirlerinden-uzakliklarini-olcme-sekstanti21-duvar-kadra", "name": "Sekstant (Tycho Brahe, sextans astronomicus)", "category": "Astronomi", "creator": "Takiyyeddin er-Rasıd", "has_img": 1, "desc": "Takiyyeddin'in 'el-ale el-müşebbehe bi-l-menatık' adını verdiği bu alet, yıldızlar arası açısal mesafeleri ölçmek için İstanbul Rasathanesi'nde kullanılmıştır ve mucidinin kendi buluşu olarak kayda geçmiştir. İki nişangah ve bir ölçekten oluşan basit ama kesin geometri, Tycho Brahe'nin benzer aletleriyle çarpıcı bir koşutluk gösterir; bu benzerlik, 16. yüzyıl Osmanlı-Avrupa astronomisinin ortak teknik diline işaret eder."}, {"id": "p107-21", "slug": "astronomi-107-21-zodyak-halkali-kure", "name": "Çemberli Küre, Tycho Brahe'nin", "category": "Astronomi", "creator": "Tycho Brahe", "has_img": 1, "desc": "Tycho Brahe'nin Hven'deki çemberli küresi, bu antik aletin Avrupa'daki en rafine versiyonudur. Tycho'nun halkaları, İslam «dev alet» geleneğinin gözlem felsefesinden devralınan hassasiyetle üretilmiştir. Küre, armiller geleneğin teleskop öncesi son zirvesidir."}, {"id": "p108-22", "slug": "astronomi-108-22-kirisli-alet", "name": "Kirişli Alet", "category": "Astronomi", "creator": "Takiyyeddin er-Rasıd", "has_img": 1, "desc": "'İpli aletler' anlamına gelen alat zat el-evtar, Takiyyeddin'in gerilmiş ipleri optik nişangah gibi kullandığı yenilikçi bir gözlem düzeneğidir. İplerin oluşturduğu geometri, gök cisimlerinin konumlarını metal cetveller olmadan da hassas biçimde ölçmeyi mümkün kılıyordu. Bu tasarım, Osmanlı gözlem geleneğinin pratik zekasının ve malzeme bağımsız mühendislik arayışının simgesidir."}, {"id": "p108-23", "slug": "astronomi-108-23-yukseklik-ve-azimut-olcme-aleti", "name": "Yükseklik ve Azimut Ölçme Aleti", "category": "Astronomi", "creator": "Tycho Brahe", "has_img": 1, "desc": "Hven Rasathanesi aletleri —büyük duvar kadranı, sekstant ve çemberli küre— Merağa ve İstanbul rasathanelerinin Avrupa'daki yankısıdır. Takiyyeddin'in aletlerine dair haberler Avrupa'ya çok erken ulaşmıştı; Tycho'nun hassas gözlem programı, aynı gözlem felsefesinin son halkasıdır."}, {"id": "p108-24", "slug": "astronomi-108-24-ahsap-buyuk-kadran", "name": "Ahşap Büyük Kadran", "category": "Astronomi", "creator": "Tycho Brahe", "has_img": 1, "desc": "Tycho Brahe'nin 1576'da inşa ettiği Quadrans maximus, yaklaşık 6 metre yarıçapıyla Avrupa'nın en büyük duvar kadranıydı. Ancak bu anıtsal tasarımın öncülleri, Merağa ve İstanbul rasathanelerindeki dev kadranlardır; duvar kadranı geleneği el-Battani'den beri İslam dünyasında yaşıyordu. Tycho'nun kadranı, İslam rasathane mühendisliğinin Avrupa'ya dolaylı mirasının bir anıtı olarak okunmalıdır."}, {"id": "p108-25", "slug": "astronomi-108-25-jaipur-rasathanesi", "name": "Jaipur Rasathanesi Aletleri", "category": "Astronomi", "creator": "Sawai Jai Singh II", "has_img": 1, "desc": "Jaipur Samrat Yantra'sı, Jai Singh II kompleksinin en büyük güneş saatidir; 27 metrelik gnomonun gölgesi, mermer yaylar üzerinde gözle izlenebilir bir hızla ilerler. Bu anıt, çıplak göz astronomisinin son büyük mimari ürünüdür."}, {"id": "p108-26", "slug": "astronomi-108-26-yildizlarin-yuksekliklerini-ve-azimutlarini-belirlemeye-yarayan-duzene", "name": "Yıldızların Yüksekliklerini ve Azimutlarını Belirlemeye Yarayan Düzenek", "category": "Astronomi", "creator": "Müeyyededin el-Urdi", "has_img": 1, "desc": "el-Urdi'nin sekizinci aleti, bir gök cisminin hem yüksekliğini hem azimutunu aynı anda belirleyebilen çok işlevli bir düzeneğidir. Dönen payandası ve azimut ayarı sayesinde gözlemci, gökyüzünün herhangi bir noktasını hızla hedefleyebiliyordu. Bu tasarım, yüzyıllar sonra Avrupa'da ortaya çıkacak 'her iki yöne döndürülebilir azimut kadranı'nın açık bir öncüsüdür."}, {"id": "p110-1", "slug": "astronomi-110-1-nast-lus-un-2-usturlabi", "name": "Nastulus'un 2. Usturlabı", "category": "Usturlaplar", "creator": "Nastülüs", "has_img": 1, "desc": "Tutulma Diski (Şâfiha el-Küsûfiyye), İslam astronomisinde 'kestirim' (prediction) biliminin mekanik bir araca dönüştürülmüş halidir. Orta Çağ'da tutulmaların ne zaman gerçekleşeceğini hesaplamak, astronomlar için aylar süren küresel trigonometri işlemleri gerektiren korkutucu bir görevdi. Nastülüs ve onun izinden giden Bağdatlı ustalar, usturlabın içine yerleştirilebilen özel bir levha (şâfiha) tasarladılar. Bu diskin üzerinde, Ay'ın düğümleri (nodes), Güneş'in ve Ay'ın günlük hareketleri ve ekliptik ile Ay yörüngesinin kesişim açıları kazınmıştı. Kullanıcı, zîc'ten (astronomik çizelgelerden) aldığı temel verileri disk üzerindeki göstergelere ayarladığında, diskin mekanik kesişimleri ona tutulmanın tam saatini, hangi burçta gerçekleşeceğini ve tutulmanın büyüklüğünü (fazını) doğrudan gösteriyordu. Bu diskler, İslam dünyasında astrolojik danışmanlık yapan saray müneccimleri için hayati bir 'hızlı hesaplama motoru' idi. Aynı zamanda, tutulmaların bilimsel olarak önceden tahmin edilebilir doğa olayları olduğunu halka gösteren en somut 'bilimsel gösteri' araçlarıydı."}, {"id": "p110-2", "slug": "astronomi-110-2-abbasi-halifesi-el-muktef-nin-o-295-908-oglu-olan-ca-fer-b-al-el-mukte", "name": "Abbasi Halifesi el-Müktefî için Usturlap", "category": "Usturlaplar", "creator": "Abbasi atölyesi", "has_img": 1, "desc": "el-Müktefî için imal edilmiş Abbasi usturlabı; havuzda birebir a-id yok."}, {"id": "p110-3", "slug": "astronomi-110-3-h-mid-b-al-el-v-sit-nin-usturlabi", "name": "Küresel Usturlap (Kustâ b. Lükâ geleneği)", "category": "Usturlaplar", "creator": "Hamîd b. Ali el-Vâsıtî", "has_img": 1, "desc": "Kustâ b. Lükâ'nın küresel usturlap geleneğini sürdüren Vâsıtî imzalı alet."}, {"id": "p111-4", "slug": "astronomi-111-4-arap-orneginin-rekonstruksiyonu-olarak-ortaya-cikmis-en-eski-latin-ust", "name": "Arap örneğinin rekonstrüksiyonu olarak ortaya çıkmış en eski Latin usturlabıdır", "category": "Usturlaplar", "creator": "İspanyol-Gotik atölye", "has_img": 1, "desc": "14. yüzyıl İspanyol-Gotik usturlabı, Endülüs geleneğini devralan Latin Hristiyan atölyelerinin ürünüdür. Kürsi formu ve gravür üslubunda Gotik estetik görülür; ancak matematiksel iskelet tamamen İslam kökenlidir. Bu alet, usturlabın İslam dünyasından Avrupa'ya «tercüme» edilişinin simgesidir."}, {"id": "p111-5", "slug": "astronomi-111-5-380-990-yilinda-fransa-da-imal-edilmis-olup-papa-ii-sylvester-e-atfedi", "name": "380/990 Yılında Fransa'da İmal Edilmiş, Papa II. Sylvester'e Atfedilen Usturlap", "category": "Usturlaplar", "creator": "Müeyyededin el-Urdi ve ekibi", "has_img": 1, "desc": "Merağa Rasathanesi aletleri, el‐Urdi'nin Aletler Kitabı'ndaki (yazma: İstanbul, III. Ahmet 3329) ayrıntılı tariflerle günümüze ulaşan en eksiksiz rasathane donanımıdır: duvar kadranı, ekinoksal çember, beş halkalı küre, çift kadranlı ve çift bacaklı aletler, paralaks cetvelleri ve «Mükemmel Alet». Hugo Seemann'ın rekonstrüksiyonları, bu metinlerden model üretimini mümkün kılmıştır. Hulagu himayesindeki Merağa, takım çalışması ve sistemli veri üretimiyle modern rasathanenin prototipidir. Koleksiyonda grup, İslam bilim tarihinin «altın standart» donanımıdır; her alet, bir metodolojinin maddi karşılığıdır."}, {"id": "p111-6", "slug": "astronomi-111-6-muhammed-b-es-sa-r-420-1029-tarafindan-toledo-da-yapilan-orjinale-daya", "name": "Muhammed b. eş-Şaffar (420/1029) tarafından toledo'da yapılan orjinale dayanılarak yapılmış usturlap", "category": "Usturlaplar", "creator": "Muhammed b. eş-Şaffar", "has_img": 1, "desc": "Muhammed b. eş‐Şaffar, 11. yüzyıl Kurtuba'sının önde gelen alet yapımcılarından ve usturlap üzerine risale yazarlarından biridir; onun adıyla anılan usturlap, Endülüs okulunun gravür zarafetini ve matematik titizliğini taşır. İbn eş‐Şaffar'ın «usturlap yapımı» risalesi, imalat sürecini adım adım anlatan erken el kitaplarından olup, zanaat bilgisinin yazıya geçerek kurumsallaştığını gösterir. Bu metinler, Latince çeviri hareketiyle Avrupa'ya ulaşan «usturlap el kitapları» geleneğinin de kaynağıdır. Koleksiyonda İbn eş‐Şaffar usturlabı, Hama'iri ve Nastülus ile birlikte Endülüs atölyelerinin üçüncü büyük imzasıdır; bir aletin aynı zamanda bir «kitap» gibi okunabildiği geleneğin kanıtıdır."}, {"id": "p111-7", "slug": "astronomi-111-7-478-1086-yilinda-valencia-da-i-spanya-i-br-h-m-b-sa-d-es-sehl-tarafind", "name": "İbrâhîm b. Sa'îd es-Sehlî'nin Usturlabı (1086)", "category": "Usturlaplar", "creator": "İbrahim b. Sa'îd es-Sehlî", "has_img": 1, "desc": "Valensiya'da imal edilmiş Endülüs usturlabı."}, {"id": "p112-8", "slug": "astronomi-112-8-472-1079-yilinda-saragossa-da-i-spanya-ahmed-b-muhammed-en-nakk-s-tara", "name": "Ahmed b. en-Nakkâş'ın Usturlabı (1079)", "category": "Usturlaplar", "creator": "Ahmed b. Muhammed en-Nakkâş", "has_img": 1, "desc": "Saragossa'da imal edilmiş Endülüs usturlabı."}, {"id": "p112-9", "slug": "astronomi-112-9-613-1216-yilinda-sevilla-da-muhammed-b-fut-h-el-ham-ir-tarafindan-imal", "name": "613/1216 Yılında Sevilla'da Muhammed b. Futuh el-Hama'iri Tarafından İmal Edilen Usturlap", "category": "Usturlaplar", "creator": "Muhammed b. Futuh el-Hama'iri", "has_img": 1, "desc": "Muhammed b. Futuh el-Hama'iri, Endülüs'ün en ünlü alet yapımcılarından biridir; 1216 tarihli bu usturlap, Mağrib okulunun gravür zarafetini ve matematik olgunluğunu yansıtır. Farklı enlemler için hazırlanmış plakalar ve yıldız adlarını taşıyan örümcek (ankebut), aletin hem gözlem hem eğitim amaçlı kullanıldığını gösterir. Bu usturlap, Endülüs alet yapımının geç döneme dek süren canlılığının maddi belgesidir."}, {"id": "p112-10", "slug": "astronomi-112-10-usturlap-619-1222-yilinda-sam-da-eyyubi-sultani-el-mu-azzam-s-b-eb-bek", "name": "Usturlap, İstanbul Deniz Müzesi'nde", "category": "Usturlaplar", "creator": "Osmanlı atölyesi", "has_img": 1, "desc": "İstanbul Deniz Müzesi koleksiyonundaki bu usturlap, aletin yalnız astronomide değil, denizcilikte de kullanıldığının kanıtıdır. «Deniz usturlabı» adıyla seyir pratiğine giren form, geminin enlemini belirlemede kamal ve Yakup sopasıyla birlikte kullanılıyordu. Bu parça, Osmanlı denizcilik geleneğinin günümüze ulaşan nadir bilimsel aletlerindendir."}, {"id": "p113-11", "slug": "astronomi-113-11-yaklasik-1500-lerden-bir-avrupa-usturlabi-sitilinde-martin-brunold-abt", "name": "Martin Brunold Yapımı Avrupa Usturlabı", "category": "Usturlaplar", "creator": "Martin Brunold", "has_img": 1, "desc": "Brunold atölyesinin Avrupa usturlabı rekonstrüksiyonu."}, {"id": "p113-12", "slug": "astronomi-113-12-7-13-yuzyildan-bir-arap-modele-dayanilarak-yapilmis-usturlap", "name": "13. yy Arap Modeline Dayanan Usturlap", "category": "Usturlaplar", "creator": "Arap atölyesi", "has_img": 1, "desc": "13. yy Arap modeline dayalı replika; teyit bekliyor."}, {"id": "p113-13", "slug": "astronomi-113-13-650-12521-yilinda-misir-da-abdulker-m-el-misr-tarafindan-eyyubi-el-esr", "name": "Abdülkerîm el-Mısrî'nin Usturlabı (1252)", "category": "Usturlaplar", "creator": "Abdülkerîm el-Mısrî", "has_img": 1, "desc": "Ahmed b. es-Serrâc'ın evrensel usturlabı, Memlük topraklarında gelişen evrensel alet geleneğinin en kapsamlı sentezidir. Libros del saber'deki tariflere dayanarak rekonstrükte edilen model, kulplu ve asma halkalı ana, üç iç disk ve ibreden oluşur. Serrâc'ın aleti, klasik usturlap geleneğinin son büyük zirvesidir."}, {"id": "p114-17", "slug": "astronomi-114-17-15-9-yy-sonu-semsedd-n-muhammed-sa-r-tarafindan-imal-edilmis-bize-ulas", "name": "Şemseddîn Muhammed eş-Şaffâr'ın Usturlabı", "category": "Usturlaplar", "creator": "Şemseddîn Muhammed eş-Şaffâr", "has_img": 1, "desc": "Şaffâr ailesinin 15. yy geleneğinden günümüze ulaşan beş usturlaptan biri."}, {"id": "p114-18", "slug": "astronomi-114-18-i-ran-sahi-ii-abb-s-icin-1057-1647-yilinda-muhammed-muk-m-el-yezd-tara", "name": "İran Şahı II. 'Abbas İçin 1057/1647'de Muhammed Mukim el-Yezdi Tarafından Yapılan Usturlap", "category": "Usturlaplar", "creator": "Muhammed Mukim el-Yezdi", "has_img": 1, "desc": "Muhammed Mukim el-Yezdi imzalı bu usturlap, Safevi dönemi İran alet yapımını temsil eder. Zarif ajurlu örümceği ve hat sanatıyla işlenmiş kitabeleri, usturlabın yalnız bir bilim aleti değil, aynı zamanda bir sanat nesnesi olduğunu gösterir. Yezdi ekolü, klasik usturlap geleneğinin son büyük okullarındandır."}, {"id": "p115-19", "slug": "astronomi-115-19-bu-usturlap-1570-civarinda-gualterus-arsenius-un-atolyesinde-imal-edil", "name": "Gualterus Arsenius Atölyesi Usturlabı (1570)", "category": "Usturlaplar", "creator": "Gualterus Arsenius", "has_img": 1, "desc": "Arsenius atölyesinin 1570 tarihli usturlabı."}, {"id": "p115-20", "slug": "astronomi-115-20-17-yuzyila-ait-bir-usturlapin-replikasi", "name": "17. yy Usturlap Replikası", "category": "Usturlaplar", "creator": "", "has_img": 1, "desc": "17. yy usturlap replikası; teyit bekliyor."}, {"id": "p115-21", "slug": "astronomi-115-21-martin-brunold-abtwil-i-svicre-tarafindan-ogretim-amacli-imal-edilmis-", "name": "Martin Brunold Öğretim Amaçlı Usturlap", "category": "Usturlaplar", "creator": "Martin Brunold", "has_img": 1, "desc": "Brunold atölyesinin ders amaçlı sadeleştirilmiş usturlabı."}, {"id": "p116-22", "slug": "astronomi-116-22-el-b-r-n-nin-o-440-1048-kuresel-usturlabi", "name": "el-Bîrûnî'nin Küresel Usturlabı", "category": "Usturlaplar", "creator": "Ebû Reyhân el-Bîrûnî", "has_img": 1, "desc": "Câbir b. Sinan el-Harrânî'nin küresel usturlabı, düzlem usturlabın üç boyutlu karşılığı olarak gök küresini döner bir küre üzerine izdüşürür. Mecra kadranıyla donatılan bu alet, İslam alet yapımı geleneğinin en özgün tasarımlarındandır. Küresel usturlap, 3./9. yüzyıl astronomlarının matematiksel yaratıcılığının pirince dökülmüş kanıtıdır."}, {"id": "p116-23", "slug": "astronomi-116-23-el-marr-kus-nin-7-13-yuzyilin-ikinci-yarisi-kuresel-usturlabi", "name": "el-Marrâkuşî'nin Küresel Usturlabı", "category": "Usturlaplar", "creator": "Hasan el-Marrâkuşî", "has_img": 1, "desc": "İbn el‑Heysem'in «âlet el‑inkâs» (yansıma aleti), düzlem, küresel, silindirik ve konik aynalarda yansıma yasalarını deneysel olarak ölçen bir optik laboratuvarıdır. Bu alet, aynı zamanda Avrupa'da «Problema Alhazeni» (Alhazen's Problem) olarak bilinen ünlü geometri probleminin çözümünde kullanılmıştır: «Verilen bir noktadan çıkan ışığın, küresel bir aynadan yansıyarak başka bir noktaya ulaşması». Bu problem, 4. dereceden denklemlere götürmüş; Avrupa'da Fermat, Huygens ve l'Hôpital gibi dev matematikçileri yüzyıllarca meşgul etmiştir. İbn el‑Heysem'in aleti, yalnız optik değil, aynı zamanda cebir ve konik kesitler geometrisinin de pratik laboratuvarıdır. Koleksiyonda bu düzenek, İslam‑Avrupa matematik diyaloğunun en kalıcı düğüm noktasını temsil eder; bir optik aleti, aslında bir denklem çözme makinesidir."}, {"id": "p116-24", "slug": "astronomi-116-24-en-neyr-z-nin-erken-4-10-yuzyil-kuresel-usturlabi", "name": "en-Neyrîzî'nin Küresel Usturlap Yorumu", "category": "Usturlaplar", "creator": "el-Fadl b. Hâtim en-Neyrîzî", "has_img": 1, "desc": "el‑Fadl b. Hâtim en‑Neyrîzî, 10. yüzyılın en yetkin matematikçi‑astronomlarından biridir ve Öklid'in Elementler'ine yazdığı şerhlerin yanı sıra, küresel usturlap ve gözlem aletleri üzerine de kurucu metinler kaleme almıştır. Onun küresel usturlap yorumları, düzlem usturlabın üç boyutlu karşılığının geometrik ispatlarını ve kullanım kılavuzlarını içerir. en‑Neyrîzî'nin çalışmaları, Harrânî ve Kustâ b. Lükâ geleneğini sistematize ederek, küresel trigonometrinin alet üzerindeki pratik uygulamalarını gösterir. Koleksiyonda bu metinler, İslam astronomisinin yalnızca alet üretmekle kalmayıp, bu aletlerin matematiksel teorilerini de yazıya döken bir «alet felsefesi» kurduğunun kanıtıdır."}, {"id": "p116-25", "slug": "astronomi-116-25-1070-1660-yilindan-bir-kuresel-usturlap", "name": "1070/1660 Yılından Bir Küresel Usturlap", "category": "Usturlaplar", "creator": "Kusta b. Lüka", "has_img": 1, "desc": "Kusta b. Lüka'nın küresel usturlabı, aynı geleneğin bir diğer önemli temsilcisidir; Baalbekli Hristiyan-Arap bilgin, çevirileri ve özgün eserleriyle Bağdat okulunun alet literatürünü zenginleştirmiştir. Küresel usturlap risalesi, Harrani'nin eseriyle birlikte okunmuş ve Avrupa'ya aktarılmıştır."}, {"id": "p117-26", "slug": "astronomi-117-26-bu-kadranin-orijinali-735-1335-yilinda-al-b-es-sih-b-tarafindan-yapilm", "name": "'Alî b. eş-Şihâb'ın Sinüs Kadranı (1335)", "category": "Usturlaplar", "creator": "Ali b. eş-Şihâb", "has_img": 1, "desc": "Muhammed b. el-Guzûlî kazıması sinüs kadranı."}, {"id": "p117-27", "slug": "astronomi-117-27-cift-kadranli-sekk-ziyye-rub-es-sekk-ziyye-cem-ledd-n-abdull-h-b-hal-l", "name": "Çift Kadranlı Şekkâziyye", "category": "Usturlaplar", "creator": "Cemâleddîn el-Merîdînî", "has_img": 1, "desc": "«Şakkâziyye» (veya Şakkâzîya), İslam astronomisinin en sofistik stereografik projeksiyon çözümlerinden biridir. Farklı enlemler için ayrı ayrı plaka (tabak) taşıma zorunluluğunu ortadan kaldıran bu evrensel disk/usturlap, tek bir «evrensel plaka» üzerinde tüm enlemlerdeki ufuk ve saat eğrilerini matematiksel bir sentezle birleştirir. Bu alet, ez-Zerkâlî'nin evrensel disk geleneğinin 14. yüzyıldaki (özellikle İbn eş-Şâtir ve Şam okulu) olgunlaşmış halidir. Şakkâziyye, kullanıcının coğrafyadan bağımsız olarak astronomik problemleri çözmesini sağlayan bir «analog bilgisayar»dır. Koleksiyonda bu alet, İslam matematiğinin projeksiyon geometrisindeki üstünlüğünün; pirinç üzerine kazınmış evrensel bir dilin kanıtıdır."}, {"id": "p117-28", "slug": "astronomi-117-28-15-9-yuzyilda-el-m-rid-n-nin-aletinin-veya-baska-bir-arap-modelin-imit", "name": "Çift Kadran (el-Merîdînî imitasyonu)", "category": "Usturlaplar", "creator": "Avrupa atölyesi", "has_img": 1, "desc": "Mebsût ve menküs çizgili güneş kadranı (rub'), İslam dünyasının en yaygın zaman ölçme aletidir; gölge skalaları küresel trigonometriye dayanır. Muvakkit geleneği binlerce böyle kadran üretmiş, cami muvakkithaneleri bu aletlerle donatılmıştır. Bu bölüm, kadran tiplerini ve matematik temellerini sergiler."}, {"id": "p118-29", "slug": "astronomi-118-29-peter-apian-a-ait-meteoroskop", "name": "Peter Apian Meteoroskopu", "category": "Usturlaplar", "creator": "Peter Apian", "has_img": 1, "desc": "Campanus ekvatoryumunun Almanya'daki devamı."}, {"id": "p118-30", "slug": "astronomi-118-30-18-yuzyildan-bir-avrupa-kadraninin-rekonstruksiyonu", "name": "18. yüzyıldan bir Avrupa kadranının rekonstrüksiyonu", "category": "Usturlaplar", "creator": "Kastilyalı X. Alfonso / ez-Zerkali geleneği", "has_img": 1, "desc": "Kastilya Kralı X. Alfonso'nun 1277'de derlettiği Libros del saber de astronomia, ez-Zerkali'nin evrensel diskinin (Saphaea) Arapça'dan Kastilya İspanyolcasına ve Latince'ye çevrilerek Avrupa'ya mal edildiği anıtsal eserdir. Bu rekonstrüksiyon, Toledo Çeviri Okulu'nun çok kültürlü (İslam, Hristiyan, Yahudi) entelektüel işbirliğinin somut bir ürünüdür. Disk üzerindeki İspanyolca ve Latince terminoloji, İslam astronominin teknik dilinin Avrupa dillerine nasıl kazındığını gösterir. Koleksiyonda bu rekonstrüksiyon, iki kültürün aynı gökyüzünü okumak için nasıl işbirliği yaptığının; bilimin sınırları ve dinleri aşan evrensel doğasının belgesidir."}, {"id": "p118-31", "slug": "astronomi-118-31-kadran-diski", "name": "Kadran Diski", "category": "Usturlaplar", "creator": "İslam geleneği", "has_img": 1, "desc": "Tanjant kadranı, gölge uzunluğunu dikey çubuğun boyuna oranlayarak güneş yüksekliğini «tanjant» fonksiyonu üzerinden okutan kadrandır; bu basit oran, İslam matematikçilerinin trigonometriye armağan ettiği fonksiyonların pratik karşılığıdır. «Rub'» ailesinin bu üyesi, usturlabın pahalı pirinç işçiliğine gerek duymadığı için «muvakkitin halk aleti» sayılmış; cami zaman ofislerinde ve medrese derslerinde yaygınlaşmıştır. Kadranın skalaları, azlâl (gölge tabloları) literatürüyle birlikte okunur; her şehir için ayrı enlem skalası hazırlanırdı. Koleksiyonda tanjant kadranı, matematiksel bir keşfin (tanjant) gündelik bir alete dönüşümünün simgesidir; bilim‑ibadet‑eğitim üçlüsünün kesiştiği noktadır."}, {"id": "p118-32", "slug": "astronomi-118-32-dest-r-kadrani", "name": "Destur Kadranı", "category": "Usturlaplar", "creator": "İslam muvakkit geleneği", "has_img": 1, "desc": "«Diğer Aletler» bölümü, standart usturlap ve kadran kategorilerine sığmayan, İslam astronomlarının özgün mühendislik ve geometri çözümlerini barındıran bir «icatlar laboratuvarı»dır. Ebû Mahmûd el-Hucendî'nin 10. yüzyılda icat ettiği «Kapsamlı Alet» (el-Âle eş-Şâmile), tek bir mekanizmada hem yükseklik hem de enlem ölçümünü birleştiren devrimci bir cihazdır. Yine bu bölümde yer alan «üç ipli gözlem sopası», Bernard Michel'in rekonstrüksiyonuyla canlandırılan, ip ve sopanın küresel trigonometriye dönüştüğü yoksul ama dahiyan bir düzendir. Bu aletler, İslam astronomisinin yalnızca Yunan mirasını devralan değil, sahadaki gözlem zorluklarını aşmak için sürekli yeni aletler (âlât) tasarlayan dinamik bir bilim olduğunu kanıtlar. Koleksiyonda bu bölüm, rasathane aletlerinin «kapalı katalog» dışındaki, deneysel ve yaratıcı yüzünü temsil eder."}, {"id": "p120-1", "slug": "astronomi-120-1-eb-ca-fer-el-h-zin-in-ekvatoryumunun-z-c-gravuru", "name": "Zîc eş-Şafâ'ih (Ekvatoryum)", "category": "Astronomi", "creator": "Ebû Ca'fer el-Hâzîn", "has_img": 1, "desc": "Zîc eş-Şafâ'ih, adını usturlabın enlem dairelerini taşıyan 'şafiha' (levha) kelimesinden alan ve astronomik çizelgelerle (zîc) birleşen özel bir gözlem geleneğini temsil eder. 4./10. yüzyılın önde gelen astronomu Ebû Ca'fer el-Hâzîn'in bu aleti, gök cisimlerinin konumlarını hem sayısal çizelgelerle hem de levha üzerindeki geometrik izdüşümle doğrulama imkânı sunuyordu. Bu yaklaşım, İslam astronomisinde kuram ile gözlem aleti arasındaki kopmaz bağın erken bir kanıtıdır. Aletin çalışma prensibi, gezegenlerin ekliptik üzerindeki konumlarını, önceden hesaplanmış çizelgelere gerek kalmadan, mekanik bir disk üzerinde okumayı mümkün kılıyordu. Bu, modern anlamda bir 'analog bilgisayar'ın erken formu olarak değerlendirilebilir. Zîc eş-Şafâ'ih geleneği, İslam dünyasında sonraki yüzyıllarda geliştirilen ekvatoryumların (eş-Şafiha ez-Zîciyye, Tabak el-Menâtık) doğrudan öncülüdür. Avrupa'ya aktarıldığında 'equatorium' adını almış ve 16. yüzyıla kadar astronomik hesaplamalarda kullanılmıştır. Bu alet, İslam biliminin yalnızca teorik değil, aynı zamanda pratik ve mühendislik boyutunu da temsil eden somut bir kanıttır."}, {"id": "p120-2", "slug": "astronomi-120-2-el-h-zin-in-ekvatoryumunun-hareketli-parcalari", "name": "el-Hâzîn Ekvatoryumunun Hareketli Parçaları", "category": "Astronomi", "creator": "Ebû Ca'fer el-Hâzîn", "has_img": 1, "desc": "Zîc eş-Şafâ'ih, adını usturlabın enlem dairelerini taşıyan 'şafiha' (levha) kelimesinden alan ve astronomik çizelgelerle (zîc) birleşen özel bir gözlem geleneğini temsil eder. 4./10. yüzyılın önde gelen astronomu Ebû Ca'fer el-Hâzîn'in bu aleti, gök cisimlerinin konumlarını hem sayısal çizelgelerle hem de levha üzerindeki geometrik izdüşümle doğrulama imkânı sunuyordu. Bu yaklaşım, İslam astronomisinde kuram ile gözlem aleti arasındaki kopmaz bağın erken bir kanıtıdır."}, {"id": "p120-3", "slug": "astronomi-120-3-i-bn-es-semh-in-ekvatoryumu", "name": "İbn es-Semh'in Ekvatoryumu", "category": "Astronomi", "creator": "İbn es-Semh", "has_img": 1, "desc": "Novara'lı Campanus'un iç içe döndürülebilir disklerden oluşan ekvatoryumu, Endülüs'te doğan ekvatoryum geleneğinin (İbn es-Semh, ez-Zerkâlî) Latin Avrupa'sına aktarım zincirinin halkasıdır. Gezegen boylamlarını hesapsız, mekanik yolla veren bu alet, İslam astronomi aletçiliğinin Avrupa hesaplama astronomisinin zeminini nasıl hazırladığını gösterir. Aynı gelenek hattı, el-Kâşî ve Chaucer'de kendi versiyonlarını üretecektir."}, {"id": "p120-4", "slug": "astronomi-120-4-i-bn-es-semh-in-ekvatoryum-parcallari", "name": "İbn es-Semh Ekvatoryum Parçaları", "category": "Astronomi", "creator": "İbn es-Semh", "has_img": 1, "desc": "İbn es-Semh ekvatoryumunun parçaları."}, {"id": "p121-5", "slug": "astronomi-121-5-es-saf-ha-ez-z-ciyye-ez-zerk-l-nin-ekvatoryumu", "name": "Eş-şafiha ez-Ziciyye ez-Zerkali'nin Ekvatoryumu", "category": "Astronomi", "creator": "Ebû İshâk ez-Zerkâlî", "has_img": 1, "desc": "ez-Zerkâlî Ekvatoryumu (Safiha Zîciyye), İslam dünyasının 'analog bilgisayar' tarihindeki en büyük devrimlerinden biridir. 11. yüzyılda bir astronomun Mars'ın veya Jüpiter'in gökyüzündeki konumunu (boylamını) bulması için, Ptoleme'nin episikl ve eksantrik modellerine dayalı, saatler süren küresel trigonometri hesaplamaları yapması gerekirdi. ez-Zerkâlî, bu zihinsel yükü ortadan kaldırmak için iç içe geçen bronz disklerden, kayar cetvellerden ve gerilmiş iplerden oluşan bir 'mekanik simülatör' icat etti. Kullanıcı, diskin dışındaki takvimi o günün tarihine ayarladığında, içerideki gezegen diskleri (Merkür, Venüs, Mars, Jüpiter, Satürn) otomatik olarak o günkü konumlarına hizalanıyor ve kullanıcı gezegenin burcunu ve derecesini doğrudan okuyabiliyordu. Bu alet, Endülüs üzerinden Avrupa'ya geçmiş, Kastilya Kralı X. Alfonso'nun 'Libros del saber' adlı eserinde 'Lámina universal' olarak detaylandırılmış ve 14. yüzyılda Avrupa'daki meşhur 'Equatorium' geleneğini başlatmıştır. Koleksiyondaki modern rekonstrüksiyonlar, ez-Zerkâlî'nin bu kayıp mekanik dehasını, günümüz ziyaretçilerinin fiziksel olarak dokunup deneyimleyebileceği bir formda yeniden canlandırmaktadır."}, {"id": "p121-6", "slug": "astronomi-121-6-novarali-campanus-un-ekvatoryumu", "name": "Novaralı Campanus'un Ekvatoryumu", "category": "Astronomi", "creator": "Novara'lı Campanus", "has_img": 1, "desc": "Novara'lı Campanus'un iç içe döndürülebilir disklerden oluşan ekvatoryumu, Endülüs'te doğan ekvatoryum geleneğinin (İbn es-Semh, ez-Zerkali) Latin Avrupa'sına aktarım zincirinin halkasıdır. Gezegen boylamlarını hesapsız, mekanik yolla veren bu alet, İslam astronomi aletçiliğinin Avrupa hesaplama astronomisinin zeminini nasıl hazırladığını gösterir. Aynı gelenek hattı, el-Kaşi ve Chaucer'de kendi versiyonlarını üretecektir."}, {"id": "p121-7", "slug": "astronomi-121-7-novarali-campanus-un-ekvatoryumu", "name": "Novaralı Campanus'un Ekvatoryumu", "category": "Astronomi", "creator": "Novara'lı Campanus", "has_img": 1, "desc": "Novara'lı Campanus'un iç içe döndürülebilir disklerden oluşan ekvatoryumu, Endülüs'te doğan ekvatoryum geleneğinin (İbn es-Semh, ez-Zerkali) Latin Avrupa'sına aktarım zincirinin halkasıdır. Gezegen boylamlarını hesapsız, mekanik yolla veren bu alet, İslam astronomi aletçiliğinin Avrupa hesaplama astronomisinin zeminini nasıl hazırladığını gösterir. Aynı gelenek hattı, el-Kaşi ve Chaucer'de kendi versiyonlarını üretecektir."}, {"id": "p121-8", "slug": "astronomi-121-8-equatorie", "name": "Chaucer'ın Ekvatoryumu", "category": "Astronomi", "creator": "Geoffrey Chaucer", "has_img": 1, "desc": "Geoffrey Chaucer'ın Orta İngilizce ekvatoryum metni, Arapça öncüllerin (ez‐Zerkali ve İbn eş‐Şatır hattı) Latin‐vernaküler kanallarla İngiltere'ye ulaştığının edebi‐bilimsel belgesidir. «Usturlap Üzerine Risale»siyle İngilizce bilim dilinin kurucusu sayılan Chaucer, ekvatoryumda da gezegen hesaplarını «çark ve disk» diliyle anlatır. Bu metin, Endülüs‐Toledo‐Paris‐Londra hattındaki bilgi akışının son halkalarındandır. Koleksiyonda Chaucer'ın ekvatoryumu, bilimin yalnız aletle değil, dille de seyahat ettiğinin kanıtıdır; bir şairin elinde gök mekaniği, halkın diline iner."}, {"id": "p122-9", "slug": "astronomi-122-9-el-k-s-nin-tabak-el-men-tik-i-ekvatoryum", "name": "el-Kâşî'nin Tabak el-Menâtık'ı", "category": "Astronomi", "creator": "Gıyâseddîn el-Kâşî", "has_img": 1, "desc": "Gıyâseddîn el-Kâşî'nin Nüzhet el-Hadâ'ik adlı eserinde tarif ettiği Tabak el-Menâtık (Bölgeler Tabağı), Semerkant ekolünün en gelişmiş ekvatoryumudur. Gezegenlerin burçlar kuşağındaki yaklaşmalarını ve boylam/enlemlerini mekanik olarak hesaplayan bu alet, ez-Zerkâlî ile başlayan geleneğin zirvesini temsil eder. Pi sayısını ondalık hanesiyle hesaplayan el-Kâşî, bu aletle gözlem astronomisini bir 'mekanik hesap makinesi'ne dönüştürmüştür."}, {"id": "p122-10", "slug": "astronomi-122-10-johannes-schoner-in-organum-uranicum-u-ekvatoryum", "name": "Johannes Schöner'in Organum Uranicum'u", "category": "Astronomi", "creator": "Johannes Schöner", "has_img": 1, "desc": "el-Kâşî geleneğinin Avrupa'daki yansımalarından Schöner'in ekvatoryumu."}, {"id": "p124-1", "slug": "astronomi-124-1-hint-dairesi", "name": "Hint Dairesi", "category": "Astronomi", "creator": "İslam Muvakkit Geleneği", "has_img": 1, "desc": "Hint Dairesi (ed-Dâ'ire el-Hindiyye), güneş saatlerinin en temel ve en kadim formudur. Dairenin merkezine bir gnomon (gölge çubuğu) sabitlenir; meridyen yönü, gölgenin daireye giriş ve çıkış noktaları belirlenerek tespit edilir. Gnomonun gölgesi, dairenin üzerindeki derece çizgilerini keserek günün saatini gösterir. Bu alet, Hindistan'daki güneş saati geleneğinden İslam dünyasına aktarılmış, muvakkitler tarafından geliştirilmiştir. Hint Dairesi, yalnızca saati değil, aynı zamanda meridyen çizgisini (kuzey-güney hattını) belirlemek için de kullanılır; bu sayede kıble yönü, namaz vakitleri ve coğrafi koordinatlar hesaplanabilir. Koleksiyonda Hint Dairesi, İslam biliminin 'çok kültürlü sentez' kapasitesinin kanıtıdır; Hindistan'ın güneş saati geleneği, İslam trigonometrisiyle birleşerek 'meridyen bilimi'ne dönüşmüştür. Bu alet, modern güneş saatlerinin ve gnomon tasarımlarının tarihsel atasıdır."}, {"id": "p124-2", "slug": "astronomi-124-2-meridyen-yonunu-belirleme-aleti", "name": "Meridyen, Yönünü Belirleme Aleti", "category": "Astronomi", "creator": "Johannes Regiomontanus", "has_img": 1, "desc": "Johannes Regiomontanus, Avrupa astronomisinin İslam mirasıyla kurduğu bağın kilit figürüdür. Arapça kaynaklardan (Battani, Zerkali) ve alet geleneğinden beslenen Regiomontanus, Ephemerides'i ve gözlem aletleriyle Avrupa'nın bilimsel uyanışını hızlandırmıştır. Koleksiyonda Regiomontanus, İslam astronomisinin Avrupa'daki «öğrencisi» ve «devamcısı»dır; bilginin sınırları aşan zincirinin halkasıdır."}, {"id": "p124-3", "slug": "astronomi-124-3-ucgenli-alet", "name": "Cetvel Pergeli (Mükemmel Alet Bileşeni)", "category": "Astronomi", "creator": "Müeyyededîn el-Urdî", "has_img": 1, "desc": "Merâğa ve İstanbul rasathanelerinin en karmaşık aletlerinden olan «Mükemmel Alet»in (veya paralaks cetvellerinin) kalbinde yer alan cetvel pergeli, devasa gözlem yayları üzerinde açıları ve mesafeleri mikron hassasiyetinde okumayı sağlayan bir mühendislik harikasıdır. Kılavuz ray üzerinde kayan, menteşeli ve ince ayar vidalarıyla donatılmış bu pergel/cetvel mekanizması, gözlemcinin nişangâhı hedefe kilitledikten sonra açısal mesafeyi doğrudan ölçekten okumasını sağlar. el-Urdî'nin Aletler Kitabı'nda ve Takiyyeddîn'in Sidretü Müntehâ'sında ayrıntılanan bu bileşen, rasathane aletlerinin «kaba devler» değil, saatçilik hassasiyetinde tasarlanmış «makine»ler olduğunu gösterir. Koleksiyonda bu bileşen, büyük bilimin küçük ama kusursuz mekanik sırlarını temsil eder."}, {"id": "p124-4", "slug": "astronomi-124-4-kapsamli-alet", "name": "Kapsamlı Alet (el-Âle eş-Şâmile, el-Hucendî)", "category": "Astronomi", "creator": "Ebû Mahmûd el-Hucendî", "has_img": 1, "desc": "el-Hucendî'nin icat ettiği Kapsamlı Alet (el-Âle eş-Şâmile), tek bir aletle çok çeşitli astronomik ölçümler yapmayı mümkün kılan devrim niteliğinde bir cihazdır. Oxford Hunt. 539 yazmasındaki çizime göre rekonstrükte edilen model, hem yükseklik hem enlem ölçümünü birleştirir. Bu alet, Hucendî'nin yalnız gözlemci değil, mucit bir mühendis olduğunun kanıtıdır."}, {"id": "p125-5", "slug": "astronomi-125-5-hint-dairesi", "name": "Hint Dairesi", "category": "Astronomi", "creator": "Michel rekonstrüksiyonu", "has_img": 1, "desc": "Üç ipli gözlem sopası, «Diğer Aletler» bölümünün en özgün düzeneklerindendir: 5°'lik yay uzunluklarını veren derecelendirme skalaları uygun bir sopa üzerine taşınır ve üç ip bu sopaya bağlanır; P kutbuna kurşun ağırlıklı bir ip sabitlenir. Gece kullanımı için güneş alçalım dairelerine başlıca sabit yıldızların deklinasyon daireleri eklenebilir. Michel, aletin kullanımını güneş yüksekliği bulma örneğiyle açıklamıştır. Bu basit ama derin düzenek, ip ve sopanın küresel trigonometriye dönüştüğü andır. Koleksiyonda üç ipli sopa, «yoksul malzeme‐zengin matematik» ilkesinin simgesidir."}, {"id": "p125-6", "slug": "astronomi-125-6-torquetum", "name": "Torquetum (Câbir b. Eflah geleneği)", "category": "Astronomi", "creator": "Câbir b. Eflah geleneği", "has_img": 1, "desc": "Câbir b. Eflah geleneğiyle anılan torquetum, ekliptik, ekvatoral ve ufuk koordinat sistemleri arasında dönüşüm yapan çok katmanlı bir alettir. İslam astronomi aletçiliğinden gelişen bu düzenek, orta çağ Avrupa'sında yoğun biçimde kullanılmıştır. Torquetum, İslam küresel astronomisinin Latin Batı'ya aktarımının simgelerinden biridir."}, {"id": "p126-7", "slug": "astronomi-126-7-hint-dairesi", "name": "Hint Dairesi", "category": "Astronomi", "creator": "Michel rekonstrüksiyonu", "has_img": 1, "desc": "Üç ipli gözlem sopası, «Diğer Aletler» bölümünün en özgün düzeneklerindendir: 5°'lik yay uzunluklarını veren derecelendirme skalaları uygun bir sopa üzerine taşınır ve üç ip bu sopaya bağlanır; P kutbuna kurşun ağırlıklı bir ip sabitlenir. Gece kullanımı için güneş alçalım dairelerine başlıca sabit yıldızların deklinasyon daireleri eklenebilir. Michel, aletin kullanımını güneş yüksekliği bulma örneğiyle açıklamıştır. Bu basit ama derin düzenek, ip ve sopanın küresel trigonometriye dönüştüğü andır. Koleksiyonda üç ipli sopa, «yoksul malzeme‐zengin matematik» ilkesinin simgesidir."}, {"id": "p126-8", "slug": "astronomi-126-8-al-re-s-o-970-1562-in-mir-t-i-k-in-t-min-l-t-i-i-rtif-adli-eserinde-bu", "name": "Sidi Ali Reis'in Torquetum'u", "category": "Astronomi", "creator": "İbn el-Heysem", "has_img": 1, "desc": "İbn el‐Heysem'in «Makale fi Dav' el‐Kamer» (Ay Işığı Üzerine Risale) adlı eseri için kurduğu deney düzeneği, deneysel bilimin en zarif ve en şiirsel kanıtlarından biridir: Ay ışığı, güneş ışığından nitelik olarak farklı mıdır, yoksa yalnızca yoğunluk farkı mı? Bu soruyu yanıtlamak için İbn el‐Heysem, iki ayna ve camera obscura kullanarak ay ışığını odaklamış; ancak odak noktasında hiçbir ısı artışı (yanma etkisi) gözlemleyememiştir. Bu «negatif sonuç», ay ışığının yalnızca yansıyan bir ışık olduğunu ve güneşin yakıcı ısısını taşımadığını kanıtlar. Düzenek, «deneyin, sezgiye karşı zaferi»nin maddi belgesidir. İbn el‐Heysem, optiği felsefi spekülasyondan koparıp laboratuvara indiren ilk bilim adamıdır; bu düzenek, modern astrofiziğin spektroskopi ve fotometri yöntemlerinin orta çağdaki prototipidir. Koleksiyonda ay ışığı düzeneği, İslam biliminin dogmaya değil, gözleme dayalı rasyonalitesinin vitrinidir."}, {"id": "p127-9", "slug": "astronomi-127-9-ekvatoral-halkali-gunes-saati", "name": "Ekvatoral Güneş Saati", "category": "Astronomi", "creator": "İslam muvakkit geleneği", "has_img": 1, "desc": "İslam şehirlerinin camilerine entegre edilen güneş saatleri (yalı saatleri, muvakkithane kadranları), ibadet ile bilimin en somut kesişim noktasıdır. Namaz vakitlerinin (özellikle ikindi ve yatsı) gölge uzunluklarına göre belirlenmesi zorunluluğu, küresel trigonometrinin ve gnomonik (gölge bilimi) pratiğinin sürekli gelişmesini sağlamıştır. Muvakkitler, her şehrin enlemine özel hesaplamlar yapar; «mebsût» ve «menküs» (tanjant ve kotanjant) çizgilerini mermer levhalara kazırlardı. Osmanlı döneminde bu saatler, mimari estetiğin bir parçası haline gelmiş; cami duvarlarına, avlu şadırvanlarına ve özel muvakkithane binalarına işlenmiştir. Koleksiyonda güneş saati, zamanın mekanik dişlilerden önce, taşın ve güneşin geometrisiyle nasıl okunduğunun; bilimin halkın günlük ibadet ritmine nasıl hizmet ettiğinin anıtıdır."}, {"id": "p127-10", "slug": "astronomi-127-10-masa-gunes-saati", "name": "Masa Güneş saati", "category": "Astronomi", "creator": "İbn el-Heysem", "has_img": 1, "desc": "İbn el‐Heysem'in «Makale fi Dav' el‐Kamer» (Ay Işığı Üzerine Risale) adlı eseri için kurduğu deney düzeneği, deneysel bilimin en zarif ve en şiirsel kanıtlarından biridir: Ay ışığı, güneş ışığından nitelik olarak farklı mıdır, yoksa yalnızca yoğunluk farkı mı? Bu soruyu yanıtlamak için İbn el‐Heysem, iki ayna ve camera obscura kullanarak ay ışığını odaklamış; ancak odak noktasında hiçbir ısı artışı (yanma etkisi) gözlemleyememiştir. Bu «negatif sonuç», ay ışığının yalnızca yansıyan bir ışık olduğunu ve güneşin yakıcı ısısını taşımadığını kanıtlar. Düzenek, «deneyin, sezgiye karşı zaferi»nin maddi belgesidir. İbn el‐Heysem, optiği felsefi spekülasyondan koparıp laboratuvara indiren ilk bilim adamıdır; bu düzenek, modern astrofiziğin spektroskopi ve fotometri yöntemlerinin orta çağdaki prototipidir. Koleksiyonda ay ışığı düzeneği, İslam biliminin dogmaya değil, gözleme dayalı rasyonalitesinin vitrinidir."}, {"id": "p127-11", "slug": "astronomi-127-11-masa-gunes-saati", "name": "Masa Güneş saati", "category": "Astronomi", "creator": "İbn el-Heysem", "has_img": 1, "desc": "İbn el‐Heysem'in «Makale fi Dav' el‐Kamer» (Ay Işığı Üzerine Risale) adlı eseri için kurduğu deney düzeneği, deneysel bilimin en zarif ve en şiirsel kanıtlarından biridir: Ay ışığı, güneş ışığından nitelik olarak farklı mıdır, yoksa yalnızca yoğunluk farkı mı? Bu soruyu yanıtlamak için İbn el‐Heysem, iki ayna ve camera obscura kullanarak ay ışığını odaklamış; ancak odak noktasında hiçbir ısı artışı (yanma etkisi) gözlemleyememiştir. Bu «negatif sonuç», ay ışığının yalnızca yansıyan bir ışık olduğunu ve güneşin yakıcı ısısını taşımadığını kanıtlar. Düzenek, «deneyin, sezgiye karşı zaferi»nin maddi belgesidir. İbn el‐Heysem, optiği felsefi spekülasyondan koparıp laboratuvara indiren ilk bilim adamıdır; bu düzenek, modern astrofiziğin spektroskopi ve fotometri yöntemlerinin orta çağdaki prototipidir. Koleksiyonda ay ışığı düzeneği, İslam biliminin dogmaya değil, gözleme dayalı rasyonalitesinin vitrinidir."}, {"id": "p127-12", "slug": "astronomi-127-12-yildiz-yuksekliklerini-dakikalarla-olcebilen-alet", "name": "Üç İpli Gözlem Sopası", "category": "Astronomi", "creator": "Michel rekonstrüksiyonu", "has_img": 1, "desc": "Üç ipli gözlem sopası, «Diğer Aletler» bölümünün en özgün düzeneklerindendir: 5°'lik yay uzunluklarını veren derecelendirme skalaları uygun bir sopa üzerine taşınır ve üç ip bu sopaya bağlanır; P kutbuna kurşun ağırlıklı bir ip sabitlenir. Gece kullanımı için güneş alçalım dairelerine başlıca sabit yıldızların deklinasyon daireleri eklenebilir. Michel, aletin kullanımını güneş yüksekliği bulma örneğiyle açıklamıştır. Bu basit ama derin düzenek, ip ve sopanın küresel trigonometriye dönüştüğü andır. Koleksiyonda üç ipli sopa, «yoksul malzeme‑zengin matematik» ilkesinin simgesidir."}, {"id": "p128-13", "slug": "astronomi-128-13-fransiz-gotik-mekanik-takvimi", "name": "Fransız-Gotik Takvim Aleti", "category": "Astronomi", "creator": "Avrupa atölyesi", "has_img": 1, "desc": "Dişli çark mekanizmalı bu Fransız-Gotik takvim aleti, usturlap geleneğinin mekanik saate evrildiği geçiş halkasıdır. Arap astronomisinin çizelge ve izdüşüm teknikleri, Gotik Avrupa'nın dişli çark mekaniğiyle birleşerek 'mekanik takvim' kavramını doğurmuştur. Bu alet, İslam astronomi mirasının Avrupa saatçiliğine sızan damarlarından biridir."}, {"id": "p128-14", "slug": "astronomi-128-14-mekanik-astronomik-takvimi", "name": "Mekanik Takvim (Muhammed b. Ebî Bekr)", "category": "Astronomi", "creator": "Muhammed b. Ebî Bekr el-İşfehânî", "has_img": 1, "desc": "618/1221 tarihli bu dişli çarklı mekanik takvim, el-Bîrûnî'nin 'Ay kutusu' (hukk el-kamer) ile tarif ettiği mekanik-astronomik geleneğin mükemmelleşmiş şeklidir. Güneş, Ay ve gezegenlerin konumlarını dişli çark oranlarıyla simüle eden düzenek, analog bilgisayar tarihinin en erken zirvelerinden biridir. el-Bîrûnî'den İşfehânî'ye uzanan bu hat, İslam mühendisliğinin sürekliliğini kanıtlar."}, {"id": "p130-1", "slug": "cografya-ve-seyrusefer-130-1-enlem-olcum-aleti", "name": "Enlem Ölçüm Aleti", "category": "Coğrafya ve Seyrüsefer", "creator": "İbn Mâcid geleneği", "has_img": 1, "desc": "a-113 (Yakup Sopası) ↔ a-302 (Kamal) teyidi bekliyor."}, {"id": "p130-2", "slug": "cografya-ve-seyrusefer-130-2-me-m-n-cografyacilarinin-dunya-haritasina-gore-yeryuzu-kuresi", "name": "Me'mun coğrafyacılarının dünya haritasına göre, Yeryüzü Küresi", "category": "Coğrafya ve Seyrüsefer", "creator": "", "has_img": 1, "desc": "Bağdat Rasathanesi'nde kağıt hamurundan yapılan yeryüzü küresi, kağıt teknolojisinin bilimsel alet yapımındaki erken kullanımının örneğidir. Me'mun döneminde üretilen küreler, düzeltilmiş Ptoleme coğrafyasının koordinatlarını somutlaştırıyordu. Bu küre, matematiksel coğrafyanın altın çağının mütevazı bir hatırasıdır."}, {"id": "p130-3", "slug": "cografya-ve-seyrusefer-130-3-d-v-dhau-dau", "name": "Dav (Dhau, Dau)", "category": "Coğrafya ve Seyrüsefer", "creator": "Hint Okyanusu atölyeleri", "has_img": 1, "desc": "Gemi modelleri bölümü, denizcilik tarihinin «üç boyutlu arşivi»dir: kadırgadan karavelaya, kalyondan buharlıya uzanan formlar,…"}, {"id": "p130-4", "slug": "cografya-ve-seyrusefer-130-4-vasco-da-gama-nin-deniz-usturlabi", "name": "Deniz Usturlabı (Vasco da Gama)", "category": "Coğrafya ve Seyrüsefer", "creator": "Portekiz denizcilik geleneği", "has_img": 1, "desc": "Denizcilik aletleri bölümü, Hint Okyanusu'ndan Akdeniz'e İslam seyir biliminin (ilm el‑bahr) araç kutusunu sergiler: kamal (düğümlü ip ve lata), Yakup sopası (balestilha), bağlantı sopası (backstaff), iskandil ve pusula ailesi. Modern araştırmaların gösterdiği gibi, İslam pusula diski sanıldığı gibi rüzgâr gülünden değil, 15 sabit yıldızın doğuş‑batış noktaları ile iki kutbun 32'lik bölümlemesinden doğmuştur; bu disk, Vasco da Gama'nın Roteiro'sunda bile izlenebilir. «Balık formu» iğne, Arap denizcilerinin en yaygın tipidir. Bölüm, açık denizde pozisyon belirlemenin matematik‑astronomi‑zanaat üçlüsüyle nasıl kurulduğunu anlatır; koleksiyonun denizcilik kanadının giriş kapısıdır."}, {"id": "p131-5", "slug": "cografya-ve-seyrusefer-131-5-yakup-sopasi", "name": "Yakup sopası", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam Astronomi ve Denizcilik Geleneği (Anonim / Kolektif)", "has_img": 1, "desc": "Gözlem aracı olarak anılır; gök cisimlerinin yükseklik açısını ölçen basit ama etkili sopa-lata-ip sistemi."}, {"id": "p131-6", "slug": "cografya-ve-seyrusefer-131-6-hint-okyanusu-denizcilerinin-dort-pusula-tipinden-biri", "name": "Pusula «İğne Evi» (beyt el-ibre)", "category": "Coğrafya ve Seyrüsefer", "creator": "Sidi Ali Reis / Süleyman el-Mehri", "has_img": 1, "desc": "Gemi pusulasında iğne mahfazası; Süleyman el-Mehrî geleneği."}, {"id": "p131-7", "slug": "cografya-ve-seyrusefer-131-7-yakup-sopasi", "name": "Yakup sopası", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam Astronomi ve Denizcilik Geleneği (Anonim / Kolektif)", "has_img": 1, "desc": "Haşabât (Hatabat), İslam bilim tarihinde 'basit aletlerin büyük işler başarması' ilkesinin en somut örneklerinden biridir. Temel yapısı son derece sadedir: bir ana sopa (veya çubuk), üzerinde kayan bir çapraz lata ve ölçüm ipleri. Ancak bu basitlik, arkasında derin bir trigonometrik bilgi birikimini barındırır. Aletin çalışma prensibi şudur: Gözlemci, sopanın bir ucunu gözüne dayar, çapraz latayı gök cismine (güneş, ay, yıldız) hizalar ve ip üzerindeki işaretlerden açıyı okur. Bu açı, trigonometrik tablolarla karşılaştırılarak gök cisminin yüksekliği ve dolayısıyla gözlemcinin enlemi belirlenir. Denizcilikte 'kamal' adıyla bilinen versiyonu, özellikle Hint Okyanusu'nda binlerce yıl kullanılmıştır. Kamal, farklı enlemler için farklı düğümler taşıyan bir ip ve küçük bir ahşap levhadan oluşuyordu; denizci, Kutup Yıldızı'nı levhanın üst kenarına, ufku alt kenarına hizalar ve ip üzerindeki düğümden enlemini okurdu. Bu alet, İslam denizcilerinin Afrika'nın doğu kıyılarından Çin'e, Endonezya'dan Doğu Afrika'ya kadar uzanan devasa ticaret ağlarını yönetmesini sağlamıştır. Avrupa'ya aktarıldığında 'Jacob's Staff' veya 'Cross-staff' adını almış, 15.-17. yüzyıllarda Portekiz ve İspanyol denizcilerinin vazgeçilmez aracı olmuştur. El-Kindî (ö. y. 873), bu aletin matematiksel temellerini risalesinde detaylandırmış; İbn Mâcid (15. yy) ise denizcilik pratiğindeki kullanımını anlatmıştır."}, {"id": "p131-8", "slug": "cografya-ve-seyrusefer-131-8-davis-kadrani", "name": "Davis Kadranı", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam denizcilik geleneği (İbn Macid, el-Mehri)", "has_img": 1, "desc": "Denizcilik aletleri bölümü, Hint Okyanusu'ndan Akdeniz'e İslam seyir biliminin (ilm el‐bahr) araç kutusunu sergiler: kamal (düğümlü ip ve lata), Yakup sopası (balestilha), bağlantı sopası (backstaff), iskandil ve pusula ailesi. Modern araştırmaların gösterdiği gibi, İslam pusula diski sanıldığı gibi rüzgar gülünden değil, 15 sabit yıldızın doğuş‐batış noktaları ile iki kutbun 32'lik bölümlemesinden doğmuştur; bu disk, Vasco da Gama'nın Roteiro'sunda bile izlenebilir. «Balık formu» iğne, Arap denizcilerinin en yaygın tipidir. Bölüm, açık denizde pozisyon belirlemenin matematik‐astronomi‐zanaat üçlüsüyle nasıl kurulduğunu anlatır; koleksiyonun denizcilik kanadının giriş kapısıdır."}, {"id": "p131-9", "slug": "cografya-ve-seyrusefer-131-9-osmanli-pusula-tipi", "name": "Osmanlı Pusula tipi", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam ve Avrupa atölyeleri", "has_img": 1, "desc": "Modern pusulaların ve haritaların vazgeçilmezi olan 32 kollu rüzgar gülü, sanıldığının aksine rüzgar yönlerinden değil, Hint Okyanusu denizcilerinin kullandığı 15 sabit yıldızın doğuş ve batış noktalarından türemiştir. Fuat Sezgin'in çığır açan araştırmaları, pusula diskindeki bu bölümlemenin, Arap denizcilerinin (İbn Macid) «hane» (ev/yıldız evi) sistemine dayandığını kanıtlar. Manyetik iğnenin üzerine monte edilen karton disk, bu astronomik mirası mekanik bir yön bulucuya dönüştürmüştür. Avrupa'ya geçen bu disk, Portekiz ve İtalyan gemicileri tarafından benimsenmiş; Akdeniz ve Atlantik keşiflerinin pusulası olmuştur. Koleksiyonda rüzgar gülü, astronominin denizciliğe, denizciliğin ise küresel coğrafyaya armağanıdır; bir karton parçası üzerinde yıldızların doğuşu, okyanusların fethine dönüşür."}, {"id": "p132-10", "slug": "cografya-ve-seyrusefer-132-10-hint-okyanusu-ndan-daha-gelismis-bir-pusula-tipi", "name": "Gelişmiş Denizcilik Pusulası", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam denizcilik geleneği", "has_img": 1, "desc": "Sîdî Alî Reis ve Süleyman el-Mehrî'nin metinlerinde tarif edilen gemi pusulası, «kardano» süspansiyonu ve 15 sabit yıldızın doğuş-batış isimlerini taşıyan diskiyle Hint Okyanusu seyir geleneğinin ürünüdür. Bu pusula diski, Portekiz «rüzgâr gülü»nün de temelini oluşturur. Deniz pusulası, İslam navigasyonunun Avrupa'ya armağan ettiği en etkili aletlerdendir."}, {"id": "p132-11", "slug": "cografya-ve-seyrusefer-132-11-pusula", "name": "Pusula", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam denizciliği", "has_img": 1, "desc": "Gemi pusulası."}, {"id": "p132-12", "slug": "cografya-ve-seyrusefer-132-12-denizcilik-bilgini-i-bn-m-cid-e-ait-pusula", "name": "İbn Mâcid'in Pusulası", "category": "Coğrafya ve Seyrüsefer", "creator": "Şihâbeddîn İbn Mâcid", "has_img": 1, "desc": "Hint Okyanusu'nun aslanı İbn Mâcid'in seyir risalelerinde detaylandırdığı pusula."}, {"id": "p132-13", "slug": "cografya-ve-seyrusefer-132-13-gercek-gemi-pusulasi", "name": "Gerçek Gemi Pusulası", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam ve Avrupa atölyeleri", "has_img": 1, "desc": "Modern pusulaların ve haritaların vazgeçilmezi olan 32 kollu rüzgar gülü, sanıldığının aksine rüzgar yönlerinden değil, Hint Okyanusu denizcilerinin kullandığı 15 sabit yıldızın doğuş ve batış noktalarından türemiştir. Fuat Sezgin'in çığır açan araştırmaları, pusula diskindeki bu bölümlemenin, Arap denizcilerinin (İbn Macid) «hane» (ev/yıldız evi) sistemine dayandığını kanıtlar. Manyetik iğnenin üzerine monte edilen karton disk, bu astronomik mirası mekanik bir yön bulucuya dönüştürmüştür. Avrupa'ya geçen bu disk, Portekiz ve İtalyan gemicileri tarafından benimsenmiş; Akdeniz ve Atlantik keşiflerinin pusulası olmuştur. Koleksiyonda rüzgar gülü, astronominin denizciliğe, denizciliğin ise küresel coğrafyaya armağanıdır; bir karton parçası üzerinde yıldızların doğuşu, okyanusların fethine dönüşür."}, {"id": "p133-14", "slug": "cografya-ve-seyrusefer-133-14-gemi-pusulasi", "name": "Gemi Pusulası", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam ve Avrupa atölyeleri", "has_img": 1, "desc": "Geminin yalpalanmasına rağmen iğnenin sabit kalmasını sağlayan gemi pusulası."}, {"id": "p133-15", "slug": "cografya-ve-seyrusefer-133-15-osmanli-pusula-tipi", "name": "Osmanlı Pusula Tipi", "category": "Coğrafya ve Seyrüsefer", "creator": "Osmanlı atölyesi", "has_img": 1, "desc": "Osmanlı denizciliğinde kullanılan, rüzgar güllü tipik Akdeniz pusulası."}, {"id": "p133-16", "slug": "cografya-ve-seyrusefer-133-16-gemi-pusulasi", "name": "Gemi Pusulası (Varyant 2)", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam ve Avrupa atölyeleri", "has_img": 1, "desc": "Süleyman el-Mehrî geleneğinden gemi pusulası varyantı."}, {"id": "p133-17", "slug": "cografya-ve-seyrusefer-133-17-gemi-pusulasi", "name": "Gemi Pusulası (Varyant 3)", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam ve Avrupa atölyeleri", "has_img": 1, "desc": "Kardan süspansiyon sisteminin erken formlarından gemi pusulası."}, {"id": "p134-18", "slug": "cografya-ve-seyrusefer-134-18-gemi-pusulasi", "name": "Gemi Pusulası (Varyant 4)", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam ve Avrupa atölyeleri", "has_img": 1, "desc": "Akdeniz ve Hint Okyanusu ticaret ağlarında kullanılan standart pusula."}, {"id": "p134-19", "slug": "cografya-ve-seyrusefer-134-19-gemi-pusulasi", "name": "Gemi Pusulası (Varyant 5)", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam ve Avrupa atölyeleri", "has_img": 1, "desc": "Piri Reis ve İbn Mâcid haritalarının arkasındaki temel yön bulma aleti."}, {"id": "p134-20", "slug": "cografya-ve-seyrusefer-134-20-namaz-pusulasi", "name": "Namaz Pusulası", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam muvakkit geleneği", "has_img": 1, "desc": "Kıble/namaz pusulası; a-305 (güneş saati) ↔ a-222 (pergel) teyidi."}, {"id": "p134-21", "slug": "cografya-ve-seyrusefer-134-21-arazi-olcum-pusulasi", "name": "Arazi Ölçüm Pusulası, İngiliz (1917)", "category": "Coğrafya ve Seyrüsefer", "creator": "İngiliz atölyesi", "has_img": 1, "desc": "Karşılaştırmalı sunulan 1917 tarihli İngiliz arazi ölçüm pusulası, İslam «mesaha» (ölçüm) geleneğinin modern mühendislikteki devamını gösterir. Arazi ölçüm pusulaları, orta çağ İslam kadastro ve mimari pratiğinin vazgeçilmez aletleriydi. Bu parça, ölçüm aletleri zincirinin günümüze uzanan halkasıdır."}, {"id": "p134-22", "slug": "cografya-ve-seyrusefer-134-22-cografi-pusula", "name": "Karton Pusula Diski", "category": "Coğrafya ve Seyrüsefer", "creator": "İslam+Avrupa atölyeleri", "has_img": 1, "desc": "Karton pusula diski, İslam denizciliğinin manyetik iğneye kattığı en önemli yeniliktir: iğnenin üzerine monte edilen karton disk, 32 kollu rüzgâr gülü ve —modern araştırmaların Fuat Sezgin'in gösterdiği gibi— 15 sabit yıldızın doğuş‑batış noktalarıyla bölümlenmiştir. Bu disk, Hint Okyanusu denizcilerinin pusula kullanımını profesyonel bir seyir aletine dönüştürür. «Kardano» süspansiyonu (iç içe halkalar), geminin yalpasında diski yatay tutar. Süleyman el‑Mehrî ve Sîdî Alî Reis'in metinleri, bu diskin kalibrasyonunu ayrıntıyla verir. Vasco da Gama'nın Roteiro'sunda bile izlenebilen bu disk, coğrafi keşiflerin teknik altyapısıdır. Koleksiyonda karton disk, pusulanın Çin'den kopup İslam dünyasında «akıllandığı» andır."}, {"id": "p136-1", "slug": "saatler-136-1-namaz-vakitlerini-belirlemek-i-cin-pergel", "name": "Namaz Vakitlerini Belirlemek İçin Pergel", "category": "Saatler", "creator": "Muvakkit Geleneği", "has_img": 1, "desc": "Namaz Vakitlerini Belirlemek İçin Pergel, muvakkit geleneğinin en zarif 'hesap makinelerinden' biridir: kolları güneş deklinasyonu ve enlem açılarını temsil eder; basit bir küresel geometri işlemiyle vakit açıları okunur. 27 cm'lik kol uzunluğu, avuç içi kullanım için idealdir; cami muvakkithanelerinde bu pergeller, usturlap ve rub' ile birlikte 'zaman ofisinin' standart donanımıydı. Namaz pergeli, toprağa derince kakılır; pergel tarafından çizilen gölgenin son noktası işaretlenir ve bu nokta ile içine sokulduğu yer arasındaki mesafe ölçülerek namaz vakti belirlenir. İbadet-bilim kaynaşmasının bu küçük aleti, astronomiyi halkın gündelik ritmine bağlar. Koleksiyonda namaz pergeli, 'bilimin ibadetle hizmetkarlığı' temasının simgesidir; büyük rasathane aletlerinin halk düzeyindeki karşılığıdır."}, {"id": "p136-2", "slug": "saatler-136-2-avize-saat", "name": "Avize Saat (İbn Yünis)", "category": "Saatler", "creator": "İbn Yünis", "has_img": 1, "desc": "İbn Yünis'e nispet edilen avize saat, sarkaç öncesi dönemin sallanmalı/ağırlıklı saat denemelerindendir. Kahire gözlem ve zaman ölçümü geleneği, böyle mekanik çözümleri beslemiştir. Avize saat, Avrupa mekanik saatine giden yolun erken halkalarından biri olarak anılır."}, {"id": "p136-3", "slug": "saatler-136-3-silindir-gunes-saati", "name": "Silindir Güneş Saati", "category": "Saatler", "creator": "İslam saat geleneği", "has_img": 1, "desc": "Silindirik formu, farklı enlemlerde kullanılabilmesini sağlayan güneş saati."}, {"id": "p136-4", "slug": "saatler-136-4-arap-geleneginde-pseudo-arsimet-su-saati", "name": "Clepsydra (antik su saati)", "category": "Saatler", "creator": "Arap geleneği (Pseudo-Arşimet)", "has_img": 1, "desc": "Doğu ve Kuzey Afrika saatleri bölümü, Kahire'den Kayravan'a, Fas'tan Endülüs'e uzanan bir zaman‑medeniyeti haritası çizer. İbn Yünis'in Kahire gözlem ve vakit hesaplama geleneği, muvakkit hanelerin kurumsal temelini oluşturmuş; su saatleri (clepsydra), güneş kadranları ve kum saatleri aynı «zaman ofisi» pratiğinde yan yana yaşamıştır. Kuzey Afrika, bu bilgiyi hem koruyan hem de Avrupa'ya (Sicilya ve İberya üzerinden) aktaran köprüdür. Bölüm, saatin yalnız bir mekanik nesne değil, ibadet, ticaret ve kent yaşamını düzenleyen kamusal bir kurum olduğunu gösterir. Koleksiyonda bu başlık, saatler zincirinin coğrafi omurgasıdır; İspanyol‑Arap ve Osmanlı halkalarıyla birlikte okunduğunda, Akdeniz'in «zaman ağı» görünür olur."}, {"id": "p136-5", "slug": "saatler-136-5-katipli-mum-saati", "name": "Kâtipli Mum Saati", "category": "Saatler", "creator": "İsmail el-Cezerî", "has_img": 1, "desc": "Kâtipli su saati, el-Cezerî'nin en ünlü otomatlarından biridir: ortada oturan kâtip figürü, elindeki yazı kamışıyla saatleri gösteren bir diski döndürür; galeri halkası 217,5 kısma bölünmüştür. Hidrostatiği estetikle birleştiren bu saat, «zamanın otomasyonu» kavramının orta çağdaki en şiirsel ifadesidir ve koleksiyonun en sevilen parçalarındandır."}, {"id": "p137-6", "slug": "saatler-137-6-su-saati", "name": "Su Saati", "category": "Saatler", "creator": "İsmail el-Cezerî", "has_img": 1, "desc": "el-Cezerî'nin el-Câmi' adlı eserindeki yolculuk saati, zincir ve terazi içermeyen, taşınabilir bir saat düzeneğidir. Yolculukta kullanılmak üzere tasarlanan bu kompakt düzenek, «seyahat saati» kavramının bilinen en erken örneklerindendir. el-Cezerî'nin yalnız anıtsal saatler değil, taşınabilir cihazlar da tasarladığını gösterir."}, {"id": "p137-7", "slug": "saatler-137-7-on-iki-kapili-mum-saati", "name": "On İki Kapılı Mum Saati", "category": "Saatler", "creator": "Endülüs saat geleneği", "has_img": 1, "desc": "İspanyol‑Arap saatleri bölümü, Endülüs'ün mekanik dehasını sergiler: el‑Murâdî'nin «Sırlar Kitabı»ndaki otomat‑saatler, ez‑Zerkâlî'nin cıvalı düzenekleri ve İbn eş‑Şâtir'in muvakkit aletleri, aynı geleneğin halkalarıdır. Toledo‑Kurtuba hattı, bu saat bilgisini Latince'ye aktararak Avrupa mekanik saatçiliğinin mayasını oluşturmuştur. Özellikle cıvanın ağırlık ve akışkanlık özelliklerinin saat mekanizmalarında (örneğin dönen disklerin balansında) kullanılması, Endülüs mühendisliğinin özgün buluşlarındandır. Kastilya Kralı X. Alfonso'nun Libros del saber'inde detaylanan bu saatler, İslam ve Hristiyan Avrupa'nın bilimsel işbirliğinin ürünüdür. Koleksiyonda bu bölüm, saatler zincirinin «köprü» halkasıdır; İskenderiye‑Bağdat‑Kurtuba‑Paris hattında zamanın mekanikleşme serüvenini anlatır."}, {"id": "p137-8", "slug": "saatler-137-8-ridv-n-es-s-t-nin-su-saati", "name": "Rıdvân es-Sâ'âtî'nin Su Saati", "category": "Saatler", "creator": "Rıdvân es-Sâ'âtî", "has_img": 1, "desc": "Rıdvân es-Sâ'âtî'nin ünlü su saati; havuzda karşılık aranıyor."}, {"id": "p137-9", "slug": "saatler-137-9-civayla-calisan-saati", "name": "Cıvayla Çalışan saati", "category": "Saatler", "creator": "el-Murâdî", "has_img": 1, "desc": "el-Murâdî'nin Sırlar Kitabı'nda tarif edilen ve daha sonra Alfons külliyatında karşımıza çıkan cıva saati, mekanik tarihinin en gizemli otomatlarından biridir. Cıvanın akışıyla elde edilen yavaş ve sürekli hareket, ağırlık ve zemberek tahrikli saatlerden önce 'düzenli hareket' arayışının ilk ciddi denemelerindendir. Endülüs otomat geleneğini Avrupa'ya bağlayan bu alet, sonraki yüzyılların astronomik saatlerinin atasıdır."}, {"id": "p137-10", "slug": "saatler-137-10-i-spanyol-arap-su-saati", "name": "İspanyol-Arap Su Saatleri", "category": "Saatler", "creator": "Endülüs saat geleneği (el-Muradi vb.)", "has_img": 1, "desc": "İspanyol‐Arap saatleri bölümü, Endülüs'ün mekanik dehasını sergiler: el‐Muradi'nin «Sırlar Kitabı»ndaki otomat‐saatler, ez‐Zerkali'nin cıvalı düzenekleri ve İbn eş‐Şatir'in muvakkit aletleri, aynı geleneğin halkalarıdır. Toledo‐Kurtuba hattı, bu saat bilgisini Latince'ye aktararak Avrupa mekanik saatçiliğinin mayasını oluşturmuştur. Özellikle cıvanın ağırlık ve akışkanlık özelliklerinin saat mekanizmalarında (örneğin dönen disklerin balansında) kullanılması, Endülüs mühendisliğinin özgün buluşlarındandır. Kastilya Kralı X. Alfonso'nun Libros del saber'inde detaylanan bu saatler, İslam ve Hristiyan Avrupa'nın bilimsel işbirliğinin ürünüdür. Koleksiyonda bu bölüm, saatler zincirinin «köprü» halkasıdır; İskenderiye‐Bağdat‐Kurtuba‐Paris hattında zamanın mekanikleşme serüvenini anlatır."}, {"id": "p138-11", "slug": "saatler-138-11-gunes-saati", "name": "Güneş Saati (Muvakkithane)", "category": "Saatler", "creator": "İslam muvakkit geleneği", "has_img": 1, "desc": "Namaz vakitlerini belirlemek için kullanılan muvakkit geleneğine ait yatay güneş saati."}, {"id": "p138-12", "slug": "saatler-138-12-gunes-saati", "name": "Güneş Saati (Muvakkithane)", "category": "Saatler", "creator": "İslam muvakkit geleneği", "has_img": 1, "desc": "Muvakkithane geleneğinden silindirik/yatay güneş saati varyantı."}, {"id": "p138-13", "slug": "saatler-138-13-i-spanyol-arap-mum-saati", "name": "İspanyol-Arap Mum Saati", "category": "Saatler", "creator": "Endülüs saat geleneği", "has_img": 1, "desc": "Endülüs kökenli, kapıların düşmesiyle zamanı bildiren mekanik mum saati."}, {"id": "p138-14", "slug": "saatler-138-14-takiyyedd-n-in-zemberekli-calar-saati", "name": "Helezoni Zemberekli Saatler (bingâmât devriyye)", "category": "Saatler", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Takiyyeddîn'in tarif ettiği helezoni zemberekli saatler (bingâmât devriyye), Avrupa'nın yay tahrikli saatlerinin Osmanlı karşılığıdır. Takiyyeddîn saat risalesinde zemberekli ve ağırlıklı tipleri karşılaştırmış, eşapman hassasiyetini artırmaya çalışmıştır. Bu saatler, 16. yüzyıl Osmanlı mekaniğinin Avrupa teknolojisini izlediğinin ve özgün çözümler ürettiğinin kanıtıdır."}, {"id": "p138-15", "slug": "saatler-138-15-su-saati", "name": "Su Saati", "category": "Saatler", "creator": "Takiyyeddîn er-Râsıd", "has_img": 1, "desc": "Takiyyeddîn'in İstanbul Rasathanesi için tasarladığı mekanik saatler (bingâmât devriyye ve siryâkiyye), 16. yüzyılın en iddialı kronometrik projelerindendir. Rasathane gözlemlerinde saniye hassasiyeti gerektiği için, dönemin Avrupa ve İslam saatleri yetersiz kalmış; Takiyyeddîn kendi «astronomik saatini» (bingâm rasadı) kurmaya girişmiştir. Zemberekli (yay tahrikli) ve ağırlıklı (siryâkiyye) varyasyonları, eşapman mekanizmaları ve kadranlarıyla Avrupa'daki çağdaş saatçilikle yarışır düzeydedir. Bu saatler, rasathanenin «zaman altyapısı»nı oluşturur; gözlemlerin eşzamanlılığı bu mekanik kalbe bağlıdır. Koleksiyonda bu saatler, Osmanlı mühendisinin zamanı ölçme tutkusunun; su saatinden mekanik saate geçişin İslam dünyasındaki en somut ve en trajik (rasathanenin yıkımıyla yarım kalan) belgesidir."}, {"id": "p140-1", "slug": "tesviye-ve-geometri-140-1-tesviye-aletleri", "name": "Tesviye Aletleri", "category": "Tesviye ve Geometri", "creator": "Ömer Hayyam / el-Kaşi / Ebu Sehl el-Kühi", "has_img": 1, "desc": "Geometri ölçüm ve çizim aletleri, İslam matematiğinin soyut cebiri maddeye indirdiği atölye araçlarıdır. Ömer Hayyam'ın kübik denklemleri konik kesitlerin (parabol, hiperbol) kesişimiyle çözerken kullandığı «mükemmel tam pergel» (barkar kamil tamm) ve el‐Kaşi'nin eliptik yörüngeleri çizen özel cetvelleri, yalnız birer çizim aracı değil, aynı zamanda birer «analog bilgisayar»dır. Ebu Sehl el‐Kühi'nin aletleri, mimari mukarnasların ve kubbe geometrilerinin kağıt üzerinde kusursuzca kurgulanmasını sağlamıştır. Koleksiyonda bu aletler, matematiğin mimariyle, astronominin mühendislikle buluştuğu; cetvel ve pergelin, imparatorlukların kubbelerini ve rasathanelerini inşa ettiği o görünmez eşikte durur."}, {"id": "p140-2", "slug": "tesviye-ve-geometri-140-2-tesviye-aletleri", "name": "Tesviye Aletleri", "category": "Tesviye ve Geometri", "creator": "Ömer Hayyam / el-Kaşi / Ebu Sehl el-Kühi", "has_img": 1, "desc": "Geometri ölçüm ve çizim aletleri, İslam matematiğinin soyut cebiri maddeye indirdiği atölye araçlarıdır. Ömer Hayyam'ın kübik denklemleri konik kesitlerin (parabol, hiperbol) kesişimiyle çözerken kullandığı «mükemmel tam pergel» (barkar kamil t  küresel, silindirik ve konik aynalarda yansıma yasalarını deneysel olarak ölçen bir optik laboratuvarıdır. Bu alet, aynı zamanda Avrupa'da «Problema Alhazeni» (Alhazen's Problem) olarak bilinen ünlü geometri probleminin çözümünde kullanılmıştır: «Verilen bir noktadan çıkan ışığın, küresel bir aynadan yansıyarak başka bir noktaya ulaşması». Bu problem, 4. dereceden denklemlere götürmüş; Avrupa'da Fermat, Huygens ve l'Hôpital gibi dev matematikçileri yüzyıllarca meşgul etmiştir. İbn el‑Heysem'in aleti, yalnız optik değil, aynı zamanda cebir ve konik kesitler geometrisinin de pratik laboratuvarıdır. Koleksiyonda bu düzenek, İslam‑Avrupa matematik diyaloğunun en kalıcı düğüm noktasını temsil eder; bir optik aleti, aslında bir denklem çözme makinesidir."}, {"id": "p141-8", "slug": "tesviye-ve-geometri-141-8-tesviye-terazisi", "name": "Tesviye Terazisi", "category": "Tesviye ve Geometri", "creator": "İslam geometri geleneği", "has_img": 1, "desc": "Arazi eğimlerini ölçmek için kullanılan hassas terazi düzeneği."}, {"id": "p141-9", "slug": "tesviye-ve-geometri-141-9-pergel", "name": "Büyük Yarım Daire Pergeli", "category": "Tesviye ve Geometri", "creator": "İslam geometri geleneği", "has_img": 1, "desc": "Büyük daireleri tek hamlede çizmek için normal pergeller yetersiz kaldığından, İslam geometri ustaları vidalanabilir uzatma parçalarına sahip özel pergeller geliştirmiştir. Büyük daireleri parça parça çizen bu alet, mukarnas, kubbe ve yıldız desenleri estetiğinin ardındaki geometrik tasarımın vazgeçilmez aracıdır. Teorik geometriyi şantiyeye taşıyan sessiz kahramanlardan biridir."}, {"id": "p141-10", "slug": "tesviye-ve-geometri-141-10-pergel", "name": "Büyük Daire Pergeli", "category": "Tesviye ve Geometri", "creator": "İslam geometri geleneği", "has_img": 1, "desc": "Rasathane ve mimari projeler için büyük ölçekli pergel."}, {"id": "p141-11", "slug": "tesviye-ve-geometri-141-11-tesviye-terazisi", "name": "Tesviye Terazisi", "category": "Tesviye ve Geometri", "creator": "İslam geometri geleneği", "has_img": 1, "desc": "İnşaat terazisi; su terazisinin erken İslam uygulaması."}, {"id": "p142-12", "slug": "tesviye-ve-geometri-142-12-tesviye-aletleri", "name": "Tesviye Aletleri", "category": "Tesviye ve Geometri", "creator": "Endülüs mühendislik geleneği", "has_img": 1, "desc": "Endülüs tesviye terazileri, İber Yarımadası'nın «su medeniyeti»nin (acequias, qanat) hassas ölçüm araçlarıdır. Suyun eğimini ve kanalların düzlemini kontrol eden bu teraziler, Endülüs tarım devriminin (pirinç, pamuk, narenciye) altyapısını oluşturur. İslam mühendislerinin nivelman bilgisi, Reconquista sonrasında İspanyol hidromühendisliğine devredilmiştir. Koleksiyonda bu teraziler, suyun yalnız bir nimet değil, matematikle yönetilen bir enerji kaynağı olduğunun; Endülüs'ün yeşil devriminin sessiz tanıklarıdır."}, {"id": "p142-13", "slug": "tesviye-ve-geometri-142-13-pergel", "name": "Konik Kesitler Çizen Pergel", "category": "Tesviye ve Geometri", "creator": "Ebû Sehl el-Kühî geleneği", "has_img": 1, "desc": "el-Kühî'nin konik kesitler çizmek için tasarladığı mükemmel pergel."}, {"id": "p142-14", "slug": "tesviye-ve-geometri-142-14-eb-ca-fer-el-h-zin-nikomedes-m-o-yaklasik-2-yuzyil4-in-cozumunu-alet-m", "name": "Ebu Ca'fer el-Hazin nikomedes (m.ö. yaklaşık 2. yüzyıl4)'in çözümünü «alet metodu»", "category": "Tesviye ve Geometri", "creator": "Endülüs mühendislik geleneği", "has_img": 1, "desc": "Endülüs tesviye terazileri, İber Yarımadası'nın «su medeniyeti»nin (acequias, qanat) hassas ölçüm araçlarıdır. Suyun eğimini ve kanalların düzlemini kontrol eden bu teraziler, Endülüs tarım devriminin (pirinç, pamuk, narenciye) altyapısını oluşturur. İslam mühendislerinin nivelman bilgisi, Reconquista sonrasında İspanyol hidromühendisliğine devredilmiştir. Koleksiyonda bu teraziler, suyun yalnız bir nimet değil, matematikle yönetilen bir enerji kaynağı olduğunun; Endülüs'ün yeşil devriminin sessiz tanıklarıdır."}, {"id": "p142-15", "slug": "tesviye-ve-geometri-142-15-arap-i-slam-geleneginde-nikomedes-m-o-yaklasik-2-yuzyil-in-pergeli", "name": "Arap-İslam Geleneğinde nikomedes (m.ö. yaklaşık 2. yüzyıl)'in Pergeli", "category": "Tesviye ve Geometri", "creator": "Endülüs mühendislik geleneği", "has_img": 1, "desc": "Endülüs tesviye terazileri, İber Yarımadası'nın «su medeniyeti»nin (acequias, qanat) hassas ölçüm araçlarıdır. Suyun eğimini ve kanalların düzlemini kontrol eden bu teraziler, Endülüs tarım devriminin (pirinç, pamuk, narenciye) altyapısını oluşturur. İslam mühendislerinin nivelman bilgisi, Reconquista sonrasında İspanyol hidromühendisliğine devredilmiştir. Koleksiyonda bu teraziler, suyun yalnız bir nimet değil, matematikle yönetilen bir enerji kaynağı olduğunun; Endülüs'ün yeşil devriminin sessiz tanıklarıdır."}, {"id": "p142-16", "slug": "tesviye-ve-geometri-142-16-aciolcer", "name": "Açıölçer", "category": "Tesviye ve Geometri", "creator": "Osmanlı atölyesi", "has_img": 1, "desc": "Osmanlı 16. yüzyılından bu açı ölçer, mimari tasarım, arazi ölçümü ve astronomi eğitiminde kullanılan pratik bir alettir. Sade ama hassas bölümlenmiş yapısı, Takiyyeddin rasathanesini ve muvakkitlik kurumunu besleyen Osmanlı teknik kültürünün parçasıdır. Geometri geleneğinin usta ellerinde yaşayan bir örnek olarak koleksiyonda yer alır."}, {"id": "p143-17", "slug": "tesviye-ve-geometri-143-17-acilir-kapanir-cifte-cetvel", "name": "Usturlap Yapım Aletleri (destür, torna)", "category": "Tesviye ve Geometri", "creator": "Ömer Hayyam / el-Kâşî geleneği", "has_img": 1, "desc": "Usturlap imalatında destür ve torna düzenekleri."}, {"id": "p143-18", "slug": "tesviye-ve-geometri-143-18-hesap-sopasi", "name": "Hesap sopası", "category": "Tesviye ve Geometri", "creator": "Ebu Ali İbn Sina", "has_img": 1, "desc": "İbn Sina'nın tesviye aracı, büyük filozof‐hekimin pratik mühendislik bilgisinin de derin olduğunu gösterir. Suyun ve yapının düzlemini kontrol etmek için tasarlanan bu araç, İbn Sina'nın ansiklopedik dehasının (felsefe, tıp, fizik) «saha mühendisliği»ne uzanan koludur. İslam bilim geleneğinde teorik bilgi (ilm) ile pratik uygulama (amel) arasındaki sınırın ne denli geçirgen olduğunun kanıtıdır. Koleksiyonda bu araç, «filozofun terazisi»dir; soyut aklın yeryüzünü düzlediği andır."}, {"id": "p144-19", "slug": "tesviye-ve-geometri-144-19-daireleri-bolumleme-duzenegi", "name": "Daireleri Bölümleme Düzeneği", "category": "Tesviye ve Geometri", "creator": "el-Bîrûnî geleneği", "has_img": 1, "desc": "el-Bîrûnî'nin İstî'âb adlı eserinde tarif ettiği destür ed-devâ'ir, iç içe döndürülebilir kollarıyla daireleri ve düz çizgileri eşit parçalara bölen zarif bir bölümleme aletidir. Astronomi aletlerinin skalalarının taksimi ve geometrik konstrüksiyonlar için temel bir araç olan bu küçük pirinç düzenek, el-Bîrûnî'nin mühendis zekâsının eserleri kadar aletlerinde de yaşadığını gösterir."}, {"id": "p144-20", "slug": "tesviye-ve-geometri-144-20-egik-uclu-pergel", "name": "Eğik Uçlu Pergel", "category": "Tesviye ve Geometri", "creator": "Ömer Hayyam / el-Kâşî geleneği", "has_img": 1, "desc": "Geometri bölümü, İslam matematiğinin soyut cebiri maddeye ve mimariye indirdiği atölye araçlarını ve teorik zirveleri sergiler. Ömer Hayyâm'ın kübik denklemleri konik kesitlerin (parabol, hiperbol) kesişimiyle çözme yöntemi, Ebû Sehl el-Kühî'nin «mükemmel tam pergel» (barkâr kâmil tâmm) tasarımları ve el-Kâşî'nin eliptik yörünge pergelleri, bu bölümün matematiksel omurgasını oluşturur. Bu aletler, yalnızca kağıt üzerinde çizim yapmak için değil, aynı zamanda İslam mimarisinin karmaşık mukarnas geometrilerini, kubbe kavislerini ve optik aletlerin parabolik aynalarını inşa etmek için kullanılmıştır. Koleksiyonda bu bölüm, matematiğin «görülebilen» ve «dokunulabilen» yüzüdür; pergel ve cetvelin, imparatorlukların kubbelerini ve rasathanelerini inşa ettiği o görünmez eşikte durur."}, {"id": "p144-21", "slug": "tesviye-ve-geometri-144-21-ucayak", "name": "Kimya Fırını Üçayağı", "category": "Tesviye ve Geometri", "creator": "İslam kimya geleneği", "has_img": 1, "desc": "Ebû Bekir er-Râzî'nin tasarladığı «kendi kendisini yelleyen» fırın (nâfih nefsehû), körük gerektirmeden baca etkisiyle kendi hava akımını üreten bir fırındır. Çelik üçayak ve pişirilmiş kil gövde, kimyasal işlemler için sabit ve kontrollü bir ısı sağlar. İşgücünden ve enerjiden tasarruf eden bu tasarım, İslam laboratuvar mühendisliğinin en özgün örneklerinden biridir."}, {"id": "p146-1", "slug": "optik-146-1-gozlemleme-aleti", "name": "Gözlemleme Aleti", "category": "Optik", "creator": "Müeyyededdin el-Urdi", "has_img": 1, "desc": "Müeyyededdin el‐Urdi'nin çember formunda tarif ettiği tesviye aleti, İslam mühendisliğinin «nivelman» (hassas düzlemleme) biliminin zirvesidir. Su kanallarının (kariz, ark) eğimini, bina temellerinin yataylığını ve rasathane zeminlerinin düzlemliğini milimetrik hassasiyetle ölçen bu alet, şakül ve çember geometrisini birleştirir. el‐Urdi, rasathane aletlerinin yanı sıra altyapı mühendisliğinin de ustasıydı. Koleksiyonda bu alet, İslam bilim insanının yalnız gökyüzünü değil, yeryüzünü de aynı matematiksel titizlikle düzlediğinin; su medeniyetinin görünmez kahramanının kanıtıdır."}, {"id": "p146-2", "slug": "optik-146-2-fecir-isigi-isinlarinin-dogrusal-cereyan-ettigini-i-spatlamak-i-cin-de", "name": "Fecir Işığı Işınlarının Doğrusal Cereyan Ettiğini İspatlamak İçin Deney Düzeneği", "category": "Optik", "creator": "Müeyyededdin el-Urdi", "has_img": 1, "desc": "Müeyyededdin el‐Urdi'nin çember formunda tarif ettiği tesviye aleti, İslam mühendisliğinin «nivelman» (hassas düzlemleme) biliminin zirvesidir. Su kanallarının (kariz, ark) eğimini, bina temellerinin yataylığını ve rasathane zeminlerinin düzlemliğini milimetrik hassasiyetle ölçen bu alet, şakül ve çember geometrisini birleştirir. el‐Urdi, rasathane aletlerinin yanı sıra altyapı mühendisliğinin de ustasıydı. Koleksiyonda bu alet, İslam bilim insanının yalnız gökyüzünü değil, yeryüzünü de aynı matematiksel titizlikle düzlediğinin; su medeniyetinin görünme
